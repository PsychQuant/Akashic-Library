  - id: "6.23"
    parent: "6.2"
    texts:
      de:
        - "Wenn zwei Ausdrücke durch das Gleichheitszeichen verbunden werden, so heisst das, sie sind durch einander ersetzbar."
        - "Ob dies aber der Fall ist muss sich an den beiden Ausdrücken selbst zeigen."
        - "Es charakterisiert die logische Form zweier Ausdrücke, dass sie durch einander ersetzbar sind."
      en_ogden_ramsey_1922:
        - "If two expressions are connected by the sign of equality, this means that they can be substituted for one another."
        - "But whether this is the case must show itself in the two expressions themselves."
        - "It characterizes the logical form of two expressions, that they can be substituted for one another."
    edition_references:
      en_pears_mcguinness: "6.23"
    segments:
      - id: "6.23.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "兩個表達式以等號連結，意即它們可以互相替換。"
        interpretation_zh_tw: "等號標示可替換性，卻不憑空授予它。"
      - id: "6.23.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "但是否確實如此，必須由兩個表達式本身顯示。"
        interpretation_zh_tw: "可替換性須由兩式的形式成立。"
      - id: "6.23.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "能互相替換，刻畫了兩個表達式的邏輯形式。"
        interpretation_zh_tw: "這是形式徵候，不表示兩個字串在所有層面相同。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前沒有把命題 6.23 所論的「兩個表達式以等號連結，意即它們可以互相替換。」設為直接軟體行為。"
        rationale_zh_tw: "命題 6.23 的直接論旨是「兩個表達式以等號連結，意即它們可以互相替換。」；這句處理等式、可替換性或數學演算的形式地位；Akashic 的數值運算不會因表面相似就成為該數學方法的哲學實例。"
