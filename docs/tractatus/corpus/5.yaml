  - id: "5.62"
    parent: "5.6"
    texts:
      de:
        - "Diese Bemerkung gibt den Schlüssel zur Entscheidung der Frage, inwieweit der Solipsismus eine Wahrheit ist."
        - "Was der Solipsismus nämlich *meint*, ist ganz richtig, nur lässt es sich nicht *sagen*, sondern es zeigt sich."
        - "Dass die Welt *meine* Welt ist, das zeigt sich darin, dass die Grenzen *der* Sprache (der Sprache, die allein ich verstehe) die Grenzen *meiner* Welt bedeuten."
      en_ogden_ramsey_1922:
        - "This remark provides a key to the question, to what extent solipsism is a truth."
        - "In fact what solipsism *means*, is quite correct, only it cannot be *said*, but it shows itself."
        - "That the world is *my* world, shows itself in the fact that the limits of the language (*the* language which I understand) mean the limits of *my* world."
    edition_references:
      en_pears_mcguinness: "5.62"
    segments:
      - id: "5.62.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "這段話提供了一把鑰匙，用來回答唯我論在何種程度上是真理。"
        interpretation_zh_tw: "唯我論的可取之處要由語言與世界的共同界線理解，而非由一則世界內事實理解。"
      - id: "5.62.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "事實上，唯我論所意指的完全正確，只是它不能被說出，而只能顯示。"
        interpretation_zh_tw: "唯我論若被寫成關於世界的一項命題，就越過其要表達的界線；其內容只能在表達範圍中顯現。"
      - id: "5.62.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "世界是我的世界，顯示於這項事實：語言的界限（我所理解的那種語言）意指我的世界的界限。"
        interpretation_zh_tw: "我能理解的命題範圍與我能描述的世界範圍重合，這就是「我的」在此顯示的方式。"
    project_relations:
