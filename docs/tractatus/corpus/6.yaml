  - id: "6.321"
    parent: "6.32"
    texts:
      de:
        - "„Kausalitätsgesetz“, das ist ein Gattungsname."
        - "Und wie es in der Mechanik, sagen wir, Minimum-Gesetze gibt, – etwa der kleinsten Wirkung – so gibt es in der Physik Kausalitätsgesetze, Gesetze von der Kausalitätsform."
      en_ogden_ramsey_1922:
        - "“Law of Causality” is a class name."
        - "And as in mechanics there are, for instance, minimum-laws, such as that of least action, so in physics there are causal laws, laws of the causality form."
    edition_references:
