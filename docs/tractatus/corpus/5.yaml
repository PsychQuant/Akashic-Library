        rationale_zh_tw: "此命題的具體內容是：唯一滿足條件由變項位置與同一名稱表達，不是在 a 之外增設一項「與 a 同一」的關係；把同一性定義成特殊關係會循環：指定唯一自關聯者時仍得先辨認同一對象。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
