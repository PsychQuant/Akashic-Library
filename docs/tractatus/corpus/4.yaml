            note_zh_tw: "測試確認 answer 與 AcceptedFact 沿用同一 valuation，且 recorded、valid、accepted 三種時間不互相替代。"
          - path: "Tests/AkashicPropositionTests/AuthorshipCompletenessPropositionTests.swift"
            kind: test
            locator: "testWitnessBackedFailureTraceRetainsAllSlotsAndWitness"
            note_zh_tw: "測試確認 witnessed exclusion 的 fails trace 同時保留每個作者槽與真正授權排除的 canonical witness。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testNegationPreservesContextQuarantineAndCompleteAtomicEvidence"
            note_zh_tw: "測試確認否定不會丟掉 snapshot context、quarantine、projection 或 atomic evidence。"
