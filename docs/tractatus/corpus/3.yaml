      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.221 關於名稱、簡單記號、分析與對象之表現關係的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.221 直接主張「對象我只能加以命名。」，本卷並將其限制解讀為「名稱提供指涉位置，但不把對象本身轉成一串可以直接說出的內容。」。這裡處理名稱、簡單記號、分析與對象的表現關係；Akashic entity 不是《論考》的簡單對象，schema 分解也不是唯一的完整分析。"
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "在本條有限類比中，sources/ 存檔內容的 digest 指稱扮演「命名」的角色：記錄層的 provenance 引用以 digest 代表位元組——記號站到內容的位置；進入 sources/ 的內容，其檔案系統位置由 digest 推導、不作為指稱的輸入。"
        rationale_zh_tw: "命題 3.221 說對象只能命名、記號代替它們；本條取其有限類比：sources/ 的 blob 不佔 canonical entity namespace，庫的記錄層只能「談論」它（記 provenance、掛 digest 引用），不把它變成一筆有名字、有生命週期的記錄——「不能說出」在此取命題表達義，不指 I/O 上不能讀取或傳回位元組。此類比只對 sources/ 存檔域成立，並不承諾 store 全域如此：entry 的 attachment 引用（AttachmentRef）是規範明文保留的唯一一種路徑指涉形式——entry-source-reference 稱該形式為 transition mechanism、並宣告它是 closed enumeration of one form（format 9 已把附件鍵域收窄到只剩它），故仍以路徑指涉、屬過渡期形狀，不在本條類比域內。digest 引用這個設計的規範理由在 #223 的裁決與 spec 條款自身；《論考》提供的是與該設計相呼應的結構類比，不構成推導或證成。同命題上一條 not_applicable 的否定理由在 entity 層（Akashic entity 不是《論考》的簡單對象），本條肯定的是儲存指稱層的有限類比，兩者對象不同、相容並存。"
        evidence:
          - path: "openspec/specs/provenance-reference/spec.md"
            kind: requirement
            locator: "Stored content SHALL NOT occupy the canonical entity namespace"
            note_zh_tw: "blob 不進 entity namespace 是 normative 條款：位元組層無 entity 名，指稱記號住在記錄層。"
          - path: "Sources/AkashicStoreIO/SourceStore.swift"
            kind: symbol
            locator: "sourceURL"
            note_zh_tw: "由 digest 解析存檔 URL 的解析器（模組內讀取面皆經此）；形狀不合法的 digest 直接回 nil。寫入面的排除驗證另以字串重建同一路徑（刻意設計，見該處註解），故不稱唯一通道。"
          - path: "openspec/specs/entry-source-reference/spec.md"
            kind: requirement
            locator: "Content the store is able to ingest SHALL be referenced by digest rather than by file-system path"
            note_zh_tw: "本條「只能命名」的類比依據：可 ingest 的內容一律以 digest 指稱、路徑不得作為新的指涉形式。同一 requirement 並明文處置 AttachmentRef——保留的路徑形式恰為一種、稱其為 transition mechanism、且宣告為 closed enumeration of one form，這正是 rationale 把它劃在類比域外的規範根據（不再只是觀察）。"
          - path: "openspec/specs/entry-source-reference/spec.md"
            kind: requirement
            locator: "The set of accepted attachment kinds SHALL contain exactly one kind"
            note_zh_tw: "rationale 括號內「附件鍵域收窄到只剩它」的 normative 來源：接受的附件種類恰為一種（外部文獻管理器自身儲存的引用），其餘一律載入時拒收。補引此條是 #252 verify 的發現——該括號原本只以 store format 9 的史實支撐，規範依據缺在 evidence 之外。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/223"
        disposition: revised
        note_zh_tw: "#223 裁決 digest-not-path 判準（2026-08-10），#235 據以掛上 analogy_only 對照；裁決本身有效。本筆標 revised：evidence 曾為已知過渡態——判準的另一份 normative 來源 entry-source-reference 當時活在未合併的 PR #249，而 validator 要求 evidence path 存在於專案內。"
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/252"
        disposition: revised
        note_zh_tw: "PR #249 已於 2026-08-15 合併，#252 據此補引 entry-source-reference 的 digest-not-path requirement 並重讀 rationale 全文。AttachmentRef 那句一併精確化：原文寫「現仍以路徑指涉、屬過渡期形狀」，複查後發現該 requirement 自己就寫著 transition mechanism 與 closed enumeration of one form——核心真值成立，改為引述規範措辭而非僅陳述觀察。"
