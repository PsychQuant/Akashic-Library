  - id: "4.1271"
    parent: "4.127"
    texts:
      de:
        - "Jede Variable ist das Zeichen eines formalen Begriffes."
        - "Denn jede Variable stellt eine konstante Form dar, welche alle ihre Werte besitzen, und die als formale Eigenschaft dieser Werte aufgefasst werden kann."
      en_ogden_ramsey_1922:
        - "Every variable is the sign of a formal concept."
        - "For every variable presents a constant form, which all its values possess, and which can be conceived as a formal property of these values."
    edition_references:
      en_pears_mcguinness: "4.1271"
    segments:
      - id: "4.1271.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "每個變項都是一個形式概念的符號。"
        interpretation_zh_tw: "變項不是一個普通名稱，而以可代入值的形式範圍顯示一項形式概念。"
      - id: "4.1271.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因為每個變項都表現一個固定形式；它的所有值都具有這形式，而此形式可被理解為這些值的形式性質。"
        interpretation_zh_tw: "變項保持形式不變而讓值變動；所有合法值共享的正是這項形式性質。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.1271 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：變項不是空白名稱，而攜帶其合法替代值共有的形式限制；可代入範圍顯示概念。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.1272"
    parent: "4.127"
    texts:
      de:
        - "So ist der variable Name „*x*“ das eigentliche Zeichen des Scheinbegriffes *Gegenstand*."
        - "Wo immer das Wort „Gegenstand“ („Ding“, „Sache“, etc.) richtig gebraucht wird, wird es in der Begriffsschrift durch den variablen Namen ausgedrückt."
        - "Zum Beispiel in dem Satz „es gibt 2 Gegenstände, welche . . . “ durch „(∃*x, y*) *. . .*“."
        - "Wo immer es anders, also als eigentliches Begriffswort gebraucht wird, entstehen unsinnige Scheinsätze."
        - "So kann man z. B. nicht sagen „Es gibt Gegenstände“, wie man etwa sagt „Es gibt Bücher“."
        - "Und ebenso wenig „Es gibt 100 Gegenstände“, oder „Es gibt ℵ~0~ Gegenstände“."
        - "Und es ist unsinnig, von der *Anzahl aller Gegenstände* zu sprechen."
        - "Dasselbe gilt von den Worten „Komplex“, „Tatsache“, „Funktion“, „Zahl“, etc."
        - "Sie alle bezeichnen formale Begriffe und werden in der Begriffsschrift durch Variable, nicht durch Funktionen oder Klassen dargestellt."
        - "(Wie Frege und Russell glaubten.)"
        - "Ausdrücke wie „1 ist eine Zahl“, „es gibt nur Eine Null“ und alle ähnlichen sind unsinnig."
        - "\\(Es ist ebenso unsinnig zu sagen „es gibt nur eine 1“, als es unsinnig wäre, zu sagen: 2 + 2 ist um 3 Uhr gleich 4.)"
      en_ogden_ramsey_1922:
        - "So the variable name “*x*” is the proper sign of the pseudo-concept *object*."
        - "Wherever the word “object” (“thing”, “entity”, etc.) is rightly used, it is expressed in logical symbolism by the variable name."
        - "For example in the proposition “there are two objects which …”, by “(∃*x*, *y*)…”."
        - "Wherever it is used otherwise, *i.e.* as a proper concept word, there arise senseless pseudo-propositions."
        - "So one cannot, *e.g.* say “There are objects” as one says “There are books”."
        - "Nor “There are 100 objects” or “There are ℵ~0~ objects”."
        - "And it is senseless to speak of the *number of all objects.*"
        - "The same holds of the words “Complex”, “Fact”, “Function”, “Number”, etc."
        - "They all signify formal concepts and are presented in logical symbolism by variables, not by functions or classes (as Frege and Russell thought)."
        - "Expressions like “1 is a number”, “there is only one number nought”, and all like them are senseless."
        - "\\(It is as senseless to say, “there is only one 1” as it would be to say: 2 + 2 is at 3 o’clock equal to 4.)"
    edition_references:
      en_pears_mcguinness: "4.1272"
    segments:
      - id: "4.1272.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "因此，可變名稱「*x*」才是擬似概念「對象」的恰當符號。"
        interpretation_zh_tw: "可變名稱 *x* 顯示可替入對象的位置；它不是名為「對象」的一般東西。"
      - id: "4.1272.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "凡「對象」（「物」「事物」等）用得正確之處，在概念文字中都由可變名稱表達。"
        interpretation_zh_tw: "「對象」用得正確時，作用是標示變項可取值的形式範圍，而非充當普通謂詞。"
      - id: "4.1272.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "例如「有兩個對象……」寫作「(∃*x, y*) *. . .*」。"
        interpretation_zh_tw: "量化式用變項表達「有兩個對象」的形式，不需要額外加入「是對象」的分類條件。"
      - id: "4.1272.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "若把它當真正概念詞使用，就產生無意義的擬似命題。"
        interpretation_zh_tw: "把「對象」當真正概念詞會產生擬似命題：表面像斷言，卻沒有相應的合法邏輯角色。"
      - id: "4.1272.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "因此，不能像說「有書」那樣說「有對象」。"
        interpretation_zh_tw: "「有書」由真正概念挑出事物；「有對象」卻想在所有可取值者之外再加一層同類分類。"
      - id: "4.1272.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "同樣不能說「有一百個對象」或「有 ℵ~0~ 個對象」。"
        interpretation_zh_tw: "同理，替形式範疇計數為一百或 ℵ~0~，不是普通經驗數量主張。"
      - id: "4.1272.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "談所有對象的數量也是無意義。"
        interpretation_zh_tw: "「所有對象的數量」預設可把整個形式範圍當成一個已界定集合，正是此處排除的物件化。"
      - id: "4.1272.h"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "「複合體」「事實」「函數」「數」等詞亦同。"
        interpretation_zh_tw: "「複合體」「事實」「函數」「數」也標示形式角色，不能不經檢查便當作資料類別。"
      - id: "4.1272.i"
        alignment:
          de: [8, 9]
          en_ogden_ramsey_1922: [8]
        translation_zh_tw: "它們都指示形式概念，在概念文字中由變項而非函數或類別表現；弗雷格與羅素的處理則不同。"
        interpretation_zh_tw: "概念文字以變項呈現這些角色；用函數或類別重寫，會把形式條件錯置成普通性質。"
      - id: "4.1272.j"
        alignment:
          de: [10]
          en_ogden_ramsey_1922: [9]
        translation_zh_tw: "「1 是一個數」「只有一個零」及類似表達都是無意義的。"
        interpretation_zh_tw: "「1 是一個數」看似分類句，卻把數字符號已顯示的形式又當內容斷言。"
      - id: "4.1272.k"
        alignment:
          de: [11]
          en_ogden_ramsey_1922: [10]
        translation_zh_tw: "（說「只有一個 1」，就像說「2 + 2 在三點鐘等於 4」一樣無意義。）"
        interpretation_zh_tw: "把「只有一個 1」比作「二加二在三點等於四」，顯示問題在類型錯置，而不是該句碰巧為假。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 刻意讓 entity 與形式性的 view／分類分屬不同 namespace。"
        rationale_zh_tw: "這避免把『選取哪些 entity』的形式條件再物件化成一筆 entity；類比只涵蓋層次區分，不把 Akashic entity 冒充 Tractatus 的 simple object。"
        evidence:
          - path: "docs/explainers/entity-vs-view.md"
            kind: heading
            locator: "## 形式概念與真正的概念"
            note_zh_tw: "此節規定形式概念不得取得 entity UUID 或進入 entities。"
    history: []

  - id: "4.12721"
    parent: "4.1272"
    texts:
      de:
        - "Der formale Begriff ist mit einem Gegenstand, der unter ihn fällt, bereits gegeben."
        - "Man kann also nicht Gegenstände eines formalen Begriffes *und* den formalen Begriff selbst als Grundbegriffe einführen."
        - "Man kann also z. B. nicht den Begriff der Funktion, und auch spezielle Funktionen (wie Russell) als Grundbegriffe einführen; oder den Begriff der Zahl und bestimmte Zahlen."
      en_ogden_ramsey_1922:
        - "The formal concept is already given with an object, which falls under it."
        - "One cannot, therefore, introduce both, the objects which fall under a formal concept *and* the formal concept itself, as primitive ideas."
        - "One cannot, therefore, *e.g.* introduce (as Russell does) the concept of function and also special functions as primitive ideas; or the concept of number and definite numbers."
    edition_references:
      en_pears_mcguinness: "4.12721"
    segments:
      - id: "4.12721.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "形式概念已隨一個落在其下的對象一併給出。"
        interpretation_zh_tw: "一旦有一個合法落入的對象，其符號使用已顯示相應形式概念，無須另立一個同層實體。"
      - id: "4.12721.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因此，不能把形式概念下的對象與形式概念本身都當作基本概念引入。"
        interpretation_zh_tw: "若同時把值與其形式概念列為基本項，就會重複引入符號使用已經給出的條件。"
      - id: "4.12721.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "例如不能像羅素那樣，同時把函數概念與特定函數當作基本概念，或同時引入數的概念與特定數。"
        interpretation_zh_tw: "羅素式做法把函數與函數概念、數與數概念並列為原始項，正好示範這種層次重複。"
    project_relations:
