        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.062 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：真假依符號在既定用法中所斷言的內容判定；改變 *p* 的約定意義會改變命題，而不是讓同一命題以「假的指稱方式」溝通。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
