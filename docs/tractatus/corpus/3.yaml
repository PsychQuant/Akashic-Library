        interpretation_zh_tw: "Bedeutung 在此依名稱—對象關係譯作「指稱」，與命題的 Sinn／意義分開。"
      - id: "3.203.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（「*A*」與「*A*」是同一個記號。）"
        interpretation_zh_tw: "括號只確認重複字樣為同一記號；不同脈絡中的符號角色仍須另由用法判定。"
