          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "數學命題能被證明，無非是說：不必把它所表達者拿去與事實比較，就能看出其正確性。"
        interpretation_zh_tw: "數學正確性在形式中判定，不靠經驗比對；這不表示計算實作無需測試。"
