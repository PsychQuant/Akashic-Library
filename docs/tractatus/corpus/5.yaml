        interpretation_zh_tw: "邏輯分析不是以人工理想語言取代日常命題，而是揭示其既有秩序。"
      - id: "5.5563.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "——我們在此應給出的簡單之物，不是真理的一個模型，而是完整的真理本身。"
        interpretation_zh_tw: "分析所尋求的簡單形式不是近似模型，而是命題實際符號結構的完整呈現。"
      - id: "5.5563.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（我們的問題並不抽象，反而可能是最具體的問題。）"
        interpretation_zh_tw: "哲學困惑發生在實際語言使用中，不是遠離生活的純抽象難題。"
