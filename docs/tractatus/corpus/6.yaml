  - id: "6.232"
    parent: "6.23"
    texts:
      de:
        - "Frege sagt, die beiden Ausdrücke haben dieselbe Bedeutung, aber verschiedenen Sinn."
        - "Das Wesentliche an der Gleichung ist aber, dass sie nicht notwendig ist, um zu zeigen, dass die beiden Ausdrücke, die das Gleichheitszeichen verbindet, dieselbe Bedeutung haben, da sich dies aus den beiden Ausdrücken selbst ersehen lässt."
      en_ogden_ramsey_1922:
        - "Frege says that these expressions have the same meaning but different senses."
        - "But what is essential about equation is that it is not necessary in order to show that both expressions, which are connected by the sign of equality, have the same meaning: for this can be perceived from the two expressions themselves."
    edition_references:
      en_pears_mcguinness: "6.232"
    segments:
      - id: "6.232.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "弗雷格說，兩個表達式有相同指涉，卻有不同意義。"
        interpretation_zh_tw: "第一句保留意義與指涉的區分。"
      - id: "6.232.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "然而要顯示等號兩側指涉相同，等式並非必要，因為這可由兩個表達式本身看出。"
        interpretation_zh_tw: "維根斯坦把等式的角色放在記法與觀點，而非新增一項事實。"
