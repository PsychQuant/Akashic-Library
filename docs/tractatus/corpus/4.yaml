  - id: "4.123"
    parent: "4.12"
    texts:
      de:
        - "Eine Eigenschaft ist intern, wenn es undenkbar ist, dass ihr Gegenstand sie nicht besitzt."
        - "\\(Diese blaue Farbe und jene stehen in der internen Relation von heller und dunkler eo ipso."
        - "Es ist undenkbar, dass *diese* beiden Gegenstände nicht in dieser Relation stünden.)"
        - "\\(Hier entspricht dem schwankenden Gebrauch der Worte „Eigenschaft“ und „Relation“ der schwankende Gebrauch des Wortes „Gegenstand“.)"
      en_ogden_ramsey_1922:
        - "A property is internal if it is unthinkable that its object does not possess it."
        - "\\(This blue colour and that stand in the internal relation of brighter and darker eo ipso."
        - "It is unthinkable that *these* two objects should not stand in this relation.)"
        - "\\(Here to the shifting use of the words “property” and “relation” there corresponds the shifting use of the word “object”.)"
    edition_references:
      en_pears_mcguinness: "4.123"
    segments:
      - id: "4.123.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "如果無法設想某對象不具有某性質，該性質就是內在的。"
        interpretation_zh_tw: "不可設想其缺失，是內在性質的模態判準；它不同於碰巧一直成立的經驗規律。"
      - id: "4.123.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（這個藍色與那個藍色本身就處於一深一淺的內在關係。"
        interpretation_zh_tw: "一旦兩個特定色彩如此被界定，深淺次序便隨它們的形式一起給出。"
      - id: "4.123.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "無法設想這兩個對象不在此關係中。）"
        interpretation_zh_tw: "這項不可分離性表明深淺不是另一次比較碰巧得到的外在事實。"
      - id: "4.123.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（此處「性質」與「關係」用法的搖擺，對應「對象」一詞用法的搖擺。）"
        interpretation_zh_tw: "術語游移顯示對象的切分層次也在改變，不能把不同層次的性質與關係混作同一類。"
    project_relations:
