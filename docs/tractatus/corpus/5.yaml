  - id: "5.5"
    parent: "5"
    texts:
      de:
        - "Jede Wahrheitsfunktion ist ein Resultat der successiven Anwendung der Operation (– – – – –W)(*ξ, . . . .*) auf Elementarsätze."
        - "Diese Operation verneint sämtliche Sätze in der rechten Klammer und ich nenne sie die Negation dieser Sätze."
      en_ogden_ramsey_1922:
        - "Every truth-function is a result of the successive application of the operation (– – – – – T)(*ξ*, ....) to elementary propositions."
        - "This operation denies all the propositions in the right-hand bracket and I call it the negation of these propositions."
    edition_references:
      en_pears_mcguinness: "5.5"
    segments:
      - id: "5.5.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "每個真值函數，都是把運算 (–––––T)(ξ, ……) 連續套用於基本命題的結果。"
        interpretation_zh_tw: "此處主張單一共同否定運算具有真值函數完備性，可經迭代生成其他聯結方式。"
      - id: "5.5.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這項運算否定右側括號中的所有命題，我稱它為這些命題的否定。"
        interpretation_zh_tw: "運算對括號值域作共同否定，其輸出只在所有輸入皆假時為真。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 把真值函數式組合作為非平凡語意層的最低目標之一；現行主線尚未實作命題 5.5 的完整形式系統。"
        rationale_zh_tw: "專案文件只支撐真值組合的方向，尚不支撐這裡的共同否定完備性或完整形式推導。此命題的重點是：單一的共同否定運算可作為完備基底，藉反覆套用生成所有真值函數。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "### 9.4 Truth-functional composition"
            note_zh_tw: "此節把真值函數式組合列為最低語意能力，並明示這是目標而非既成實作。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "命題 5.5 所需的共同否定 N、遞迴生成與 truth-functional completeness 由此 issue 追蹤；現行 TruthValue enum 不是共同否定運算。"

  - id: "5.501"
    parent: "5.5"
    texts:
      de:
        - "Einen Klammerausdruck, dessen Glieder Sätze sind, deute ich – wenn die Reihenfolge der Glieder in der Klammer gleichgültig ist – durch ein Zeichen von der Form „![{ (\\bar{\\xi}) }](images/531064e7807699e5544919383c09e44c0041e20bae70ec24417d5cc8e39fc4d6.svg)\\ “ an."
        - "„*ξ*“ ist eine Variable, deren Werte die Glieder des Klammerausdruckes sind; und der Strich über der Variablen deutet an, dass sie ihre sämtlichen Werte in der Klammer vertritt."
        - "\\(Hat also *ξ* etwa die 3 Werte P, Q, R, so ist ![{ (\\bar{\\xi}) }](images/531064e7807699e5544919383c09e44c0041e20bae70ec24417d5cc8e39fc4d6.svg)\\  = (P, Q, R).)"
        - "Die Werte der Variablen werden festgesetzt."
        - "Die Festsetzung ist die Beschreibung der Sätze, welche die Variable vertritt."
        - "Wie die Beschreibung der Glieder des Klammerausdruckes geschieht, ist unwesentlich."
        - "Wir *können* drei Arten der Beschreibung unterscheiden: 1. Die direkte Aufzählung."
        - "In diesem Fall können wir statt der Variablen einfach ihre konstanten Werte setzen."
        - "2. Die Angabe einer Funktion *fx*, deren Werte für alle Werte von *x* die zu beschreibenden Sätze sind."
        - "3. Die Angabe eines formalen Gesetzes, nach welchem jene Sätze gebildet sind."
        - "In diesem Falle sind die Glieder des Klammerausdrucks sämtliche Glieder einer Formenreihe."
      en_ogden_ramsey_1922:
        - "An expression in brackets whose terms are propositions I indicate—if the order of the terms in the bracket is indifferent—by a sign of the form “![{ ( \\bar{\\xi} ) }](images/22c545a9a90d2f7b95fb0636e2d79882d0cd328a78afb1e7c723da5b44a774bf.svg)\\ ”."
        - "“*ξ*” is a variable whose values are the terms of the expression in brackets, and the line over the variable indicates that it stands for all its values in the bracket."
        - "\\(Thus if *ξ* has the 3 values P, Q, R, then ![{ ( \\bar{\\xi} ) }](images/22c545a9a90d2f7b95fb0636e2d79882d0cd328a78afb1e7c723da5b44a774bf.svg)\\  = (P, Q, R).)"
        - "The values of the variables must be determined."
        - "The determination is the description of the propositions which the variable stands for."
        - "How the description of the terms of the expression in brackets takes place is unessential."
        - "We may distinguish 3 kinds of description: Direct enumeration."
        - "In this case we can place simply its constant values instead of the variable."
        - "Giving a function *fx* whose values for all values of *x* are the propositions to be described."
        - "Giving a formal law, according to which those propositions are constructed."
        - "In this case the terms of the expression in brackets are all the terms of a formal series."
    edition_references:
      en_pears_mcguinness: "5.501"
    segments:
      - id: "5.501.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "當括號內各項是命題，而且項目次序無關時，我用「(ξ̄)」這類記號表示它。"
        interpretation_zh_tw: "此記號把次序無關的命題集合標成共同運算的值域。"
      - id: "5.501.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "ξ 是變項，其值為括號表達式中的各項；變項上方的橫線表示它代表括號內的全部值。"
        interpretation_zh_tw: "橫線指定此處取遍變項的整個值域，而非只代入某一項。"
      - id: "5.501.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（例如 ξ 有 P、Q、R 三個值時，(ξ̄)=(P,Q,R)。）"
        interpretation_zh_tw: "例式把抽象值域具體展開為三個命題。"
      - id: "5.501.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "變項的值必須被確定。"
        interpretation_zh_tw: "未指定值域的變項不能決定後續運算究竟作用於哪些命題。"
      - id: "5.501.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "這項確定就是描述變項所代表的命題。"
        interpretation_zh_tw: "指定值域不是替變項命名，而是給出所有可代入命題的描述。"
      - id: "5.501.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "描述括號各項的方式並不重要。"
        interpretation_zh_tw: "只要值域相同，採哪種表示方法不改變運算的邏輯結果。"
      - id: "5.501.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "我們可以區分三種描述方式：第一，直接列舉。"
        interpretation_zh_tw: "第一種方式直接把有限值域中的命題逐一列出。"
      - id: "5.501.h"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "在這種情形中，可以直接用變項的各個常項值取代變項。"
        interpretation_zh_tw: "直接列舉時，常項清單本身就完整指定值域。"
      - id: "5.501.i"
        alignment:
          de: [8]
          en_ogden_ramsey_1922: [8]
        translation_zh_tw: "第二，給出函數 fx，使它對 x 的所有取值恰為待描述的命題。"
        interpretation_zh_tw: "函數式描述以滿足共同條件的全部值來界定值域。"
      - id: "5.501.j"
        alignment:
          de: [9]
          en_ogden_ramsey_1922: [9]
        translation_zh_tw: "第三，給出建構那些命題所依循的形式法則。"
        interpretation_zh_tw: "生成律不逐項枚舉，而是規定每一項如何按同一形式產生。"
      - id: "5.501.k"
        alignment:
          de: [10]
          en_ogden_ramsey_1922: [10]
        translation_zh_tw: "在這種情形中，括號表達式的各項就是一個形式序列的全部項。"
        interpretation_zh_tw: "形式法則所生成的完整序列，構成變項在括號中的值域。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 把真值函數式組合作為非平凡語意層的最低目標之一；現行主線尚未實作命題 5.501 的完整形式系統。"
        rationale_zh_tw: "專案文件只支撐真值組合的方向，尚不支撐這裡的共同否定完備性或完整形式推導。此命題的重點是：變項值域必須可由列舉、函數或形式生成律確定；橫線記號把指定值域中的所有命題收束為運算輸入。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "### 9.4 Truth-functional composition"
            note_zh_tw: "此節把真值函數式組合列為最低語意能力，並明示這是目標而非既成實作。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "命題 5.501 所需的有限運算值域、列舉／函數式／生成律表示由此 issue 追蹤；現行模型沒有公式值域抽象。"

  - id: "5.502"
    parent: "5.5"
    texts:
      de:
        - "Ich schreibe also statt „(– – – – –W)(*ξ, . . . .*)“ „![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\ “."
        - "![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\  ist die Negation sämtlicher Werte der Satzvariablen *ξ*."
      en_ogden_ramsey_1922:
        - "Therefore I write instead of “(– – – – – T)(*ξ*, ....)”, “![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\ ”."
        - "![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\  is the negation of all the values of the propositional variable ξ."
    edition_references:
      en_pears_mcguinness: "5.502"
    segments:
      - id: "5.502.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "因此我不用「(–––––T)(ξ, ……)」，而寫成「N(ξ̄)」。"
        interpretation_zh_tw: "N 記號把冗長真值圖式縮寫為對整個指定值域的單一運算。"
      - id: "5.502.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "N(ξ̄) 是對命題變項 ξ 的全部值作否定。"
        interpretation_zh_tw: "定義明確規定 N 的輸入範圍與共同否定語意。"
    project_relations:
