  - id: "6.2322"
    parent: "6.232"
    texts:
      de:
        - "Die Identität der Bedeutung zweier Ausdrücke lässt sich nicht *behaupten*."
        - "Denn um etwas von ihrer Bedeutung behaupten zu können, muss ich ihre Bedeutung kennen: und indem ich ihre Bedeutung kenne, weiss ich, ob sie dasselbe oder verschiedenes bedeuten."
      en_ogden_ramsey_1922:
        - "The identity of the meaning of two expressions cannot be *asserted*."
        - "For in order to be able to assert anything about their meaning, I must know their meaning, and if I know their meaning, I know whether they mean the same or something different."
    edition_references:
      en_pears_mcguinness: "6.2322"
    segments:
      - id: "6.2322.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "兩個表達式指涉相同，不能被斷言。"
        interpretation_zh_tw: "同一指涉不是另一項待報導的經驗事實。"
      - id: "6.2322.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因為要斷言關於其指涉的事，我必須先知道其指涉；一旦知道，就已知道兩者指涉相同或不同。"
        interpretation_zh_tw: "論證依賴先理解表達式，不能以等號補足未知指涉。"
    project_relations:
