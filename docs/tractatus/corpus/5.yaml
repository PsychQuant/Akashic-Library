  - id: "5.131"
    parent: "5.13"
    texts:
      de:
        - "Folgt die Wahrheit eines Satzes aus der Wahrheit anderer, so drückt sich dies durch Beziehungen aus, in welchen die Formen jener Sätze zu einander stehen; und zwar brauchen wir sie nicht erst in jene Beziehungen zu setzen, indem wir sie in einem Satze miteinander verbinden, sondern diese Beziehungen sind intern und bestehen, sobald, und dadurch dass, jene Sätze bestehen."
      en_ogden_ramsey_1922:
        - "If the truth of one proposition follows from the truth of others, this expresses itself in relations in which the forms of these propositions stand to one another, and we do not need to put them in these relations first by connecting them with one another in a proposition; for these relations are internal, and exist as soon as, and by the very fact that, the propositions exist."
    edition_references:
      en_pears_mcguinness: "5.131"
    segments:
      - id: "5.131.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若一個命題的真隨其他命題的真而成立，這會表現在這些命題形式彼此所處的關係中；我們不必先用另一個命題把它們連結起來，才使它們進入這些關係。因為這些關係是內在的：命題一存在，它們就藉此而存在。"
        interpretation_zh_tw: "邏輯關係不是命題之間額外發生的事實，而是由各命題的形式直接成立。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.131 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：邏輯關係不是命題之間額外發生的事實，而是由各命題的形式直接成立。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.1311"
    parent: "5.131"
    texts:
      de:
        - "Wenn wir von *p* ∨ *q* und ∼*p* auf *q* schliessen, so ist hier durch die Bezeichnungsweise die Beziehung der Satzformen von „*p* ∨ *q*“ und „∼*p*“ verhüllt."
        - "Schreiben wir aber z. B. statt „*p* ∨ *q*“ „*p* \\| *q* . \\| . *p* \\| *q*“ und statt „∼*p*“ „*p* \\| *p*“ (*p* \\| *q* = weder *p*, noch *q*), so wird der innere Zusammenhang offenbar."
        - "\\(Dass man aus (*x*) *. fx* auf *fa* schliessen kann, das zeigt, dass die Allgemeinheit auch im Symbol „(*x*) . *fx*“ vorhanden ist.)"
      en_ogden_ramsey_1922:
        - "When we conclude from *p* ∨ *q* and \\~*p* to *q* the relation between the forms of the propositions “*p* ∨ *q*” and “\\~*p*” is here concealed by the method of symbolizing."
        - "But if we write, *e.g.* instead of “*p* ∨ *q*” “*p* \\| *q* . \\| . *p* \\| *q*” and instead of “\\~*p*” “*p* \\| *p*” (*p* \\| *q* = neither *p* nor *q*), then the inner connexion becomes obvious."
        - "\\(The fact that we can infer *fa* from (x)*fx* shows that generality is present also in the symbol “(*x*) . *fx*”.)"
    edition_references:
      en_pears_mcguinness: "5.1311"
    segments:
      - id: "5.1311.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "當我們由 p∨q 與 ~p 推出 q 時，「p∨q」與「~p」的命題形式關係被記號方式遮住了。"
        interpretation_zh_tw: "不同聯結詞的表面寫法會遮蔽有效推論所依賴的共同形式。"
      - id: "5.1311.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "但若把「p∨q」改寫為「p｜q．｜．p｜q」，並把「~p」寫成「p｜p」（p｜q 表示 p、q 皆非），內在聯繫便清楚可見。"
        interpretation_zh_tw: "統一用共同否定重寫前提後，推論關係直接顯現在共享的符號結構中。"
      - id: "5.1311.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（我們能由 (x)fx 推出 fa，顯示一般性也已存在於「(x)．fx」這個符號中。）"
        interpretation_zh_tw: "全稱記號本身已包含對任意個體的適用性，因此代入 a 不需另添一則世界事實。"
