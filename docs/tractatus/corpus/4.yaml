  - id: "4.03"
    parent: "4"
    texts:
      de:
        - "Ein Satz muss mit alten Ausdrücken einen neuen Sinn mitteilen."
        - "Der Satz teilt uns eine Sachlage mit, also muss er *wesentlich* mit der Sachlage zusammenhängen."
        - "Und der Zusammenhang ist eben, dass er ihr logisches Bild ist."
        - "Der Satz sagt nur insoweit etwas aus, als er ein Bild ist."
      en_ogden_ramsey_1922:
        - "A proposition must communicate a new sense with old words."
        - "The proposition communicates to us a state of affairs, therefore it must be *essentially* connected with the state of affairs."
        - "And the connexion is, in fact, that it is its logical picture."
        - "The proposition only asserts something, in so far as it is a picture."
    edition_references:
      en_pears_mcguinness: "4.03"
    segments:
      - id: "4.03.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題必須以舊有表達傳達新的意義。"
        interpretation_zh_tw: "新 sense 不是靠創造全新字彙，而由既有表達採取新的合法配置產生。"
      - id: "4.03.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "命題向我們傳達一個事態，所以它在本質上必須與該事態相連。"
        interpretation_zh_tw: "命題能傳達事態，預設其符號配置與可能事態之間已有投射關係。"
      - id: "4.03.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "這項連結正是命題為其邏輯圖像。"
        interpretation_zh_tw: "這項結構性連結就是「邏輯圖像」；它不是另加在命題上的相似性標籤。"
      - id: "4.03.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "命題只有在它是一幅圖像的範圍內才有所斷言。"
        interpretation_zh_tw: "命題的斷言能力以描繪一個可能事態為限；符號存在或被檢索到本身不構成斷言。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "Akashic 以 typed relation 與 projection rule 說明符號配置如何形成 picture-like 主張。"
        rationale_zh_tw: "這種結構映射可說明 record 如何表現可能事態，但專案沒有證明所有命題都服從單一圖像論。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 2. logical picture 的最小結構"
            note_zh_tw: "此節明列元素、配置、投射規則與 sense。"
          - path: "Sources/AkashicProposition/Proposition.swift"
            kind: symbol
            locator: "Proposition"
            note_zh_tw: "`Proposition` 宣告 typed authored 命題的封閉結構。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "project"
            note_zh_tw: "`project(in:)` 依端點身分與角色方向建立投射。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testReversedArgumentsReportWrongEntityKind"
            note_zh_tw: "測試確認反轉端點時會因實體種類錯誤而拒絕投射。"
    history:
