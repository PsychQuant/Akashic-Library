  - id: "6.41"
    parent: "6.4"
    texts:
      de:
        - "Der Sinn der Welt muss ausserhalb ihrer liegen."
        - "In der Welt ist alles wie es ist und geschieht alles wie es geschieht;"
        - "es gibt *in* ihr keinen Wert – und wenn es ihn gäbe, so hätte er keinen Wert."
        - "Wenn es einen Wert gibt, der Wert hat, so muss er ausserhalb alles Geschehens und So-Seins liegen."
        - "Denn alles Geschehen und So-Sein ist zufällig."
        - "Was es nicht-zufällig macht, kann nicht *in* der Welt liegen, denn sonst wäre dies wieder zufällig."
        - "Es muss ausserhalb der Welt liegen."
      en_ogden_ramsey_1922:
        - "The sense of the world must lie outside the world."
        - "In the world everything is as it is and happens as it does happen."
        - "*In* it there is no value—and if there were, it would be of no value."
        - "If there is a value which is of value, it must lie outside all happening and being-so."
        - "For all happening and being-so is accidental."
        - "What makes it non-accidental cannot lie *in* the world, for otherwise this would again be accidental."
        - "It must lie outside the world."
    edition_references:
      en_pears_mcguinness: "6.41"
    segments:
      - id: "6.41.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "世界的意義必須在世界之外。"
        interpretation_zh_tw: "第一句把意義與事實總體分層。"
      - id: "6.41.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "世界中一切如其所是地存在、如其所發生地發生。"
        interpretation_zh_tw: "這句只陳述世界內事實如何存在與發生，沒有由事實本身導出價值排序。"
      - id: "6.41.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "其中沒有價值；即使有，也不會有價值。"
        interpretation_zh_tw: "價值若只是世界內另一項偶然事實，就無法取得此處所要求的無條件地位。"
      - id: "6.41.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "若真有有價值的價值，它必須在一切發生與如此存在之外。"
        interpretation_zh_tw: "無條件價值不能只是事件鏈中的一項。"
      - id: "6.41.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "因為一切發生與如此存在都是偶然的。"
        interpretation_zh_tw: "這句提供排除世界內根基的理由。"
      - id: "6.41.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "使它成為非偶然者的東西不能在世界中，否則它又會偶然。"
        interpretation_zh_tw: "非偶然性的來源不能再是偶然事實。"
      - id: "6.41.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "它必須在世界之外。"
        interpretation_zh_tw: "「之外」是邏輯界線用語，不是另一個可定位空間。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前沒有把命題 6.41 所論的「世界的意義必須在世界之外。」設為直接軟體行為。"
        rationale_zh_tw: "命題 6.41 的直接論旨是「世界的意義必須在世界之外。」；這句處理倫理、價值、生命意義或神祕界線；Akashic 只能聲明自身表示限制，不能把資料模型冒充對該論旨的實作或裁決。"
