  - id: "5.451"
    parent: "5.45"
    texts:
      de:
        - "Hat die Logik Grundbegriffe, so müssen sie von einander unabhängig sein."
        - "Ist ein Grundbegriff eingeführt, so muss er in allen Verbindungen eingeführt sein, worin er überhaupt vorkommt."
        - "Man kann ihn also nicht zuerst für *eine* Verbindung, dann noch einmal für eine andere einführen."
        - "Z. B.: Ist die Verneinung eingeführt, so müssen wir sie jetzt in Sätzen von der Form „∼*p*“ ebenso verstehen, wie in Sätzen wie „∼(*p* ∨ *q*)“, „(∃*x*) *.* ∼*fx*“ u. a."
        - "Wir dürfen sie nicht erst für die eine Klasse von Fällen, dann für die andere einführen, denn es bliebe dann zweifelhaft, ob ihre Bedeutung in beiden Fällen die gleiche wäre und es wäre kein Grund vorhanden, in beiden Fällen dieselbe Art der Zeichenverbindung zu benützen."
        - "\\(Kurz, für die Einführung der Urzeichen gilt, mutatis mutandis, dasselbe, was Frege („Grundgesetze der Arithmetik“) für die Einführung von Zeichen durch Definitionen gesagt hat.)"
      en_ogden_ramsey_1922:
        - "If logic has primitive ideas these must be independent of one another."
        - "If a primitive idea is introduced it must be introduced in all contexts in which it occurs at all."
        - "One cannot therefore introduce it for *one* context and then again for another."
        - "For example, if denial is introduced, we must understand it in propositions of the form “\\~*p*” just as in propositions like “\\~(*p* ∨ *q*)”, “(∃*x*) . \\~*fx*” and others."
        - "We may not first introduce it for one class of cases and then for another, for it would then remain doubtful whether its meaning in the two cases was the same, and there would be no reason to use the same way of symbolizing in the two cases."
        - "\\(In short, what Frege (“Grundgesetze der Arithmetik”) has said about the introduction of signs by definitions holds, mutatis mutandis, for the introduction of primitive signs also.)"
    edition_references:
      en_pears_mcguinness: "5.451"
    segments:
      - id: "5.451.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若邏輯有原始概念，它們必須彼此獨立。"
        interpretation_zh_tw: "原始概念若能由另一項補足或界定，就不再是真正獨立的原始成分。"
      - id: "5.451.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "引入一個原始概念時，必須在它所有出現的脈絡中一併引入。"
        interpretation_zh_tw: "引入記號就是一次固定它在全部合法位置的符號角色。"
      - id: "5.451.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "因此不能先為一種連結引入它，再為另一種連結重新引入。"
        interpretation_zh_tw: "逐脈絡重訂用法會把同一字形拆成意義未必相同的多個符號。"
      - id: "5.451.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "例如引入否定時，我們必須同時理解它在「~p」、「~(p∨q)」、「(∃x)．~fx」等命題中的用法。"
        interpretation_zh_tw: "否定的真值效果必須跨命題、複合式與量化式保持一致。"
      - id: "5.451.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "我們不可先為一類情形、再為另一類情形引入它，否則兩處意義是否相同仍有疑問，也沒有理由在兩處使用同一種記號連結。"
        interpretation_zh_tw: "同一記號的語意若不能跨全部合法位置一致，字形相同便無法保證符號相同。"
      - id: "5.451.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "（簡言之，弗雷格在《算術基本法則》中論藉定義引入記號的話，經適當變更後也適用於原始記號。）"
        interpretation_zh_tw: "原始記號雖不由其他記號定義，仍須遵守一次引入、全面固定用法的要求。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 以 schema 中的合法位置與用法限制記號；這可類比命題 5.451 對一致記法的要求。"
        rationale_zh_tw: "對 5.451，此類比只及於同一欄位或標籤在各合法位置須有一致的解碼規則；Akashic 並未證成邏輯原始概念彼此獨立，或窮盡它們的一切脈絡。"
        evidence:
          - path: "docs/explainers/entity-vs-view.md"
            kind: heading
            locator: "## 是記法先犯的錯"
            note_zh_tw: "此節把錯誤定位為記法與位置的失敗，並要求由 schema 擋下不合法形狀。"
    history: []

  - id: "5.452"
    parent: "5.45"
    texts:
      de:
        - "Die Einführung eines neuen Behelfes in den Symbolismus der Logik muss immer ein folgenschweres Ereignis sein."
        - "Kein neuer Behelf darf in die Logik – sozusagen, mit ganz unschuldiger Miene – in Klammern oder unter dem Striche eingeführt werden."
        - "\\(So kommen in den „Principia Mathematica“ von Russell und Whitehead Definitionen und Grundgesetze in Worten vor."
        - "Warum hier plötzlich Worte?"
        - "Dies bedürfte einer Rechtfertigung."
        - "Sie fehlt und muss fehlen, da das Vorgehen tatsächlich unerlaubt ist.)"
        - "Hat sich aber die Einführung eines neuen Behelfes an einer Stelle als nötig erwiesen, so muss man sich nun sofort fragen: Wo muss dieser Behelf nun *immer* angewandt werden?"
        - "Seine Stellung in der Logik muss nun erklärt werden."
      en_ogden_ramsey_1922:
        - "The introduction of a new expedient in the symbolism of logic must always be an event full of consequences."
        - "No new symbol may be introduced in logic in brackets or in the margin—with, so to speak, an entirely innocent face."
        - "\\(Thus in the “Principia Mathematica” of Russell and Whitehead there occur definitions and primitive propositions in words."
        - "Why suddenly words here?"
        - "This would need a justification."
        - "There was none, and can be none for the process is actually not allowed.)"
        - "But if the introduction of a new expedient has proved necessary in one place, we must immediately ask: Where is this expedient *always* to be used?"
        - "Its position in logic must be made clear."
    edition_references:
      en_pears_mcguinness: "5.452"
    segments:
      - id: "5.452.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在邏輯記法中引入一項新手段，必定是後果深遠的事件。"
        interpretation_zh_tw: "新增記號會改變可形成的組合與推論，因此影響整個形式系統。"
      - id: "5.452.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "邏輯裡不能把新手段放在括號或頁邊，彷彿它完全無害地被引入。"
        interpretation_zh_tw: "旁註式加入仍會承擔符號功能，不能逃避全域規則的說明。"
      - id: "5.452.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（羅素與懷德海的《數學原理》中，以文字寫出了一些定義與原始命題。"
        interpretation_zh_tw: "形式系統在關鍵位置借用自然語言，就引入了尚未由自身規則說明的資源。"
      - id: "5.452.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "為何此處忽然出現文字？"
        interpretation_zh_tw: "反問要求交代自然語言在形式推導中究竟具有什麼合法地位。"
      - id: "5.452.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "這需要一項辯護。"
        interpretation_zh_tw: "任何新增表意手段都必須說清其適用範圍及與既有記號的關係。"
      - id: "5.452.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "但這項辯護既缺席，也必然缺席，因為該程序實際上不被容許。）"
        interpretation_zh_tw: "未納入形式規則的文字不能在系統內證成自己的推理角色。"
      - id: "5.452.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "然而，若某處已證明必須引入新手段，就應立刻追問：這項手段往後必須用在哪些所有地方？"
        interpretation_zh_tw: "局部需要一旦成立，就須同步界定新記號的全部合法使用位置。"
      - id: "5.452.h"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "它在邏輯中的位置必須被說明。"
        interpretation_zh_tw: "新手段與既有原始記號、生成規則的系統關係不能留白。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 以 schema 中的合法位置與用法限制記號；這可類比命題 5.452 對一致記法的要求。"
        rationale_zh_tw: "對 5.452，新增 schema 手段會連動解析、驗證與 quarantine，確實有系統性後果；但工程格式的版本演進不等於在邏輯中引入原始記號。"
        evidence:
