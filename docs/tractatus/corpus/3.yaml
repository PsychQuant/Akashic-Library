  - id: "3.3"
    parent: "3"
    texts:
      de:
        - "Nur der Satz hat Sinn; nur im Zusammenhange des Satzes hat ein Name Bedeutung."
      en_ogden_ramsey_1922:
        - "Only the proposition has sense; only in the context of a proposition has a name meaning."
    edition_references:
      en_pears_mcguinness: "3.3"
    segments:
      - id: "3.3.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "只有命題具有意義；名稱只有在命題脈絡中才有指稱。"
        interpretation_zh_tw: "名稱的語意角色由它在可真假的命題配置中取得，孤立字樣不自帶完整用法。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.3 關於表達式、符號、用法與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.3 直接主張「只有命題具有意義；名稱只有在命題脈絡中才有指稱。」，本卷並將其限制解讀為「名稱的語意角色由它在可真假的命題配置中取得，孤立字樣不自帶完整用法。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
    history: []
  - id: "3.31"
    parent: "3.3"
    texts:
      de:
        - "Jeden Teil des Satzes, der seinen Sinn charakterisiert, nenne ich einen Ausdruck (ein Symbol)."
        - "\\(Der Satz selbst ist ein Ausdruck.)"
        - "Ausdruck ist alles, für den Sinn des Satzes wesentliche, was Sätze miteinander gemein haben können."
        - "Der Ausdruck kennzeichnet eine Form und einen Inhalt."
      en_ogden_ramsey_1922:
        - "Every part of a proposition which characterizes its sense I call an expression (a symbol)."
        - "\\(The proposition itself is an expression.)"
        - "Expressions are everything—essential for the sense of the proposition—that propositions can have in common with one another."
        - "An expression characterizes a form and a content."
    edition_references:
      en_pears_mcguinness: "3.31"
    segments:
      - id: "3.31.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我把命題中每個刻畫其意義的部分稱為表達式（符號）。"
        interpretation_zh_tw: "Symbol 譯為「符號」；它不是單純可感知的記號，而是命題中由有意義用法所界定的表達部分。"
      - id: "3.31.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（命題本身也是一個表達式。）"
        interpretation_zh_tw: "表達式可涵蓋整個命題，因此不是只指詞彙或最小構件。"
      - id: "3.31.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "表達式是命題之間可以共有、而且對命題意義而言重要的一切。"
        interpretation_zh_tw: "同一表達式由跨命題保持的意義特徵辨認，不由字形相同單獨決定。"
      - id: "3.31.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "表達式刻畫一種形式與一項內容。"
        interpretation_zh_tw: "符號的角色同時限制它可進入何種命題形式，以及在那些形式中貢獻何種內容。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.31 關於表達式、符號、用法與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.31 直接主張「我把命題中每個刻畫其意義的部分稱為表達式（符號）。」，本卷並將其限制解讀為「Symbol 譯為「符號」；它不是單純可感知的記號，而是命題中由有意義用法所界定的表達部分。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
    history: []
  - id: "3.311"
    parent: "3.31"
    texts:
      de:
        - "Der Ausdruck setzt die Formen aller Sätze voraus, in welchen er vorkommen kann."
        - "Er ist das gemeinsame charakteristische Merkmal einer Klasse von Sätzen."
      en_ogden_ramsey_1922:
        - "An expression presupposes the forms of all propositions in which it can occur."
        - "It is the common characteristic mark of a class of propositions."
    edition_references:
      en_pears_mcguinness: "3.311"
    segments:
      - id: "3.311.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "表達式預設它可能出現於其中的所有命題之形式。"
        interpretation_zh_tw: "理解表達式包含掌握其合法用法範圍，不只是辨認一段相同字樣。"
      - id: "3.311.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "它是一類命題共有的特徵。"
        interpretation_zh_tw: "共同特徵跨越多個具體命題，並由它們共享的符號角色確定。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.311 關於表達式、符號、用法與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.311 直接主張「表達式預設它可能出現於其中的所有命題之形式。」，本卷並將其限制解讀為「理解表達式包含掌握其合法用法範圍，不只是辨認一段相同字樣。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
    history: []
  - id: "3.312"
    parent: "3.31"
    texts:
      de:
        - "Er wird also dargestellt durch die allgemeine Form der Sätze, die er charakterisiert."
        - "Und zwar wird in dieser Form der Ausdruck *konstant* und alles übrige *variabel* sein."
      en_ogden_ramsey_1922:
        - "It is therefore represented by the general form of the propositions which it characterizes."
        - "And in this form the expression is *constant* and everything else *variable*."
    edition_references:
      en_pears_mcguinness: "3.312"
    segments:
      - id: "3.312.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "所以，表達式由它所刻畫之命題的一般形式來表現。"
        interpretation_zh_tw: "一般形式把共享表達式保留下來，並抽離各命題不同的部分。"
      - id: "3.312.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "而在這個形式中，表達式將是常項，其餘一切則是變項。"
        interpretation_zh_tw: "常項標示被比較命題共有之處，變項則標示可替換的位置。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.312 關於表達式、符號、用法與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.312 直接主張「所以，表達式由它所刻畫之命題的一般形式來表現。」，本卷並將其限制解讀為「一般形式把共享表達式保留下來，並抽離各命題不同的部分。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
    history: []
  - id: "3.313"
    parent: "3.31"
    texts:
      de:
        - "Der Ausdruck wird also durch eine Variable dargestellt, deren Werte die Sätze sind, die den Ausdruck enthalten."
        - "\\(Im Grenzfall wird die Variable zur Konstanten, der Ausdruck zum Satz.)"
        - "Ich nenne eine solche Variable „Satzvariable“."
      en_ogden_ramsey_1922:
        - "An expression is thus presented by a variable, whose values are the propositions which contain the expression."
        - "\\(In the limiting case the variable becomes constant, the expression a proposition.)"
        - "I call such a variable a “propositional variable”."
    edition_references:
      en_pears_mcguinness: "3.313"
    segments:
      - id: "3.313.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "所以，表達式由一個變項來表現；該變項的值就是包含此表達式的命題。"
        interpretation_zh_tw: "變項在此代表一整類可能命題，其取值範圍由共享表達式界定。"
      - id: "3.313.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（在極限情況下，變項成為常項，表達式成為命題。）"
        interpretation_zh_tw: "若不再留下任何可變位置，一般形式就收斂為單一具體命題。"
      - id: "3.313.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "我把這種變項稱為「命題變項」。"
        interpretation_zh_tw: "命題變項的值是命題，而非把一個資料欄位任意命名為 variable。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.313 關於表達式、符號、用法與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.313 直接主張「所以，表達式由一個變項來表現；該變項的值就是包含此表達式的命題。」，本卷並將其限制解讀為「變項在此代表一整類可能命題，其取值範圍由共享表達式界定。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
    history: []
  - id: "3.314"
    parent: "3.31"
    texts:
      de:
        - "Der Ausdruck hat nur im Satz Bedeutung."
        - "Jede Variable lässt sich als Satzvariable auffassen."
        - "\\(Auch der variable Name.)"
      en_ogden_ramsey_1922:
        - "An expression has meaning only in a proposition."
        - "Every variable can be conceived as a propositional variable."
        - "(Including the variable name.)"
    edition_references:
      en_pears_mcguinness: "3.314"
    segments:
      - id: "3.314.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "表達式只有在命題中才有指稱。"
        interpretation_zh_tw: "表達式的功能由命題脈絡給出，孤立記號不足以確定其符號角色。"
      - id: "3.314.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "每個變項都可被理解為命題變項。"
        interpretation_zh_tw: "變項的取值可視為一類完整命題，因而應由命題形式來界定。"
      - id: "3.314.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（包括變項名稱。）"
        interpretation_zh_tw: "即使名稱位置被變項化，它也仍在命題形式中取得角色；兩版原本段落界線不同，拆句後逐一對齊。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.314 關於表達式、符號、用法與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.314 直接主張「表達式只有在命題中才有指稱。」，本卷並將其限制解讀為「表達式的功能由命題脈絡給出，孤立記號不足以確定其符號角色。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
    history: []
  - id: "3.315"
    parent: "3.31"
    texts:
      de:
        - "Verwandeln wir einen Bestandteil eines Satzes in eine Variable, so gibt es eine Klasse von Sätzen, welche sämtlich Werte des so entstandenen variablen Satzes sind."
        - "Diese Klasse hängt im allgemeinen noch davon ab, was wir, nach willkürlicher Übereinkunft, mit Teilen jenes Satzes meinen."
        - "Verwandeln wir aber alle jene Zeichen, deren Bedeutung willkürlich bestimmt wurde, in Variable, so gibt es nun noch immer eine solche Klasse."
        - "Diese aber ist nun von keiner Übereinkunft abhängig, sondern nur noch von der Natur des Satzes."
        - "Sie entspricht einer logischen Form – einem logischen Urbild."
      en_ogden_ramsey_1922:
        - "If we change a constituent part of a proposition into a variable, there is a class of propositions which are all the values of the resulting variable proposition."
        - "This class in general still depends on what, by arbitrary agreement, we mean by parts of that proposition."
        - "But if we change all those signs, whose meaning was arbitrarily determined, into variables, there always remains such a class."
        - "But this is now no longer dependent on any agreement; it depends only on the nature of the proposition."
        - "It corresponds to a logical form, to a logical prototype."
    edition_references:
      en_pears_mcguinness: "3.315"
    segments:
      - id: "3.315.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若把命題的一個構成部分改成變項，就會得到一類命題，它們全是所得變項命題的值。"
        interpretation_zh_tw: "第一次變項化把一個位置開放為取值範圍，從單一命題形成一類相關命題。"
      - id: "3.315.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這一類通常仍取決於我們依任意約定如何理解原命題的部分。"
        interpretation_zh_tw: "只抽換部分記號時，尚未移除語言共同體賦予其他記號的約定意義。"
      - id: "3.315.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "但若把所有其指稱由任意約定決定的記號都改成變項，仍會剩下一類命題。"
        interpretation_zh_tw: "更徹底的變項化企圖排除個別字彙約定，同時保留命題可具有的共同結構。"
      - id: "3.315.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "此時它不再依賴任何約定，只依賴命題的本性。"
        interpretation_zh_tw: "作者把剩餘共同性視為非任意形式；這是《論考》的哲學主張，不是資料模型可直接證成的事實。"
      - id: "3.315.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "它對應一種邏輯形式——一個邏輯原型。"
        interpretation_zh_tw: "邏輯原型是跨記法保持的可能結構，不能直接拿 Swift generic 或 schema template 充當。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.315 關於表達式、符號、用法與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.315 直接主張「若把命題的一個構成部分改成變項，就會得到一類命題，它們全是所得變項命題的值。」，本卷並將其限制解讀為「第一次變項化把一個位置開放為取值範圍，從單一命題形成一類相關命題。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
    history: []
  - id: "3.316"
    parent: "3.31"
    texts:
      de:
        - "Welche Werte die Satzvariable annehmen darf, wird festgesetzt."
        - "Die Festsetzung der Werte *ist* die Variable."
      en_ogden_ramsey_1922:
        - "What values the propositional variable can assume *is* determined."
        - "The determination of the values *is* the variable."
    edition_references:
      en_pears_mcguinness: "3.316"
    segments:
      - id: "3.316.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題變項可以取哪些值，是由規定確定的。"
        interpretation_zh_tw: "變項的身分由其允許代入的命題範圍界定，不能只看變項字母。"
      - id: "3.316.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "對值的規定就是這個變項。"
        interpretation_zh_tw: "變項不是先存在再另附範圍；其取值規則構成它作為此變項的角色。"
