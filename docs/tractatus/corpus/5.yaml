        - "(Russell und Whitehead haben die Möglichkeit dieses Fortschreitens nicht zugegeben, aber immer wieder von ihr Gebrauch gemacht.)"
      en_ogden_ramsey_1922:
        - "Only in this way is the progress from term to term in a formal series possible (from type to type in the hierarchy of Russell and Whitehead)."
        - "(Russell and Whitehead have not admitted the possibility of this progress but have made use of it all the same.)"
    edition_references:
