  - id: "5.634"
    parent: "5.63"
    texts:
      de:
        - "Das hängt damit zusammen, dass kein Teil unserer Erfahrung auch a priori ist."
        - "Alles, was wir sehen, könnte auch anders sein."
        - "Alles, was wir überhaupt beschreiben können, könnte auch anders sein."
        - "Es gibt keine Ordnung der Dinge a priori."
      en_ogden_ramsey_1922:
        - "This is connected with the fact that no part of our experience is also a priori."
        - "Everything we see could also be otherwise."
        - "Everything we can describe at all could also be otherwise."
        - "There is no order of things a priori."
    edition_references:
      en_pears_mcguinness: "5.634"
    segments:
      - id: "5.634.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "這與我們經驗的任何部分都不是先於經驗的這項事實相連。"
        interpretation_zh_tw: "經驗內容沒有哪一塊因主體視點而成為不可更動的先驗事實。"
      - id: "5.634.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我們看見的一切都可能是另一種樣子。"
        interpretation_zh_tw: "任何實際視覺配置都是偶然的，不由邏輯保證。"
      - id: "5.634.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "凡我們能描述的，也都可能是另一種樣子。"
        interpretation_zh_tw: "有意義命題必須容許真假，因此其所描述情形可以不成立。"
      - id: "5.634.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "事物並沒有先於經驗的秩序。"
        interpretation_zh_tw: "具體世界秩序不能由純邏輯預先讀出。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.634 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：經驗內容沒有哪一塊因主體視點而成為不可更動的先驗事實；任何實際視覺配置都是偶然的，不由邏輯保證；有意義命題必須容許真假，因此其所描述情形可以不成立；具體世界秩序不能由純邏輯預先讀出。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.64"
    parent: "5.6"
    texts:
      de:
        - "Hier sieht man, dass der Solipsismus, streng durchgeführt, mit dem reinen Realismus zusammenfällt."
        - "Das Ich des Solipsismus schrumpft zum ausdehnungslosen Punkt zusammen, und es bleibt die ihm koordinierte Realität."
      en_ogden_ramsey_1922:
        - "Here we see that solipsism strictly carried out coincides with pure realism."
        - "The I in solipsism shrinks to an extensionless point and there remains the reality co-ordinated with it."
    edition_references:
      en_pears_mcguinness: "5.64"
    segments:
      - id: "5.64.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在此可見，貫徹到底的唯我論與純粹實在論重合。"
        interpretation_zh_tw: "唯我論若不再把我當世界內唯一實體，就不會排除世界中任何現實。"
      - id: "5.64.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "唯我論的我縮成一個沒有延展的點，留下與它相對應的現實。"
        interpretation_zh_tw: "我只作為世界的無延展視點與界線保留，世界本身則完整留下。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.64 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：一旦不把「我」當作世界內實體，唯我論只留下世界及其無延展視點，因而與承認全部現實的實在論重合。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.641"
    parent: "5.64"
    texts:
      de:
        - "Es gibt also wirklich einen Sinn, in welchem in der Philosophie nicht-psychologisch vom Ich die Rede sein kann."
        - "Das Ich tritt in die Philosophie dadurch ein, dass die „Welt meine Welt ist“."
        - "Das philosophische Ich ist nicht der Mensch, nicht der menschliche Körper, oder die menschliche Seele, von der die Psychologie handelt, sondern das metaphysische Subjekt, die Grenze – nicht ein Teil der Welt."
      en_ogden_ramsey_1922:
        - "There is therefore really a sense in which in philosophy we can talk of a non-psychological I."
        - "The I occurs in philosophy through the fact that the “world is my world”."
        - "The philosophical I is not the man, not the human body or the human soul of which psychology treats, but the metaphysical subject, the limit—not a part of the world."
    edition_references:
      en_pears_mcguinness: "5.641"
    segments:
      - id: "5.641.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "因此，確實有一種意義容許我們在哲學中談非心理學的我。"
        interpretation_zh_tw: "哲學可談的不是經驗心理特徵，而是世界以第一人稱具有界線這件事。"
      - id: "5.641.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我之所以進入哲學，是因為「世界是我的世界」。"
        interpretation_zh_tw: "「我」出現於世界與可理解語言的界線重合，而非作為新增的世界內對象。"
      - id: "5.641.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "哲學的我不是人，不是人的身體，也不是心理學所處理的人的靈魂；它是形上主體，是世界的界限，而不是世界的一部分。"
        interpretation_zh_tw: "結論明確區分經驗中的人與形上主體：前者可描述，後者只標示描述整體的界線。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.641 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：哲學可談的不是經驗心理特徵，而是世界以第一人稱具有界線這件事；「我」出現於世界與可理解語言的界線重合，而非作為新增的世界內對象；結論明確區分經驗中的人與形上主體：前者可描述，後者只標示描述整體的界線。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
