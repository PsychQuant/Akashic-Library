  - id: "5.555"
    parent: "5.55"
    texts:
      de:
        - "Es ist klar, wir haben vom Elementarsatz einen Begriff, abgesehen von seiner besonderen logischen Form."
        - "Wo man aber Symbole nach einem System bilden kann, dort ist dieses System das logisch wichtige und nicht die einzelnen Symbole."
        - "Und wie wäre es auch möglich, dass ich es in der Logik mit Formen zu tun hätte, die ich erfinden kann; sondern mit dem muss ich es zu tun haben, was es mir möglich macht, sie zu erfinden."
      en_ogden_ramsey_1922:
        - "It is clear that we have a concept of the elementary proposition apart from its special logical form."
        - "Where, however, we can build symbols according to a system, there this system is the logically important thing and not the single symbols."
        - "And how would it be possible that I should have to deal with forms in logic which I can invent: but I must have to deal with that which makes it possible for me to invent them."
    edition_references:
      en_pears_mcguinness: "5.555"
    segments:
      - id: "5.555.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "顯然，我們不依賴基本命題的特殊邏輯形式，也具有基本命題這個概念。"
        interpretation_zh_tw: "我們理解基本命題的角色，不必先知道所有具體項數或排列。"
      - id: "5.555.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "但凡能依一套系統建構符號，邏輯上重要的是那套系統，而不是個別符號。"
        interpretation_zh_tw: "生成規則比任意列出的單一形式更能表達邏輯必然性。"
      - id: "5.555.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "我怎可能必須在邏輯中處理我自己能發明的形式？我所必須處理的，應是使我能發明它們的東西。"
        interpretation_zh_tw: "邏輯研究的是造出各種記法的共同可能條件，不是把人為發明逐項神聖化。"
    project_relations:
