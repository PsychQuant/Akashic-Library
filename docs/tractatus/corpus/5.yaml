        rationale_zh_tw: "此命題的具體內容是：問題要求的是基本命題形式的完整先驗清單；未知名稱的可能數量，使逐項列舉基本命題形式的企圖失去根據。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
