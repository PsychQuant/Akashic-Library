        rationale_zh_tw: "命題 3.33 直接主張「在邏輯句法中，記號的指稱絕不可扮演任何角色；邏輯句法必須能在不談記號指稱的情況下建立，而且只可預設對表達式的描述。」，本卷並將其限制解讀為「此條要求句法規則保持在符號描述層，不能靠先偷看對象層語意才決定哪些組合合法。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
