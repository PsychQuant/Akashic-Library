  - id: "3.328"
    parent: "3.32"
    texts:
      de:
        - "Wird ein Zeichen *nicht gebraucht*, so ist es bedeutungslos."
        - "Das ist der Sinn der Devise Occams."
        - "\\(Wenn sich alles so verhält als hätte ein Zeichen Bedeutung, dann hat es auch Bedeutung.)"
      en_ogden_ramsey_1922:
        - "If a sign is *not necessary* then it is meaningless."
        - "That is the meaning of Occam’s razor."
        - "\\(If everything in the symbolism works as though a sign had meaning, then it has meaning.)"
    edition_references:
      en_pears_mcguinness: "3.328"
    segments:
      - id: "3.328.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若一個記號不被使用，它便沒有指稱。"
        interpretation_zh_tw: "工作譯文依德文 *nicht gebraucht* 作「不被使用」；Ogden／Ramsey 的 *not necessary* 是版本差異，不能悄悄改寫原文。"
      - id: "3.328.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這就是 Occam 格言的意義。"
        interpretation_zh_tw: "奧坎原則在此拒絕沒有任何符號作用的閒置記號，而不是一般性的程式效能準則。"
      - id: "3.328.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（若一切運作都如同某記號有指稱，那麼它也就有指稱。）"
        interpretation_zh_tw: "指稱由整體符號實踐中的作用顯出，不必在有效作用之外再假定一個隱藏實體。"
