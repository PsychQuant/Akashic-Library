        disposition: revised
        note_zh_tw: "此 issue 所追蹤的 snapshot revision、valid-time affiliation、typed context 與 evidence trace 已有直接實作及測試證據；關係仍因館藏 snapshot 沒有現實完備性證明而維持 partial。"
