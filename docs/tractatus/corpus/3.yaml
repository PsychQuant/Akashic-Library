    texts:
      de:
        - "Der Satz besitzt wesentliche und zufällige Züge."
        - "Zufällig sind die Züge, die von der besonderen Art der Hervorbringung des Satzzeichens herrühren."
        - "Wesentlich diejenigen, welche allein den Satz befähigen, seinen Sinn auszudrücken."
      en_ogden_ramsey_1922:
        - "A proposition possesses essential and accidental features."
        - "Accidental are the features which are due to a particular way of producing the propositional sign."
        - "Essential are those which alone enable the proposition to express its sense."
