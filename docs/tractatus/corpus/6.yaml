  - id: "6.3611"
    parent: "6.361"
    texts:
      de:
        - "Wir können keinen Vorgang mit dem „Ablauf der Zeit“ vergleichen – diesen gibt es nicht –, sondern nur mit einem anderen Vorgang (etwa mit dem Gang des Chronometers)."
        - "Daher ist die Beschreibung des zeitlichen Verlaufs nur so möglich, dass wir uns auf einen anderen Vorgang stützen."
        - "Ganz Analoges gilt für den Raum."
        - "Wo man z. B. sagt, es könne keines von zwei Ereignissen (die sich gegenseitig ausschliessen) eintreten, weil *keine Ursache* vorhanden sei, warum das eine eher als das andere eintreten solle, da handelt es sich in Wirklichkeit darum, dass man gar nicht *eines* der beiden Ereignisse beschreiben kann, wenn nicht irgend eine Asymmetrie vorhanden ist."
        - "Und *wenn* eine solche Asymmetrie vorhanden *ist*, so können wir diese als *Ursache* des Eintreffens des einen und Nicht-Eintreffens des anderen auffassen."
      en_ogden_ramsey_1922:
        - "We cannot compare any process with the “passage of time”—there is no such thing—but only with another process (say, with the movement of the chronometer)."
        - "Hence the description of the temporal sequence of events is only possible if we support ourselves on another process."
        - "It is exactly analogous for space."
        - "When, for example, we say that neither of two events (which mutually exclude one another) can occur, because there is *no cause* why the one should occur rather than the other, it is really a matter of our being unable to describe *one* of the two events unless there is some sort of asymmetry."
        - "And if there *is* such an asymmetry, we can regard this as the *cause* of the occurrence of the one and of the non-occurrence of the other."
    edition_references:
      en_pears_mcguinness: "6.3611"
    segments:
      - id: "6.3611.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們不能把任何過程與「時間流逝」比較，因為沒有這種獨立過程；只能把它與另一過程比較，例如計時器運行。"
        interpretation_zh_tw: "時間量測依事件間比較，不依名為時間流的額外對象。"
      - id: "6.3611.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "所以描述時間進程只能依靠另一個過程。"
        interpretation_zh_tw: "量測基準本身也是一個過程。"
      - id: "6.3611.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "空間也完全類似。"
        interpretation_zh_tw: "空間描述同樣需要關係基準。"
      - id: "6.3611.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "若兩個互斥事件都因沒有原因偏向其一而被說成不能發生，真正問題是：缺少不對稱時，根本無法描述其中一個事件。"
        interpretation_zh_tw: "這句以可描述性重新分析所謂無原因的對稱情況。"
      - id: "6.3611.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "若有不對稱，就可把它視為一者發生而另一者不發生的原因。"
        interpretation_zh_tw: "不對稱可作原因描述，但不是說任何差異都已構成充分因果證據。"
    project_relations:
