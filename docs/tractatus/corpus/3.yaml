  - id: "3.343"
    parent: "3.34"
    texts:
      de:
        - "Definitionen sind Regeln der Übersetzung von einer Sprache in eine andere."
        - "Jede richtige Zeichensprache muss sich in jede andere nach solchen Regeln übersetzen lassen:"
        - "*Dies* ist, was sie alle gemeinsam haben."
      en_ogden_ramsey_1922:
        - "Definitions are rules for the translation of one language into another."
        - "Every correct symbolism must be translatable into every other according to such rules."
        - "It is *this* which all have in common."
    edition_references:
      en_pears_mcguinness: "3.343"
    segments:
      - id: "3.343.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "定義是從一種語言翻譯到另一種語言的規則。"
        interpretation_zh_tw: "定義在此提供保存指示關係的轉換，不只是為同一字串附上一段說明文字。"
      - id: "3.343.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "每一種正確的符號語言，都必須能依這類規則翻譯成任何另一種。"
        interpretation_zh_tw: "可翻譯性要求轉換時保存相關的符號結構與作用，不只是輸出另一種可解析格式。"
      - id: "3.343.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "這就是它們共有之處。"
        interpretation_zh_tw: "共有者是受規則約束的可互譯結構，不是各種記法表面使用同一批字元。"
