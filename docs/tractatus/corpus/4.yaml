    texts:
      de:
        - "So zeigt ein Satz „*fa*“, dass in seinem Sinn der Gegenstand *a* vorkommt, zwei Sätze „*fa*“ und „*ga*“, dass in ihnen beiden von demselben Gegenstand die Rede ist."
        - "Wenn zwei Sätze einander widersprechen, so zeigt dies ihre Struktur; ebenso, wenn einer aus dem anderen folgt."
        - "U. s. w."
      en_ogden_ramsey_1922:
        - "Thus a proposition “*fa*” shows that in its sense the object *a* occurs, two propositions “*fa*” and “*ga*” that they are both about the same object."
        - "If two propositions contradict one another, this is shown by their structure; similarly if one follows from another, etc."
