        rationale_zh_tw: "命題 3.3421 直接主張「某種特定指示方式也許不重要，但它必須是一種可能的指示方式，這點總是重要。」，本卷並將其限制解讀為「哲學關注的不只是選了哪個字形，而是該記法是否能在邏輯結構中一致運作。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
