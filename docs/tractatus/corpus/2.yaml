  - id: "2.16"
    parent: "2.1"
    texts:
      de:
        - "Die Tatsache muss um Bild zu sein, etwas mit dem Abgebildeten gemeinsam haben."
      en_ogden_ramsey_1922:
        - "In order to be a picture a fact must have something in common with what it pictures."
    edition_references:
      en_pears_mcguinness: "2.16"
    segments:
      - id: "2.16.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一個事實若要成為圖像，就必須與被描繪者共有某種東西。"
        interpretation_zh_tw: "因圖像本身也是事實，它若要描繪另一者，兩邊必須有可支撐對應的共同條件；純粹任意配對不夠。"
    project_relations:
      - status: analogy_only
        mode: structural_invariant
        claim_zh_tw: "Akashic 只在記錄與所表現內容具有可檢查結構對應時，採用 picture-like 的說法。"
        rationale_zh_tw: "共同處來自 schema、角色與投射規則，但這些工程規則是局部約定，不能直接等同邏輯形式。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 2. logical picture 的最小結構"
            note_zh_tw: "此節要求 configuration 與 projection rule，而不以表面相似作準。"
    history: []

  - id: "2.161"
    parent: "2.16"
    texts:
      de:
        - "In Bild und Abgebildetem muss etwas identisch sein, damit das eine überhaupt ein Bild des anderen sein kann."
      en_ogden_ramsey_1922:
        - "In the picture and the pictured there must be something identical in order that the one can be a picture of the other at all."
    edition_references:
      en_pears_mcguinness: "2.161"
    segments:
      - id: "2.161.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "圖像與被描繪者之中必須有某種相同的東西，一方才可能真正成為另一方的圖像。"
        interpretation_zh_tw: "「相同」所指不是元素本身同一，而是讓兩種配置可對應的形式；後續命題會將它明確化為描繪形式與邏輯形式。"
    project_relations:
      - status: analogy_only
        mode: structural_invariant
        claim_zh_tw: "Akashic 的 canonical record 與衍生表示只有在轉換保留相關結構時，才被視為同一內容的不同表現。"
        rationale_zh_tw: "這是可測的結構保存類比；不同資料格式共享的 schema 關係並非哲學上唯一且普遍的邏輯形式。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 3. 維根斯坦自己的例子，以及它們對 Akashic 的意義"
            note_zh_tw: "此節以 canonical record 與衍生格式的結構保存說明對應條件。"
    history: []

  - id: "2.17"
    parent: "2.1"
    texts:
      de:
        - "Was das Bild mit der Wirklichkeit gemein haben muss, um sie auf seine Art und Weise – richtig oder falsch – abbilden zu können, ist seine Form der Abbildung."
      en_ogden_ramsey_1922:
        - "What the picture must have in common with reality in order to be able to represent it after its manner—rightly or falsely—is its form of representation."
    edition_references:
      en_pears_mcguinness: "2.17"
    segments:
      - id: "2.17.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "圖像為了能依其自身方式——正確或錯誤地——描繪實在，而必須與實在共有的，就是它的描繪形式。"
        interpretation_zh_tw: "共同的描繪形式使真假皆可表現：錯誤圖像仍有形式與意義，只是其所表現狀況不符合實在。"
    project_relations:
      - status: analogy_only
        mode: structural_invariant
        claim_zh_tw: "Akashic 文件要求 picture-like 表示具有明確投射規則，且不把格式正確直接等同內容為真。"
        rationale_zh_tw: "這與描繪形式的角色相似，但投射規則由專案設計且可能有損，故只標為類比。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 2. logical picture 的最小結構"
            note_zh_tw: "此節同時列出 projection rule 與獨立的 reality comparison。"
    history: []

  - id: "2.171"
    parent: "2.17"
    texts:
      de:
        - "Das Bild kann jede Wirklichkeit abbilden, deren Form es hat."
        - "Das räumliche Bild alles Räumliche, das farbige alles Farbige, etc."
      en_ogden_ramsey_1922:
        - "The picture can represent every reality whose form it has."
        - "The spatial picture, everything spatial, the coloured, everything coloured, etc."
    edition_references:
      en_pears_mcguinness: "2.171"
    segments:
      - id: "2.171.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "圖像能描繪任何它所具有其形式的實在。"
        interpretation_zh_tw: "圖像的描繪範圍由它具備何種形式決定；缺少相應形式的圖像不能跨域表現。"
      - id: "2.171.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "空間圖像能描繪一切空間事物，有色圖像能描繪一切有色事物，等等。"
        interpretation_zh_tw: "空間性與有色性是領域特定的描繪形式例子；它們不是所有圖像都必須共有的材質。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 的各種 export 只能保留其投射規則所涵蓋的內容面向。"
        rationale_zh_tw: "衍生格式可能丟失 provenance、identity 或時間區分，故專案明確拒絕把任一表示視為可描繪所有內容。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 3. 維根斯坦自己的例子，以及它們對 Akashic 的意義"
            note_zh_tw: "此節說明衍生格式只在投射保存相關結構時表現同一內容。"
    history: []

  - id: "2.172"
    parent: "2.17"
    texts:
      de:
        - "Seine Form der Abbildung aber, kann das Bild nicht abbilden; es weist sie auf."
      en_ogden_ramsey_1922:
        - "The picture, however, cannot represent its form of representation; it shows it forth."
    edition_references:
      en_pears_mcguinness: "2.172"
    segments:
      - id: "2.172.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "然而，圖像不能描繪自己的描繪形式；它把這形式顯示出來。"
        interpretation_zh_tw: "圖像運用其形式來描繪，因而不能再站在同一形式之外把它當作一般對象描繪；形式在圖像能做什麼之中顯示。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 文件承認 schema 不能僅靠更多同層 schema 無限奠基自己的全部使用條件。"
        rationale_zh_tw: "這是對「不能站到自身表現形式之外」的工程類比，不是宣稱程式限制與說／顯示區分完全相同。"
        evidence:
          - path: "docs/design-principles-and-philosophy.md"
            kind: heading
            locator: "## 14. 早期維根斯坦：圖書館作為世界的圖像"
            note_zh_tw: "此節直接討論圖像不能站到自身表現形式之外。"
    history: []

  - id: "2.173"
    parent: "2.17"
    texts:
      de:
        - "Das Bild stellt sein Objekt von ausserhalb dar (sein Standpunkt ist seine Form der Darstellung), darum stellt das Bild sein Objekt richtig oder falsch dar."
      en_ogden_ramsey_1922:
        - "The picture represents its object from without (its standpoint is its form of representation), therefore the picture represents its object rightly or falsely."
    edition_references:
      en_pears_mcguinness: "2.173"
    segments:
      - id: "2.173.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "圖像從外部表現其對象（它的立足點就是它的表現形式），因此圖像會正確或錯誤地表現其對象。"
        interpretation_zh_tw: "圖像有一個由表現形式決定的立足點，並不與對象合一；正因保持可比較距離，才有正確與錯誤之分。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "Akashic 將記錄視為帶有 schema、來源與知識狀態之立足點的表現，而非事物自身。"
        rationale_zh_tw: "這種外部表現使錯誤與修訂可見，但它是資料治理上的類比，並非原典立足點概念的完整實作。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 3. 維根斯坦自己的例子，以及它們對 Akashic 的意義"
            note_zh_tw: "此節區分 well-formed assertion、truth status、evidence 與 adjudication。"
    history: []

  - id: "2.174"
    parent: "2.17"
    texts:
      de:
        - "Das Bild kann sich aber nicht ausserhalb seiner Form der Darstellung stellen."
      en_ogden_ramsey_1922:
        - "But the picture cannot place itself outside of its form of representation."
    edition_references:
      en_pears_mcguinness: "2.174"
    segments:
      - id: "2.174.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "但是，圖像不能把自己置於其表現形式之外。"
        interpretation_zh_tw: "任何描繪都已在某種形式中運作；試圖從完全無形式的外部描述該形式，仍會使用另一種表現方式。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 的 schema 與文件只能從既有記法中說明其表現邊界，不能取得完全無記法的觀點。"
        rationale_zh_tw: "此限制可提醒專案避免無限後設奠基，但不表示所有 schema 問題都只能顯示、不能文件化。"
        evidence:
          - path: "docs/design-principles-and-philosophy.md"
            kind: heading
            locator: "## 14. 早期維根斯坦：圖書館作為世界的圖像"
            note_zh_tw: "此節直接以 schema 類比不能站到自身表現形式之外。"
    history: []

  - id: "2.18"
    parent: "2.1"
    texts:
      de:
        - "Was jedes Bild, welcher Form immer, mit der Wirklichkeit gemein haben muss, um sie überhaupt – richtig oder falsch – abbilden zu können, ist die logische Form, das ist, die Form der Wirklichkeit."
      en_ogden_ramsey_1922:
        - "What every picture, of whatever form, must have in common with reality in order to be able to represent it at all—rightly or falsely—is the logical form, that is, the form of reality."
    edition_references:
      en_pears_mcguinness: "2.18"
    segments:
      - id: "2.18.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "任何圖像，不論具有何種形式，為了根本能正確或錯誤地描繪實在，而必須與實在共有的，就是邏輯形式，也就是實在的形式。"
        interpretation_zh_tw: "空間、色彩等特定形式可以不同，但一切可描繪者仍須共享邏輯形式；否則連真假比較的共同空間都不存在。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "Akashic 以結構可投射性說明不同表示如何可能指向同一內容。"
        rationale_zh_tw: "專案沒有證明或實作普遍的「實在形式」；它只在各 schema 與 export 邊界內檢查局部結構保存。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 2. logical picture 的最小結構"
            note_zh_tw: "此節以 projection rule 說明結構對應的最低條件。"
    history: []

  - id: "2.181"
    parent: "2.18"
    texts:
      de:
        - "Ist die Form der Abbildung die logische Form, so heisst das Bild das logische Bild."
      en_ogden_ramsey_1922:
        - "If the form of representation is the logical form, then the picture is called a logical picture."
    edition_references:
      en_pears_mcguinness: "2.181"
    segments:
      - id: "2.181.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "如果描繪形式就是邏輯形式，那麼這幅圖像就稱為邏輯圖像。"
        interpretation_zh_tw: "「邏輯圖像」不是另一種視覺媒材，而是以邏輯形式作為描繪形式、因而能表現可真可假的狀況之圖像。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "專案文件使用 logical picture 一詞描述具元素、配置、投射規則與意義的工程模型。"
        rationale_zh_tw: "文件同時明言這是受維根斯坦啟發的工程詮釋，不主張 Akashic 完整實作其理論。"
        evidence:
