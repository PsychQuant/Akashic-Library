        - |-
          |p |q |r |
          |---|---|---|
          |T|T|T |
          |F|T|T |
          |T|F|T |
          |T|T|F |
          |F|F|T |
          |F|T|F |
          |T|F|F |
          |F|F|F |
        - |-
          |p |q |
          |---|---|
