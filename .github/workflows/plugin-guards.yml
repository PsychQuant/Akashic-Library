name: Plugin guards

# **為什麼是獨立 workflow 而不是 ci.yml 的一個 step**
#
# `ci.yml` 的 `paths-ignore` 明列 `plugin/**`——一個純 plugin 的 push 不只是
# 「CI 沒跑守衛」，是**整個 CI job 被跳過**。那個排除有真實理由（macOS runner
# 是 10× 計費，2026-08 兩度把免費額度燒光），而它的註解當時寫著排除 plugin 的
# 理由是「plugin shell 沒有任何測試讀取」。
#
# 那句話當時為真、現在為假：`plugin/` 底下已經有五支守衛。#407 R6 的跨模型審查
# 量到這個缺口——「進版控不等於會被執行」。
#
# 解法不是把 `plugin/**` 從那份 paths-ignore 拿掉（那會讓每次改 skill 散文都點
# 一台 10× 計費的 macOS runner，重演被燒光的那件事），而是**按需求分流**：
#
#   * 純 python／bash 的守衛（散文、覆蓋）→ 這裡，ubuntu，1× 計費。
#   * 需要 build 好的 CLI 當 oracle 的 parity 守衛 → `census-parity.yml`，macOS，
#     但觸發路徑**只有三條**（census 本身、parity 測試、它的 oracle
#     `StoreVersion.swift`）。那三條就是「parity 可能因此破掉」的完整條件。
#
# （`ci.yml` 的 macOS job 也有一個 parity step，但它的觸發是 push-to-main ＋
# `paths-ignore: plugin/**`——所以改 census 時它反而被跳過。`census-parity.yml`
# 補的正是那一格；兩者重疊無害。）

# **`Sources/AkashicCore/Venue.swift` 也在觸發路徑裡**：散文守衛的第 5 項讀它，
# 存在的理由正是「規則檔的值域宣稱會與那個 enum 漂移」。只監看 plugin/** 的話，
# 改 enum 不觸發任何跑那個守衛的 workflow——而那正是它防的那個漂移
# （#407 R7 verify）。
on:
  push:
    branches: [main]
    paths: &guard_paths
      - "plugin/**"
      - "Sources/AkashicCore/Venue.swift"
      # trigger-coverage.py 讀這兩處——**改觸發點本身就該重跑它**，
      # 否則一個把守衛從 workflow 拿掉的 PR 不會驚動任何東西（#407 R19）。
      - ".github/workflows/**"
      - ".githooks/**"
      # parity 的 oracle。它不在這裡跑 parity（那需要 build，屬 census-parity.yml），
      # 但 trigger-coverage 要能看見它改動時的覆蓋狀況。
      - "Sources/AkashicStoreIO/StoreVersion.swift"
      # decision-matrix-drift.py 的輸入是 CLAUDE.md 的 8 列決策矩陣（#407 R27）。
      # 表改了守衛就得跑——不加這條的話，一個改壞矩陣的 push 在 CI 側完全無聲。
      - "CLAUDE.md"
      # measured-numbers-audit.py 讀 .claude/rules 與 plugin/rules 兩處（#407 R36）。
      - ".claude/rules/**"
      # parity-table-drift.py 拿這兩支當真值來源（#407 R50）。
      - "Sources/akashic-mcp/Server.swift"
      - "Sources/akashic/*.swift"
      # backlink-field-ratchet.py 讀這六個型別檔（#407 R51）。
      - "Sources/AkashicCore/*.swift"
  pull_request:
    paths: *guard_paths

# **最小權限 ＋ 不留憑證**（#407 R8 HIGH）。這兩個 workflow 以 `pull_request`
# 觸發並**執行 PR 端可控的程式碼**（守衛本身就是 PR 可以改的檔案）。
# `actions/checkout` 預設 `persist-credentials: true` 會把 token 留在 git config，
# 於是被改過的守衛腳本可以直接拿它 push。同 repo 的 contributor PR 拿到的 token
# 不像 fork PR 那樣被降權，所以這道防線不能靠外部設定。
permissions:
  contents: read

concurrency:
  group: plugin-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 規則有沒有被每個 skill 掛到，且相對路徑真的解析得到。
      - name: rule-coverage
        run: bash plugin/tests/rule-coverage.sh

      # 散文守衛。`--venue` 顯式指向 checkout 內的原始碼——**不給的話第 5 項會
      # 走「未涵蓋」出口並以 exit 2 表明它沒被執行**（未涵蓋不得冒充通過）。
      # 逐條重建審查者宣稱的失敗情境。純 bash，不需要 build 產物。
      - name: review-claim-audit
        run: bash plugin/tests/review-claim-audit.sh

      - name: rule-prose-guards
        run: python3 plugin/tests/rule-prose-guards.py --venue Sources/AkashicCore/Venue.swift

      # 上一步的每一項都證明會紅。一個從沒紅過的檢查，和一個不存在的檢查，
      # 在報告上長得一模一樣。
      - name: rule-prose-guards negative control
        run: python3 plugin/tests/rule-prose-guards-mutations.py

      # 觸發點自己的守衛。它不執行任何被保護的程式碼，只讀 workflow／hook 的
      # 設定與各守衛的原始碼——所以放在 ubuntu（1× 計費）這一側。
      # plugin.json 的 description 宣告 store format,而它與 `StoreVersion.supported`
      # 是同一份規格的兩個副本。實測三次漂移零次被發現（#408）——放這裡不放 macOS 那側:
      # 它只讀兩個檔的文字,不需要 build。
      - name: plugin.json 的 store format 與唯一來源一致
        run: python3 plugin/tests/plugin-store-format-parity.py

      - name: 觸發點覆蓋（逐對，非聯集）
        run: python3 plugin/tests/trigger-coverage.py
      - name: 觸發點守衛的 negative control
        run: python3 plugin/tests/trigger-coverage-mutations.py
      - name: 判準表的現查
        run: python3 plugin/tests/measured-claims-audit.py

      # 決策矩陣的漂移檢查。純讀 CLAUDE.md 的表 + 兩條語意規則，不跑任何
      # 被保護的程式碼、不需要 swift ——所以同樣放 ubuntu（1× 計費）這一側。
      - name: 決策矩陣漂移
        run: python3 plugin/tests/decision-matrix-drift.py
      - name: 決策矩陣守衛的 negative control
        run: python3 plugin/tests/decision-matrix-mutations.py
      # exit 2 ＝「跑得動的都綠，但有沒跑到的」（#407 R43）。本 runner 是 stock
      # ubuntu，沒有 Swift toolchain，所以 6 個需要它的 case 一定跳過。**顯式接受 2
      # 並把跳過清單印出來**——而 1（真的有 case 紅）照樣讓這一步失敗。
      - name: rule-coverage／hash-table-drift／review-claim-audit 的 negative control
        run: |
          set +e
          python3 plugin/tests/audit-guards-mutations.py
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning::此 runner 沒有 Swift toolchain，6 個 case 未執行（見上方清單）"
            exit 0
          fi
          exit "$rc"
      # oracle 前提檢查自己的負控（#407 R67h）。它毒化「ROBUST case 最多」的那一支
      # 守衛——刻意不是隨手挑：只有一格的守衛在前提不成立時第一輪就 continue，走不到
      # 會 KeyError 的那條路徑，而 R67e 的 scratch probe 正是這樣漏掉它的。
      # 它跑的是 harness 本身，所以在無 Swift 的 runner 上同樣走 skip 路徑；通過數是
      # 現算的，不寫死，因此兩種環境都成立。
      - name: oracle 前提檢查會乾淨降級
        run: python3 plugin/tests/oracle-precondition-control.py
      - name: 規則檔的實測數字要有時間錨
        run: python3 plugin/tests/measured-numbers-audit.py
      - name: parity 表 vs 程式碼
        run: python3 plugin/tests/parity-table-drift.py
      - name: 欄位棘輪（14 條邊的表）
        run: python3 plugin/tests/backlink-field-ratchet.py
      - name: zero-instance 裁決表的編號棘輪
        run: python3 plugin/tests/zero-instance-rows-audit.py
      - name: literal 純量解碼 parity
        run: python3 plugin/tests/literal-scalar-parity.py
