    parent: "6.3"
    texts:
      de:
        - "Obwohl die Flecke in unserem Bild geometrische Figuren sind, so kann doch selbstverständlich die Geometrie gar nichts über ihre tatsächliche Form und Lage sagen."
        - "Das Netz aber ist *rein* geometrisch, alle seine Eigenschaften können a priori angegeben werden."
        - "Gesetze, wie der Satz vom Grunde, etc., handeln vom Netz, nicht von dem, was das Netz beschreibt."
      en_ogden_ramsey_1922:
        - "Although the spots in our picture are geometrical figures, geometry can obviously say nothing about their actual form and position."
        - "But the network is *purely* geometrical, and all its properties can be given a priori."
        - "Laws, like the law of causation, etc., treat of the network and not of what the network describes."
    edition_references:
