name: CI

# **只在 PR 與 push to main 觸發**（#57）。macOS runner 的 GitHub Actions 計費
# 倍率是 10×，而這個 repo 是 Apple 平台專屬（Swift + XCTest + macOS-only 依賴），
# 沒有 Linux 選項。在每個 feature branch 的每次 push 都跑，成本與價值不成比例——
# PR 是改動進入 main 之前的最後一道門，那裡跑一次就夠。
# 觸發改制（2026-08-07，使用者裁決）：只在 push to main 跑一次。
# macOS runner 是 10× 計費——「每 PR 每 push 都跑」在 2026-08 把 free plan 的
# 月額度燒到 14016/2000 折算分鐘，runner 層直接拒跑。PR 面的把關改由
# .githooks/pre-push（本機全套）+ verify 紀律承擔；CI 保留「乾淨環境」的
# 獨特價值（#109 的教訓：submodule/DerivedData 殘留只有乾淨 checkout 抓得到），
# 在每次 merge 後驗一次。
#
# 二次止血（2026-08-14）：改制後額度仍於 8 月中用罄——單日 6 次 main push
# 幾乎全為 docs-only（skill／README／規則），卻每次點一台 macOS runner。
# 加 paths-ignore：改動**全部**落在下列路徑才跳過（混有 code 的 push 照跑）。
# 忽略清單刻意不含 docs/tractatus/**——corpus YAML 是測試的輸入（strict
# validation 解析 locator，#266 的跨 PR 破壞即實例）。
#
# **`plugin/**` 留在忽略清單，但理由已經換了**（#407 R6）。原註解寫的是
# 「plugin shell 沒有任何測試讀取」——那句話當時為真、現在為假：`plugin/` 底下
# 已有五支守衛。現在留著它的理由純粹是計費：一次改 skill 散文不該點一台 10×
# 的 macOS runner。守衛由 .github/workflows/plugin-guards.yml（ubuntu，1×）涵蓋
# 純 python／bash 的三支；parity 那兩支由 .github/workflows/census-parity.yml
# 涵蓋——**不是**由本檔下方那個 step。理由：本檔的觸發是 push-to-main ＋ 這份
# paths-ignore，所以一個只改 census 的變更會讓整個 job 被跳過，而 census 正是
# parity 的受測對象（#407 R7 verify 量到：守衛的觸發條件與它保護的檔案剛好
# 互斥）。下方那個 step 保留為第二層——一次 push 同時含 Swift 與 plugin 變更時
# 它會跑到。
# 本機 pre-push 全套仍是每次 push 的主閘，此處只省 CI 面。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "plugin/**"
      - ".claude/**"

concurrency:
  # 同一個 PR 連推數次時，只留最後一次——省掉排隊中的過期 run。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      # **submodules 必須一起 checkout。** Package.swift 用 path-based 依賴指向
      # repos/biblatex-apa-swift；沒有它 swift build 直接失敗。本機看不到這個問題
      # ——submodule 早就在那裡了。Tractatus strict validation 也會解析歷史 commit，
      # 所以 fetch-depth 必須為 0，不能使用 checkout 的單一 commit 預設值。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Swift 版本
        run: swift --version

      # .build 快取。key 綁 Package.resolved——依賴沒變就重用，變了就重建。
      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # `-warnings-as-errors`（#62）。擋的是「只有 warning、沒有測試失敗」這一類——
      # attribute 靜默轉移的第二次事故（PR #55）正是這個形狀：`writePerson` 失去
      # `@discardableResult` 後 14 個站點變成 unused-result **warning**，`swift test`
      # 照樣 0 failures，而 warning 在一般 build 輸出裡很容易被淹沒。
      #
      # build 與 test target 都開啟：測試碼本身若因 API 轉為 nonthrowing 而留下
      # 多餘 `try`，也會讓可重現驗證與實際 merge tree 分歧（#215）。
      - name: Build（warnings 視為錯誤）
        run: swift build -Xswiftc -warnings-as-errors

      # **不得加 --skip**（#57）。允許跳過測試的 CI 等於沒有 CI；要暫時停用某個
      # 測試，正確做法是在測試裡 XCTSkip 並寫明理由，那會留在程式碼裡被 review。
      - name: Test
        run: |
          set -o pipefail
          swift test -Xswiftc -warnings-as-errors 2>&1 | tee /tmp/test.log

      # **Plugin parity 守衛**（#407）。放這個 job 而不是 plugin-guards.yml，
      # 因為它們拿**建好的 CLI** 當 oracle——比對 census 的 store-marker 解析
      # 與 StoreVersion.read 對同一批 fixture 的裁決是否一致。ubuntu 上沒有
      # binary 可以問，所以只能在這裡。
      #
      # 第二支是第一支的 negative control：證明那張 fixture 矩陣真的會紅。
      # 它 mutate 的是複製到 tempdir 的 census，**不碰出貨檔**。
      - name: Plugin parity 守衛
        run: |
          bash plugin/skills/akashic-promote-literals/scripts/tests/store-marker-parity.sh
          python3 plugin/skills/akashic-promote-literals/scripts/tests/marker-parity-mutations.py

      # 測試「跑到一半崩掉」由 exit code 擋（fatal error 會讓程序非零退出）。
      # 這一步擋的是**另一種**失敗：測試靜默地不再被執行——整個 suite 沒編進
      # target、有人註解掉一個 class、或 filter 寫錯。那些情況 exit code 是 0。
      #
      # 下限刻意設得比當下總數低一截：偶爾刪掉幾個測試是正常的，整個 suite 消失
      # 不是。數字要隨測試成長往上調，調整本身就是一次 review。
      - name: 測試數下限
        run: |
          MIN=650
          N=$(grep -oE 'Executed [0-9]+ tests' /tmp/test.log | tail -1 | grep -oE '[0-9]+')
          echo "執行了 $N 個測試（下限 $MIN）"
          if [ -z "$N" ]; then
            echo "::error::從測試輸出裡讀不到 'Executed N tests'——輸出格式變了或測試根本沒跑"
            exit 1
          fi
          if [ "$N" -lt "$MIN" ]; then
            echo "::error::測試數 $N 低於下限 $MIN——是不是有整組測試沒被執行？"
            exit 1
          fi

      # 《邏輯哲學論》正典只讀版控內的 sources.yaml、離線 snapshots 與分卷 YAML；
      # CI 不連網抓原典。strict validate 擋缺卷、漏句、mega-segment、失效證據與權利
      # 違規；render --check 擋 YAML 已更新但並排 Markdown 尚未重生的 drift。
      - name: Tractatus 正典與並排文件
        run: |
          swift run tractatus-doc validate --root docs/tractatus
          swift run tractatus-doc render \
            --root docs/tractatus \
            --output docs/tractatus/generated/tractatus-project-map.md \
            --check

      # **AkashicApp 是 XcodeGen 專案，不是 SwiftPM target**（#109）——上面的
      # `swift build` / `swift test` 完全不編譯 `AkashicApp/Sources/`。#101 的
      # R1→R2 已實證後果：App 面修一半、707 個測試全綠、沒有任何機制能發現
      # （GraphView 的同類缺陷靠第二輪 verify ensemble 才抓到）。這一步把
      # 「測試全綠」對 App 面重新變得有意義：至少保證它編得過。
      #
      # 只 build 不 test：AkashicApp target 目前沒有測試（view 邏輯下沉到
      # AkashicAppKit 讓它可測是 #109 明列的另案 B 選項）。
      - name: AkashicApp（XcodeGen 專案——swift test 涵蓋不到）
        run: |
          set -o pipefail   # 沒有它，xcodebuild 失敗會被 tail 的 exit 0 蓋掉——假綠
          brew install xcodegen
          cd AkashicApp
          xcodegen generate
          xcodebuild -project AkashicApp.xcodeproj -scheme AkashicApp \
            -destination 'platform=macOS' build | tail -20

      # #92 的教訓：既有測試斷言的是「產生的 SQL 字串長什麼樣」，沒有任何測試真的
      # **執行**過那份腳本——於是一份「產生出來就跑不起來」的 load.sql 活了很久。
      # 這一步把那道落差補上：真的建 store、真的匯出、真的把 SQL 餵給 duckdb。
      #
      # **fixture 必須含母子機構。** #92 的觸發條件是 organization.parent_id 非空
      # （自我參照 FK）——空 store 或扁平機構跑得過，於是這一步就白做了。這正是
      # 那個 bug 當初能活下來的同一個形狀：測到的路徑不是會壞的那條。
      - name: 端對端 — export-tables 產生的 load.sql 必須跑得起來
        run: |
          brew install duckdb
          swift build -c release
          TMP=$(mktemp -d)
          STORE="$TMP/store"
          .build/release/akashic doctor --library "$STORE" > /dev/null
          cat > "$STORE/entities/11111111-1111-4111-8111-111111111111.yaml" <<'ORG'
          organization:
          id: 11111111-1111-4111-8111-111111111111
          key: parent-org
          names:
          - value: Parent
          ORG
          cat > "$STORE/entities/22222222-2222-4222-8222-222222222222.yaml" <<'ORG'
          organization:
          id: 22222222-2222-4222-8222-222222222222
          key: child-org
          names:
          - value: Child
          parents:
          - value:
              key: parent-org
          ORG
          .build/release/akashic validate --library "$STORE"
          .build/release/akashic export-tables --library "$STORE" -o "$TMP/out"
          grep -q 'parent-org' "$TMP/out/organization.csv" || { echo "::error::fixture 沒進匯出"; exit 1; }
          test -n "$(awk -F, 'NR>1 && $NF != "" {print}' "$TMP/out/organization.csv")" \
            || { echo "::error::匯出的 organization.csv 沒有非空的 parent_id——這一步就抓不到 #92 那類 bug"; exit 1; }
          duckdb "$TMP/probe.db" -c ".read $TMP/out/load.sql"
          echo "✓ 含母子機構的 load.sql 可執行"
