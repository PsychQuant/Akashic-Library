        rationale_zh_tw: "專案文件要求未來能由原子判定組成複合真值，但目前只能據此標示方向，不能把現有資料讀取冒充為真值運算。此命題的重點是：無限多種邏輯等價寫法不增加關於世界的內容；邏輯命題的必然性來自形式。"
