  - id: "6.422"
    parent: "6.42"
    texts:
      de:
        - "Der erste Gedanke bei der Aufstellung eines ethischen Gesetzes von der Form „du sollst *. . . .*“ ist: Und was dann, wenn ich es nicht tue?"
        - "Es ist aber klar, dass die Ethik nichts mit Strafe und Lohn im gewöhnlichen Sinne zu tun hat."
        - "Also muss diese Frage nach den *Folgen* einer Handlung belanglos sein."
        - "– Zum Mindesten dürfen diese Folgen nicht Ereignisse sein."
        - "Denn etwas muss doch an jener Fragestellung richtig sein."
        - "Es muss zwar eine Art von ethischem Lohn und ethischer Strafe geben, aber diese müssen in der Handlung selbst liegen."
        - "\\(Und das ist auch klar, dass der Lohn etwas Angenehmes, die Strafe etwas Unangenehmes sein muss.)"
      en_ogden_ramsey_1922:
        - "The first thought in setting up an ethical law of the form “thou shalt…” is: And what if I do not do it?"
        - "But it is clear that ethics has nothing to do with punishment and reward in the ordinary sense."
        - "This question as to the *consequences* of an action must therefore be irrelevant."
        - "At least these consequences will not be events."
        - "For there must be something right in that formulation of the question."
        - "There must be some sort of ethical reward and ethical punishment, but this must lie in the action itself."
        - "\\(And this is clear also that the reward must be something acceptable, and the punishment something unacceptable.)"
    edition_references:
      en_pears_mcguinness: "6.422"
    segments:
      - id: "6.422.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "制定「你應當……」形式的倫理法則時，首先會想：若我不照做會怎樣？"
        interpretation_zh_tw: "第一句提出以外在後果理解規範的直覺。"
      - id: "6.422.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "但倫理顯然與通常意義的獎懲無關。"
        interpretation_zh_tw: "本節拒絕把倫理化約成一般獎懲機制。"
      - id: "6.422.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "所以行動的事件性後果無關緊要。"
        interpretation_zh_tw: "因而不能以結果事件單獨定義倫理價值。"
      - id: "6.422.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "至少這些後果不能是事件。"
        interpretation_zh_tw: "這句把倫理後果排除於事實序列。"
      - id: "6.422.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "然而這種問法必有某種正確之處。"
        interpretation_zh_tw: "維根斯坦仍保留問句中對規範力的要求。"
      - id: "6.422.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "必有某種倫理獎懲，但它們必須位於行動本身。"
        interpretation_zh_tw: "倫理價值被移回行動自身，而非外部事件。"
      - id: "6.422.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "（獎賞必為可悅者，懲罰必為不可悅者。）"
        interpretation_zh_tw: "括號描述價值感受，不是權限或錯誤碼設計。"
