  - id: "3.24"
    parent: "3.2"
    texts:
      de:
        - "Der Satz, welcher vom Komplex handelt, steht in interner Beziehung zum Satze, der von dessen Bestandteil handelt."
        - "Der Komplex kann nur durch seine Beschreibung gegeben sein, und diese wird stimmen oder nicht stimmen."
        - "Der Satz, in welchem von einem Komplex die Rede ist, wird, wenn dieser nicht existiert, nicht unsinnig, sondern einfach falsch sein."
        - "Dass ein Satzelement einen Komplex bezeichnet, kann man aus einer Unbestimmtheit in den Sätzen sehen, worin es vorkommt."
        - "Wir *wissen*, durch diesen Satz ist noch nicht alles bestimmt."
        - "(Die Allgemeinheitsbezeichnung *enthält* ja ein Urbild.)"
        - "Die Zusammenfassung des Symbols eines Komplexes in ein einfaches Symbol kann durch eine Definition ausgedrückt werden."
      en_ogden_ramsey_1922:
        - "A proposition about a complex stands in internal relation to the proposition about its constituent part."
        - "A complex can only be given by its description, and this will either be right or wrong."
        - "The proposition in which there is mention of a complex, if this does not exist, becomes not nonsense but simply false."
        - "That a propositional element signifies a complex can be seen from an indeterminateness in the propositions in which it occurs."
        - "We *know* that everything is not yet determined by this proposition."
        - "(The notation for generality *contains* a prototype.)"
        - "The combination of the symbols of a complex in a simple symbol can be expressed by a definition."
    edition_references:
      en_pears_mcguinness: "3.24"
    segments:
      - id: "3.24.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "論及複合體的命題，與論及其構成部分的命題處於內在關係。"
        interpretation_zh_tw: "複合體表現可依形式展開為構成部分的表現，兩種命題的關聯不是外加的偶然事實。"
      - id: "3.24.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "複合體只能由其描述給出，而描述可能正確或不正確。"
        interpretation_zh_tw: "描述提供複合體的真假條件，不需要先假定一個充當簡單名稱所指的複合對象。"
      - id: "3.24.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "若命題談到一個不存在的複合體，它不會成為無意義，而只會是假的。"
        interpretation_zh_tw: "不存在使描述不符合現實，卻不取消我們對何種情況會使該命題為真的理解。"
      - id: "3.24.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "一個命題元素指示複合體，可從它所在命題中的某種未確定性看出。"
        interpretation_zh_tw: "複合表達保留不同構成方式的餘地，這種未確定性顯示它並非不可再分析的名稱。"
      - id: "3.24.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "我們知道，這個命題尚未決定一切。"
        interpretation_zh_tw: "未決之處是描述仍容許多個值或配置，不是讀者缺少任意背景資料。"
      - id: "3.24.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "（全稱記法本來就包含一個原型。）"
        interpretation_zh_tw: "括號指出一般性記法已規定可代入項目的形式，因此其未確定性仍有結構。"
      - id: "3.24.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "把複合體的符號組合收束成一個簡單符號，可以用定義表達。"
        interpretation_zh_tw: "定義提供縮寫與展開規則，改變表面記法而不新增被描述的事態。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.24 關於名稱、簡單記號、分析與對象之表現關係的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.24 直接主張「論及複合體的命題，與論及其構成部分的命題處於內在關係。」，本卷並將其限制解讀為「複合體表現可依形式展開為構成部分的表現，兩種命題的關聯不是外加的偶然事實。」。這裡處理名稱、簡單記號、分析與對象的表現關係；Akashic entity 不是《論考》的簡單對象，schema 分解也不是唯一的完整分析。"
