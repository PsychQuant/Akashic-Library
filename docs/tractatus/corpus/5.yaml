  - id: "5.557"
    parent: "5.55"
    texts:
      de:
        - "Die *Anwendung* der Logik entscheidet darüber, welche Elementarsätze es gibt."
        - "Was in der Anwendung liegt, kann die Logik nicht vorausnehmen."
        - "Das ist klar: Die Logik darf mit ihrer Anwendung nicht kollidieren."
        - "Aber die Logik muss sich mit ihrer Anwendung berühren."
        - "Also dürfen die Logik und ihre Anwendung einander nicht übergreifen."
      en_ogden_ramsey_1922:
        - "The *application* of logic decides what elementary propositions there are."
        - "What lies in its application logic cannot anticipate."
        - "It is clear that logic may not conflict with its application."
        - "But logic must have contact with its application."
        - "Therefore logic and its application may not overlap one another."
    edition_references:
      en_pears_mcguinness: "5.557"
    segments:
      - id: "5.557.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯的應用決定有哪些基本命題。"
        interpretation_zh_tw: "基本命題的具體種類要在符號實際接觸世界時才確定。"
      - id: "5.557.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "凡屬於邏輯應用的內容，邏輯不能預先料定。"
        interpretation_zh_tw: "純形式系統不能先驗列出其一切經驗填充。"
      - id: "5.557.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "顯然，邏輯不能與其應用衝突。"
        interpretation_zh_tw: "邏輯形式若排除實際可表達情形，就失去作為應用條件的角色。"
      - id: "5.557.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "但邏輯必須與其應用接觸。"
        interpretation_zh_tw: "邏輯也不能成為與任何實際符號化無關的空轉系統。"
      - id: "5.557.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "因此，邏輯與其應用既不能彼此重疊。"
        interpretation_zh_tw: "形式規則與經驗內容必須相接卻不混同：前者不冒充後者，後者不改寫邏輯。"
    project_relations:
