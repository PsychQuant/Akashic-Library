  - id: "5.43"
    parent: "5.4"
    texts:
      de:
        - "Dass aus einer Tatsache *p* unendlich viele *andere* folgen sollten, nämlich ∼∼*p*, ∼∼∼∼*p*, etc., ist doch von vornherein kaum zu glauben."
        - "Und nicht weniger merkwürdig ist, dass die unendliche Anzahl der Sätze der Logik (der Mathematik) aus einem halben Dutzend „Grundgesetzen“ folgen."
        - "Alle Sätze der Logik sagen aber dasselbe."
        - "Nämlich Nichts."
      en_ogden_ramsey_1922:
        - "That from a fact *p* an infinite number of *others* should follow, namely \\~\\~*p*, \\~\\~\\~\\~*p* etc., is indeed hardly to be believed, and it is no less wonderful that the infinite number of propositions of logic (of mathematics) should follow from half a dozen “primitive propositions”."
        - "But all propositions of logic say the same thing."
        - "That is, nothing."
    edition_references:
      en_pears_mcguinness: "5.43"
    segments:
      - id: "5.43.a"
        alignment:
          de: [0, 1]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "由一項事實 p 竟會推出無限多個其他命題，例如 ~~p、~~~~p 等，確實難以置信；同樣令人驚異的是，無限多的邏輯（數學）命題竟由少數幾個「原始命題」推出。"
        interpretation_zh_tw: "德文分成兩句，英文合為一個並列句；兩者都質疑把無限多式子當成無限多新內容。"
      - id: "5.43.b"
        alignment:
