  - id: "3.13"
    parent: "3.1"
    texts:
      de:
        - "Zum Satz gehört alles, was zur Projektion gehört; aber nicht das Projizierte."
        - "Also die Möglichkeit des Projizierten, aber nicht dieses selbst."
        - "Im Satz ist also sein Sinn noch nicht enthalten, wohl aber die Möglichkeit ihn auszudrücken."
        - "\\(„Der Inhalt des Satzes“ heisst der Inhalt des sinnvollen Satzes.)"
        - "Im Satz ist die Form seines Sinnes enthalten, aber nicht dessen Inhalt."
      en_ogden_ramsey_1922:
        - "To the proposition belongs everything which belongs to the projection; but not what is projected."
        - "Therefore the possibility of what is projected but not this itself."
        - "In the proposition, therefore, its sense is not yet contained, but the possibility of expressing it."
        - "\\(“The content of the proposition” means the content of the significant proposition.)"
        - "In the proposition the form of its sense is contained, but not its content."
    edition_references:
      en_pears_mcguinness: "3.13"
    segments:
      - id: "3.13.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一切屬於投射的，都屬於命題；但被投射者不屬於命題。"
        interpretation_zh_tw: "命題包含使投射成立的形式條件，卻不把它所描繪的世界項目當作自身零件。"
      - id: "3.13.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因此，屬於命題的是被投射者的可能性，而不是被投射者本身。"
        interpretation_zh_tw: "命題給出狀況可能如何，而不把實際狀況搬入符號載體之中。"
      - id: "3.13.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "所以，命題尚未包含它的意義，卻包含表達該意義的可能性。"
        interpretation_zh_tw: "命題記號的結構提供表達意義的能力；具體意義仍取決於投射的使用。"
      - id: "3.13.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（「命題的內容」意指有意義命題的內容。）"
        interpretation_zh_tw: "括號限定避免把尚未建立意義的記號串也逕稱為有內容的命題。"
      - id: "3.13.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "命題包含其意義的形式，而不包含其內容。"
        interpretation_zh_tw: "形式是命題能表現某種可能配置的條件；內容則是依投射而被表現的那個配置。"
    project_relations:
