  - id: "5.526"
    parent: "5.52"
    texts:
      de:
        - "Man kann die Welt vollständig durch vollkommen verallgemeinerte Sätze beschreiben, das heisst also, ohne irgend einen Namen von vornherein einem bestimmten Gegenstand zuzuordnen."
        - "Um dann auf die gewöhnliche Ausdrucksweise zu kommen, muss man einfach nach einem Ausdruck „es gibt ein und nur ein *x*, welches *. . . .*“ sagen: Und dies *x* ist *a*."
      en_ogden_ramsey_1922:
        - "One can describe the world completely by completely generalized propositions, *i.e.*, without from the outset co-ordinating any name with a definite object."
        - "In order then to arrive at the customary way of expression we need simply say after an expression “there is one and only one *x*, which ....”: and this *x* is *a*."
    edition_references:
      en_pears_mcguinness: "5.526"
    segments:
      - id: "5.526.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "完全一般化的命題可以完整描述世界，也就是不必一開始就把任何名稱配給某個確定對象。"
        interpretation_zh_tw: "量化描述可先保留個體未命名，仍窮盡地表達世界的結構。"
      - id: "5.526.b"
