        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若沒注意命題具有獨立於事實的意義，就很容易以為真與假是符號和被指稱者之間兩種地位相同的關係。"
        interpretation_zh_tw: "命題先有獨立於實際真假的 sense；若漏掉這點，就會把真、假錯想成兩種指稱方式。"
      - id: "4.061.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "於是人或許會說：「*p*」以真的方式指稱「∼*p*」以假的方式指稱之物，等等。"
        interpretation_zh_tw: "把 *p* 與 ∼*p* 說成分別「真指稱」與「假指稱」同一物，會把真值誤作符號—物件關係。"
