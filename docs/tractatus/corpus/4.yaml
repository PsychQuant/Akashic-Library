    texts:
      de:
        - "Beachtet man nicht, dass der Satz einen von den Tatsachen unabhängigen Sinn hat, so kann man leicht glauben, dass wahr und falsch gleichberechtigte Beziehungen von Zeichen und Bezeichnetem sind."
        - "Man könnte dann z. B. sagen, dass „*p*“ auf die wahre Art bezeichnet, was „∼*p*“ auf die falsche Art, etc."
      en_ogden_ramsey_1922:
        - "If one does not observe that propositions have a sense independent of the facts, one can easily believe that true and false are two relations between signs and things signified with equal rights."
        - "One could, then, for example, say that “*p*” signifies in the true way what “\\~*p*” signifies in the false way, etc."
    edition_references:
      en_pears_mcguinness: "4.061"
    segments:
