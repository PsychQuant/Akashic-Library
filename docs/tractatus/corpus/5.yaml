        translation_zh_tw: "例如，我是否可能遇到需要用二十七項關係記號表示的情形，我們怎能先於經驗地決定？"
        interpretation_zh_tw: "特定關係項數是否在應用中出現，不能靠純邏輯預先列舉。"
