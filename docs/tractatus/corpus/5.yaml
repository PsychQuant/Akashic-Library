  - id: "5.532"
    parent: "5.53"
    texts:
      de:
        - "Und analog: Nicht „(∃*x, y*) *. f* (*x, y*) *. x* = *y*“, sondern „(∃*x*) *. f* (*x, x*)“; und nicht „(∃*x, y*) *. f* (*x, y*) *.* ∼*x* = *y*“, sondern „(∃*x, y*) *. f* (*x, y*)“."
        - "\\(Also statt des Russell’schen „(∃*x, y*) *. f* (*x, y*)“: „(∃*x, y*) *. f* (*x, y*) *.* ∨ *.* (∃*x*) *. f* (*x, x*)“.)"
      en_ogden_ramsey_1922:
        - "And analogously: not “(∃*x*, *y*) . *f*(*x*, *y*) . *x* = *y*”, but “(∃*x*) . *f*(*x*, *x*)”; and not “(∃*x*, *y*) . *f*(*x*, *y*) . \\~*x* = *y*” but “(∃*x*, *y*) . *f*(*x*, *y*)”."
        - "\\(Therefore instead of Russell’s “(∃*x*, *y*) . *f*(*x*, *y*)”: “(∃*x*, *y*) . *f*(*x*, *y*) . ∨ . (∃*x*) . *f*(*x*, *x*)”.)"
    edition_references:
      en_pears_mcguinness: "5.532"
    segments:
      - id: "5.532.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "類似地，不寫「(∃x,y)．f(x,y)．x=y」，而寫「(∃x)．f(x,x)」；也不寫「(∃x,y)．f(x,y)．~x=y」，而寫「(∃x,y)．f(x,y)」。"
        interpretation_zh_tw: "重複變項表達兩位置由同一對象占據；不同變項則表達可由不同對象占據，無須額外等式。"
      - id: "5.532.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（所以羅素的「(∃x,y)．f(x,y)」應改寫為「(∃x,y)．f(x,y)．∨．(∃x)．f(x,x)」。）"
        interpretation_zh_tw: "括號式把不同對象的情形與同一對象占兩位置的情形明列為選言。"
    project_relations:
