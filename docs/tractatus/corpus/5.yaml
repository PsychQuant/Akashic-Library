  - id: "5.61"
    parent: "5.6"
    texts:
      de:
        - "Die Logik erfüllt die Welt; die Grenzen der Welt sind auch ihre Grenzen."
        - "Wir können also in der Logik nicht sagen: Das und das gibt es in der Welt, jenes nicht."
        - "Das würde nämlich scheinbar voraussetzen, dass wir gewisse Möglichkeiten ausschliessen und dies kann nicht der Fall sein, da sonst die Logik über die Grenzen der Welt hinaus müsste; wenn sie nämlich diese Grenzen auch von der anderen Seite betrachten könnte."
        - "Was wir nicht denken können, das können wir nicht denken; wir können also auch nicht *sagen*, was wir nicht denken können."
      en_ogden_ramsey_1922:
        - "Logic fills the world: the limits of the world are also its limits."
        - "We cannot therefore say in logic: This and this there is in the world, that there is not."
        - "For that would apparently presuppose that we exclude certain possibilities, and this cannot be the case since otherwise logic must get outside the limits of the world: that is, if it could consider these limits from the other side also."
        - "What we cannot think, that we cannot think: we cannot therefore *say* what we cannot think."
    edition_references:
      en_pears_mcguinness: "5.61"
    segments:
      - id: "5.61.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯充滿世界；世界的界限也是邏輯的界限。"
        interpretation_zh_tw: "邏輯不是世界中的一塊領域，而遍及一切可描述的可能性，兩者因而共享界線。"
      - id: "5.61.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "所以我們不能在邏輯中說：世界裡有這個與這個，卻沒有那個。"
        interpretation_zh_tw: "邏輯本身不能列舉哪些偶然事物存在，否則就把經驗內容冒充為形式限制。"
      - id: "5.61.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "因為那看來會預設我們排除某些可能性；但這不可能，否則邏輯就必須超出世界的界限，彷彿也能從另一側觀看這些界限。"
        interpretation_zh_tw: "要把某些可能性從邏輯之外排除，得先站到邏輯與世界之外；這個觀看位置本身無法形成。"
      - id: "5.61.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "凡我們不能思考的，我們就不能思考；所以，我們也不能說出凡我們不能思考的。"
        interpretation_zh_tw: "可說性的界線不是額外禁令，而由可思考、可形成命題的範圍直接劃定。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.61 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：邏輯不是世界中的一塊領域，而遍及一切可描述的可能性，兩者因而共享界線；邏輯本身不能列舉哪些偶然事物存在，否則就把經驗內容冒充為形式限制；要把某些可能性從邏輯之外排除，得先站到邏輯與世界之外；這個觀看位置本身無法形成；可說性的界線不是額外禁令，而由可思考、可形成命題的範圍直接劃定。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
