  - id: "5.42"
    parent: "5.4"
    texts:
      de:
        - "Dass ∨, ⊃, etc. nicht Beziehungen im Sinne von rechts und links etc. sind, leuchtet ein."
        - "Die Möglichkeit des kreuzweisen Definierens der logischen „Urzeichen“ Freges und Russells zeigt schon, dass dies keine Urzeichen sind, und schon erst recht, dass sie keine Relationen bezeichnen."
        - "Und es ist offenbar, dass das „⊃“, welches wir durch „∼“ und „∨“ definieren, identisch ist mit dem, durch welches wir „∨ “ mit „∼“ definieren und dass dieses „∨“ mit dem ersten identisch ist."
        - "U. s. w."
      en_ogden_ramsey_1922:
        - "That ∨, ⊃ etc., are not relations in the sense of right and left, etc., is obvious."
        - "The possibility of crosswise definition of the logical “primitive signs” of Frege and Russell shows by itself that these are not primitive signs and that they signify no relations."
        - "And it is obvious that the “⊃” which we define by means of “\\~” and “∨” is identical with that by which we define “∨” with the help of “\\~”, and that this “∨” is the same as the first, and so on."
    edition_references:
      en_pears_mcguinness: "5.42"
    segments:
      - id: "5.42.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "∨、⊃ 等並不是像左右關係那樣的關係，這很明顯。"
        interpretation_zh_tw: "邏輯聯結詞不把兩個世界內對象置於某種空間式關係。"
      - id: "5.42.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "弗雷格與羅素的邏輯「原始記號」能彼此交叉定義，這件事本身就顯示它們不是原始記號，也不表示任何關係。"
        interpretation_zh_tw: "若一個聯結詞可完全由其他聯結詞定義，它就不是不可再分析的邏輯對象名稱。"
      - id: "5.42.c"
        alignment:
          de: [2, 3]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "用 ~ 與 ∨ 定義的 ⊃，和反過來藉 ~ 與 ⊃ 定義 ∨ 時所用的 ⊃ 是同一個；所得的 ∨ 也與原先相同，如此等等。"
        interpretation_zh_tw: "德文以獨立縮語句補上「如此等等」，英文收在同一句；交叉定義保持同一真值函數。"
    project_relations:
