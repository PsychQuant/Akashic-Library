        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.5351 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：用恆真式當型別標記，無法替引數建立命題身分，因為它沒有增加相關內容；型別錯誤使整個符號失去意義，不會被一個只有在合法命題上才成立的前置假設攔截。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
