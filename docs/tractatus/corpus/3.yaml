  - id: "3.333"
    parent: "3.33"
    texts:
      de:
        - "Eine Funktion kann darum nicht ihr eigenes Argument sein, weil das Funktionszeichen bereits das Urbild seines Arguments enthält und es sich nicht selbst enthalten kann."
        - "Nehmen wir nämlich an, die Funktion *F* (*fx*) könnte ihr eigenes Argument sein; dann gäbe es also einen Satz: „*F* (*F* (*fx*))“ und in diesem müssen die äussere Funktion *F* und die innere Funktion *F* verschiedene Bedeutungen haben, denn die innere hat die Form *ϕ*(*fx*), die äussere, die Form *ψ*(*ϕ*(*fx*))."
        - "Gemeinsam ist den beiden Funktionen nur der Buchstabe „*F* “, der aber allein nichts bezeichnet."
        - "Dies wird sofort klar, wenn wir statt „*F* (*F* (*u*))“ schreiben „(∃*ϕ*) : *F* (*ϕu*) *. ϕu* = *Fu*“."
        - "Hiermit erledigt sich Russell’s Paradox."
      en_ogden_ramsey_1922:
        - "A function cannot be its own argument, because the functional sign already contains the prototype of its own argument and it cannot contain itself."
        - "If, for example, we suppose that the function *F*(*fx*) could be its own argument, then there would be a proposition “*F*(*F*(*fx*))”, and in this the outer function *F* and the inner function *F* must have different meanings; for the inner has the form *ϕ*(*fx*), the outer the form *ψ*(*ϕ*(*fx*))."
        - "Common to both functions is only the letter “*F*”, which by itself signifies nothing."
        - "This is at once clear, if instead of “*F*(*F*(*u*))” we write “(∃*ϕ*) : *F*(*ϕu*) . *ϕu* = *Fu*”."
        - "Herewith Russell’s paradox vanishes."
    edition_references:
      en_pears_mcguinness: "3.333"
    segments:
      - id: "3.333.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "函數不能成為它自己的論元，因為函數記號已包含其論元的原型，而它不能包含自身。"
        interpretation_zh_tw: "限制來自函數記號預先規定的論元形式；讓函數占據自己的論元位置會把不同邏輯角色壓成一層。"
      - id: "3.333.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "例如，假定函數 *F*(*fx*) 能成為自己的論元，就會有命題「*F*(*F*(*fx*))」；其中外層函數 *F* 與內層函數 *F* 必須具有不同指稱，因為內層形式是 *ϕ*(*fx*)，外層形式是 *ψ*(*ϕ*(*fx*))。"
        interpretation_zh_tw: "內外兩個 F 占據不同形式位置，故相同字母遮蔽了不同符號角色；這不是一般程式呼叫堆疊的敘述。"
      - id: "3.333.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "兩函數共有的只有字母「*F*」，而該字母單獨並不指示任何東西。"
        interpretation_zh_tw: "共同記號不足以建立共同符號；脫離內外層用法的字母 F 沒有獨立決定函數角色。"
      - id: "3.333.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "若把「*F*(*F*(*u*))」改寫為「(∃*ϕ*) : *F*(*ϕu*) . *ϕu* = *Fu*」，這點立刻變得清楚。"
        interpretation_zh_tw: "改寫用變項分開函數位置，顯露原式以同一字母掩蓋的形式差異；公式是邏輯闡明，不是程式碼範例。"
      - id: "3.333.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "Russell 悖論由此得到處理。"
        interpretation_zh_tw: "結論把悖論診斷為符號層次混淆；專案只在 view／entity 界線採用受限類比。"
