  - id: "4.063"
    parent: "4.06"
    texts:
      de:
        - "Ein Bild zur Erklärung des Wahrheitsbegriffes: Schwarzer Fleck auf weissem Papier; die Form des Fleckes kann man beschreiben, indem man für jeden Punkt der Fläche angibt, ob er weiss oder schwarz ist."
        - "Der Tatsache, dass ein Punkt schwarz ist, entspricht eine positive – der, dass ein Punkt weiss (nicht schwarz) ist, eine negative Tatsache."
        - "Bezeichne ich einen Punkt der Fläche (einen Frege’schen Wahrheitswert), so entspricht dies der Annahme, die zur Beurteilung aufgestellt wird, etc. etc."
        - "Um aber sagen zu können, ein Punkt sei schwarz oder weiss, muss ich vorerst wissen, wann man einen Punkt schwarz und wann man ihn weiss nennt; um sagen zu können: „*p*“ ist wahr (oder falsch), muss ich bestimmt haben, unter welchen Umständen ich „*p*“ wahr nenne, und damit bestimme ich den Sinn des Satzes."
        - "Der Punkt an dem das Gleichnis hinkt ist nun der: Wir können auf einen Punkt des Papiers zeigen, auch ohne zu wissen, was weiss und schwarz ist; einem Satz ohne Sinn aber entspricht gar nichts, denn er bezeichnet kein Ding (Wahrheitswert) dessen Eigenschaften etwa „falsch“ oder „wahr“ hiessen; das Verbum eines Satzes ist nicht „ist wahr“ oder „ist falsch“ – wie Frege glaubte –, sondern das, was „wahr ist“ muss das Verbum schon enthalten."
      en_ogden_ramsey_1922:
        - "An illustration to explain the concept of truth."
        - "A black spot on white paper; the form of the spot can be described by saying of each point of the plane whether it is white or black."
        - "To the fact that a point is black corresponds a positive fact; to the fact that a point is white (not black), a negative fact."
        - "If I indicate a point of the plane (a truth-value in Frege’s terminology), this corresponds to the assumption proposed for judgment, etc. etc."
        - "But to be able to say that a point is black or white, I must first know under what conditions a point is called white or black; in order to be able to say “*p*” is true (or false) I must have determined under what conditions I call “*p*” true, and thereby I determine the sense of the proposition."
        - "The point at which the simile breaks down is this: we can indicate a point on the paper, without knowing what white and black are; but to a proposition without a sense corresponds nothing at all, for it signifies no thing (truth-value) whose properties are called “false” or “true”; the verb of the proposition is not “is true” or “is false”—as Frege thought—but that which “is true” must already contain the verb."
    edition_references:
      en_pears_mcguinness: "4.063"
    segments:
      - id: "4.063.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0, 1]
        translation_zh_tw: "用一幅圖像說明真理概念：白紙上的黑斑；要描述斑點形狀，可逐一指出平面每點是白或黑。"
        interpretation_zh_tw: "黑白平面的比喻先把真值判定呈現為對每一位置給定兩種可能狀態。"
      - id: "4.063.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "某點為黑對應正面事實，某點為白（非黑）則對應負面事實。"
        interpretation_zh_tw: "黑與白分別示範正面、負面事實；負面事實不是另一種神祕物件。"
      - id: "4.063.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "若我指定平面一點（弗雷格式的真值），便對應提出待判斷的假定，等等。"
        interpretation_zh_tw: "指定一點只提出一個等待判斷的候選，對應弗雷格把真值當作判斷論元的做法。"
      - id: "4.063.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "但要說某點是黑或白，必須先知道在什麼條件下稱它為黑或白；同樣，要說「*p*」為真（或假），必須先決定在什麼情況下稱「*p*」為真，而這也就決定命題的意義。"
        interpretation_zh_tw: "在判定 *p* 真或假之前，必須先規定何種情況算真；這項 truth condition 同時界定 *p* 的 sense。"
      - id: "4.063.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "譬喻失效之處在於：即使不知道白黑為何，仍能指向紙上一點；但沒有意義的命題根本沒有任何對應物，因為它不指稱一個性質叫作「假」或「真」的東西（真值）。命題的動詞不是「是真的」或「是假的」——不像弗雷格所想——而是「為真者」本身必須已含有動詞。"
        interpretation_zh_tw: "紙上的點可在未懂黑白時仍被指到，但無 sense 的符號沒有真值物件可指；「為真」也不能替命題補上原本缺少的動詞與結構。"
    project_relations:
      - status: intentional_nonconformance
        mode: declared_nonconformance
        claim_zh_tw: "Akashic 刻意不把 retrieval 的布林結果當成命題真值。"
        rationale_zh_tw: "真值判定以前必須先固定 truth condition，這同時界定 sense；真、假不是兩個可由無意義符號直接指到的物件。 專案文件因此把搜尋命中、館藏裁決與 world-relative truth 分層。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "## 3. 最簡單的反例：搜尋到一個句子，不等於句子是真的"
            note_zh_tw: "此節用可命中但為假的句子證明 retrieval 不等於 truth。"
    history: []

