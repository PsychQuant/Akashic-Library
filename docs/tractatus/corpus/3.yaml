  - id: "3.331"
    parent: "3.33"
    texts:
      de:
        - "Von dieser Bemerkung sehen wir in Russell’s „Theory of types“ hinüber:"
        - "Der Irrtum Russell’s zeigt sich darin, dass er bei der Aufstellung der Zeichenregeln von der Bedeutung der Zeichen reden musste."
      en_ogden_ramsey_1922:
        - "From this observation we get a further view—into Russell’s *Theory of Types*."
        - "Russell’s error is shown by the fact that in drawing up his symbolic rules he has to speak about the things his signs mean."
    edition_references:
      en_pears_mcguinness: "3.331"
    segments:
      - id: "3.331.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "由此可進一步看 Russell 的「類型論」。"
        interpretation_zh_tw: "這句把前一命題的句法要求轉向 Russell 的案例，尚未把所有類型區分一概判錯。"
      - id: "3.331.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "Russell 的錯誤顯現在：他建立記號規則時，不得不談論記號所指之物。"
        interpretation_zh_tw: "具體批評是規則層必須訴諸記號所指的事物，因而沒有只靠表達式形式建立邏輯句法。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.331 關於記號規則與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.331 以 Russell 類型論為案例，批評建立記號規則時仍須談所指之物；它針對句法規則混入對象層語意，不等於否定所有工程型別區分。Akashic 的型別與驗證規則因此不能冒充此處所要求的完整邏輯句法。"
    history: []
  - id: "3.332"
    parent: "3.33"
    texts:
      de:
        - "Kein Satz kann etwas über sich selbst aussagen, weil das Satzzeichen nicht in sich selbst enthalten sein kann, (das ist die ganze „Theory of types“)."
      en_ogden_ramsey_1922:
        - "No proposition can say anything about itself, because the propositional sign cannot be contained in itself (that is the “whole theory of types”)."
    edition_references:
      en_pears_mcguinness: "3.332"
    segments:
      - id: "3.332.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "任何命題都不能述說自身，因為命題記號不能包含於自身之中（這就是整個「類型論」）。"
        interpretation_zh_tw: "自我述說會要求同一命題記號同時作為完整表達與自身構件，混合了表示層次。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.332 關於表達式、符號、用法與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.332 直接主張「任何命題都不能述說自身，因為命題記號不能包含於自身之中（這就是整個「類型論」）。」，本卷並將其限制解讀為「自我述說會要求同一命題記號同時作為完整表達與自身構件，混合了表示層次。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
