  - id: "3.317"
    parent: "3.31"
    texts:
      de:
        - "Die Festsetzung der Werte der Satzvariablen ist die *Angabe der Sätze*, deren gemeinsames Merkmal die Variable ist."
        - "Die Festsetzung ist eine Beschreibung dieser Sätze."
        - "Die Festsetzung wird also nur von Symbolen, nicht von deren Bedeutung handeln."
        - "Und *nur* dies ist der Festsetzung wesentlich, *dass sie nur eine Beschreibung von Symbolen ist und nichts über das Bezeichnete aussagt*."
        - "Wie die Beschreibung der Sätze geschieht, ist unwesentlich."
      en_ogden_ramsey_1922:
        - "The determination of the values of the propositional variable is done by *indicating the propositions* whose common mark the variable is."
        - "The determination is a description of these propositions."
        - "The determination will therefore deal only with symbols not with their meaning."
        - "And *only* this is essential to the determination, *that it is only a description of symbols and asserts nothing about what is symbolized.*"
        - "The way in which we describe the propositions is not essential."
    edition_references:
      en_pears_mcguinness: "3.317"
    segments:
      - id: "3.317.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題變項之值的規定，是指出以該變項為共同特徵的那些命題。"
        interpretation_zh_tw: "規定藉列示或刻畫一類命題，確立變項跨命題保持的共同位置。"
      - id: "3.317.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這項規定是對這些命題的描述。"
        interpretation_zh_tw: "規定的對象是命題形式本身，而不是它們在世界中談論的事物。"
      - id: "3.317.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "因此，這項規定只會處理符號，而不處理符號的指稱。"
        interpretation_zh_tw: "句法層的取值描述應依符號形態與用法完成，不把對象層的內容偷渡進來。"
      - id: "3.317.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "而且，對規定而言唯一本質之處是：它只是對符號的描述，並未斷言任何被指示之物。"
        interpretation_zh_tw: "此句強化層次界線：描述表示式的範圍，不等於對其所表現世界作一項新主張。"
      - id: "3.317.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "如何描述這些命題，並非本質。"
        interpretation_zh_tw: "不同列示方式只要保留相同取值範圍，就不改變變項的邏輯角色。"
