    texts:
      de:
        - "Der Name ist durch keine Definition weiter zu zergliedern:"
        - "er ist ein Urzeichen."
      en_ogden_ramsey_1922:
        - "The name cannot be analysed further by any definition."
        - "It is a primitive sign."
    edition_references:
      en_pears_mcguinness: "3.26"
    segments:
      - id: "3.26.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "名稱不能再由任何定義分解。"
        interpretation_zh_tw: "定義只能展開衍生記號；到了名稱便不能再以另一組記號分析其指稱方式。"
      - id: "3.26.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "它是原初記號。"
        interpretation_zh_tw: "Urzeichen 譯為「原初記號」；這是《論考》分析終點的角色，不表示軟體中未拆欄位者就是簡單對象。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.26 關於名稱何以不可再分解、何以是原初記號的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.26 先說名稱不能再由定義分解，再把它定位為原初記號；這是《論考》分析終點的主張。Akashic entity 仍是可演化的工程紀錄，不能因某欄位目前未拆分，就冒充此處的簡單對象或原初記號。"
