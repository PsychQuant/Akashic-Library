  - id: "5.51"
    parent: "5.5"
    texts:
      de:
        - "Hat *ξ* nur einen Wert, so ist ![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\  = ∼*p* (nicht *p*), hat es zwei Werte, so ist ![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\  = ∼*p .* ∼*q* (weder *p* noch *q*)."
      en_ogden_ramsey_1922:
        - "If *ξ* has only one value, then ![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\  = \\~*p* (not *p*), if it has two values then ![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\  = \\~*p* . \\~*q* (neither *p* nor *q*)."
    edition_references:
      en_pears_mcguinness: "5.51"
    segments:
      - id: "5.51.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若 ξ 只有一個值，則 N(ξ̄)=~p（非 p）；若它有兩個值，則 N(ξ̄)=~p．~q（既非 p 亦非 q）。"
        interpretation_zh_tw: "共同否定在單一輸入時是普通否定，在兩個輸入時是否定兩者的 NOR 運算。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 已實作單一 operand 的 bounded not，對 holds／fails 互換並保留 undetermined；把同一運算推廣成兩個以上輸入的共同否定 NOR 仍屬 aspirational。"
        rationale_zh_tw: "5.51 要求 N 在一個輸入時表 ordinary negation，在兩個輸入時表 neither p nor q。現行 PropositionExpression.not 與 recursive trace 已直接覆蓋前半的 unary case，且 witnessed authored fails 使兩個 determinate 方向都能實際執行；但 AST 沒有多輸入 N、and 或任何 binary operator，不能由 unary 成果推稱已具 NOR 完備性。"
