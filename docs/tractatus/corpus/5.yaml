  - id: "5.525"
    parent: "5.52"
    texts:
      de:
        - "Es ist unrichtig, den Satz „(∃*x*) *. fx*“ – wie Russell dies tut – in Worten durch „*fx* ist *möglich*“ wiederzugeben."
        - "Gewissheit, Möglichkeit oder Unmöglichkeit einer Sachlage wird nicht durch einen Satz ausgedrückt, sondern dadurch, dass ein Ausdruck eine Tautologie, ein sinnvoller Satz, oder eine Kontradiktion ist."
        - "Jener Präzedenzfall, auf den man sich immer berufen möchte, muss schon im Symbol selber liegen."
      en_ogden_ramsey_1922:
        - "It is not correct to render the proposition “(∃*x*) . *fx*”—as Russell does—in words “*fx* is *possible*”."
        - "Certainty, possibility or impossibility of a state of affairs are not expressed by a proposition but by the fact that an expression is a tautology, a significant proposition or a contradiction."
        - "That precedent to which one would always appeal, must be present in the symbol itself."
    edition_references:
      en_pears_mcguinness: "5.525"
    segments:
      - id: "5.525.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "像羅素那樣把命題「(∃x)．fx」用文字譯成「fx 是可能的」，並不正確。"
        interpretation_zh_tw: "存在量化斷言有某個 x 滿足 f，不等同於把未指定的 fx 稱為可能。"
      - id: "5.525.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "一個事態的確定、可能或不可能，不由某個命題直接說出，而由一個表達式是恆真式、有意義命題或矛盾式這件事表現。"
        interpretation_zh_tw: "模態地位由符號在全部真值可能性中的形式位置顯示，不是另加一個「可能」述詞。"
      - id: "5.525.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "我們總會訴諸的那個先例，必須已存在於符號本身。"
        interpretation_zh_tw: "判準必須能從記號形式讀出，不能依賴表達式外的一則補充規則。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.525 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：存在量化斷言有某個 x 滿足 f，不等同於把未指定的 fx 稱為可能；模態地位由符號在全部真值可能性中的形式位置顯示，不是另加一個「可能」述詞；判準必須能從記號形式讀出，不能依賴表達式外的一則補充規則。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
