title: The Association between Depression and Gastroesophageal Reflux based on Phylogenetic
  Analysis of miRNA Biomarkers
authors:
- literal: Yi-Hau Chen
- literal: Hsiuying Wang
date: 2020-11-12
fields:
  abstract: '<jats:sec>

    <jats:title/>

    <jats:p>A number of clinical studies have revealed that there is an association
    between major

    depression (MD) and gastroesophageal reflux disease (GERD). Both the diseases
    are

    shown to affect a large proportion of the global population. More advanced studies
    for understanding

    the comorbidity mechanism of these two diseases can shed light on developing new

    therapies of both diseases. To the best of our knowledge, there has not been any
    research

    work in the literature investigating the relationship between MD and GERD using
    their

    miRNA biomarkers. We adopt a phylogenetic analysis to analyze their miRNA biomarkers.

    From our analyzed results, the association between these two diseases can be explored

    through miRNA phylogeny. In addition to evidence from the phylogenetic analysis,
    we also

    demonstrate epidemiological evidence for the relationship between MD and GERD
    based on

    Taiwan biobank data.</jats:p>

    </jats:sec>'
