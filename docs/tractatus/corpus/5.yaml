  - id: "5.1241"
    parent: "5.124"
    texts:
      de:
        - "„*p . q*“ ist einer der Sätze, welche „*p*“ bejahen und zugleich einer der Sätze, welche „*q*“ bejahen."
        - "Zwei Sätze sind einander entgegengesetzt, wenn es keinen sinnvollen Satz gibt, der sie beide bejaht."
        - "Jeder Satz der einem anderen widerspricht, verneint ihn."
      en_ogden_ramsey_1922:
        - "“*p . q*” is one of the propositions which assert “*p*” and at the same time one of the propositions which assert “*q*”."
        - "Two propositions are opposed to one another if there is no significant proposition which asserts them both."
        - "Every proposition which contradicts another, denies it."
    edition_references:
      en_pears_mcguinness: "5.1241"
    segments:
      - id: "5.1241.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "「p．q」既是斷言「p」的命題之一，同時也是斷言「q」的命題之一。"
        interpretation_zh_tw: "合取為真時兩個成分都為真，所以它同時承擔 p 與 q 的斷言。"
      - id: "5.1241.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "若沒有任何有意義的命題能同時斷言兩個命題，這兩個命題便彼此對立。"
        interpretation_zh_tw: "彼此對立表示兩者沒有共同真值根據，不可能由同一個有意義命題同時承擔。"
      - id: "5.1241.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "凡與另一命題矛盾的命題，都否定它。"
        interpretation_zh_tw: "矛盾者的真值根據完全落在對方之外，因此構成對方的否定。"
