  - id: "5.512"
    parent: "5.51"
    texts:
      de:
        - "„∼*p*“ ist wahr, wenn „*p*“ falsch ist."
        - "Also in dem wahren Satz „∼*p*“ ist „*p*“ ein falscher Satz."
        - "Wie kann ihn nun der Strich „∼“ mit der Wirklichkeit zum Stimmen bringen?"
        - "Das, was in „∼*p*“ verneint, ist aber nicht das „∼“, sondern dasjenige, was allen Zeichen dieser Notation, welche *p* verneinen, gemeinsam ist."
        - "Also die gemeinsame Regel, nach welcher „∼*p*“, „∼∼∼*p*“, „∼*p* ∨ ∼*p*“, „∼*p .* ∼*p*“, etc. etc. (ad inf.) gebildet werden."
        - "Und dies Gemeinsame spiegelt die Verneinung wider."
      en_ogden_ramsey_1922:
        - "“\\~*p*” is true if “*p*” is false."
        - "Therefore in the true proposition “\\~*p*” “*p*” is a false proposition."
        - "How then can the stroke “\\~” bring it into agreement with reality?"
        - "That which denies in “\\~*p*” is however not “\\~” but that which all signs of this notation, which deny *p*, have in common."
        - "Hence the common rule according to which “\\~*p*”, “\\~\\~\\~*p*”, “\\~*p* ∨ *\\~p*”, “\\~*p* . \\~*p*”, etc. etc. (to infinity) are constructed."
        - "And this which is common to them all mirrors denial."
    edition_references:
      en_pears_mcguinness: "5.512"
    segments:
      - id: "5.512.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "「~p」在「p」為假時為真。"
        interpretation_zh_tw: "否定式的真值條件與 p 的真值相反。"
      - id: "5.512.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "所以在真的命題「~p」裡，「p」是一個假命題。"
        interpretation_zh_tw: "整式為真並不使其中的 p 變真；真值來自否定所規定的配置。"
      - id: "5.512.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "那麼筆畫「~」怎能使它符合現實？"
        interpretation_zh_tw: "反問揭示不能把符合關係歸功於單一筆畫，彷彿它會改造假命題。"
      - id: "5.512.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "其實在「~p」中進行否定的不是「~」這個筆畫，而是這套記法中所有否定 p 的記號所共有的東西。"
        interpretation_zh_tw: "否定的語意在整類等價表達共享的真值規則，不在字形本身。"
      - id: "5.512.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "也就是「~p」、「~~~p」、「~p∨~p」、「~p．~p」等等直到無限所共同遵循的建構規則。"
        interpretation_zh_tw: "不同表面式可由同一規則生成，並在相同輸入配置下為真。"
      - id: "5.512.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "正是這個共同之處映照否定。"
        interpretation_zh_tw: "共享的建構與真值模式才是記號所顯示的否定形式。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 的 explicit not 以共享求值規則反轉 operand 的 holds／fails、原樣保留 undetermined，並在 recursive trace 中保存 operand；辨認各種不同字形／公式為同一否定仍屬 aspirational。"
        rationale_zh_tw: "5.512 的第一步要求 ~p 在 p 為假時為真，後半更要求 ~p、~~~p、~p∨~p、~p．~p 等表面形式共享否定規則。現行 unary evaluator 已使 not(fails)=holds、not(holds)=fails，結論只能由 operand truth 導出，不能由 caller 偽造；但 expression equality 仍是結構式，且沒有 or／and、normalization 或 truth-condition equivalence，故只能證成前半的窄幅語意。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "### 9.4 Truth-functional composition"
            note_zh_tw: "此節把真值函數式組合列為最低語意能力，並明示這是目標而非既成實作。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "EvidenceTrace"
            note_zh_tw: "`EvidenceTrace` 公開唯讀 kind／operand／atomic views；raw constructors 留在 module 內，negation conclusion 必由 operand truth 導出。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testTraceEqualityTraverses32768NodesAndDerivesEveryConclusion"
            note_zh_tw: "測試確認深層 recursive trace 以迭代 equality 安全比較，且每層 conclusion 都由 operand 機械導出。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testNegationPreservesEveryUndeterminedReasonExactly"
            note_zh_tw: "測試確認共享否定規則不把 epistemic undetermined 偽造成 determinate truth。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testExternalClientCannotConstructRawTraceNodes"
            note_zh_tw: "外部 non-@testable compile probe 證明 caller 只能稽核 trace，不能自行配對 operand 與任意 conclusion。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "explicit unary negation truth-condition 與 recursive trace 已有直接證據；不同 formula 的等價、字形無關 normalization 及 binary forms 仍留在既有 issue 能力邊界。"

  - id: "5.513"
    parent: "5.51"
    texts:
      de:
        - "Man könnte sagen: Das Gemeinsame aller Symbole, die sowohl *p* als *q* bejahen, ist der Satz „*p . q*“."
        - "Das Gemeinsame aller Symbole, die entweder *p* oder *q* bejahen, ist der Satz „*p* ∨ *q*“."
        - "Und so kann man sagen: Zwei Sätze sind einander entgegengesetzt, wenn sie nichts miteinander gemein haben, und: Jeder Satz hat nur ein Negativ, weil es nur einen Satz gibt, der ganz ausserhalb seiner liegt."
        - "Es zeigt sich so auch in Russells Notation, dass „*q* : *p* ∨ ∼*p*“ dasselbe sagt wie „*q*“; dass „*p* ∨ ∼*p*“ nichts sagt."
      en_ogden_ramsey_1922:
        - "We could say: What is common to all symbols, which assert both *p* and *q*, is the proposition “*p* . *q*”."
        - "What is common to all symbols, which assert either *p* or *q*, is the proposition “*p* ∨ *q*”."
        - "And similarly we can say: Two propositions are opposed to one another when they have nothing in common with one another; and every proposition has only one negative, because there is only one proposition which lies altogether outside it."
        - "Thus in Russell’s notation also it appears evident that “*q* : *p* ∨ *\\~p*” says the same as “*q*”; that “*p* ∨ *\\~p*” says nothing."
    edition_references:
      en_pears_mcguinness: "5.513"
    segments:
      - id: "5.513.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "可以說：所有同時斷言 p 與 q 的符號所共有的，就是命題「p．q」。"
        interpretation_zh_tw: "合取由整類同時肯定 p、q 的等價符號之共同真值根據界定。"
      - id: "5.513.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "所有斷言 p 或 q 的符號所共有的，就是命題「p∨q」。"
        interpretation_zh_tw: "選言同樣由所有保留至少一項為真配置的符號所共有之處界定。"
      - id: "5.513.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "同樣地，兩命題若毫無共同之處便彼此對立；每個命題只有一個否定，因為只有一個命題完全位於它之外。"
        interpretation_zh_tw: "否定取命題真值根據的完整補集，因此在邏輯上唯一，即使可有多種寫法。"
      - id: "5.513.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "因此在羅素的記法中也可清楚看出，「q：p∨~p」與「q」說同一件事，而「p∨~p」什麼也沒說。"
        interpretation_zh_tw: "恆真式與 q 組合不改變 q 的真值根據，證明恆真式沒有增加世界內容。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 把真值函數式組合作為非平凡語意層的最低目標之一；現行主線尚未實作命題 5.513 的完整形式系統。"
        rationale_zh_tw: "專案文件只支撐真值組合的方向，尚不支撐這裡的共同否定完備性或完整形式推導。此命題的重點是：合取、選言與否定由整類等價符號共享的真值根據界定；恆真式不為 q 增添內容。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "### 9.4 Truth-functional composition"
            note_zh_tw: "此節把真值函數式組合列為最低語意能力，並明示這是目標而非既成實作。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "命題 5.513 所需的合取、選言、否定、恆真式之 truth-ground 等價由此 issue 追蹤；現行求值不含這些複合式。"

  - id: "5.514"
    parent: "5.51"
    texts:
      de:
        - "Ist eine Notation festgelegt, so gibt es in ihr eine Regel, nach der alle *p* verneinenden Sätze gebildet werden, eine Regel, nach der alle *p* bejahenden Sätze gebildet werden, eine Regel, nach der alle *p* oder *q* bejahenden Sätze gebildet werden, u. s. f."
        - "Diese Regeln sind den Symbolen äquivalent und in ihnen spiegelt sich ihr Sinn wider."
      en_ogden_ramsey_1922:
        - "If a notation is fixed, there is in it a rule according to which all the propositions denying *p* are constructed, a rule according to which all the propositions asserting *p* are constructed, a rule according to which all the propositions asserting *p* or *q* are constructed, and so on."
        - "These rules are equivalent to the symbols and in them their sense is mirrored."
    edition_references:
      en_pears_mcguinness: "5.514"
    segments:
      - id: "5.514.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "記法一旦確定，其中就有建構所有否定 p 的命題之規則、建構所有斷言 p 的命題之規則、建構所有斷言 p 或 q 的命題之規則，等等。"
        interpretation_zh_tw: "固定記法等於固定各類真值表達式的完整生成規則。"
      - id: "5.514.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這些規則與符號等價，而符號的意義就在規則中得到映照。"
        interpretation_zh_tw: "符號語意由整套合法建構與真值效果承載，不是由孤立字形承載。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 讓 schema 的合法位置與用法限制記號；這可類比命題 5.514 對記法自行擋錯的要求。"
        rationale_zh_tw: "schema 一經固定，便決定「view」在哪些位置有合法用法、哪些位置必須拒絕；這只類比規則承載符號意義，未建立本命題所說的全部命題建構規則。"
        evidence:
          - path: "docs/explainers/entity-vs-view.md"
            kind: heading
            locator: "### 維根斯坦真正用蘇格拉底舉的例子"
            note_zh_tw: "此節以 5.4733 說明同一字形在錯誤位置未獲賦義，錯在記法而非形上學。"
    history: []

  - id: "5.515"
    parent: "5.51"
    texts:
      de:
        - "Es muss sich an unseren Symbolen zeigen, dass das, was durch „∨“, „*.*“, etc. miteinander verbunden ist, Sätze sein müssen."
        - "Und dies ist auch der Fall, denn das Symbol „*p*“ und „*q*“ setzt ja selbst das „∨“, „∼“, etc. voraus."
        - "Wenn das Zeichen „*p*“ in „*p*∨ *q*“ nicht für ein komplexes Zeichen steht, dann kann es allein nicht Sinn haben; dann können aber auch die mit „*p*“ gleichsinnigen Zeichen „*p* ∨ *p*“, „*p . p*“, etc. keinen Sinn haben."
        - "Wenn aber „*p* ∨ *p*“ keinen Sinn hat, dann kann auch „*p* ∨ *q*“ keinen Sinn haben."
      en_ogden_ramsey_1922:
        - "It must be recognized in our symbols that what is connected by “∨”, “.”, etc., must be propositions."
        - "And this is the case, for the symbols “*p*” and “*q*” presuppose “∨”, “*\\~*”, etc."
        - "If the sign “*p*” in “*p* ∨ *q*” does not stand for a complex sign, then by itself it cannot have sense; but then also the signs “*p* ∨ *p*”, “*p* . *p*” etc. which have the same sense as “*p*” have no sense."
        - "If, however, “*p* ∨ *p*” has no sense, then also “*p* ∨ *q*” can have no sense."
    edition_references:
      en_pears_mcguinness: "5.515"
    segments:
      - id: "5.515.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們的符號必須讓人看出：由「∨」、「．」等連結的項目必須是命題。"
        interpretation_zh_tw: "輸入種類限制應直接顯現在記法中，不能等運算後才用散文檢查。"
      - id: "5.515.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "實際上也如此，因為「p」、「q」這些符號已預設「∨」、「~」等。"
        interpretation_zh_tw: "命題變項與聯結詞在整體系統中互相規定彼此可合法出現的位置。"
      - id: "5.515.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "若「p∨q」中的「p」不代表複合記號，它單獨就不可能有意義；但如此一來，與「p」同義的「p∨p」、「p．p」等也沒有意義。"
        interpretation_zh_tw: "p 必須可承擔完整命題位置，否則所有宣稱與 p 同義的複合式也失去形成基礎。"
      - id: "5.515.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "若「p∨p」沒有意義，「p∨q」也不可能有意義。"
        interpretation_zh_tw: "錯誤種類的輸入不是讓式子為假，而是使整個組合未形成有意義命題。"
    project_relations:
