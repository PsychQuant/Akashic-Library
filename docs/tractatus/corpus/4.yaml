  - id: "4.2"
    parent: "4"
    texts:
      de:
        - "Der Sinn des Satzes ist seine Übereinstimmung, und Nichtübereinstimmung mit den Möglichkeiten des Bestehens und Nichtbestehens der Sachverhalte."
      en_ogden_ramsey_1922:
        - "The sense of a proposition is its agreement and disagreement with the possibilities of the existence and non-existence of the atomic facts."
    edition_references:
      en_pears_mcguinness: "4.2"
    segments:
      - id: "4.2.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題的意義，在於它與事態成立及不成立之各種可能相符合或不符合。"
        interpretation_zh_tw: "sense 可由命題允許與排除哪些事態可能來刻畫；這是 truth condition 的空間，不是當下真值本身。"
    project_relations:
      - status: partial
        mode: semantic_operation
        claim_zh_tw: "對 authored，Akashic 已使一組窄幅 truth conditions 可執行：resolved author identity 為 holds；canonical witness 證成的 exact exclusion 為 fails；沒有 witness 或仍含 literal identity 問題則為 undetermined；bounded not 機械導出相反的 determinate truth。"
        rationale_zh_tw: "4.2 以命題對事態成立／不成立可能性的符合關係界定 sense。現行 slice 已同時表示 atom 與 unary negation，並以 recursive EvidenceTrace 保存原子證據及每層結論；但它只涵蓋少數館藏 predicate，沒有多原子 binary operators、完整 truth-possibility space、truth table 或 formula equivalence，因此仍只是局部 truth-condition 實例。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "## 3. 最簡單的反例：搜尋到一個句子，不等於句子是真的"
            note_zh_tw: "此節用可搜尋的假句子明確區分 retrieval 與 truth。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "evaluate"
            note_zh_tw: "`evaluate(in:)` 先驗整個 expression，求值一次 atom，再以同一 context 逐層導出 negation trace。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "EvidenceTrace"
            note_zh_tw: "`EvidenceTrace` 是唯讀 recursive value；atom 保存完整 evidence，negation 保存 operand 與由其 truth 導出的 conclusion。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testSupportingEvidenceHolds"
            note_zh_tw: "測試確認 model 的正面作者配置可使 authored 求值為 holds。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testAbsenceIsUndeterminedNotFalse"
            note_zh_tw: "測試確認缺少支持資料時維持 undetermined，而非推論為假。"
          - path: "Tests/AkashicPropositionTests/AuthorshipCompletenessPropositionTests.swift"
            kind: test
            locator: "testAuthoredUsesFixedOpenWorldPrecedence"
            note_zh_tw: "測試釘住 holds、matching／other literal 未決、普通缺席未決及 exact witnessed exclusion 為 fails 的固定優先序。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testDoubleNegationKeepsTwoTraceNodesButRestoresTruth"
            note_zh_tw: "測試確認雙重否定保留兩個結構與 trace 節點，同時恢復 operand truth。"
    history:
      - kind: commit
        reference: "e16c6f6e6d77f7cfe7e9d66323aecb174917872c"
        disposition: revised
        note_zh_tw: "e16c6f6 讓 authored 的正向成立條件成為可執行規則，但沒有完整 truth-condition 空間，故修訂為 partial。"
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/203"
        disposition: revised
        note_zh_tw: "此 issue 已交付明確否定與 canonical witness 證成的負向 authored 事態；普通資料缺席仍不得冒充反證。"
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "多原子 binary operators、truth-possibility table 與 formula equivalence 保留在既有能力邊界之外。"

