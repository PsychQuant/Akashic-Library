  - id: "5.44"
    parent: "5.4"
    texts:
      de:
        - "Die Wahrheitsfunktionen sind keine materiellen Funktionen."
        - "Wenn man z. B. eine Bejahung durch doppelte Verneinung erzeugen kann, ist dann die Verneinung – in irgend einem Sinn – in der Bejahung enthalten?"
        - "Verneint „∼∼*p*“ ∼*p*, oder bejaht es *p*; oder beides?"
        - "Der Satz „∼∼*p*“ handelt nicht von der Verneinung wie von einem Gegenstand; wohl aber ist die Möglichkeit der Verneinung in der Bejahung bereits präjudiziert."
        - "Und gäbe es einen Gegenstand, der „∼“ hiesse, so müsste „∼∼*p*“ etwas anderes sagen als „*p*“."
        - "Denn der eine Satz würde dann eben von ∼ handeln, der andere nicht."
      en_ogden_ramsey_1922:
        - "Truth-functions are not material functions."
        - "If *e.g.* an affirmation can be produced by repeated denial, is the denial—in any sense—contained in the affirmation?"
        - "Does “\\~\\~*p*” deny \\~*p*, or does it affirm *p*; or both?"
        - "The proposition “*\\~\\~p*” does not treat of denial as an object, but the possibility of denial is already prejudged in affirmation."
        - "And if there was an object called “\\~”, then “\\~\\~*p*” would have to say something other than “*p*”."
        - "For the one proposition would then treat of \\~, the other would not."
    edition_references:
      en_pears_mcguinness: "5.44"
    segments:
      - id: "5.44.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "真值函數不是質料函數。"
        interpretation_zh_tw: "真值函數不把否定等聯結詞當成可被命題談論的材料對象。"
      - id: "5.44.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "例如，肯定若可由雙重否定產生，否定是否以任何意義包含在肯定裡？"
        interpretation_zh_tw: "這個問題測試運算的表面步驟是否會成為結果命題所談論的內容。"
      - id: "5.44.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "「~~p」是在否定 ~p、肯定 p，還是兩者兼具？"
        interpretation_zh_tw: "雙重否定的逐步讀法不能改變整式與 p 相同的真值條件。"
      - id: "5.44.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "命題「~~p」不把否定當作對象；肯定中卻已預先包含否定的可能性。"
        interpretation_zh_tw: "命題空間本已容許否定運算，而不是因為式子額外指稱一個否定物。"
      - id: "5.44.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "若真有一個叫作「~」的對象，則「~~p」必須說出不同於「p」的內容。"
        interpretation_zh_tw: "若 ~ 是被指稱的對象，多出兩個 ~ 就會增加 p 所沒有的世界內容。"
      - id: "5.44.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "因為前一命題會談到 ~，後一命題則不會。"
        interpretation_zh_tw: "兩式實際上邏輯同義，反證 ~ 不能是其中一式額外談論的對象。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 的 not 是 expression operator 而非資料實體；雙重否定保留兩個結構與 trace 節點，求值則恢復 operand truth。跨公式的語意等價與正規化仍屬 aspirational。"
        rationale_zh_tw: "5.44 強調否定不是命題所談論的質料對象，且 ~~p 與 p 有相同 truth condition。現行 AST／trace 把每層 not 表為 operator，沒有建立名為否定的 entity；測試也證明 double negation truth 恢復。然而結構 equality 刻意維持 p、~p、~~p 三者不同，系統尚不能宣告 p 與 ~~p truth-condition equivalent，更沒有涵蓋其他等價寫法，故維持 aspirational。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "### 9.4 Truth-functional composition"
            note_zh_tw: "此節把真值函數式組合列為最低語意能力，並明示這是目標而非既成實作。"
          - path: "Sources/AkashicProposition/Expression.swift"
            kind: symbol
            locator: "PropositionExpression"
            note_zh_tw: "`not` 是唯一 formula 型別上的 operator；structural equality 不做雙重否定化簡。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "EvidenceTrace"
            note_zh_tw: "recursive trace 將 negation 保存為 operand／derived conclusion，而不是把否定當成 atomic evidence object。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testDoubleNegationKeepsTwoTraceNodesButRestoresTruth"
            note_zh_tw: "測試確認 ~~p 的 truth 與 p 相同，但兩層 operator／trace 不被抹平。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testAtomNegationAndDoubleNegationHaveDistinctStructuralIdentity"
            note_zh_tw: "測試明示 structural identity 不等於尚未實作的 truth-condition equivalence。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "operator 非對象化與 double-negation truth 已有窄幅證據；normalization、跨公式語意等價及 binary truth-functions 仍留在既有 issue 能力邊界。"

