  - id: "3.323"
    parent: "3.32"
    texts:
      de:
        - "In der Umgangssprache kommt es ungemein häufig vor, dass dasselbe Wort auf verschiedene Art und Weise bezeichnet – also verschiedenen Symbolen angehört –, oder, dass zwei Wörter, die auf verschiedene Art und Weise bezeichnen, äusserlich in der gleichen Weise im Satze angewandt werden."
        - "So erscheint das Wort „ist“ als Kopula, als Gleichheitszeichen und als Ausdruck der Existenz; „existieren“ als intransitives Zeitwort wie „gehen“; „identisch“ als Eigenschaftswort; wir reden von *Etwas*, aber auch davon, dass *etwas* geschieht."
        - "\\(Im Satze „Grün ist grün“ – wo das erste Wort ein Personenname, das letzte ein Eigenschaftswort ist – haben diese Worte nicht einfach verschiedene Bedeutung, sondern es sind *verschiedene Symbole*.)"
      en_ogden_ramsey_1922:
        - "In the language of everyday life it very often happens that the same word signifies in two different ways—and therefore belongs to two different symbols—or that two words, which signify in different ways, are apparently applied in the same way in the proposition."
        - "Thus the word “is” appears as the copula, as the sign of equality, and as the expression of existence; “to exist” as an intransitive verb like “to go”; “identical” as an adjective; we speak of *something* but also of the fact of *something* happening."
        - "\\(In the proposition “Green is green”—where the first word is a proper name as the last an adjective—these words have not merely different meanings but they are *different symbols*.)"
    edition_references:
      en_pears_mcguinness: "3.323"
    segments:
      - id: "3.323.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在日常語言中，同一個詞極常以不同方式指示——因而屬於不同符號；或者，兩個以不同方式指示的詞，在命題中表面上以相同方式使用。"
        interpretation_zh_tw: "自然語言的表面文法會遮蔽邏輯角色：同字可以是不同符號，不同字也可能呈現相同外觀位置。"
      - id: "3.323.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "例如，「是」可作繫詞、等號與存在的表達；「存在」可像「走」一樣作不及物動詞；「同一的」可作形容詞；我們既談論某個東西，也談論某件事發生。"
        interpretation_zh_tw: "例子逐一拆開「是／存在／同一」的功能，說明日常詞形不能直接決定其符號類型。"
      - id: "3.323.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（在「綠是綠」這個命題中，第一個詞是人名，最後一個詞是形容詞；兩者不只指稱不同，而是不同的符號。）"
        interpretation_zh_tw: "同一字樣「綠」因句法位置與用法不同而成為不同符號，正是記號相同不等於符號相同的人工檢查點。"
    project_relations:
      - status: partial
        mode: meta_elucidation
        claim_zh_tw: "Akashic 的設計文件已具體記錄：自然語言的同一個「隸屬」表面詞，實際涵蓋不同 predicate 與不同適用位置。"
        rationale_zh_tw: "這直接支撐 3.323 所警告的表層文法歧義；目前支撐層是設計規範與分形狀欄位，不宣稱已建成無歧義的完整符號語言。"
