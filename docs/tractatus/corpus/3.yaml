          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "記號代替它們。"
        interpretation_zh_tw: "代替關係讓可感知記號在命題中站到對象的位置，並非宣稱兩者同一。"
      - id: "3.221.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2, 3]
        translation_zh_tw: "我只能談論它們，不能把它們本身說出來。"
        interpretation_zh_tw: "英譯把德文同一句拆成兩句，故採一對二；兩版都區分談論對象與把對象本身作為斷言。"
