    texts:
      de:
        - "Man kann z. B. das Gemeinsame aller Notationen für die Wahrheitsfunktionen so ausdrücken: Es ist ihnen gemeinsam, dass sich alle – z. B. – durch die Notation von „∼*p*“ („nicht *p*“) und „*p* ∨ *q*“ („*p* oder *q*“) *ersetzen lassen*."
        - "\\(Hiermit ist die Art und Weise gekennzeichnet, wie eine spezielle mögliche Notation uns allgemeine Aufschlüsse geben kann.)"
      en_ogden_ramsey_1922:
        - "We can, for example, express what is common to all notations for the truth-functions as follows: It is common to them that they all, for example, *can be replaced* by the notations of “\\~*p*” (“not *p*”) and “*p* ∨ *q*” (“*p* or *q*”)."
        - "\\(Herewith is indicated the way in which a special possible notation can give us general information.)"
    edition_references:
      en_pears_mcguinness: "3.3441"
    segments:
      - id: "3.3441.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "例如，所有真值函數記法的共同之處，可以這樣表達：它們全都可由「∼*p*」（「非 *p*」）與「*p* ∨ *q*」（「*p* 或 *q*」）這類記法取代。"
        interpretation_zh_tw: "例子用可相互定義的基底說明記法表面不同，仍可能保存相同的真值函數能力。"
      - id: "3.3441.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（這也刻畫了：一種特定的可能記法，如何能給我們一般性的洞見。）"
        interpretation_zh_tw: "具體基底之所以有哲學價值，不在它是唯一寫法，而在它展示整類記法共有的替換結構。"
