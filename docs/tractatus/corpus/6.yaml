  - id: "6.43"
    parent: "6.4"
    texts:
      de:
        - "Wenn das gute oder böse Wollen die Welt ändert, so kann es nur die Grenzen der Welt ändern, nicht die Tatsachen; nicht das, was durch die Sprache ausgedrückt werden kann."
        - "Kurz, die Welt muss dann dadurch überhaupt eine andere werden."
        - "Sie muss sozusagen als Ganzes abnehmen oder zunehmen."
        - "Die Welt des Glücklichen ist eine andere als die des Unglücklichen."
      en_ogden_ramsey_1922:
        - "If good or bad willing changes the world, it can only change the limits of the world, not the facts; not the things that can be expressed in language."
        - "In brief, the world must thereby become quite another."
        - "It must so to speak wax or wane as a whole."
        - "The world of the happy is quite another than that of the unhappy."
    edition_references:
      en_pears_mcguinness: "6.43"
    segments:
      - id: "6.43.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若善或惡的意志改變世界，它只能改變世界的界線，而非事實，也不是語言可表達之物。"
        interpretation_zh_tw: "倫理改變被置於主體與世界之界線，不是事件清單改寫。"
      - id: "6.43.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "簡言之，世界整體會因此成為另一個世界。"
        interpretation_zh_tw: "「另一個世界」指觀看與生活的整體界線。"
      - id: "6.43.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "它彷彿作為整體縮小或擴大。"
        interpretation_zh_tw: "縮放是整體比喻，不是資料量變化。"
      - id: "6.43.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "幸福者的世界不同於不幸者的世界。"
        interpretation_zh_tw: "這句不是 Git branch 或資料庫副本的可能世界模型。"
