  - id: "5.5351"
    parent: "5.535"
    texts:
      de:
        - "Es gibt gewisse Fälle, wo man in Versuchung gerät, Ausdrücke von der Form „*a* = *a*“ oder „*p* ⊃ *p*“ u. dgl. zu benützen."
        - "Und zwar geschieht dies, wenn man von dem Urbild: Satz, Ding, etc. reden möchte."
        - "So hat Russell in den „Principles of Mathematics“ den Unsinn „*p* ist ein Satz“ in Symbolen durch „*p* ⊃ *p*“ wiedergegeben und als Hypothese vor gewisse Sätze gestellt, damit deren Argumentstellen nur von Sätzen besetzt werden könnten."
        - "\\(Es ist schon darum Unsinn, die Hypothese *p* ⊃ *p* vor einen Satz zu stellen, um ihm Argumente der richtigen Form zu sichern, weil die Hypothese für einen Nicht-Satz als Argument nicht falsch, sondern unsinnig wird, und weil der Satz selbst durch die unrichtige Gattung von Argumenten unsinnig wird, also sich selbst ebenso gut, oder so schlecht, vor den unrechten Argumenten bewahrt, wie die zu diesem Zweck angehängte sinnlose Hypothese.)"
      en_ogden_ramsey_1922:
        - "There are certain cases in which one is tempted to use expressions of the form “*a* = *a*” or “*p* ⊃ *p*”."
        - "As, for instance, when one would speak of the archetype Proposition, Thing, etc."
        - "So Russell in the *Principles of Mathematics* has rendered the nonsense “*p* is a proposition” in symbols by “*p* ⊃ *p*” and has put it as hypothesis before certain propositions to show that their places for arguments could only be occupied by propositions."
        - "\\(It is nonsense to place the hypothesis *p* ⊃ *p* before a proposition in order to ensure that its arguments have the right form, because the hypothesis for a non-proposition as argument becomes not false but meaningless, and because the proposition itself becomes senseless for arguments of the wrong kind, and therefore it survives the wrong arguments no better and no worse than the senseless hypothesis attached for this purpose.)"
    edition_references:
      en_pears_mcguinness: "5.5351"
    segments:
      - id: "5.5351.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在某些情形中，人會想使用「a=a」或「p⊃p」這類表達式。"
        interpretation_zh_tw: "這些恆真形式容易被誤當成替符號標記其邏輯種類的述詞。"
      - id: "5.5351.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "例如，人想談論命題、事物等原型時就會如此。"
        interpretation_zh_tw: "把「命題」或「事物」當成可由恆真式斷言的原型，混淆了形式與內容。"
      - id: "5.5351.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "羅素在《數學原理》中就把「p 是一個命題」這句無意義的話寫成「p⊃p」，並把它置於某些命題之前作假設，以使其引數位置只能由命題占據。"
        interpretation_zh_tw: "用恆真式當型別標記無法替引數建立命題身分，因為它只在 p 已是命題時才有意義。"
      - id: "5.5351.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（為確保引數形式正確而在命題前加上 p⊃p，是無意義的：當引數不是命題時，該假設不是假而是沒有意義；原命題遇到錯誤種類的引數也同樣無意義，因此它面對錯誤引數時，並不比附加的無意義假設更好或更壞。）"
        interpretation_zh_tw: "型別錯誤使整個符號失去意義，不會被一個只有在合法命題上才成立的前置假設攔截。"
    project_relations:
