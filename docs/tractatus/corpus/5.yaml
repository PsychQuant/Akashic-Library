        - "Und der Spielraum, welcher ihrem Bau durch die Gesamtheit der Elementarsätze gelassen wird, ist eben derjenige, welchen die ganz allgemeinen Sätze begrenzen."
        - "\\(Wenn ein Elementarsatz wahr ist, so ist damit doch jedenfalls Ein Elementarsatz *mehr* wahr.)"
      en_ogden_ramsey_1922:
        - "The truth or falsehood of *every* proposition alters something in the general structure of the world."
        - "And the range which is allowed to its structure by the totality of elementary propositions is exactly that which the completely general propositions delimit."
        - "\\(If an elementary proposition is true, then, at any rate, there is one *more* elementary proposition true.)"
