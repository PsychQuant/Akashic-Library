# 自然科學、因果性與邏輯可能性
  - id: "6.3"
    parent: "6"
    texts:
      de:
        - "Die Erforschung der Logik bedeutet die Erforschung *aller Gesetzmässigkeit*."
        - "Und ausserhalb der Logik ist alles Zufall."
      en_ogden_ramsey_1922:
        - "Logical research means the investigation of *all regularity*."
        - "And outside logic all is accident."
    edition_references:
      en_pears_mcguinness: "6.3"
    segments:
      - id: "6.3.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "研究邏輯，就是研究一切合規律性。"
        interpretation_zh_tw: "這裡的規律性是邏輯形式，不是統計規律。"
      - id: "6.3.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "而在邏輯之外，一切都是偶然的。"
        interpretation_zh_tw: "「偶然」意指非邏輯必然，不等於沒有因果或無法解釋。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前沒有把命題 6.3 所論的「研究邏輯，就是研究一切合規律性。」設為直接軟體行為。"
        rationale_zh_tw: "命題 6.3 的直接論旨是「研究邏輯，就是研究一切合規律性。」；這句處理科學描述、因果形式或邏輯可能性的界線；Akashic 的模型與驗證規則不能把經驗假設升格為邏輯必然。"
    history: []
  - id: "6.31"
    parent: "6.3"
    texts:
      de:
        - "Das sogenannte Gesetz der Induktion kann jedenfalls kein logisches Gesetz sein, denn es ist offenbar ein sinnvoller Satz."
        - "– Und darum kann es auch kein Gesetz a priori sein."
      en_ogden_ramsey_1922:
        - "The so-called law of induction cannot in any case be a logical law, for it is obviously a significant proposition."
        - "—And therefore it cannot be a law a priori either."
    edition_references:
      en_pears_mcguinness: "6.31"
    segments:
      - id: "6.31.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "所謂歸納律無論如何都不可能是邏輯法則，因為它顯然是有意義命題。"
        interpretation_zh_tw: "歸納律會排除某些可能情況，因而具有實質內容；它的成立不能只由邏輯形式保證。"
      - id: "6.31.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "——因此，它也不可能是先天法則。"
        interpretation_zh_tw: "後句把前述有實質內容的理由推到先天地位：若須由經驗評估，就不是此處所說的先天法則。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前沒有把命題 6.31 對歸納律之非邏輯、非先天地位的主張設為直接軟體行為。"
        rationale_zh_tw: "命題 6.31 因歸納律是有實質內容的命題，而否定它是邏輯或先天法則；這是在劃分經驗規律與邏輯形式。Akashic 的模型與驗證規則同樣不能把經驗假設升格為邏輯必然，但這項警戒不是形式邏輯實作。"
    history: []
