        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題只有因為是現實的圖像，才可能為真或為假。"
        interpretation_zh_tw: "同一結構能與現實相符或不符，才使二值評價有意義；任意資料項或搜尋結果不因輸出布林值就成為 proposition。"
    project_relations:
      - status: partial
        mode: semantic_operation
        claim_zh_tw: "Akashic 只有在 typed atom 成功投射到正確 entity roles 後才進行 truth evaluation；canonical author-list witness 可使 authored atom 為 fails，bounded not 可遞迴導出相反的 determinate truth，不可投射者仍保持 undetermined。"
        rationale_zh_tw: "4.06 把可真可假的條件連到命題對現實的圖像關係。現行 projector 以角色、身分與 entity kind 守住最小結構對應；witness-backed exact exclusion 與 explicit negation 已提供窄幅 false 路徑，且 recursive trace 可稽核每一層來源。這仍只是兩個館藏 predicate 加 unary not 的 model-relative 語意，不是完整圖像論或任意 formula calculus。"
