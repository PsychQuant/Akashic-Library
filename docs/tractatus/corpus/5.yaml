schema_version: 1
volume: "5"
propositions:
  - id: "5"
    texts:
      de:
        - "Der Satz ist eine Wahrheitsfunktion der Elementarsätze."
        - "\\(Der Elementarsatz ist eine Wahrheitsfunktion seiner selbst.)"
      en_ogden_ramsey_1922:
        - "Propositions are truth-functions of elementary propositions."
        - "\\(An elementary proposition is a truth-function of itself.)"
    edition_references:
      en_pears_mcguinness: "5"
    segments:
      - id: "5.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題是基本命題的真值函數。"
        interpretation_zh_tw: "複合命題的真假完全由其基本命題的真值配置決定。"
      - id: "5.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（基本命題是它自身的真值函數。）"
        interpretation_zh_tw: "括號中的補充把基本命題也納入同一形式：不改變自身真值的單項函數就是它本身。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 已有唯一且 bounded 的 PropositionExpression，可由 typed atom 遞迴套用 unary not，並以 recursive EvidenceTrace 求值；由多個原子建立完整 classical truth-functions 仍是工程願景。"
        rationale_zh_tw: "命題 5 主張一切命題都是基本命題的真值函數，並把基本命題視為自身的恆等真值函數。現行 atom／not expression 已讓 determinate truth 逐層反轉、undetermined 原因保持不變，且雙重否定恢復 truth；但三值 epistemic 結果不是二值完備演算，專案也沒有 and／or／implies、任意多原子組合、truth table、normalization 或 truth-condition equivalence，因此仍維持 aspirational。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "### 9.4 Truth-functional composition"
            note_zh_tw: "此節把真值函數式組合列為最低語意能力，並明示這是目標而非既成實作。"
          - path: "Sources/AkashicProposition/Expression.swift"
            kind: symbol
            locator: "PropositionExpression"
            note_zh_tw: "`PropositionExpression` 是唯一 formula 型別，現階段提供 atom／not 與 64 層 operator budget。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "EvidenceTrace"
            note_zh_tw: "`EvidenceTrace` 以唯讀遞迴樹保存 atom evidence 與每層 negation operand／conclusion。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testValidationAccepts64OperatorsAndRejects65"
            note_zh_tw: "測試確認 unary formula 可遞迴但有明確 64／65 深度邊界。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testDoubleNegationKeepsTwoTraceNodesButRestoresTruth"
            note_zh_tw: "測試確認雙重否定保留兩個結構節點並恢復 truth，沒有冒充完整公式等價。"
    history:
      - kind: commit
        reference: "e16c6f6e6d77f7cfe7e9d66323aecb174917872c"
        disposition: retained
        note_zh_tw: "e16c6f6 當時只新增 authored atom 的三值求值；後續 unary negation 擴張了 expression 與 trace，但未交付多原子 classical truth-function，故 aspirational 判定保留。"
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "既有 issue identity 保留作 binary operators、遞迴多原子組合、truth table 與等價驗證的能力邊界；#213 的 bounded atom／not 不完成本關係。"

  - id: "5.01"
    parent: "5"
    texts:
      de:
        - "Die Elementarsätze sind die Wahrheitsargumente des Satzes."
      en_ogden_ramsey_1922:
        - "The elementary propositions are the truth-arguments of propositions."
    edition_references:
      en_pears_mcguinness: "5.01"
    segments:
      - id: "5.01.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "基本命題是命題的真值引數。"
        interpretation_zh_tw: "基本命題提供真值運算所作用的輸入位置，而不是另一種藏在命題背後的對象。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 把真值函數式組合作為非平凡語意層的最低目標之一；現行主線尚未實作命題 5.01 的完整形式系統。"
        rationale_zh_tw: "專案文件要求未來能由原子判定組成複合真值，但目前只能據此標示方向，不能把現有資料讀取冒充為《邏輯哲學論》的真值運算。此命題的重點是：基本命題提供真值運算所作用的輸入位置，而不是另一種藏在命題背後的對象。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "### 9.4 Truth-functional composition"
            note_zh_tw: "此節把真值函數式組合列為最低語意能力，並明示這是目標而非既成實作。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "命題 5.01 所需的多原子 truth-argument 表示與輸入配置由此 issue 追蹤；單一 authored atom 尚不能構成該形式系統。"

  - id: "5.02"
    parent: "5"
    texts:
      de:
        - "Es liegt nahe, die Argumente von Funktionen mit den Indices von Namen zu verwechseln."
        - "Ich erkenne nämlich sowohl am Argument wie am Index die Bedeutung des sie enthaltenden Zeichens."
        - "In Russell’s „+*~c~*“ ist z. B. „*c*“ ein Index, der darauf hinweist, dass das ganze Zeichen das Additionszeichen für Kardinalzahlen ist."
        - "Aber diese Bezeichnung beruht auf willkürlicher Übereinkunft und man könnte statt „+*~c~*“ auch ein einfaches Zeichen wählen; in „∼*p*“ aber ist „*p*“ kein Index, sondern ein Argument: der Sinn von „∼*p*“ *kann nicht* verstanden werden, ohne dass vorher der Sinn von „*p*“ verstanden worden wäre."
        - "(Im Namen Julius Cäsar ist „Julius“ ein Index."
        - "Der Index ist immer ein Teil einer Beschreibung des Gegenstandes, dessen Namen wir ihn anhängen."
        - "Z. B. *Der* Cäsar aus dem Geschlechte der Julier.)"
        - "Die Verwechslung von Argument und Index liegt, wenn ich mich nicht irre, der Theorie Frege’s von der Bedeutung der Sätze und Funktionen zugrunde."
        - "Für Frege waren die Sätze der Logik Namen, und deren Argumente die Indices dieser Namen."
      en_ogden_ramsey_1922:
        - "It is natural to confuse the arguments of functions with the indices of names."
        - "For I recognize the meaning of the sign containing it from the argument just as much as from the index."
        - "In Russell’s “+~*c*~”, for example, “*c*” is an index which indicates that the whole sign is the addition sign for cardinal numbers."
        - "But this way of symbolizing depends on arbitrary agreement, and one could choose a simple sign instead of “+~*c*~”: but in “\\~*p*” “*p*” is not an index but an argument; the sense of “\\~*p*” *cannot* be understood, unless the sense of “*p*” has previously been understood."
        - "(In the name Julius Caesar, Julius is an index."
        - "The index is always part of a description of the object to whose name we attach it, e.g. *The* Caesar of the Julian gens.)"
        - "The confusion of argument and index is, if I am not mistaken, at the root of Frege’s theory of the meaning of propositions and functions."
        - "For Frege the propositions of logic were names and their arguments the indices of these names."
    edition_references:
      en_pears_mcguinness: "5.02"
    segments:
      - id: "5.02.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們很自然會把函數的引數與名稱的下標混淆。"
        interpretation_zh_tw: "引數與下標的外觀角色相近，因而容易被誤認為同一種符號成分。"
      - id: "5.02.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因為我既可由引數，也可由下標，辨認含有它的記號之意義。"
        interpretation_zh_tw: "兩者都能協助辨認整體記號，但辨認作用相同不等於邏輯功能相同。"
      - id: "5.02.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "例如在羅素的「+~c~」中，c 是下標，指出整個記號是基數的加號。"
        interpretation_zh_tw: "此處下標 c 只依約定限定加號所適用的數類。"
      - id: "5.02.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "但這種表示法取決於任意約定，本可用一個簡單記號取代「+~c~」；在「~p」中，p 卻不是下標而是引數：若事先不理解 p 的意義，就不能理解 ~p 的意義。"
        interpretation_zh_tw: "下標可由另一字形替換，引數 p 卻帶著自身命題意義進入真值運算。"
      - id: "5.02.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "（在 Julius Caesar 這個名稱裡，Julius 是下標。"
        interpretation_zh_tw: "Julius 在名稱內縮小所指對象的描述範圍，而不充當函數輸入。"
      - id: "5.02.f"
        alignment:
          de: [5, 6]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "下標總是所附名稱之對象描述的一部分，例如「儒略氏族的那位凱撒」。）"
        interpretation_zh_tw: "德文另以一句列出例子；兩版都把下標放在對象描述內，而不是命題運算的位置。"
      - id: "5.02.g"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "若我沒有看錯，把引數與下標混淆正是弗雷格命題與函數意義理論的根源。"
        interpretation_zh_tw: "批評的焦點是把參與真值結構的成分降成僅用來辨認名稱的標記。"
      - id: "5.02.h"
        alignment:
          de: [8]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "對弗雷格而言，邏輯命題是名稱，而它們的引數則是這些名稱的下標。"
        interpretation_zh_tw: "一旦命題被當成名稱，引數就會被錯讀為附著於名稱的下標，掩蓋命題的函數結構。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.02 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：下標只協助辨認約定好的記號，引數卻帶入具有自身意義的內容；混淆兩者會掩蓋函數式符號如何取得意義。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.1"
    parent: "5"
    texts:
      de:
        - "Die Wahrheitsfunktionen lassen sich in Reihen ordnen."
        - "Das ist die Grundlage der Wahrscheinlichkeitslehre."
      en_ogden_ramsey_1922:
        - "The truth-functions can be ordered in series."
        - "That is the foundation of the theory of probability."
    edition_references:
      en_pears_mcguinness: "5.1"
    segments:
      - id: "5.1.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "真值函數可以排列成序列。"
        interpretation_zh_tw: "真值條件可依其包含與排除的形式關係排序。"
      - id: "5.1.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這是機率理論的基礎。"
        interpretation_zh_tw: "機率可在排列後的真值可能性中，以相符配置所占比例來刻畫。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 把真值函數式組合作為非平凡語意層的最低目標之一；現行主線尚未實作命題 5.1 的完整形式系統。"
        rationale_zh_tw: "專案文件要求未來能由原子判定組成複合真值，但目前只能據此標示方向，不能把現有資料讀取冒充為《邏輯哲學論》的真值運算。此命題的重點是：真值條件之間可依形式關係排序，而機率可由這些真值可能性的包含與比例來刻畫。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "### 9.4 Truth-functional composition"
            note_zh_tw: "此節把真值函數式組合列為最低語意能力，並明示這是目標而非既成實作。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "命題 5.1 所需的有限真值配置排序與包含／排除關係由此 issue 追蹤；現行求值沒有可枚舉的 truth-possibility 空間。"

  - id: "5.101"
    parent: "5.1"
    texts:
      de:
        - "Die Wahrheitsfunktionen jeder Anzahl von Elementarsätzen lassen sich in einem Schema folgender Art hinschreiben:"
        - "|   |   |   |\n|---|---|---|"
        - "|(WWWW)(*p*, *q*) |Tautologie |(Wenn *p*, so *p*; und wenn *q*, so *q*.) (*p* ⊃ *p . q* ⊃ *q*) |"
        - "|(FWWW)(*p*, *q*) |in Worten: |Nicht beides *p* und *q*. (∼(*p* . *q*)) |"
        - "|(WFWW)(*p*, *q*) |„ „ |Wenn *q*, so *p*. (q ⊃ p) |"
        - "|(WWFW)(*p*, *q*) |„ „ |Wenn *p*, so *q*. (p ⊃ q) |"
        - "|(WWWF)(*p*, *q*) |„ „ |*p* oder *q*. (*p* ∨ *q*) |"
        - "|(FFWW)(*p*, *q*) |„ „ |Nicht *q*. ∼*q* |"
        - "|(FWFW)(*p*, *q*) |„ „ |Nicht *p*. ∼*p* |"
        - "|(FWWF)(*p*, *q*) |„ „ |*p* oder *q*, aber nicht beide. (*p* . ∼*q* : ∨ : *q* . ∼*p*) |"
        - "|(WFFW)(*p*, *q*) |„ „ |Wenn *p*, so *q*; und wenn *q*, so *p*. (*p* ≡ *q*) |"
        - "|(WFWF)(*p*, *q*) |„ „ |*p* |"
        - "|(WWFF)(*p*, *q*) |„ „ |*q* |"
        - "|(FFFW)(*p*, *q*) |„ „ |Weder *p* noch *q*. (∼*p* . ∼*q*) oder (*p* \\| *q*) |"
        - "|(FFWF)(*p*, *q*) |„ „ |*p* und nicht *q*. (*p* . ∼*q*) |"
        - "|(FWFF)(*p*, *q*) |„ „ |*q* und nicht *p*. (*q* . ∼*p*) |"
        - "|(WFFF)(*p*, *q*) |„ „ |*q* und *p*. (*q* . *p*) |"
        - "|(FFFF)(*p*, *q*) |Kontradiktion |(*p* und nicht *p*; und *q* und nicht *q*.) (*p* . ∼*p* . *q* . ∼*q*) |"
        - "Diejenigen Wahrheitsmöglichkeiten seiner Wahrheitsargumente, welche den Satz bewahrheiten, will ich seine *Wahrheitsgründe* nennen."
      en_ogden_ramsey_1922:
        - "The truth-functions of every number of elementary propositions can be written in a schema of the following kind:"
        - "|   |   |   |\n|---|---|---|"
        - "|(TTTT)(*p*, *q*) |Tautology |(if *p* then *p*, and if *q* then *q*.) [*p* ⊃ *p . q* ⊃ *q*] |"
        - "|(FTTT)(*p*, *q*) |in words: |Not both *p* and *q*. [\\~(*p* . *q*)] |"
        - "|(TFTT)(*p*, *q*) |” ” |If *q* then *p*. [*q* ⊃ *p*] |"
        - "|(TTFT)(*p*, *q*) |” ” |If *p* then *q*. [*p* ⊃ *q*] |"
        - "|(TTTF)(*p*, *q*) |” ” |*p* or *q*. [*p* ∨ *q*] |"
        - "|(FFTT)(*p*, *q*) |” ” |Not *q*. \\~*q* |"
        - "|(FTFT)(*p*, *q*) |” ” |Not *p*. \\~*p* |"
        - "|(FTTF)(*p*, *q*) |” ” |*p* or *q*, but not both. [*p* . \\~*q* : ∨ : *q* . \\~*p*] |"
        - "|(TFFT)(*p*, *q*) |” ” |If *p*, then *q*; and if *q*, then *p*. [*p* ≡ *q*] |"
        - "|(TFTF)(*p*, *q*) |” ” |*p* |"
        - "|(TTFF)(*p*, *q*) |” ” |*q* |"
        - "|(FFFT)(*p*, *q*) |” ” |Neither *p* nor *q*. [\\~*p* . \\~*q* or *p* \\| *q*] |"
        - "|(FFTF)(*p*, *q*) |” ” |*p* and not *q*. [*p* . \\~*q*] |"
        - "|(FTFF)(*p*, *q*) |” ” |*q* and not *p*. [*q* . \\~*p*] |"
        - "|(TFFF)(*p*, *q*) |” ” |*q* and *p*. [*q* . *p*] |"
        - "|(FFFF)(*p*, *q*) |Contradiction |(*p* and not *p*; and *q* and not *q*.) [*p* . \\~*p* . *q* . \\~*q*] |"
        - "Those truth-possibilities of its truth-arguments, which verify the proposition, I shall call its *truth-grounds*."
    edition_references:
      en_pears_mcguinness: "5.101"
    segments:
      - id: "5.101.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "任意數目的基本命題，其真值函數都能寫成下列類型的圖式。"
        interpretation_zh_tw: "真值表以有限列窮盡基本命題的真假配置，使真值函數可由輸出模式表出。"
      - id: "5.101.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "表格由真值模式、文字說明與等值式三欄構成。"
        interpretation_zh_tw: "表頭與分隔線只組織後續十六列，不另宣告一項真值函數。"
      - id: "5.101.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（WWWW／TTTT）（p、q）：恆真式；若 p 則 p，且若 q 則 q。"
        interpretation_zh_tw: "四種 p、q 配置的輸出全為真，所以這一列不排除任何可能性。"
      - id: "5.101.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（FWWW／FTTT）（p、q）：p 與 q 不可同時為真，即 ~(p．q)。"
        interpretation_zh_tw: "只有 p、q 同真時輸出為假，這正是合取的否定。"
      - id: "5.101.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "（WFWW／TFTT）（p、q）：若 q，則 p，即 q⊃p。"
        interpretation_zh_tw: "唯一被排除的是 q 真而 p 假的配置，因此該列表示 q 蘊涵 p。"
      - id: "5.101.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "（WWFW／TTFT）（p、q）：若 p，則 q，即 p⊃q。"
        interpretation_zh_tw: "唯一被排除的是 p 真而 q 假的配置，因此該列表示 p 蘊涵 q。"
      - id: "5.101.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "（WWWF／TTTF）（p、q）：p 或 q，即 p∨q。"
        interpretation_zh_tw: "只有 p、q 同假時輸出為假，所以該列是包容選言。"
      - id: "5.101.h"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "（FFWW／FFTT）（p、q）：非 q，即 ~q。"
        interpretation_zh_tw: "輸出只隨 q 的真假改變，q 假時為真，故等值於否定 q。"
      - id: "5.101.i"
        alignment:
          de: [8]
          en_ogden_ramsey_1922: [8]
        translation_zh_tw: "（FWFW／FTFT）（p、q）：非 p，即 ~p。"
        interpretation_zh_tw: "輸出只隨 p 的真假改變，p 假時為真，故等值於否定 p。"
      - id: "5.101.j"
        alignment:
          de: [9]
          en_ogden_ramsey_1922: [9]
        translation_zh_tw: "（FWWF／FTTF）（p、q）：p 或 q，但不可兩者皆真。"
        interpretation_zh_tw: "恰有一項為真時輸出為真，這一列表示互斥選言。"
      - id: "5.101.k"
        alignment:
          de: [10]
          en_ogden_ramsey_1922: [10]
        translation_zh_tw: "（WFFW／TFFT）（p、q）：若 p 則 q，且若 q 則 p，即 p≡q。"
        interpretation_zh_tw: "p、q 真值相同時輸出為真，所以該列表示等值。"
      - id: "5.101.l"
        alignment:
          de: [11]
          en_ogden_ramsey_1922: [11]
        translation_zh_tw: "（WFWF／TFTF）（p、q）：命題 p。"
        interpretation_zh_tw: "四格輸出逐格重現 p 的真值，故此真值函數就是 p 本身。"
      - id: "5.101.m"
        alignment:
          de: [12]
          en_ogden_ramsey_1922: [12]
        translation_zh_tw: "（WWFF／TTFF）（p、q）：命題 q。"
        interpretation_zh_tw: "四格輸出逐格重現 q 的真值，故此真值函數就是 q 本身。"
      - id: "5.101.n"
        alignment:
          de: [13]
          en_ogden_ramsey_1922: [13]
        translation_zh_tw: "（FFFW／FFFT）（p、q）：p、q 皆非，即 ~p．~q 或 p｜q。"
        interpretation_zh_tw: "只有兩者同假時輸出為真，表示共同否定。"
      - id: "5.101.o"
        alignment:
          de: [14]
          en_ogden_ramsey_1922: [14]
        translation_zh_tw: "（FFWF／FFTF）（p、q）：p 且非 q，即 p．~q。"
        interpretation_zh_tw: "只有 p 真且 q 假的配置被保留。"
      - id: "5.101.p"
        alignment:
          de: [15]
          en_ogden_ramsey_1922: [15]
        translation_zh_tw: "（FWFF／FTFF）（p、q）：q 且非 p，即 q．~p。"
        interpretation_zh_tw: "只有 q 真且 p 假的配置被保留。"
      - id: "5.101.q"
        alignment:
          de: [16]
          en_ogden_ramsey_1922: [16]
        translation_zh_tw: "（WFFF／TFFF）（p、q）：q 且 p，即 q．p。"
        interpretation_zh_tw: "只有 p、q 同真時輸出為真，這一列表示合取。"
      - id: "5.101.r"
        alignment:
          de: [17]
          en_ogden_ramsey_1922: [17]
        translation_zh_tw: "（FFFF）（p、q）：矛盾式；p 且非 p，並且 q 且非 q。"
        interpretation_zh_tw: "四種配置的輸出全為假，所以矛盾式排除全部可能性。"
      - id: "5.101.s"
        alignment:
          de: [18]
          en_ogden_ramsey_1922: [18]
        translation_zh_tw: "凡真值引數中使該命題為真的真值可能性，我稱為它的「真值根據」。"
        interpretation_zh_tw: "一個命題由表中哪些輸入配置得到真值所界定，那些配置就是其真值根據。"
