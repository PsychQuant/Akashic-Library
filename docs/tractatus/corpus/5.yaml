  - id: "5.631"
    parent: "5.63"
    texts:
      de:
        - "Das denkende, vorstellende, Subjekt gibt es nicht."
        - "Wenn ich ein Buch schriebe „Die Welt, wie ich sie vorfand“, so wäre darin auch über meinen Leib zu berichten und zu sagen, welche Glieder meinem Willen unterstehen und welche nicht etc., dies ist nämlich eine Methode, das Subjekt zu isolieren, oder vielmehr zu zeigen, dass es in einem wichtigen Sinne kein Subjekt gibt: Von ihm allein nämlich könnte in diesem Buche *nicht* die Rede sein. –"
      en_ogden_ramsey_1922:
        - "The thinking, presenting subject; there is no such thing."
        - "If I wrote a book “The world as I found it”, I should also have therein to report on my body and say which members obey my will and which do not, etc."
        - "This then would be a method of isolating the subject or rather of showing that in an important sense there is no subject: that is to say, of it alone in this book mention could *not* be made."
    edition_references:
      en_pears_mcguinness: "5.631"
    segments:
      - id: "5.631.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "思考、表象的主體並不存在。"
        interpretation_zh_tw: "這裡否定的是可在世界內被描述為額外對象的形上主體，不是否定經驗中的人。"
      - id: "5.631.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1, 2]
        translation_zh_tw: "若我寫一本《我所發現的世界》，其中也必須報告我的身體，說明哪些肢體服從我的意志、哪些不服從等等。這便是隔離主體的方法，或者更確切地說，是顯示在一個重要意義上並沒有主體：唯獨它不能在這本書中被提及。"
        interpretation_zh_tw: "德文以一個長句、英文以兩句表達同一論證：世界描述可收錄身體與意志關係，卻無法把觀看整體的主體列為其中一項。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.631 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：這裡否定的是可在世界內被描述為一個額外簡單對象的形上主體，不是否定經驗中的人；世界描述可以收錄身體與意志關係，卻找不到負責觀看整體的主體本身；它是描述的界線，而非描述項目。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

