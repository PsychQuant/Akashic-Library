  - id: "5.5542"
    parent: "5.554"
    texts:
      de:
        - "Dürfen wir denn aber überhaupt so fragen?"
        - "Können wir eine Zeichenform aufstellen und nicht wissen, ob ihr etwas entsprechen könne?"
        - "Hat die Frage einen Sinn: Was muss *sein*, damit etwas der-Fall-sein kann?"
      en_ogden_ramsey_1922:
        - "May we then ask this at all?"
        - "Can we set out a sign form and not know whether anything can correspond to it?"
        - "Has the question sense: what must there *be* in order that anything can be the case?"
    edition_references:
      en_pears_mcguinness: "5.5542"
    segments:
      - id: "5.5542.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們究竟能不能這樣問？"
        interpretation_zh_tw: "反問先檢查問題本身是否形成有意義的符號要求。"
      - id: "5.5542.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "能否先提出一種記號形式，卻不知道有沒有任何東西能與它對應？"
        interpretation_zh_tw: "若完全不知符號的可能應用，所造形式是否仍為記號便成疑問。"
      - id: "5.5542.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "「必須有什麼，才可能有任何事情成立？」這個問題有意義嗎？"
        interpretation_zh_tw: "問題試圖從邏輯之外指定世界的必要材料，因而觸及可問性的界線。"
    project_relations:
