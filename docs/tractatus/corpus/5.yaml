  - id: "5.5151"
    parent: "5.515"
    texts:
      de:
        - "Muss das Zeichen des negativen Satzes mit dem Zeichen des positiven gebildet werden?"
        - "Warum sollte man den negativen Satz nicht durch eine negative Tatsache ausdrücken können."
        - "(Etwa: Wenn „*a*“ nicht in einer bestimmten Beziehung zu „*b*“ steht, könnte das ausdrücken, dass *aRb* nicht der Fall ist.)"
        - "Aber auch hier ist ja der negative Satz indirekt durch den positiven gebildet."
        - "Der positive *Satz* muss die Existenz des negativen *Satzes* voraussetzen und umgekehrt."
      en_ogden_ramsey_1922:
        - "Must the sign of the negative proposition be constructed by means of the sign of the positive?"
        - "Why should one not be able to express the negative proposition by means of a negative fact?"
        - "(Like: if “*a*” does not stand in a certain relation to “*b*”, it could express that “*aRb*” is not the case.)"
        - "But here also the negative proposition is indirectly constructed with the positive."
        - "The positive *proposition* must presuppose the existence of the negative *proposition* and conversely."
    edition_references:
      en_pears_mcguinness: "5.5151"
    segments:
      - id: "5.5151.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "否定命題的記號一定要藉肯定命題的記號建構嗎？"
        interpretation_zh_tw: "問題探查否定是否必須在字形上直接包含被否定的肯定式。"
      - id: "5.5151.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "為何不能藉一項否定事實表達否定命題？"
        interpretation_zh_tw: "即使改用世界中的缺席配置作記號，仍須說明其否定功能。"
      - id: "5.5151.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（例如以「a」不和「b」處於某關係，表達「aRb」不成立。）"
        interpretation_zh_tw: "這個例子仍以肯定關係 aRb 作為辨認其缺席的基準。"
      - id: "5.5151.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "但即使如此，否定命題仍間接由肯定命題建構。"
        interpretation_zh_tw: "所謂否定事實只有相對於某個肯定配置才具有否定作用。"
      - id: "5.5151.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "肯定命題必須預設否定命題的存在，反之亦然。"
        interpretation_zh_tw: "兩者共同切分同一可能性空間，不能各自成為互不相干的符號系統。"
