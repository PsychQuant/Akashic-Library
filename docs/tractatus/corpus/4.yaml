  - id: "4.0312"
    parent: "4.031"
    texts:
      de:
        - "Die Möglichkeit des Satzes beruht auf dem Prinzip der Vertretung von Gegenständen durch Zeichen."
        - "Mein Grundgedanke ist, dass die „logischen Konstanten“ nicht vertreten."
        - "Dass sich die *Logik* der Tatsachen nicht vertreten lässt."
      en_ogden_ramsey_1922:
        - "The possibility of propositions is based upon the principle of the representation of objects by signs."
        - "My fundamental thought is that the “logical constants” do not represent."
        - "That the *logic* of the facts cannot be represented."
