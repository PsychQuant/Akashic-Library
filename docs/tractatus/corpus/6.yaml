  - id: "6.1271"
    parent: "6.127"
    texts:
      de:
        - "Es ist klar, dass die Anzahl der „logischen Grundgesetze“ willkürlich ist, denn man könnte die Logik ja aus Einem Grundgesetz ableiten, indem man einfach z. B. aus Freges Grundgesetzen das logische Produkt bildet."
        - "(Frege würde vielleicht sagen, dass dieses Grundgesetz nun nicht mehr unmittelbar einleuchte."
        - "Aber es ist merkwürdig, dass ein so exakter Denker wie Frege sich auf den Grad des Einleuchtens als Kriterium des logischen Satzes berufen hat.)"
      en_ogden_ramsey_1922:
        - "It is clear that the number of “primitive propositions of logic” is arbitrary, for we could deduce logic from one primitive proposition by simply forming, for example, the logical product of Frege’s primitive propositions."
        - "(Frege would perhaps say that this would no longer be immediately self-evident."
        - "But it is remarkable that so exact a thinker as Frege should have appealed to the degree of self-evidence as the criterion of a logical proposition.)"
    edition_references:
      en_pears_mcguinness: "6.1271"
    segments:
      - id: "6.1271.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯基本法則的數量顯然是任意的，因為可把弗雷格各基本法則取邏輯積，從一條法則導出整套邏輯。"
        interpretation_zh_tw: "公理如何分組是記法與演算選擇。"
      - id: "6.1271.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（弗雷格或許會說，這條法則不再直接自明。"
        interpretation_zh_tw: "第二句提出可能的自明性反對。"
      - id: "6.1271.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "但如此精確的思想家竟訴諸自明程度作為邏輯命題的判準，實在奇怪。）"
        interpretation_zh_tw: "最後拒絕以主觀自明感取代形式判準。"
    project_relations:
