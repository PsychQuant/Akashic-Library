    texts:
      de:
        - "Der Name bedeutet den Gegenstand."
        - "Der Gegenstand ist seine Bedeutung."
        - "(„*A*“ ist dasselbe Zeichen wie „*A*“.)"
      en_ogden_ramsey_1922:
