        - "– Der Zusammenhang von Wissen und Gewusstem, ist der der logischen Notwendigkeit."
        - "\\(„A weiss, dass *p* der Fall ist“ ist sinnlos, wenn *p* eine Tautologie ist.)"
      en_ogden_ramsey_1922:
        - "The freedom of the will consists in the fact that future actions cannot be known now."
        - "We could only know them if causality were an *inner* necessity, like that of logical deduction."
        - "—The connexion of knowledge and what is known is that of logical necessity."
        - "\\(“A knows that *p* is the case” is senseless if *p* is a tautology.)"
