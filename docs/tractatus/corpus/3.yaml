  - id: "3.3421"
    parent: "3.342"
    texts:
      de:
        - "Eine besondere Bezeichnungsweise mag unwichtig sein, aber wichtig ist es immer, dass diese eine *mögliche* Bezeichnungsweise ist."
        - "Und so verhält es sich in der Philosophie überhaupt: Das Einzelne erweist sich immer wieder als unwichtig, aber die Möglichkeit jedes Einzelnen gibt uns einen Aufschluss über das Wesen der Welt."
      en_ogden_ramsey_1922:
        - "A particular method of symbolizing may be unimportant, but it is always important that this is a *possible* method of symbolizing."
        - "And this happens as a rule in philosophy: The single thing proves over and over again to be unimportant, but the possibility of every single thing reveals something about the nature of the world."
    edition_references:
      en_pears_mcguinness: "3.3421"
    segments:
      - id: "3.3421.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "某種特定指示方式也許不重要，但它必須是一種可能的指示方式，這點總是重要。"
        interpretation_zh_tw: "哲學關注的不只是選了哪個字形，而是該記法是否能在邏輯結構中一致運作。"
      - id: "3.3421.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "哲學中通常也是如此：個別事物一再顯得不重要，但每個個別事物的可能性會揭示世界本質的某些面向。"
        interpretation_zh_tw: "由個例轉向其可能條件，才讓分析觸及世界可被表現的形式，而不是蒐集偶然特徵。"
    project_relations:
      - status: not_applicable
