  - id: "3.321"
    parent: "3.32"
    texts:
      de:
        - "Zwei verschiedene Symbole können also das Zeichen (Schriftzeichen oder Lautzeichen etc.) miteinander gemein haben – sie bezeichnen dann auf verschiedene Art und Weise."
      en_ogden_ramsey_1922:
        - "Two different symbols can therefore have the sign (the written sign or the sound sign) in common—they then signify in different ways."
    edition_references:
      en_pears_mcguinness: "3.321"
    segments:
      - id: "3.321.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "因此，兩個不同的符號可以共有同一個記號（書寫記號、聲音記號等）——它們此時以不同方式指示。"
        interpretation_zh_tw: "相同字形或聲音不保證相同符號；所屬命題脈絡與指示方式可以使其成為不同符號。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.321 關於表達式、符號、用法與邏輯句法的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.321 直接主張「因此，兩個不同的符號可以共有同一個記號（書寫記號、聲音記號等）——它們此時以不同方式指示。」，本卷並將其限制解讀為「相同字形或聲音不保證相同符號；所屬命題脈絡與指示方式可以使其成為不同符號。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
