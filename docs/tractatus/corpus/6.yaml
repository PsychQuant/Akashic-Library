          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "等式表達兩式的可替換性；依等式以一式替換另一式，便可從已有等式進到新等式。"
        interpretation_zh_tw: "推演保持指涉相等，不是改寫世界中的對象。"
