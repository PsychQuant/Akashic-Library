  - id: "4.05"
    parent: "4"
    texts:
      de:
        - "Die Wirklichkeit wird mit dem Satz verglichen."
      en_ogden_ramsey_1922:
        - "Reality is compared with the proposition."
    edition_references:
      en_pears_mcguinness: "4.05"
    segments:
      - id: "4.05.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "現實與命題互相比較。"
        interpretation_zh_tw: "真值來自命題所描繪的可能情形與現實的比較；理解、儲存或找到命題都不是這次比較本身。"
    project_relations:
      - status: partial
        mode: semantic_operation
        claim_zh_tw: "Akashic 已以 context-bound evaluate(in:) 把 bounded atom／not expression 與固定 store identity、content revision 及 valid day 的不可變館藏 snapshot 比較，並以 structured valuation、canonical author-list witness 與 recursive EvidenceTrace 保存比較依據。"
        rationale_zh_tw: "4.05 要求把命題與現實比較。現行 evaluator 已執行 predicate-specific model comparison：authored 可用綁定 work UUID 與 exact ordered authors 的 canonical witness 證成窄幅排除；affiliated 依 valid day 評估完整時間區段；否定只反轉 determinate truth 並逐層保留 operand trace、context 與 quarantine。然而 snapshot 仍是可重播的館藏模型，不是全部現實；沒有相應 witness 的作者缺席及隸屬缺席仍是 undetermined，因此維持 partial。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "## 3. 最簡單的反例：搜尋到一個句子，不等於句子是真的"
            note_zh_tw: "此節用可命中但為假的句子證明 retrieval 不等於 truth。"
          - path: "Sources/AkashicStoreIO/LibrarySnapshot.swift"
            kind: symbol
            locator: "loadSnapshot"
            note_zh_tw: "`loadSnapshot()` 只接受穩定 captured bytes，並以同一份 bytes 解碼館藏內容及計算 store revision。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "ValuationContext"
            note_zh_tw: "`ValuationContext` 綁定不可拆配的 snapshot identity、revision、model 與明示 valid day。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "evaluate"
            note_zh_tw: "`evaluate(in:)` 驗證完整 expression，只投射 atom 一次，再逐層建立 negation valuation 與 recursive trace。"
          - path: "Sources/AkashicCore/AuthorshipCompleteness.swift"
            kind: symbol
            locator: "AuthorListCompletenessWitness"
            note_zh_tw: "`AuthorListCompletenessWitness` 以 work UUID、exact ordered author snapshot、fingerprint 與封閉 provenance bundle 授權窄幅負向比較。"
          - path: "Tests/AkashicKitTests/LibrarySnapshotTests.swift"
            kind: test
            locator: "testThreePassSlidingCaptureAcceptsAThenBThenBAndDecodesAcceptedBytes"
            note_zh_tw: "測試確認 revision 與 model 都來自同一份穩定 capture，避免 hash／decode 二讀造成拆配。"
          - path: "Tests/AkashicPropositionTests/ContextValuationTests.swift"
