  - id: "6.36111"
    parent: "6.3611"
    texts:
      de:
        - "Das Kant’sche Problem von der rechten und linken Hand, die man nicht zur Deckung bringen kann, besteht schon in der Ebene, ja im eindimensionalen Raum, wo die beiden kongruenten Figuren *a* und *b* auch nicht zur Deckung gebracht werden können, ohne aus diesem Raum herausbewegt zu werden."
        - "Rechte und linke Hand sind tatsächlich vollkommen kongruent."
        - "Und dass man sie nicht zur Deckung bringen kann, hat damit nichts zu tun."
        - "![](images/330px-TLP_6.36111.png)\\"
        - "Den rechten Handschuh könnte man an die linke Hand ziehen, wenn man ihn im vierdimensionalen Raum umdrehen könnte."
      en_ogden_ramsey_1922:
        - "The Kantian problem of the right and left hand which cannot be made to cover one another already exists in the plane, and even in one-dimensional space; where the two congruent figures *a* and *b* cannot be made to cover one another without moving them out of this space."
        - "The right and left hand are in fact completely congruent."
        - "And the fact that they cannot be made to cover one another has nothing to do with it."
        - "![](images/330px-TLP_6.36111.png)\\"
        - "A right-hand glove could be put on a left hand if it could be turned round in four-dimensional space."
    edition_references:
      en_pears_mcguinness: "6.36111"
    segments:
      - id: "6.36111.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "康德的左右手問題在平面甚至一維空間中便已出現：全等圖形若不移出該空間，也不能重合。"
        interpretation_zh_tw: "第一句把問題定位為空間內可重合性。"
      - id: "6.36111.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "左右手其實完全全等。"
        interpretation_zh_tw: "全等只比較形狀尺度。"
      - id: "6.36111.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "它們不能重合，與全等與否無關。"
        interpretation_zh_tw: "可否重合還涉及定向與允許的運動。"
      - id: "6.36111.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "來源圖示呈現這種定向差異。"
        interpretation_zh_tw: "圖像是幾何說明，不是另一項論證前提。"
      - id: "6.36111.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "右手手套若能在四維空間中翻轉，就可套到左手上。"
        interpretation_zh_tw: "四維翻轉展示增加維度如何解除定向障礙，與資料欄位交換無關。"
