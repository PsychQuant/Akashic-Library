        - "Einen Komplex wahrnehmen, heisst, wahrnehmen, dass sich seine Bestandteile so und so zu einander verhalten."
        - "Dies erklärt wohl auch, dass man die Figur\n![](images/250px-TLP_5.5423.png)\\\nauf zweierlei Art als Würfel sehen kann; und alle ähnlichen Erscheinungen."
        - "Denn wir sehen eben wirklich zwei verschiedene Tatsachen."
        - "\\(Sehe ich erst auf die Ecken *a* und nur flüchtig auf *b*, so erscheint *a* vorne; und umgekehrt.)"
      en_ogden_ramsey_1922:
        - "To perceive a complex means to perceive that its constituents are combined in such and such a way."
        - "This perhaps explains that the figure\n![](images/250px-TLP_5.5423.png)\\\ncan be seen in two ways as a cube; and all similar phenomena."
        - "For we really see two different facts."
        - "\\(If I fix my eyes first on the corners *a* and only glance at *b*, *a* appears in front and *b* behind, and vice versa.)"
    edition_references:
      en_pears_mcguinness: "5.5423"
    segments:
      - id: "5.5423.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "知覺一個複合體，就是知覺其各部分以如此這般的方式組合。"
        interpretation_zh_tw: "知覺複合物不只接收成分，還呈現成分之間的特定配置。"
      - id: "5.5423.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這或許也能說明圖中的立方體可用兩種方式觀看，以及所有類似現象。"
        interpretation_zh_tw: "同一組紙面筆畫可依不同組合方式，被知覺為兩種空間配置。"
      - id: "5.5423.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "因為我們實際看見的是兩個不同事實。"
        interpretation_zh_tw: "知覺轉換改變的是成分被看成如何關聯，而不是單純替同一事實換名稱。"
      - id: "5.5423.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（若我先注視角 a，只瞥角 b，a 看來在前；反過來亦然。）"
        interpretation_zh_tw: "注意方向使同一圖形的前後配置互換，具體示範兩種知覺事實。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.5423 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：知覺複合物不只接收成分，還呈現成分的特定配置；同一筆畫可投射為兩種不同空間配置，因此改變的是所見事實，而非紙面元素；注意方向使同一圖形的前後配置互換，具體示範兩種知覺事實。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
