        translation_zh_tw: "雖然一個命題只可確定邏輯空間中的一個位置，整個邏輯空間卻必須已由它一併給出。"
        interpretation_zh_tw: "理解一個位置要求同時掌握它與其他可能位置的系統關係，不能把命題意義孤立成單點。"
