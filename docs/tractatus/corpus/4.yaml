  - id: "4.0141"
    parent: "4.014"
    texts:
      de:
        - "Dass es eine allgemeine Regel gibt, durch die der Musiker aus der Partitur die Symphonie entnehmen kann, durch welche man aus der Linie auf der Grammophonplatte die Symphonie und nach der ersten Regel wieder die Partitur ableiten kann, darin besteht eben die innere Ähnlichkeit dieser scheinbar so ganz verschiedenen Gebilde."
        - "Und jene Regel ist das Gesetz der Projektion, welches die Symphonie in die Notensprache projiziert."
        - "Sie ist die Regel der Übersetzung der Notensprache in die Sprache der Grammophonplatte."
      en_ogden_ramsey_1922:
        - "In the fact that there is a general rule by which the musician is able to read the symphony out of the score, and that there is a rule by which one could reconstruct the symphony from the line on a gramophone record and from this again—by means of the first rule—construct the score, herein lies the internal similarity between these things which at first sight seem to be entirely different."
        - "And the rule is the law of projection which projects the symphony into the language of the musical score."
        - "It is the rule of translation of this language into the language of the gramophone record."
    edition_references:
      en_pears_mcguinness: "4.0141"
    segments:
      - id: "4.0141.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "有一條普遍規則，使音樂家能從總譜讀出交響曲；也能依規則從唱片紋路重建交響曲，再按第一條規則重建總譜。這正是這些外觀迥異構造之間的內在相似。"
        interpretation_zh_tw: "內在相似由可重複的往返轉換成立，不取決於總譜、聲音與唱片紋路在材質或外觀上相像。"
      - id: "4.0141.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這條規則就是投射律，它把交響曲投射為樂譜語言。"
        interpretation_zh_tw: "投射律指定哪些結構關係在媒介轉換中必須保存，才使樂譜能表現交響曲。"
      - id: "4.0141.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "它也是把樂譜語言翻譯成唱片語言的規則。"
        interpretation_zh_tw: "此處的翻譯是兩套表現系統之間的規則化轉換，不是逐字替換；同一內容可有不同載體。"
    project_relations:
      - status: analogy_only
        mode: semantic_operation
        claim_zh_tw: "Akashic 以明確 projection rule 說明不同載體如何保存一項主張的相關結構。"
