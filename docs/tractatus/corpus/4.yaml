  - id: "4.463"
    parent: "4.46"
    texts:
      de:
        - "Die Wahrheitsbedingungen bestimmen den Spielraum, der den Tatsachen durch den Satz gelassen wird."
        - "\\(Der Satz, das Bild, das Modell, sind im negativen Sinne wie ein fester Körper, der die Bewegungsfreiheit der anderen beschränkt; im positiven Sinne, wie der von fester Substanz begrenzte Raum, worin ein Körper Platz hat.)"
        - "Die Tautologie lässt der Wirklichkeit den ganzen – unendlichen – logischen Raum; die Kontradiktion erfüllt den ganzen logischen Raum und lässt der Wirklichkeit keinen Punkt."
        - "Keine von beiden kann daher die Wirklichkeit irgendwie bestimmen."
      en_ogden_ramsey_1922:
        - "The truth-conditions determine the range, which is left to the facts by the proposition."
        - "\\(The proposition, the picture, the model, are in a negative sense like a solid body, which restricts the free movement of another: in a positive sense, like the space limited by solid substance, in which a body may be placed.)"
        - "Tautology leaves to reality the whole infinite logical space; contradiction fills the whole logical space and leaves no point to reality."
        - "Neither of them, therefore, can in any way determine reality."
    edition_references:
      en_pears_mcguinness: "4.463"
    segments:
      - id: "4.463.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "真值條件決定命題留給事實的活動範圍。"
        interpretation_zh_tw: "truth condition 以允許或排除可能情形限制現實，這個限制範圍構成命題的描述內容。"
      - id: "4.463.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（命題、圖像與模型在負面意義上像限制他物活動自由的實體；在正面意義上，像由堅固物質圍出的空間，物體可置於其中。）"
        interpretation_zh_tw: "空間比喻同時說明負面排除與正面容許；命題像邊界，不是替世界新增一個物體。"
      - id: "4.463.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "重言式把整個無限邏輯空間留給現實；矛盾式填滿整個邏輯空間，不留任何點給現實。"
        interpretation_zh_tw: "重言式完全不限制邏輯空間，矛盾式完全堵住邏輯空間，兩者都是失去選擇性的邊界情況。"
      - id: "4.463.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "因此，兩者都不能以任何方式決定現實。"
        interpretation_zh_tw: "因為沒有在可能情形間作有內容的切分，兩個極端都不能決定現實實際如何。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.463 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：一般命題以允許與排除限制現實；tautology 沒有限制，contradiction 沒有容許，兩者皆未指定現實如何。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.464"
    parent: "4.46"
    texts:
      de:
        - "Die Wahrheit der Tautologie ist gewiss, des Satzes möglich, der Kontradiktion unmöglich."
        - "\\(Gewiss, möglich, unmöglich: Hier haben wir das Anzeichen jener Gradation, die wir in der Wahrscheinlichkeitslehre brauchen.)"
      en_ogden_ramsey_1922:
        - "The truth of tautology is certain, of propositions possible, of contradiction impossible."
        - "\\(Certain, possible, impossible: here we have an indication of that gradation which we need in the theory of probability.)"
    edition_references:
      en_pears_mcguinness: "4.464"
    segments:
      - id: "4.464.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "重言式之真是確定的，命題之真是可能的，矛盾式之真是不可能的。"
        interpretation_zh_tw: "確定、可能、不可能分別對應重言式、一般命題與矛盾式的模態位置，不是三種證據強度。"
      - id: "4.464.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（確定、可能、不可能：這裡出現機率論所需層次的徵兆。）"
        interpretation_zh_tw: "這三層為機率論預示一個邏輯尺度，但尚未把機率等同於主觀信心或搜尋排名。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.464 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：三種模態由 truth condition 對 valuation 空間的涵蓋程度產生；這不是對事件主觀信心的百分比。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.465"
    parent: "4.46"
    texts:
      de:
        - "Das logische Produkt einer Tautologie und eines Satzes sagt dasselbe, wie der Satz."
        - "Also ist jenes Produkt identisch mit dem Satz."
        - "Denn man kann das Wesentliche des Symbols nicht ändern, ohne seinen Sinn zu ändern."
      en_ogden_ramsey_1922:
        - "The logical product of a tautology and a proposition says the same as the proposition."
        - "Therefore that product is identical with the proposition."
        - "For the essence of the symbol cannot be altered without altering its sense."
    edition_references:
      en_pears_mcguinness: "4.465"
    segments:
      - id: "4.465.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一個重言式與一個命題的邏輯積，所說的與該命題相同。"
        interpretation_zh_tw: "與重言式合取不排除任何額外 valuation，所以合取式保留原命題的全部 truth condition。"
      - id: "4.465.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因此，這個積與命題同一。"
        interpretation_zh_tw: "兩式雖字面不同，卻因說出相同內容而在邏輯上同一。"
      - id: "4.465.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "因為若不改變符號的意義，就不能改變符號的本質。"
        interpretation_zh_tw: "符號的本質繫於其 sense；若真值條件未變，增加冗餘重言式不會產生新符號功能。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.465 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：與無條件真式合取不改變 truth condition；邏輯同一性依 sense 保持，而非字面符號完全相同。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.466"
    parent: "4.46"
    texts:
      de:
        - "Einer bestimmten logischen Verbindung von Zeichen entspricht eine bestimmte logische Verbindung ihrer Bedeutungen; *jede beliebige* Verbindung entspricht nur den unverbundenen Zeichen."
        - "Das heisst, Sätze die für jede Sachlage wahr sind, können überhaupt keine Zeichenverbindungen sein, denn sonst könnten ihnen nur bestimmte Verbindungen von Gegenständen entsprechen."
        - "\\(Und keiner logischen Verbindung entspricht *keine* Verbindung der Gegenstände.)"
        - "Tautologie und Kontradiktion sind die Grenzfälle der Zeichenverbindung, nämlich ihre Auflösung."
      en_ogden_ramsey_1922:
        - "To a definite logical combination of signs corresponds a definite logical combination of their meanings; *every arbitrary* combination only corresponds to the unconnected signs."
        - "That is, propositions which are true for every state of affairs cannot be combinations of signs at all, for otherwise there could only correspond to them definite combinations of objects."
        - "\\(And to no logical combination corresponds *no* combination of the objects.)"
        - "Tautology and contradiction are the limiting cases of the combinations of symbols, namely their dissolution."
    edition_references:
      en_pears_mcguinness: "4.466"
    segments:
      - id: "4.466.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "特定的符號邏輯聯結，對應特定的意義邏輯聯結；任意聯結只對應未聯結的符號。"
        interpretation_zh_tw: "有描述內容的符號聯結必須對應特定意義聯結；任意聯結因未作選擇，只留下未特定結合的成分。"
      - id: "4.466.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "也就是說，對每種情形都真的命題根本不可能是符號聯結，否則它只會對應特定的對象聯結。"
        interpretation_zh_tw: "若一式在每種情形皆真，它不能描繪某個特定對象聯結，否則便會排除不符合該聯結的情形。"
      - id: "4.466.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（沒有任何邏輯聯結，則不對應任何對象聯結。）"
        interpretation_zh_tw: "完全沒有邏輯聯結時，也沒有相應的特定對象聯結；表現關係不會憑空補上。"
      - id: "4.466.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "重言式與矛盾式是符號聯結的極限情形，也就是聯結的消解。"
        interpretation_zh_tw: "重言式與矛盾式把聯結推到全容許或全排除的極限，因而使原本的特定聯結消解。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.466 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：有描述內容的符號聯結必須挑出特定對象配置；任意真或全無可能的極端式使這種特定表現關係消失。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.4661"
    parent: "4.466"
    texts:
      de:
        - "Freilich sind auch in der Tautologie und Kontradiktion die Zeichen noch mit einander verbunden, d. h. sie stehen in Beziehungen zu einander, aber diese Beziehungen sind bedeutungslos, dem *Symbol* unwesentlich."
      en_ogden_ramsey_1922:
        - "Of course the signs are also combined with one another in the tautology and contradiction, *i.e.* they stand in relations to one another, but these relations are meaningless, unessential to the *symbol*."
    edition_references:
      en_pears_mcguinness: "4.4661"
    segments:
      - id: "4.4661.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "當然，在重言式與矛盾式中，符號仍彼此聯結，也就是仍處於關係中；但這些關係沒有意義，對 symbol 並非本質。"
        interpretation_zh_tw: "表面句法關係仍在，不代表它們構成描述現實所需的本質 symbol 關係；需區分 sign 的外觀與 symbol 的有意義用途。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.4661 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：表面句法關係仍在，不代表它們構成描述現實所需的本質 symbol 關係；需區分 sign 的外觀與 symbol 的有意義用途。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.5"
    parent: "4"
    texts:
      de:
        - "Nun scheint es möglich zu sein, die allgemeinste Satzform anzugeben: das heisst, eine Beschreibung der Sätze *irgendeiner* Zeichensprache zu geben, so dass jeder mögliche Sinn durch ein Symbol, auf welches die Beschreibung passt, ausgedrückt werden kann, und dass jedes Symbol, worauf die Beschreibung passt, einen Sinn ausdrücken kann, wenn die Bedeutungen der Namen entsprechend gewählt werden."
        - "Es ist klar, dass bei der Beschreibung der allgemeinsten Satzform *nur* ihr Wesentliches beschrieben werden darf, – sonst wäre sie nämlich nicht die allgemeinste."
        - "Dass es eine allgemeine Satzform gibt, wird dadurch bewiesen, dass es keinen Satz geben darf, dessen Form man nicht hätte voraussehen (d. h. konstruieren) können."
        - "Die allgemeine Form des Satzes ist: Es verhält sich so und so."
      en_ogden_ramsey_1922:
        - "Now it appears to be possible to give the most general form of proposition; *i.e.* to give a description of the propositions of some one sign language, so that every possible sense can be expressed by a symbol, which falls under the description, and so that every symbol which falls under the description can express a sense, if the meanings of the names are chosen accordingly."
        - "It is clear that in the description of the most general form of proposition *only* what is essential to it may be described—otherwise it would not be the most general form."
        - "That there is a general form is proved by the fact that there cannot be a proposition whose form could not have been foreseen (*i.e.* constructed)."
        - "The general form of proposition is: Such and such is the case."
    edition_references:
      en_pears_mcguinness: "4.5"
    segments:
      - id: "4.5.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "現在看來，可以給出最一般的命題形式：也就是描述任一符號語言的命題，使每個可能意義都能由符合描述的符號表達，而且只要適當選定名稱意義，每個符合描述的符號都能表達意義。"
        interpretation_zh_tw: "最一般命題形式要描述任何符號語言中可表達 sense 的共同構造條件，而不是列出既有語句。"
      - id: "4.5.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "很清楚，描述最一般命題形式時，只能描述其本質；否則它便不是最一般。"
        interpretation_zh_tw: "若描述加入某一類命題的偶然特徵，就會排除其他可能形式，因而失去「最一般」資格。"
      - id: "4.5.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "一般命題形式之所以存在，是因為不能有任何命題，其形式無法被預見（亦即構造）。"
        interpretation_zh_tw: "任何命題形式都必須可依規則構造；完全不可預見的形式也就無法成為可理解命題。"
      - id: "4.5.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "命題的一般形式是：情形如此這般。"
        interpretation_zh_tw: "「情形如此這般」保留命題的核心角色：表現某種可能情形成立，而不預定具體內容。"
    project_relations:
      - status: intentional_nonconformance
        mode: declared_nonconformance
        claim_zh_tw: "Akashic 刻意不把任何現行 schema 宣稱為所有有意義命題的一般形式。"
        rationale_zh_tw: "專案 schema 是領域限定且可演化的資料契約；它無法由此取得涵蓋任一符號語言所有可能 sense 的普遍性。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 2. logical picture 的最小結構"
            note_zh_tw: "此節只提出 picture 的最小結構條件，並未把任何現行 schema 宣稱為所有可能命題的一般形式。"
    history: []

  - id: "4.51"
    parent: "4.5"
    texts:
      de:
        - "Angenommen, mir wären *alle* Elementarsätze gegeben: Dann lässt sich einfach fragen: welche Sätze kann ich aus ihnen bilden."
        - "Und das sind *alle* Sätze und *so* sind sie begrenzt."
      en_ogden_ramsey_1922:
        - "Suppose *all* elementary propositions were given me: then we can simply ask: what propositions I can build out of them."
        - "And these are *all* propositions and *so* are they limited."
    edition_references:
      en_pears_mcguinness: "4.51"
    segments:
      - id: "4.51.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "假定所有基本命題都已給我，那麼可以直接問：我能由它們構成哪些命題？"
        interpretation_zh_tw: "給定全部基本命題後，問題轉為哪些真值函數式可由它們構成，而不是還有哪些句子可從資料庫找到。"
      - id: "4.51.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這些就是全部命題，而且它們的界線也由此確定。"
        interpretation_zh_tw: "全部命題由可構造的組合封閉而得，其界線來自生成規則與基本命題總體。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "Akashic 文件把 query 理解為對一組可能答案的切分與組織。"
        rationale_zh_tw: "這可類比由已給定基本命題詢問可構成命題；但現有查詢沒有完備基本命題總體，也不產生 world-relative truth。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "### 回應：問題是對 logical space 的切分操作"
            note_zh_tw: "此節說明 query 的角色是組織可能答案，而不是自己成為 fact。"
    history: []

  - id: "4.52"
    parent: "4.5"
    texts:
      de:
        - "Die Sätze sind Alles, was aus der Gesamtheit aller Elementarsätze folgt (natürlich auch daraus, dass es die *Gesamtheit aller* ist)."
        - "(So könnte man in gewissem Sinne sagen, dass *alle* Sätze Verallgemeinerungen der Elementarsätze sind.)"
      en_ogden_ramsey_1922:
        - "The propositions are everything which follows from the totality of all elementary propositions (of course also from the fact that it is the *totality of them all*)."
        - "(So, in some sense, one could say, that *all* propositions are generalizations of the elementary propositions.)"
    edition_references:
      en_pears_mcguinness: "4.52"
    segments:
      - id: "4.52.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題就是從所有基本命題的總體所推出的一切（當然也包括從「它確實是全部的總體」這點推出者）。"
        interpretation_zh_tw: "生成全部命題不只需要基本命題成員，還需要其完備總體；若有遺漏，就不能宣稱生成範圍封閉。"
      - id: "4.52.b"
        alignment:
          de: [1]
