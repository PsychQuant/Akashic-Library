    texts:
      de:
        - "Wenn es ein Kausalitätsgesetz gäbe, so könnte es lauten: „Es gibt Naturgesetze“."
        - "Aber freilich kann man das nicht sagen: es zeigt sich."
      en_ogden_ramsey_1922:
        - "If there were a law of causality, it might run: “There are natural laws”."
        - "But that can clearly not be said: it shows itself."
    edition_references:
