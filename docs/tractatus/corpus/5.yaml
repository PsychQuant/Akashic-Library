  - id: "5.152"
    parent: "5.15"
    texts:
      de:
        - "Sätze, welche keine Wahrheitsargumente mit einander gemein haben, nennen wir von einander unabhängig."
        - "Von einander unabhängige Sätze (z. B. irgend zwei Elementarsätze) geben einander die Wahrscheinlichkeit ½."
        - "Folgt *p* aus *q*, so gibt der Satz „*q*“ dem Satz „*p*“ die Wahrscheinlichkeit 1."
        - "Die Gewissheit des logischen Schlusses ist ein Grenzfall der Wahrscheinlichkeit."
        - "\\(Anwendung auf Tautologie und Kontradiktion.)"
      en_ogden_ramsey_1922:
        - "Propositions which have no truth-arguments in common with one another we call independent."
        - "Two elementary propositions give to one another the probability ½."
        - "If *p* follows from *q*, the proposition *q* gives to the proposition *p* the probability 1."
        - "The certainty of logical conclusion is a limiting case of probability."
        - "\\(Application to tautology and contradiction.)"
    edition_references:
      en_pears_mcguinness: "5.152"
    segments:
      - id: "5.152.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "彼此沒有共同真值引數的命題，我們稱為獨立。"
        interpretation_zh_tw: "獨立在此由真值計算所依賴的基本命題不重疊來界定。"
      - id: "5.152.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "兩個彼此獨立的命題（例如任意兩個基本命題）互相賦予的機率是二分之一。"
        interpretation_zh_tw: "一個獨立基本命題為真，不改變另一者在等權真值配置中一真一假的比例。"
      - id: "5.152.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "若 p 由 q 推出，命題 q 賦予命題 p 的機率是 1。"
        interpretation_zh_tw: "所有使 q 為真的配置都使 p 為真，所以 p 在 q 條件下的真值比例為一。"
      - id: "5.152.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "邏輯推論的確定性是機率的一個極限情形。"
        interpretation_zh_tw: "必然後承位於機率尺度的上限，不是另一種與機率全然無關的關係。"
      - id: "5.152.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "（可應用於恆真式與矛盾式。）"
        interpretation_zh_tw: "恆真式與矛盾式分別位於不排除與全排除的極限，需按同一真值根據框架處理。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.152 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：獨立、必然後承與邏輯極限都可由真值根據的比例統一表達。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
