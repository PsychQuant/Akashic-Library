  - id: "3.322"
    parent: "3.32"
    texts:
      de:
        - "Es kann nie das gemeinsame Merkmal zweier Gegenstände anzeigen, dass wir sie mit demselben Zeichen, aber durch zwei verschiedene *Bezeichnungsweisen* bezeichnen."
        - "Denn das Zeichen ist ja willkürlich."
        - "Man könnte also auch zwei verschiedene Zeichen wählen, und wo bliebe dann das Gemeinsame in der Bezeichnung."
      en_ogden_ramsey_1922:
        - "It can never indicate the common characteristic of two objects that we symbolize them with the same signs but by different *methods of symbolizing*."
        - "For the sign is arbitrary."
        - "We could therefore equally well choose two different signs and where then would be what was common in the symbolization."
    edition_references:
      en_pears_mcguinness: "3.322"
    segments:
      - id: "3.322.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們用相同記號、卻以兩種不同的指示方式指示兩個對象，絕不能顯示這兩個對象的共同特徵。"
        interpretation_zh_tw: "共用字形只說明記法選擇，尤其當兩個用法屬於不同符號時，不能反推對象共有性質。"
      - id: "3.322.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因為記號是任意的。"
        interpretation_zh_tw: "可感知載體可以依約定更換，所以它本身不是被指對象之內在共同性的證據。"
      - id: "3.322.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "我們同樣可以選兩個不同記號，那麼指示中的共同之處又會在哪裡？"
        interpretation_zh_tw: "替換字形而不改變符號功能的思想實驗，逼使共同性轉向指示方式與結構來說明。"
