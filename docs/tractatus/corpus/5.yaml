      de:
        - "Frege sagt: Jeder rechtmässig gebildete Satz muss einen Sinn haben; und ich sage: Jeder mögliche Satz ist rechtmässig gebildet, und wenn er keinen Sinn hat, so kann das nur daran liegen, dass wir einigen seiner Bestandteile keine *Bedeutung* gegeben haben."
        - "\\(Wenn wir auch glauben, es getan zu haben.)"
        - "So sagt „Sokrates ist identisch“ darum nichts, weil wir dem Wort „identisch“ als *Eigenschaftswort keine* Bedeutung gegeben haben."
        - "Denn, wenn es als Gleichheitszeichen auftritt, so symbolisiert es auf ganz andere Art und Weise – die bezeichnende Beziehung ist eine andere, – also ist auch das Symbol in beiden Fällen ganz verschieden; die beiden Symbole haben nur das Zeichen zufällig miteinander gemein."
      en_ogden_ramsey_1922:
        - "Frege says: Every legitimately constructed proposition must have a sense; and I say: Every possible proposition is legitimately constructed, and if it has no sense this can only be because we have given no *meaning* to some of its constituent parts."
        - "\\(Even if we believe that we have done so.)"
        - "Thus “Socrates is identical” says nothing, because we have given *no* meaning to the word “identical” as *adjective*."
        - "For when it occurs as the sign of equality it symbolizes in an entirely different way—the symbolizing relation is another—therefore the symbol is in the two cases entirely different; the two symbols have the sign in common with one another only by accident."
    edition_references:
      en_pears_mcguinness: "5.4733"
    segments:
      - id: "5.4733.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "弗雷格說：每個合法構成的命題都必須有意義；而我說：每個可能的命題都合法構成，若它沒有意義，只可能是因為我們沒有賦予它某些組成部分任何意義。"
        interpretation_zh_tw: "合法命題由已賦義成分形成；無意義不表示違反一套獨立於意義的句法清單。"
      - id: "5.4733.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（即使我們自以為已經賦予。）"
        interpretation_zh_tw: "熟悉同一字形的其他用法，可能讓人誤以為它在新位置也已有意義。"
      - id: "5.4733.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "因此「蘇格拉底是同一的」什麼也沒說，因為我們沒有賦予「同一的」作為形容詞的意義。"
        interpretation_zh_tw: "等號字形移到形容詞位置後沒有既定用法；錯的是記號的位置與符號化關係。"
      - id: "5.4733.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "因為當它作為等號出現時，其符號化方式完全不同——符號化關係不同——所以兩種情形中的符號也完全不同；兩者只是偶然共有同一個記號字形。"
        interpretation_zh_tw: "符號身分取決於用法與表意關係，同一字形在不同位置可構成完全不同的符號。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 讓 schema 的合法位置與用法限制記號；這可類比命題 5.4733 對記法自行擋錯的要求。"
        rationale_zh_tw: "診斷重點是記號的位置與用法，不是對象在形上學上不存在；因此此處只主張類比，不把專案構件等同原命題。"
        evidence:
          - path: "docs/explainers/entity-vs-view.md"
            kind: heading
            locator: "### 維根斯坦真正用蘇格拉底舉的例子"
            note_zh_tw: "此節以 5.4733 說明同一字形在錯誤位置未獲賦義，錯在記法而非形上學。"
    history: []

