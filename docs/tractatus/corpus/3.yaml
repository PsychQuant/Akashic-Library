  - id: "3.263"
    parent: "3.26"
    texts:
      de:
        - "Die Bedeutungen von Urzeichen können durch Erläuterungen erklärt werden."
        - "Erläuterungen sind Sätze, welche die Urzeichen enthalten."
        - "Sie können also nur verstanden werden, wenn die Bedeutungen dieser Zeichen bereits bekannt sind."
      en_ogden_ramsey_1922:
        - "The meanings of primitive signs can be explained by elucidations."
        - "Elucidations are propositions which contain the primitive signs."
        - "They can, therefore, only be understood when the meanings of these signs are already known."
    edition_references:
      en_pears_mcguinness: "3.263"
    segments:
      - id: "3.263.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "原初記號的指稱可以藉闡明來解釋。"
        interpretation_zh_tw: "闡明協助使用者掌握記號如何被用來指稱，卻不是用另一名稱取代同一問題。"
      - id: "3.263.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "闡明是包含原初記號的命題。"
        interpretation_zh_tw: "解釋必須讓記號在有意義命題中實際運作，而非只提供孤立詞彙對照。"
      - id: "3.263.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "因此，只有在這些記號的指稱已被知道時，闡明才能被理解。"
        interpretation_zh_tw: "闡明無法從零奠定全部指稱；理解仍預設使用者已能把記號連到其對象。"
    project_relations:
