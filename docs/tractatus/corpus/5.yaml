        - "Ist *W~r~* die Anzahl der Wahrheitsgründe des Satzes „*r*“, *W~rs~* die Anzahl derjenigen Wahrheitsgründe des Satzes „*s*“, die zugleich Wahrheitsgründe von „*r*“ sind, dann nennen wir das Verhältnis: *W~rs~* : *W~r~* das Mass der *Wahrscheinlichkeit*, welche der Satz „*r*“ dem Satz „*s*“ gibt."
      en_ogden_ramsey_1922:
        - "If *T~r~* is the number of the truth-grounds of the proposition “*r*”, *T~rs~* the number of those truth-grounds of the proposition “*s*” which are at the same time truth-grounds of “*r*”, then we call the ratio *T*~*rs*~ : *T*~*r*~ the measure of the *probability* which the proposition “*r*” gives to the proposition “*s*”."
    edition_references:
      en_pears_mcguinness: "5.15"
    segments:
      - id: "5.15.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若 Tᵣ 是命題「r」的真值根據數目，Tᵣₛ 是命題「s」中同時也是「r」之真值根據的那些真值根據數目，那麼我們把比值 Tᵣₛ：Tᵣ 稱為命題「r」賦予命題「s」的機率尺度。"
        interpretation_zh_tw: "條件機率在此由共同真值根據占既定真值根據的比例界定。"
