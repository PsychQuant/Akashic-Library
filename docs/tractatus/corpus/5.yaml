  - id: "5.5563"
    parent: "5.556"
    texts:
      de:
        - "Alle Sätze unserer Umgangssprache sind tatsächlich, so wie sie sind, logisch vollkommen geordnet."
        - "– Jenes Einfachste, was wir hier angeben sollen, ist nicht ein Gleichnis der Wahrheit, sondern die volle Wahrheit selbst."
        - "\\(Unsere Probleme sind nicht abstrakt, sondern vielleicht die konkretesten, die es gibt.)"
      en_ogden_ramsey_1922:
        - "All propositions of our colloquial language are actually, just as they are, logically completely in order."
        - "That simple thing which we ought to give here is not a model of the truth but the complete truth itself."
        - "\\(Our problems are not abstract but perhaps the most concrete that there are.)"
    edition_references:
      en_pears_mcguinness: "5.5563"
    segments:
      - id: "5.5563.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
