        translation_zh_tw: "因為運算不斷言任何事情；只有它的結果才斷言，而結果又取決於運算的基底。"
        interpretation_zh_tw: "運算是產生符號的規則，結果命題才與世界比較並取得真假。"
      - id: "5.25.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（運算與函數不可混淆。）"
        interpretation_zh_tw: "函數表現在命題內的值依存，運算則描述由一個形式產生另一形式的步驟。"
    project_relations:
