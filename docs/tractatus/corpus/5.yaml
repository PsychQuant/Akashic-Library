  - id: "5.47"
    parent: "5.4"
    texts:
      de:
        - "Es ist klar, dass alles was sich überhaupt *von vornherein* über die Form aller Sätze sagen lässt, sich *aufeinmal* sagen lassen muss."
        - "Sind ja schon im Elementarsatze alle logischen Operationen enthalten."
        - "Denn „*fa*“ sagt dasselbe wie „(∃*x*) *. fx . x* = *a*“."
        - "Wo Zusammengesetztheit ist, da ist Argument und Funktion, und wo diese sind, sind bereits alle logischen Konstanten."
        - "Man könnte sagen: Die Eine logische Konstante ist das, was *alle* Sätze, ihrer Natur nach, mit einander gemein haben."
        - "Das aber ist die allgemeine Satzform."
      en_ogden_ramsey_1922:
        - "It is clear that everything which can be said *beforehand* about the form of *all* propositions at all can be said *on one occasion*."
        - "For all logical operations are already contained in the elementary proposition."
        - "For “*fa*” says the same as “(∃*x*) . *fx* . *x* = *a*”."
        - "Where there is composition, there is argument and function, and where these are, all logical constants already are."
        - "One could say: the one logical constant is that which *all* propositions, according to their nature, have in common with one another."
        - "That however is the general form of proposition."
    edition_references:
      en_pears_mcguinness: "5.47"
    segments:
      - id: "5.47.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "顯然，凡能預先說明一切命題之形式的事情，都必須能一次說完。"
        interpretation_zh_tw: "命題形式若真正一般，就應由單一通式涵蓋，不能靠無限逐案補充。"
      - id: "5.47.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因為一切邏輯運算都已包含在基本命題中。"
        interpretation_zh_tw: "基本命題已有名稱、函數與可組合位置，具備後續運算所需的形式條件。"
      - id: "5.47.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "「fa」與「(∃x)．fx．x=a」說的是同一件事。"
        interpretation_zh_tw: "量化改寫把既有符號關係展開，並未加入另一種世界內容。"
      - id: "5.47.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "有組合之處就有引數與函數，而有這些之處，一切邏輯常項也已存在。"
        interpretation_zh_tw: "複合性本身帶出運算所需的形式位置，無須再從外部加入邏輯對象。"
      - id: "5.47.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "可以說：唯一的邏輯常項，就是所有命題依其本性彼此共有的東西。"
        interpretation_zh_tw: "所謂唯一常項不是一個特別字形，而是貫穿所有命題的共同生成條件。"
      - id: "5.47.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "而那就是命題的一般形式。"
        interpretation_zh_tw: "一般命題形式概括前述共同條件，取代原始常項清單。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.47 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：命題的一般形式一次涵蓋所有可組合方式，無須逐項列出額外邏輯對象。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
