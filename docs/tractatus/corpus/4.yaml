  - id: "4.241"
    parent: "4.24"
    texts:
      de:
        - "Gebrauche ich zwei Zeichen in ein und derselben Bedeutung, so drücke ich dies aus, indem ich zwischen beide das Zeichen „=“ setze."
        - "„*a* = *b*“ heisst also: das Zeichen „*a*“ ist durch das Zeichen „*b*“ ersetzbar."
        - "\\(Führe ich durch eine Gleichung ein neues Zeichen „*b*“ ein, indem ich bestimme, es solle ein bereits bekanntes Zeichen „*a*“ ersetzen, so schreibe ich die Gleichung – Definition – (wie Russell) in der Form „*a* = *b* Def.“."
        - "Die Definition ist eine Zeichenregel.)"
      en_ogden_ramsey_1922:
        - "If I use two signs with one and the same meaning, I express this by putting between them the sign “=”."
        - "“*a* = *b*” means then, that the sign “*a*” is replaceable by the sign “*b*”."
        - "\\(If I introduce by an equation a new sign “*b*”, by determining that it shall replace a previously known sign “*a*”, I write the equation—definition—(like Russell) in the form “*a* = *b* Def.”."
        - "A definition is a symbolic rule.)"
    edition_references:
      en_pears_mcguinness: "4.241"
    segments:
      - id: "4.241.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若我以兩個符號表達同一意義，就在兩者之間放置「=」號來表示。"
        interpretation_zh_tw: "等號在這裡標記兩個符號同義的使用規約，不是先斷言世界中兩物相等。"
      - id: "4.241.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "「*a* = *b*」意即符號「*a*」可由符號「*b*」替換。"
        interpretation_zh_tw: "*a = b* 的內容是符號可在保留 sense 下互換，判準落在替換規則。"
      - id: "4.241.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "若我用等式引入新符號「*b*」，規定它取代已知符號「*a*」，便像羅素那樣寫成「*a* = *b* Def.」。"
        interpretation_zh_tw: "定義式授權新舊記號互換，其效力來自規約，而不是發現兩個對象碰巧相等。"
      - id: "4.241.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "定義是一條符號規則。"
        interpretation_zh_tw: "把定義定位為規則，排除把它當成需要由世界驗證真假的普通命題。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.241 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：等號在此陳述符號可替換的規約，不是描述兩個對象之間額外存在的同一性事實；定義規範記法使用。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.242"
    parent: "4.24"
    texts:
      de:
        - "Ausdrücke von der Form „*a* = *b*“ sind also nur Behelfe der Darstellung; sie sagen nichts über die Bedeutung der Zeichen „*a*“, „*b*“ aus."
      en_ogden_ramsey_1922:
        - "Expressions of the form “*a* = *b*” are therefore only expedients in presentation: They assert nothing about the meaning of the signs “*a*” and “*b*”."
    edition_references:
      en_pears_mcguinness: "4.242"
    segments:
      - id: "4.242.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "因此，「*a* = *b*」形式的表達只是表現上的輔助；它們沒有斷言符號「*a*」「*b*」的意義。"
        interpretation_zh_tw: "定義等式協調符號用法，不對符號意義所指的世界內容新增一項命題。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.242 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：定義等式協調符號用法，不對符號意義所指的世界內容新增一項命題。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.243"
    parent: "4.24"
    texts:
      de:
        - "Können wir zwei Namen verstehen, ohne zu wissen, ob sie dasselbe Ding oder zwei verschiedene Dinge bezeichnen?"
        - "– Können wir einen Satz, worin zwei Namen vorkommen, verstehen, ohne zu wissen, ob sie Dasselbe oder Verschiedenes bedeuten?"
        - "Kenne ich etwa die Bedeutung eines englischen und eines gleichbedeutenden deutschen Wortes, so ist es unmöglich, dass ich nicht weiss, dass die beiden gleichbedeutend sind; es ist unmöglich, dass ich sie nicht ineinander übersetzen kann."
        - "Ausdrücke wie „*a* = *a*“, oder von diesen abgeleitete, sind weder Elementarsätze, noch sonst sinnvolle Zeichen."
        - "(Dies wird sich später zeigen.)"
      en_ogden_ramsey_1922:
        - "Can we understand two names without knowing whether they signify the same thing or two different things?"
        - "Can we understand a proposition in which two names occur, without knowing if they mean the same or different things?"
        - "If I know the meaning of an English and a synonymous German word, it is impossible for me not to know that they are synonymous, it is impossible for me not to be able to translate them into one another."
        - "Expressions like “*a*=*a*”, or expressions deduced from these are neither elementary propositions nor otherwise significant signs."
        - "(This will be shown later.)"
    edition_references:
      en_pears_mcguinness: "4.243"
    segments:
      - id: "4.243.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們能否理解兩個名稱，卻不知道它們指同一個物還是兩個不同的物？"
        interpretation_zh_tw: "若已理解兩名稱，就應掌握它們是否共指；否則名稱的使用條件尚未完整。"
      - id: "4.243.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "能否理解一個含兩個名稱的命題，卻不知道兩者意指同一還是不同？"
        interpretation_zh_tw: "含兩名稱命題的 sense 取決於兩個位置是否同指，不能把這項差異留到理解之後才決定。"
      - id: "4.243.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "若我知道一個英文詞與一個同義德文詞的意義，就不可能不知道它們同義，也不可能無法互譯。"
        interpretation_zh_tw: "真正掌握兩個同義詞便包含可互譯性；同義不是另待搜尋或經驗發現的偶然關係。"
      - id: "4.243.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "「*a* = *a*」或由此導出的表達，既不是基本命題，也不是其他有意義的符號。"
        interpretation_zh_tw: "自我同一式沒有挑出可能事態，不能因必真就被誤當具有描述性 sense 的基本命題。"
      - id: "4.243.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "（後文將顯示這點。）"
        interpretation_zh_tw: "括註把論證責任留給後續真值函數分析，而非把當前斷言當作無需說明的直覺。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.243 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：完整理解名稱包含掌握同一與差異的使用條件；同義不是待另一個經驗命題發現的偶然關係，而自我同一式也不描繪事態。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.25"
    parent: "4.2"
    texts:
      de:
        - "Ist der Elementarsatz wahr, so besteht der Sachverhalt; ist der Elementarsatz falsch, so besteht der Sachverhalt nicht."
      en_ogden_ramsey_1922:
        - "If the elementary proposition is true, the atomic fact exists; if it is false the atomic fact does not exist."
    edition_references:
      en_pears_mcguinness: "4.25"
    segments:
      - id: "4.25.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若基本命題為真，事態便成立；若基本命題為假，事態便不成立。"
        interpretation_zh_tw: "基本命題的真值由相應事態是否成立決定；記錄存在、語法合法或搜尋命中都不是這項 world-relative 判定。"
    project_relations:
      - status: partial
        mode: semantic_operation
        claim_zh_tw: "authored vertical slice 將 resolved author identity 評為 holds；只有綁定同一 work UUID 與 exact ordered author list 的 canonical witness 排除該 person 時才評為 fails，普通缺席仍拒絕推成不成立。"
        rationale_zh_tw: "4.25 同時說明基本命題為真與為假時事態成立／不成立。現行實作已有一條正面 identity match 與一條 witness-backed exact exclusion，但後者只證成單一作品作者名單的封閉邊界；matching literal、other literal、無 witness 或其他 predicate 的缺席仍是 undetermined，不能外推成完整世界 valuation。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "## 3. 最簡單的反例：搜尋到一個句子，不等於句子是真的"
            note_zh_tw: "此節用可搜尋的假句子明確區分 retrieval 與 truth。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "evaluate"
            note_zh_tw: "`evaluate(in:)` 對投射結果執行 authored 的開放世界求值。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testSupportingEvidenceHolds"
            note_zh_tw: "測試確認 model 的正面作者配置可使 authored 求值為 holds。"
          - path: "Tests/AkashicPropositionTests/AuthorshipCompletenessPropositionTests.swift"
            kind: test
            locator: "testAuthoredUsesFixedOpenWorldPrecedence"
            note_zh_tw: "測試同時證明 plain absence 保持 undetermined，只有 exact valid witness exclusion 才進入 fails。"
          - path: "Tests/AkashicPropositionTests/AuthorshipCompletenessPropositionTests.swift"
            kind: test
            locator: "testWitnessBackedFailureTraceRetainsAllSlotsAndWitness"
            note_zh_tw: "測試確認 fails 結論的 trace 保留全部不支持的 author slots 與授權排除的 witness。"
    history:
      - kind: commit
        reference: "e16c6f6e6d77f7cfe7e9d66323aecb174917872c"
        disposition: revised
        note_zh_tw: "e16c6f6 當時只落實 authored 的正向 model satisfaction；後續 canonical witness 已補上受限的負向條件，但仍不足以越過 partial 邊界。"
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/203"
        disposition: revised
        note_zh_tw: "此 issue 已交付可證成的 authored fails／no 窄幅條件；本筆仍不把沒有 canonical witness 的缺席當作不成立。"

  - id: "4.26"
    parent: "4.2"
    texts:
      de:
        - "Die Angabe aller wahren Elementarsätze beschreibt die Welt vollständig."
        - "Die Welt ist vollständig beschrieben durch die Angaben aller Elementarsätze plus der Angabe, welche von ihnen wahr und welche falsch sind."
      en_ogden_ramsey_1922:
        - "The specification of all true elementary propositions describes the world completely."
        - "The world is completely described by the specification of all elementary propositions plus the specification, which of them are true and which false."
    edition_references:
      en_pears_mcguinness: "4.26"
    segments:
      - id: "4.26.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "列出所有真的基本命題，就完整描述了世界。"
        interpretation_zh_tw: "世界可由全部基本命題的真者決定；這裡的「列出」是完整 truth assignment，不是搜尋命中清單。"
      - id: "4.26.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "世界由所有基本命題，以及其中哪些為真、哪些為假的說明而獲得完整描述。"
        interpretation_zh_tw: "完整描述還須知道每個基本命題為真或為假；只保存命題文本或 record 存在狀態不足以決定世界。"
    project_relations:
      - status: intentional_nonconformance
        mode: declared_nonconformance
        claim_zh_tw: "Akashic 刻意不把現有館藏宣稱為全部基本命題及其完整 valuation。"
        rationale_zh_tw: "專案承認未觀察、未說出與未留下紀錄的事件；因此不存在於資料庫不等於在世界中為假。Canonical author-list witness 只把同一 work 的 exact ordered authors 局部封閉，足以證成一項 authored exclusion，卻不會把整份館藏、affiliated 或其他未見事態升格為完整 world valuation。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "## 3. 最簡單的反例：搜尋到一個句子，不等於句子是真的"
            note_zh_tw: "此節以可搜尋到假句子的反例，證明館藏與檢索狀態不能充當完整世界 valuation。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "TruthValue"
            note_zh_tw: "`TruthValue` 明列 holds、fails 與 undetermined。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testAuthoredWithoutCompletenessWitnessNeverReturnsFails"
            note_zh_tw: "測試確認沒有作者清單完備性證言時，authored absence 仍不會被當成 fails。"
          - path: "Tests/AkashicPropositionTests/AuthorshipCompletenessPropositionTests.swift"
            kind: test
            locator: "testAffiliatedAbsenceRemainsUndeterminedWithoutItsOwnCompletenessWitness"
            note_zh_tw: "測試確認 author-list witness 不外溢成 affiliated predicate 的 closed-world 排除。"
    history:
      - kind: commit
        reference: "e16c6f6e6d77f7cfe7e9d66323aecb174917872c"
        disposition: retained
        note_zh_tw: "e16c6f6 明載 authored model 無法聲明作者清單完備，因此保留館藏不是完整 world valuation 的 nonconformance。"

  - id: "4.27"
    parent: "4.2"
    texts:
      de:
        - "Bezüglich des Bestehens und Nichtbestehens von *n* Sachverhalten gibt es ![{ K_n = \\sum_{\\nu=0}^n \\binom{n}{\\nu} }](images/109747f0cdbcfd62f1bce67d93eb51350f5f3835c6459539f96d2dc70d84420f.svg)\\  Möglichkeiten."
        - "Es können alle Kombinationen der Sachverhalte bestehen, die andern nicht bestehen."
      en_ogden_ramsey_1922:
        - "With regard to the existence of *n* atomic facts there are ![{ K_n = \\sum_{\\nu=0}^n \\binom{n}{\\nu} }](images/109747f0cdbcfd62f1bce67d93eb51350f5f3835c6459539f96d2dc70d84420f.svg)\\  possibilities."
        - "It is possible for all combinations of atomic facts to exist, and the others not to exist."
    edition_references:
      en_pears_mcguinness: "4.27"
    segments:
      - id: "4.27.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "針對 *n* 個事態的成立與不成立，共有 ![{ K_n = \\sum_{\\nu=0}^n \\binom{n}{\\nu} }](images/109747f0cdbcfd62f1bce67d93eb51350f5f3835c6459539f96d2dc70d84420f.svg)\\ 種可能。"
        interpretation_zh_tw: "公式計數 *n* 個事態所有成立／不成立的組合，也就是邏輯空間中的 valuation 數量。"
      - id: "4.27.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "事態的所有組合都可能成立，而其他事態不成立。"
        interpretation_zh_tw: "每一組合都代表一種可能配置；某些事態成立時，其餘可不成立，尚未指定實際世界是哪一組。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.27 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：每個事態的二種狀態組合成完整可能性空間；公式計數組合，並不預測哪個組合實際出現。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.28"
    parent: "4.2"
    texts:
      de:
        - "Diesen Kombinationen entsprechen ebenso viele Möglichkeiten der Wahrheit – und Falschheit – von *n* Elementarsätzen."
      en_ogden_ramsey_1922:
        - "To these combinations correspond the same number of possibilities of the truth—and falsehood—of *n* elementary propositions."
    edition_references:
      en_pears_mcguinness: "4.28"
    segments:
      - id: "4.28.a"
        alignment:
