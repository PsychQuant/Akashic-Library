  - id: "5.473"
    parent: "5.47"
    texts:
      de:
        - "Die Logik muss für sich selber sorgen."
        - "Ein *mögliches* Zeichen muss auch bezeichnen können."
        - "Alles was in der Logik möglich ist, ist auch erlaubt."
        - "(„Sokrates ist identisch“ heisst darum nichts, weil es keine Eigenschaft gibt, die „identisch“ heisst."
        - "Der Satz ist unsinnig, weil wir eine willkürliche Bestimmung nicht getroffen haben, aber nicht darum, weil das Symbol an und für sich unerlaubt wäre.)"
        - "Wir können uns, in gewissem Sinne, nicht in der Logik irren."
      en_ogden_ramsey_1922:
        - "Logic must take care of itself."
        - "A *possible* sign must also be able to signify."
        - "Everything which is possible in logic is also permitted."
        - "(“Socrates is identical” means nothing because there is no property which is called “identical”."
        - "The proposition is senseless because we have not made some arbitrary determination, not because the symbol is in itself unpermissible.)"
        - "In a certain sense we cannot make mistakes in logic."
    edition_references:
      en_pears_mcguinness: "5.473"
    segments:
      - id: "5.473.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯必須自己照顧自己。"
        interpretation_zh_tw: "正確記法應由自身形成規則排除邏輯錯置，而不是靠外部散文逐案禁止。"
      - id: "5.473.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "一個可能的記號也必須能有所指。"
        interpretation_zh_tw: "真正合乎符號形式的記號，不能在形成後才被宣告原則上無法表意。"
      - id: "5.473.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "凡在邏輯中可能的，也都是容許的。"
        interpretation_zh_tw: "邏輯可能性與合法形成相合，不另設任意的符號禁令。"
      - id: "5.473.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（「蘇格拉底是同一的」沒有意義，因為沒有一個叫作「同一的」的性質。"
        interpretation_zh_tw: "問題在於「同一的」在形容詞位置未被賦予符號化用法。"
      - id: "5.473.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "這個命題無意義，是因為我們未作出某項任意的規定，而不是因為該符號本身不被容許。）"
        interpretation_zh_tw: "字形並未遭邏輯禁止；缺少的是使它在此位置成為符號的意義約定。"
      - id: "5.473.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "在某種意義上，我們不可能在邏輯中犯錯。"
        interpretation_zh_tw: "若記法完整固定合法用法，邏輯錯置會在形成符號前被擋下，剩下的只是未賦義字串。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 讓 schema 的合法位置與用法限制記號；這可類比命題 5.473 對記法自行擋錯的要求。"
        rationale_zh_tw: "quarantine 讓不合法的資料形狀在記法層直接失敗，可類比「邏輯必須自己照顧自己」；專案仍需人訂 schema，沒有因此成為自足的邏輯。"
        evidence:
