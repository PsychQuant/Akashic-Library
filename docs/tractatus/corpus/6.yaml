  - id: "6.341"
    parent: "6.34"
    texts:
      de:
        - "Die Newtonsche Mechanik z. B. bringt die Weltbeschreibung auf eine einheitliche Form."
        - "Denken wir uns eine weisse Fläche, auf der unregelmässige schwarze Flecken wären."
        - "Wir sagen nun: Was für ein Bild immer hierdurch entsteht, immer kann ich seiner Beschreibung beliebig nahe kommen, indem ich die Fläche mit einem entsprechend feinen quadratischen Netzwerk bedecke und nun von jedem Quadrat sage, dass es weiss oder schwarz ist."
        - "Ich werde auf diese Weise die Beschreibung der Fläche auf eine einheitliche Form gebracht haben."
        - "Diese Form ist beliebig, denn ich hätte mit dem gleichen Erfolge ein Netz aus dreieckigen oder sechseckigen Maschen verwenden können."
        - "Es kann sein, dass die Beschreibung mit Hilfe eines Dreiecks-Netzes einfacher geworden wäre; das heisst, dass wir die Fläche mit einem gröberen Dreiecks-Netz genauer beschreiben könnten, als mit einem feineren quadratischen (oder umgekehrt) u. s. w."
        - "Den verschiedenen Netzen entsprechen verschiedene Systeme der Weltbeschreibung."
        - "Die Mechanik bestimmt eine Form der Weltbeschreibung, indem sie sagt: Alle Sätze der Weltbeschreibung müssen aus einer Anzahl gegebener Sätze – den mechanischen Axiomen – auf eine gegebene Art und Weise erhalten werden."
        - "Hierdurch liefert sie die Bausteine zum Bau des wissenschaftlichen Gebäudes und sagt: Welches Gebäude immer du aufführen willst, jedes musst du irgendwie mit diesen und nur diesen Bausteinen zusammenbringen."
        - "\\(Wie man mit dem Zahlensystem jede beliebige Anzahl, so muss man mit dem System der Mechanik jeden beliebigen Satz der Physik hinschreiben können.)"
      en_ogden_ramsey_1922:
        - "Newtonian mechanics, for example, brings the description of the universe to a unified form."
        - "Let us imagine a white surface with irregular black spots."
        - "We now say: Whatever kind of picture these make I can always get as near as I like to its description, if I cover the surface with a sufficiently fine square network and now say of every square that it is white or black."
        - "In this way I shall have brought the description of the surface to a unified form."
        - "This form is arbitrary, because I could have applied with equal success a net with a triangular or hexagonal mesh."
        - "It can happen that the description would have been simpler with the aid of a triangular mesh; that is to say we might have described the surface more accurately with a triangular, and coarser, than with the finer square mesh, or vice versa, and so on."
        - "To the different networks correspond different systems of describing the world."
        - "Mechanics determine a form of description by saying: All propositions in the description of the world must be obtained in a given way from a number of given propositions—the mechanical axioms."
        - "It thus provides the bricks for building the edifice of science, and says: Whatever building thou wouldst erect, thou shalt construct it in some manner with these bricks and these alone."
        - "\\(As with the system of numbers one must be able to write down any arbitrary number, so with the system of mechanics one must be able to write down any arbitrary physical proposition.)"
    edition_references:
      en_pears_mcguinness: "6.341"
    segments:
      - id: "6.341.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "牛頓力學把世界描述帶入統一形式。"
        interpretation_zh_tw: "第一句把力學定位成統一表示系統。"
      - id: "6.341.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "設想白底上有不規則黑斑。"
        interpretation_zh_tw: "黑斑是待描述內容，不是理論自身。"
      - id: "6.341.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "無論圖像如何，只要覆上夠細的方格並逐格說明黑白，就能任意逼近其描述。"
        interpretation_zh_tw: "方格示範形式如何容納任意內容。"
      - id: "6.341.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "如此便把平面描述帶入統一形式。"
        interpretation_zh_tw: "統一性來自共同網格，不代表圖像相同。"
      - id: "6.341.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "這種形式是任意的，也可採三角形或六角形網格。"
        interpretation_zh_tw: "網格形狀可選，故描述形式含約定成分。"
      - id: "6.341.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "三角網格有時可能以較粗網目得到比細方格更簡潔準確的描述，反之亦然。"
        interpretation_zh_tw: "簡潔度與所描述圖像相關，不能由網格形式單獨決定。"
      - id: "6.341.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "不同網格對應不同世界描述系統。"
        interpretation_zh_tw: "不同理論可形成不同描述座標。"
      - id: "6.341.h"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "力學規定描述形式：世界描述命題須以指定方式由力學公理構成。"
        interpretation_zh_tw: "公理規定可接受描述如何生成。"
      - id: "6.341.i"
        alignment:
          de: [8]
          en_ogden_ramsey_1922: [8]
        translation_zh_tw: "它提供科學建築的磚塊，要求任何建築都只用這些磚塊組合。"
        interpretation_zh_tw: "磚塊比喻說的是表達限制，不保證建成的命題為真。"
      - id: "6.341.j"
        alignment:
          de: [9]
          en_ogden_ramsey_1922: [9]
        translation_zh_tw: "（如同數系應能寫出任意數，力學系統也應能寫出任意物理命題。）"
        interpretation_zh_tw: "括號要求表示完備性，仍不決定哪個物理命題符合世界。"
