        rationale_zh_tw: "命題 3.324 直接主張「最根本的混淆很容易由此產生（整個哲學充滿這類混淆）。」，本卷並將其限制解讀為「哲學問題可能源於表面語法掩蓋符號差異，而不是源於一項待發現的世界事實。」。這裡處理表達式、符號、用法與邏輯句法；專案的型別與使用規則只能作受限工程規範，不能冒充完整符號理論。"
