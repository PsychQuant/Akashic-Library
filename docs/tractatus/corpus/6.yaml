        disposition: revised
        note_zh_tw: "e16c6f6 將文件中的問句／答案分層落成 typed yes-no vertical slice；後續 EstablishedAnswer 與 canonical witness-backed no 又補上可表達的負答案，整體仍維持 partial。"
