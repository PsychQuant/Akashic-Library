    edition_references:
      en_pears_mcguinness: "2.1515"
    segments:
      - id: "2.1515.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "這些對應彷彿是圖像元素的觸角，圖像藉它們接觸實在。"
        interpretation_zh_tw: "觸角比喻把抽象對應具象化：圖像不直接變成現實，而以每一項代表關係伸向其所描繪者。"
    project_relations:
      - status: analogy_only
        mode: semantic_operation
        claim_zh_tw: "Akashic 的來源與識別參照可視為記錄元素接觸所指內容的有限工程接點。"
        rationale_zh_tw: "接點使主張可追溯，卻不保證相符或真實；因此只採觸角比喻的稽核面向。"
