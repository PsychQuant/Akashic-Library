name: Census parity

# **為什麼要第三個 workflow**
#
# #407 R7 verify 量到一個難堪的形狀：parity 守衛在 CI **只會在它的受測檔案沒被
# 改動時執行**。
#
#   * `ci.yml`（macOS，跑 parity）的觸發是 `push: branches:[main]` ＋
#     `paths-ignore: plugin/**`——所以一個只改 `literal-census.sh` 的 push
#     會讓整個 job 被跳過，而 census 正是 parity 的受測對象。
#   * `ci.yml` 也**沒有 `pull_request` 觸發**，所以任何 PR 都不跑 parity。
#   * `plugin-guards.yml`（ubuntu，1×）跑不了 parity：它需要 build 好的 CLI
#     當 oracle。
#
# 兩個檔案的註解都寫「兩者合起來涵蓋五支」。那句話在「檔案集合的聯集」意義上成立，
# 在「任一次變更」意義上不成立——而後者才是觸發點要保證的事。
#
# 這個 workflow 補上缺的那一格：**只在 parity 的受測對象或它的 oracle 改動時**
# 點 macOS runner。範圍刻意窄——那台是 10× 計費，而這個 repo 在 2026-08 兩度把
# 免費額度燒光。這三條路徑涵蓋 parity **最直接的三個受測對象**。
#
# **刻意不寫成「完整條件」**：讀端的行為還受其他檔案影響（例如
# `Sources/akashic/CLI.swift` 裡呼叫 `StoreVersion.check` 的那個 choke point），
# 而窮舉那條依賴鏈需要另一次量測。上一版寫了「完整條件」——一句沒量過的全稱句，
# 出現在一份以「別寫沒量過的話」為主題的變更裡（#407 R8 verify）。

on:
  push:
    branches: [main]
    paths: &parity_paths
      - "plugin/skills/akashic-promote-literals/scripts/literal-census.sh"
      # census 的 runtime 資料依賴。漏了它的話，「只改這份生成表」的 PR
      # 不會觸發任何 workflow——而那正是 drift guard 最需要跑的情況
      # （#407 R10 verify）。
      - "plugin/skills/akashic-promote-literals/scripts/hash-merging-ranges.txt"
      - "plugin/skills/akashic-promote-literals/scripts/tests/**"
      - "Sources/AkashicStoreIO/StoreVersion.swift"
      # plugin-store-format-parity.py 的第三份宣告來源。它是**出貨物**
      # （release-signed.sh 會 zip 進 .mcpb），改它而守衛不跑＝出貨一個過期數字。
      # 承接自已刪除的 plugin-guards.yml（#408 新增、#435 合併）。
      - "mcpb/manifest.json"
      # **原本這裡有 `plugin/tests/audit-guards-mutations.py`，#521 刪掉。**
      # 那個檔在 `989ac64` 已不存在，而它的理由註解描述的正是本輪刪掉的那個 step。
      # 觸發面沒有變窄：`plugin/**` 本來就涵蓋它曾在的位置。
      # **Swift 守衛自己**（#433）。它們需要 `swift build`，所以只有這台 macOS runner
      # 跑得動——ubuntu 那份缺 toolchain。理由與上一條同型：改守衛本身正是最需要驗證的
      # 時候，而先前 `Sources/akashic-guards/**` 不在任何 workflow 的 paths 裡，
      # `trigger-coverage` 實測報 **26 個缺口**（9 支 Swift 守衛 × 讀它們的守衛）。
      # 這個目錄只裝守衛，不像 `plugin/tests/**` 會被高頻改動——10× 計費可負擔。
      - "Sources/akashic-guards/**"
      # ── 以下承接自 `plugin-guards.yml`（#435，該 workflow 已刪除）─────────────
      #
      # 它跑在 ubuntu（1× 計費），設計理由是「純 python／bash 的守衛不必點 10× 的
      # macOS runner」。**守衛遷成 Swift 之後那個理由不再成立**：`run-guards.sh` 需要
      # `swift build`，而 ubuntu runner 沒有 toolchain——那個 workflow 必然失敗。
      #
      # 兩者現在跑的是**同一個命令**（`bash .githooks/run-guards.sh`），差別只在 paths。
      # 合併是誠實的收斂：留著一個必然失敗的 workflow，比沒有它更糟——它會訓練人忽略
      # 紅燈，而下一個真缺陷就混在被忽略的那批裡。
      #
      # **代價寫出來**：所有 plugin 改動現在都點 10× 的 macOS runner。2026-08 兩度把免費
      # 額度燒光正是這個形狀，所以這不是零成本的決定——但它是**必然的**，除非在 ubuntu
      # 裝 Swift（#435 的候選一與二，兩者都無法在 CI 恢復前驗證）。
      - "plugin/**"
      # #625：`plugin/` 以外的 plugin 根與 marketplace manifest。守衛逐根涵蓋它們
      # （`plugin-roots`），而只改這兩處的 push 若不觸發這裡，那些守衛就沒人跑。
      - "plugins/**"
      - ".claude-plugin/**"
      - "Sources/AkashicCore/Venue.swift"
      # trigger-coverage 讀這兩處——**改觸發點本身就該重跑它**（#407 R19）。
      - ".github/workflows/**"
      - ".githooks/**"
      # decision-matrix-drift 的輸入是 CLAUDE.md 的決策矩陣（#407 R27）。
      - "CLAUDE.md"
      # measured-numbers-audit 讀 .claude/rules 與 plugin/rules 兩處（#407 R36）。
      - ".claude/rules/**"
      # parity-table-drift 拿這兩支當真值來源（#407 R50）。
      - "Sources/akashic-mcp/Server.swift"
      - "Sources/akashic/*.swift"
      # backlink-field-ratchet 讀這六個型別檔（#407 R51）。
      - "Sources/AkashicCore/*.swift"
  pull_request:
    paths: *parity_paths

# **最小權限 ＋ 不留憑證**（#407 R8 HIGH）。這兩個 workflow 以 `pull_request`
# 觸發並**執行 PR 端可控的程式碼**（守衛本身就是 PR 可以改的檔案）。
# `actions/checkout` 預設 `persist-credentials: true` 會把 token 留在 git config，
# 於是被改過的守衛腳本可以直接拿它 push。同 repo 的 contributor PR 拿到的 token
# 不像 fork PR 那樣被降權，所以這道防線不能靠外部設定。
permissions:
  contents: read

concurrency:
  group: census-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # 只影響 checkout **之後**是否把 token 留在 git config——submodule 在
          # checkout 當下仍取得到憑證，所以兩者不衝突。
          persist-credentials: false
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # parity 拿建好的 CLI 當 oracle——這是它非 macOS 不可的唯一理由。
      - name: Build（只為了拿到 oracle）
        run: |
          # #577 中間項（R21 verify 第 5／38 列：這是 CI 裡唯一真的跑守衛的 workflow，卻是三處裡唯一沒釘 native 的）：
          # store-marker-parity.sh 從 .build/debug/akashic、run-guards.sh 從 .build/debug/akashic-guards 找 binary，
          # 而 swiftbuild 會把 .build/debug 改指 out/Products/Debug。與 .githooks/pre-push、ci.yml 同一段，#577 落地時三處一起拿掉。
          swift build --build-system native
          N="$(uname -m)-apple-macosx/debug"
          [ -d ".build/$N" ] || { echo "找不到 native 產物目錄 .build/$N" >&2; exit 1; }
          if [ -e .build/debug ] && [ ! -L .build/debug ]; then echo ".build/debug 是真目錄，不能重指" >&2; exit 1; fi
          ln -sfn "$N" .build/debug
          [ "$(readlink .build/debug)" = "$N" ] || { echo ".build/debug 重指失敗" >&2; exit 1; }

      # 生成的 `#` grapheme 表有沒有隨 Swift／Unicode 版本漂移。一張生成的表
      # 有它自己的失效模式：版本一動它就過期，而過期是安靜的。
      - name: hash 表漂移
        run: bash plugin/skills/akashic-promote-literals/scripts/tests/hash-table-drift.sh

      # 表是逐 code point 的——這支證明對「# + 多 scalar 序列」那樣就夠。
      - name: 多 scalar 序列 parity
        run: swift plugin/skills/akashic-promote-literals/scripts/tests/multiscalar-parity.swift

      - name: store-marker parity
        run: bash plugin/skills/akashic-promote-literals/scripts/tests/store-marker-parity.sh

      # **這裡原本有兩個 step，#521 刪掉了。** 它們跑的是
      #   plugin/skills/akashic-promote-literals/scripts/tests/marker-parity-mutations.py
      #   plugin/tests/audit-guards-mutations.py
      # 而兩個 .py 都在 `989ac64`（#433 Step 5「Python 歸零」）刪除。`python3 <不存在的檔>`
      # 回非零，整份 workflow 無 continue-on-error / 無 if:，三個 step 同一個 job 循序排列
      # ——所以 job 會在這裡**大聲死掉**，而下面那個「全部守衛」的 step **永遠到不了**。
      # 今天觀察不到紅燈只因為 GitHub Actions 帳務擱置（runner 不啟動、steps=0）。
      #
      # 為什麼是刪除而不是改指 Swift 子命令：下面的 `run-guards.sh` **已經跑這兩支**
      # （該檔行 53 與 94，皆為 `akashic-guards <子命令>`）。而這兩步當初獨立存在的理由
      # ——「ubuntu 那台缺 toolchain，6 個 swift-gated case 在 CI 哪裡都跑不到」——隨
      # #435 刪掉 ubuntu workflow 一起消失了。留著等於第二份會分岔的清單。
      # **全部守衛**（#433）。9 支守衛已遷成 `akashic-guards` 子命令，而它們需要
      # `swift build`——本 runner 有（上面第一步就是），ubuntu 那台沒有。
      #
      # 不加這一步的話，`Sources/akashic-guards/**` 改動時**沒有任何 workflow 會執行讀
      # 它們的守衛**：`trigger-coverage` 實測 26 個缺口（9 支 Swift 守衛 × 讀它們的守衛）。
      # 光把那個路徑加進 `paths:` 不夠——判準是逐對的：workflow 要同時 (a) 該檔改動時
      # 觸發、(b) 執行那支守衛。加 paths 只做到 (a)。
      #
      # **上一版這裡寫「與上一步的 `audit-guards-mutations.py` 重疊」——那個 step 已於
      # #521 刪除**（它跑的是已刪的 `.py`）。現在這是本 workflow 唯一執行守衛的地方，
      # 與 pre-push 同一份清單。
      - name: 全部守衛（與 pre-push 同一份清單；本 runner 有 Swift）
        run: bash .githooks/run-guards.sh
