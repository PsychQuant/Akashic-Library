  - id: "3.1"
    parent: "3"
    texts:
      de:
        - "Im Satz drückt sich der Gedanke sinnlich wahrnehmbar aus."
      en_ogden_ramsey_1922:
        - "In the proposition the thought is expressed perceptibly through the senses."
    edition_references:
      en_pears_mcguinness: "3.1"
    segments:
      - id: "3.1.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "思想在命題中以可由感官感知的方式表達出來。"
        interpretation_zh_tw: "命題讓思想取得可聽或可見的載體；載體不是思想本身，卻使思想能被共同使用與檢驗。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.1 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.1 直接主張「思想在命題中以可由感官感知的方式表達出來。」，本卷並將其限制解讀為「命題讓思想取得可聽或可見的載體；載體不是思想本身，卻使思想能被共同使用與檢驗。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
