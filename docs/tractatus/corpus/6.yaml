  - id: "6.54"
    parent: "6.5"
    texts:
      de:
        - "Meine Sätze erläutern dadurch, dass sie der, welcher mich versteht, am Ende als unsinnig erkennt, wenn er durch sie – auf ihnen – über sie hinausgestiegen ist."
        - "(Er muss sozusagen die Leiter wegwerfen, nachdem er auf ihr hinaufgestiegen ist.)"
        - "Er muss diese Sätze überwinden, dann sieht er die Welt richtig."
      en_ogden_ramsey_1922:
        - "My propositions are elucidatory in this way: he who understands me finally recognizes them as senseless, when he has climbed out through them, on them, over them."
        - "(He must so to speak throw away the ladder, after he has climbed up on it.)"
        - "He must surmount these propositions; then he sees the world rightly."
    edition_references:
      en_pears_mcguinness: "6.54"
    segments:
      - id: "6.54.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我的命題作為闡明：理解者最後會認出它們無意義，因為他已穿過、踏在其上並越過它們。"
        interpretation_zh_tw: "闡明語句完成工作後不再被當成世界事實；「無意義」不是說它們毫無用途。"
      - id: "6.54.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（他爬上梯子後，必須把梯子丟掉。）"
        interpretation_zh_tw: "梯子是閱讀方法比喻，不是刪除來源或版本歷史的指令。"
      - id: "6.54.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "他必須克服這些命題，然後才會正確地看世界。"
        interpretation_zh_tw: "「克服」是哲學閱讀終點，不授權把所得世界觀當成新資料事實。"
    project_relations:
