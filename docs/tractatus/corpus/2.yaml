        claim_zh_tw: "Akashic 的來源 locator 與識別參照只在明示接點上把記錄連到外部證據。"
        rationale_zh_tw: "可解析 locator 類似有限接觸點，但技術引用不等於量尺比喻的完整邏輯關係。"
        evidence:
