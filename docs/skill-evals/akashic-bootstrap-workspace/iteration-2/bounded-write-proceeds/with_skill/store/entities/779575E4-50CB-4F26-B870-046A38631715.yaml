date: 1991
fields:
  abstract: Two studies examined the development of children's implicit theories of
    self-attributes (as stable or malleable) in 4 domains (intelligence, sociability,
    physical skills, physical appearance) and the degree to which beliefs about intelligence
    predict recovery from failure on a novel achievement task. In Study 1, 130 children
    in kindergarten through Grade 5 were interviewed. Third and fifth graders also
    performed a problem-solving task. In Study 2, 36 5th and 6th graders' beliefs
    about a novel ability were manipulated. Results of Study 1 showed that by 3rd
    grade, Ss distinguished between attributes and applied different theories to different
    attributes. Study 2 showed that Ss' beliefs about the flexibility of ability could
    be manipulated to produce predicted achievement cognitions. (PsycINFO Database
    Record (c) 2016 APA, all rights reserved)
