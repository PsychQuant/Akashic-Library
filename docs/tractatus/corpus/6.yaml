    parent: "6.1"
    texts:
      de:
        - "Die Sätze der Logik sagen also Nichts."
        - "(Sie sind die analytischen Sätze.)"
      en_ogden_ramsey_1922:
        - "The propositions of logic therefore say nothing."
        - "(They are the analytical propositions.)"
    edition_references:
      en_pears_mcguinness: "6.11"
    segments:
      - id: "6.11.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "所以邏輯命題什麼也不說。"
        interpretation_zh_tw: "「什麼也不說」指重言式不切分可能事態，不是字串空白。"
      - id: "6.11.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（它們是分析命題。）"
        interpretation_zh_tw: "括號把這種無經驗內容的地位稱為分析性。"
    project_relations:
