  - id: "6.4312"
    parent: "6.431"
    texts:
      de:
        - "Die zeitliche Unsterblichkeit der Seele des Menschen, das heisst also ihr ewiges Fortleben auch nach dem Tode, ist nicht nur auf keine Weise verbürgt, sondern vor allem leistet diese Annahme gar nicht das, was man immer mit ihr erreichen wollte."
        - "Wird denn dadurch ein Rätsel gelöst, dass ich ewig fortlebe?"
        - "Ist denn dieses ewige Leben dann nicht ebenso rätselhaft wie das gegenwärtige?"
        - "Die Lösung des Rätsels des Lebens in Raum und Zeit liegt *ausserhalb* von Raum und Zeit."
        - "\\(Nicht Probleme der Naturwissenschaft sind ja zu lösen.)"
      en_ogden_ramsey_1922:
        - "The temporal immortality of the human soul, that is to say, its eternal survival after death, is not only in no way guaranteed, but this assumption in the first place will not do for us what we always tried to make it do."
        - "Is a riddle solved by the fact that I survive for ever?"
        - "Is this eternal life not as enigmatic as our present one?"
        - "The solution of the riddle of life in space and time lies *outside* space and time."
        - "\\(It is not problems of natural science which have to be solved.)"
    edition_references:
      en_pears_mcguinness: "6.4312"
    segments:
      - id: "6.4312.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "人的靈魂死後在時間中永遠延續，不只毫無保證，也不能完成我們一向寄望它完成的事。"
        interpretation_zh_tw: "第一句既不證成來世，也指出延長時間不是意義解答。"
      - id: "6.4312.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我永遠活著就解開謎題了嗎？"
        interpretation_zh_tw: "單純延續不會改變問題的邏輯形狀。"
      - id: "6.4312.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "永生不會和當下生命同樣難解嗎？"
        interpretation_zh_tw: "永生仍可保留同一困惑。"
      - id: "6.4312.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "生命在時空中的謎題，其解答位於時空之外。"
        interpretation_zh_tw: "「之外」標示問題不屬於更多時空事實。"
      - id: "6.4312.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "（要解決的並不是自然科學問題。）"
        interpretation_zh_tw: "括號明確區分生命意義與自然科學可解題。"
