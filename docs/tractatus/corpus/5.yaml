  - id: "5.47321"
    parent: "5.4732"
    texts:
      de:
        - "Occams Devise ist natürlich keine willkürliche, oder durch ihren praktischen Erfolg gerechtfertigte, Regel: Sie besagt, dass *unnötige* Zeicheneinheiten nichts bedeuten."
        - "Zeichen, die *Einen* Zweck erfüllen, sind logisch äquivalent, Zeichen, die *keinen* Zweck erfüllen, logisch bedeutungslos."
      en_ogden_ramsey_1922:
        - "Occam’s razor is, of course, not an arbitrary rule nor one justified by its practical success."
        - "It simply says that *unnecessary* elements in a symbolism mean nothing."
        - "Signs which serve *one* purpose are logically equivalent, signs which serve *no* purpose are logically meaningless."
    edition_references:
      en_pears_mcguinness: "5.47321"
    segments:
      - id: "5.47321.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0, 1]
        translation_zh_tw: "奧坎剃刀當然不是任意規則，也不是靠實用成效證成的規則；它只是在說，記法中不必要的元素沒有意義。"
        interpretation_zh_tw: "德文以冒號連成一句，英文分成兩句；刪除冗餘的根據是多餘元素不承擔符號化功能。"
      - id: "5.47321.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "服務同一目的的記號在邏輯上等價；不服務任何目的的記號在邏輯上無意義。"
        interpretation_zh_tw: "邏輯身分由用途與真值效果決定；純粹多出的筆畫不形成另一個符號。"
    project_relations:
