  - id: "5.5321"
    parent: "5.532"
    texts:
      de:
        - "Statt „(*x*) : *fx* ⊃ *x* = *a*“ schreiben wir also z. B. „(∃*x*) *. fx.* ⊃ *.fa* : ∼(∃*x, y*) *. fx . fy*“."
        - "Und der Satz „*nur* Ein *x* befriedigt *f* ()“ lautet: „(∃*x*) *. fx* : ∼(∃*x, y*) *. fx . fy*“."
      en_ogden_ramsey_1922:
        - "Instead of “(*x*) : *fx* ⊃ *x* = *a*” we therefore write *e.g.* “(∃*x*) . *fx* . ⊃ . *fa* : \\~(∃*x*, *y*) . *fx* . *fy*”."
        - "And the proposition “*only* one *x* satisfies *f*( )” reads: “(∃*x*) . *fx* : \\~(∃*x*, *y*) . *fx* . *fy*”."
    edition_references:
      en_pears_mcguinness: "5.5321"
    segments:
      - id: "5.5321.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "因此，例如不用「(x)：fx⊃x=a」，而寫「(∃x)．fx．⊃．fa：~(∃x,y)．fx．fy」。"
        interpretation_zh_tw: "唯一性可由存在、特定個體滿足條件，以及不存在兩個滿足者共同表達。"
      - id: "5.5321.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "命題「只有一個 x 滿足 f( )」則寫成：「(∃x)．fx：~(∃x,y)．fx．fy」。"
        interpretation_zh_tw: "此式直接以量化結構表達唯一滿足者，避免把同一性當成額外關係。"
    project_relations:
