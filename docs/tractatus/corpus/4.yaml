  - id: "4.24"
    parent: "4.2"
    texts:
      de:
        - "Die Namen sind die einfachen Symbole, ich deute sie durch einzelne Buchstaben („*x*“, „*y*“, „*z*“) an."
        - "Den Elementarsatz schreibe ich als Funktion der Namen in der Form: „*fx*“, „*ϕ*(*x, y*)“, etc."
        - "Oder ich deute ihn durch die Buchstaben *p*, *q*, *r* an."
      en_ogden_ramsey_1922:
        - "The names are the simple symbols, I indicate them by single letters (*x*, *y*, *z*)."
        - "The elementary proposition I write as function of the names, in the form “*fx*”, “*ϕ*(*x*, *y*)”, etc."
        - "Or I indicate it by the letters *p*, *q*, *r*."
    edition_references:
      en_pears_mcguinness: "4.24"
    segments:
      - id: "4.24.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "名稱是簡單符號，我以單一字母（「*x*」「*y*」「*z*」）表示。"
        interpretation_zh_tw: "單一字母只是一套標示名稱的記法；簡單性屬於邏輯角色，不是字串長度。"
      - id: "4.24.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "基本命題寫作名稱的函數，形式如「*fx*」「*ϕ*(*x, y*)」等。"
        interpretation_zh_tw: "寫成 *fx* 或 *ϕ(x,y)* 能保留名稱在基本命題中的論元位置與關係結構。"
      - id: "4.24.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "或者用字母 *p*、*q*、*r* 表示。"
        interpretation_zh_tw: "以 *p*、*q*、*r* 表示時，是把整個基本命題當真值運算單位，不再展示其內部名稱配置。"
    project_relations:
