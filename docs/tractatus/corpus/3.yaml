  - id: "3.342"
    parent: "3.34"
    texts:
      de:
        - "An unseren Notationen ist zwar etwas willkürlich, aber *das* ist nicht willkürlich: Dass, *wenn* wir etwas willkürlich bestimmt haben, dann etwas anderes der Fall sein muss."
        - "(Dies hängt von dem *Wesen* der Notation ab.)"
      en_ogden_ramsey_1922:
        - "In our notations there is indeed something arbitrary, but *this* is not arbitrary, namely that *if* we have determined anything arbitrarily, then something else *must* be the case."
        - "(This results from the *essence* of the notation.)"
    edition_references:
      en_pears_mcguinness: "3.342"
    segments:
      - id: "3.342.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們的記法固然有任意之處，但以下這點並不任意：一旦我們任意規定某事，另一些事情就必須隨之成立。"
        interpretation_zh_tw: "約定可以選擇基本記號；選定後，由整套記法的關係產生的後果便不能再逐項任意決定。"
      - id: "3.342.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（這取決於記法的本質。）"
        interpretation_zh_tw: "必然後果來自記法作為整體的構造與替換規則，不來自某個字形本身。"
    project_relations:
