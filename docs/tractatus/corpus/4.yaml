  - id: "4.0621"
    parent: "4.062"
    texts:
      de:
        - "Dass aber die Zeichen „*p*“ und „∼*p*“ das gleiche sagen *können*, ist wichtig."
        - "Denn es zeigt, dass dem Zeichen „∼“ in der Wirklichkeit nichts entspricht."
        - "Dass in einem Satz die Verneinung vorkommt, ist noch kein Merkmal seines Sinnes (∼∼*p* = *p*)."
        - "Die Sätze „*p*“ und „∼*p*“ haben entgegengesetzten Sinn, aber es entspricht ihnen eine und dieselbe Wirklichkeit."
      en_ogden_ramsey_1922:
        - "That, however, the signs “*p*” and “\\~*p*” *can* say the same thing is important, for it shows that the sign “*\\~*” corresponds to nothing in reality."
        - "That negation occurs in a proposition, is no characteristic of its sense (\\~\\~*p* = *p*)."
        - "The propositions “*p*” and “\\~*p*” have opposite senses, but to them corresponds one and the same reality."
    edition_references:
      en_pears_mcguinness: "4.0621"
    segments:
      - id: "4.0621.a"
        alignment:
          de: [0, 1]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "然而，符號「*p*」與「∼*p*」可能說出同一件事，這很重要；它顯示現實中沒有東西對應符號「∼」。"
        interpretation_zh_tw: "*p* 與 ∼*p* 能因符號規約而說同一件事，說明 ∼ 不是名稱，現實中沒有一個「否定物」。"
      - id: "4.0621.b"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "命題中出現否定，並非其意義本身的特徵（∼∼*p* = *p*）。"
        interpretation_zh_tw: "雙重否定可與原命題同義，證明表面出現否定符號不足以單獨決定 sense。"
      - id: "4.0621.c"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "命題「*p*」與「∼*p*」有相反意義，但同一現實與兩者相對應。"
        interpretation_zh_tw: "相反 sense 是同一現實的兩種互補切分，不需要為肯定與否定各設一個對應世界。"
    project_relations:
