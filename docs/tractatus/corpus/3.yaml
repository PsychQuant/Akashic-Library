  - id: "3.325"
    parent: "3.32"
    texts:
      de:
        - "Um diesen Irrtümern zu entgehen, müssen wir eine Zeichensprache verwenden, welche sie ausschliesst, indem sie nicht das gleiche Zeichen in verschiedenen Symbolen, und Zeichen, welche auf verschiedene Art bezeichnen, nicht äusserlich auf die gleiche Art verwendet."
        - "Eine Zeichensprache also, die der *logischen* Grammatik – der logischen Syntax – gehorcht."
        - "\\(Die Begriffsschrift Frege’s und Russell’s ist eine solche Sprache, die allerdings noch nicht alle Fehler ausschliesst.)"
      en_ogden_ramsey_1922:
        - "In order to avoid these errors, we must employ a symbolism which excludes them, by not applying the same sign in different symbols and by not applying signs in the same way which signify in different ways."
        - "A symbolism, that is to say, which obeys the rules of *logical* grammar—of logical syntax."
        - "\\(The logical symbolism of Frege and Russell is such a language, which, however, does still not exclude all errors.)"
    edition_references:
      en_pears_mcguinness: "3.325"
    segments:
      - id: "3.325.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "為避免這些錯誤，我們必須使用一種排除它們的符號語言：不讓同一記號用於不同符號，也不讓以不同方式指示的記號在表面上以相同方式使用。"
        interpretation_zh_tw: "目標是讓表面記法可靠顯出符號角色，降低 3.323 所列的同形異用與異形同用混淆。"
      - id: "3.325.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "也就是一種服從邏輯文法——邏輯句法——的符號語言。"
        interpretation_zh_tw: "logische Syntax 譯為「邏輯句法」；它不能直接等同於 Swift 型別系統或 YAML schema。"
      - id: "3.325.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（Frege 與 Russell 的概念文字是一種這樣的語言，但仍未排除所有錯誤。）"
        interpretation_zh_tw: "形式化可以減少歧義，卻不保證完備無誤；括號句本身限制了工程類比可宣稱的程度。"
