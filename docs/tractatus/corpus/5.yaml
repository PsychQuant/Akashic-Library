  - id: "5.153"
    parent: "5.15"
    texts:
      de:
        - "Ein Satz ist an sich weder wahrscheinlich noch unwahrscheinlich."
        - "Ein Ereignis trifft ein, oder es trifft nicht ein, ein Mittelding gibt es nicht."
      en_ogden_ramsey_1922:
        - "A proposition is in itself neither probable nor improbable."
        - "An event occurs or does not occur, there is no middle course."
    edition_references:
      en_pears_mcguinness: "5.153"
    segments:
      - id: "5.153.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題本身既非可能性高，也非可能性低。"
        interpretation_zh_tw: "機率衡量已知條件對命題的支持關係，不是命題自身附帶的一項性質。"
      - id: "5.153.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "一件事件發生或不發生，沒有居中狀態。"
        interpretation_zh_tw: "實際事件仍只有發生與不發生；機率不把真假改造成連續程度。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.153 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：機率衡量的是已知條件對事件的支持，不是把事件實際的真假變成介於兩者之間的程度。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.154"
    parent: "5.15"
    texts:
      de:
        - "In einer Urne seien gleichviel weisse und schwarze Kugeln (und keine anderen)."
        - "Ich ziehe eine Kugel nach der anderen und lege sie wieder in die Urne zurück."
        - "Dann kann ich durch den Versuch feststellen, dass sich die Zahlen der gezogenen schwarzen und weissen Kugeln bei fortgesetztem Ziehen einander nähern."
        - "*Das* ist also kein mathematisches Faktum."
        - "Wenn ich nun sage: Es ist gleich wahrscheinlich, dass ich eine weisse Kugel wie eine schwarze ziehen werde, so heisst das: Alle mir bekannten Umstände (die hypothetisch angenommenen Naturgesetze mitinbegriffen) geben dem Eintreffen des einen Ereignisses nicht *mehr* Wahrscheinlichkeit als dem Eintreffen des anderen."
        - "Das heisst, sie geben – wie aus den obigen Erklärungen leicht zu entnehmen ist – jedem die Wahrscheinlichkeit ½."
        - "Was ich durch den Versuch bestätige ist, dass das Eintreffen der beiden Ereignisse von den Umständen, die ich nicht näher kenne, unabhängig ist."
      en_ogden_ramsey_1922:
        - "In an urn there are equal numbers of white and black balls (and no others)."
        - "I draw one ball after another and put them back in the urn."
        - "Then I can determine by the experiment that the numbers of the black and white balls which are drawn approximate as the drawing continues."
        - "So *this* is not a mathematical fact."
        - "If then, I say, It is equally probable that I should draw a white and a black ball, this means, All the circumstances known to me (including the natural laws hypothetically assumed) give to the occurrence of the one event no more probability than to the occurrence of the other."
        - "That is they give—as can easily be understood from the above explanations—to each the probability ½."
        - "What I can verify by the experiment is that the occurrence of the two events is independent of the circumstances with which I have no closer acquaintance."
    edition_references:
      en_pears_mcguinness: "5.154"
    segments:
      - id: "5.154.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一只甕裡有相同數目的白球與黑球，此外沒有別的球。"
        interpretation_zh_tw: "例子先固定兩種結果及其對稱數量，建立等機率模型的形式背景。"
      - id: "5.154.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我逐一抽球，每次再把球放回甕裡。"
        interpretation_zh_tw: "放回抽樣使每一次抽取維持相同的候選配置。"
      - id: "5.154.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "由實驗可以確定，抽取持續進行時，黑白球被抽中的次數會逐漸接近。"
        interpretation_zh_tw: "長期頻率接近是可觀察的實驗結果，尚不是由純數學保證的個別事實。"
      - id: "5.154.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "所以，這並不是一項數學事實。"
        interpretation_zh_tw: "實際抽取序列如何發展，不能與機率模型的形式比例混為一談。"
      - id: "5.154.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "當我說抽到白球與黑球同樣可能，意思是：我所知道的一切情況（包括假設成立的自然律）對一種事件的發生，沒有比另一種給予更多機率。"
        interpretation_zh_tw: "等機率相對於已知條件與假定規律，表示這些條件對兩結果的支持對稱。"
      - id: "5.154.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "也就是，如前述說明容易看出，它們給予每一種事件的機率都是二分之一。"
        interpretation_zh_tw: "在兩種結果受到同等支持時，真值可能性的比例各占一半。"
      - id: "5.154.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "我能由實驗檢驗的是：這兩種事件的發生，與那些我不更深入了解的情況相互獨立。"
        interpretation_zh_tw: "實驗可支持抽取結果未隨未知條件系統偏移，而不是直接看見一個機率對象。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.154 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：等機率陳述以已知條件與假定規律為背景；長期頻率可檢驗獨立性，卻不是機率定義本身的純數學證明。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

