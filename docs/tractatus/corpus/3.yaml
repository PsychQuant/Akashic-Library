  - id: "3.11"
    parent: "3.1"
    texts:
      de:
        - "Wir benützen das sinnlich wahrnehmbare Zeichen (Laut- oder Schriftzeichen etc.) des Satzes als Projektion der möglichen Sachlage."
        - "Die Projektionsmethode ist das Denken des Satz-Sinnes."
      en_ogden_ramsey_1922:
        - "We use the sensibly perceptible sign (sound or written sign, etc.) of the proposition as a projection of the possible state of affairs."
        - "The method of projection is the thinking of the sense of the proposition."
    edition_references:
      en_pears_mcguinness: "3.11"
    segments:
      - id: "3.11.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們把命題中可由感官感知的記號（聲音記號、書寫記號等），用作可能狀況的投射。"
        interpretation_zh_tw: "Zeichen 譯為「記號」：它是可感知的載體；記號只有經由投射關係，才把自身配置連到可能狀況。"
      - id: "3.11.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "投射方法就是對命題意義的思考。"
        interpretation_zh_tw: "Projektionsmethode 譯為「投射方法」；它不是單純的圖形轉換，而是把命題記號理解為具有某一意義的活動。"
    project_relations:
