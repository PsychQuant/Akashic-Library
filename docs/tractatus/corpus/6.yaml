        claim_zh_tw: "Akashic 目前不主張命題 6.1263 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1263 的直接論旨是「若有意義命題與邏輯命題都以同一方式從其他命題證明，那就太奇怪了。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1264"
    parent: "6.126"
    texts:
      de:
        - "Der sinnvolle Satz sagt etwas aus, und sein Beweis zeigt, dass es so ist; in der Logik ist jeder Satz die Form eines Beweises."
        - "Jeder Satz der Logik ist ein in Zeichen dargestellter modus ponens."
        - "(Und den modus ponens kann man nicht durch einen Satz ausdrücken.)"
      en_ogden_ramsey_1922:
        - "The significant proposition asserts something, and its proof shows that it is so; in logic every proposition is the form of a proof."
        - "Every proposition of logic is a modus ponens presented in signs."
        - "(And the modus ponens can not be expressed by a proposition.)"
    edition_references:
      en_pears_mcguinness: "6.1264"
    segments:
      - id: "6.1264.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "有意義命題說出某事，其證明顯示事情確是如此；在邏輯中，每個命題都是證明的形式。"
        interpretation_zh_tw: "經驗內容的證明與邏輯形式的展示被區分。"
