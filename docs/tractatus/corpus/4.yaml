  - id: "4.1252"
    parent: "4.125"
    texts:
      de:
        - "Reihen, welche durch *interne* Relationen geordnet sind, nenne ich Formenreihen."
        - "Die Zahlenreihe ist nicht nach einer externen, sondern nach einer internen Relation geordnet."
        - "Ebenso die Reihe der Sätze „*aRb*“,"
        - "„(∃*x*) : *aRx . xRb*“,"
        - "„(∃*x, y*) : *aRx . xRy . yRb*“, u. s. f."
        - "\\(Steht *b* in einer dieser Beziehungen zu *a*, so nenne ich *b* einen Nachfolger von *a*.)"
      en_ogden_ramsey_1922:
        - "Series which are ordered by *internal* relations I call formal series."
        - "The series of numbers is ordered not by an external, but by an internal relation."
        - "Similarly the series of propositions “*aRb*”,"
        - "“(∃*x*) : *aRx* . *xRb*”,"
        - "“(∃*x,y*) : *aRx* . *xRy* . *yRb*”, etc."
        - "\\(If *b* stands in one of these relations to *a*, I call *b* a successor of *a*.)"
    edition_references:
      en_pears_mcguinness: "4.1252"
    segments:
      - id: "4.1252.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "由內在關係排序的序列，我稱為形式序列。"
        interpretation_zh_tw: "形式序列由成員間的內在生成關係排序，不依賴事後外加的編號或排列。"
      - id: "4.1252.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "數列不是由外在關係，而是由內在關係排序。"
        interpretation_zh_tw: "數列的次序來自後繼結構本身，示範內在關係如何決定序列。"
      - id: "4.1252.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "同樣地，命題序列先有「*aRb*」，"
        interpretation_zh_tw: "*aRb* 給出形式序列的第一種關係形狀，直接連結起點與終點。"
      - id: "4.1252.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "再有「(∃*x*) : *aRx . xRb*」，"
        interpretation_zh_tw: "加入一個中介 *x* 形成下一個結構步驟，顯示序列可由同一操作擴展。"
      - id: "4.1252.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "接著是「(∃*x, y*) : *aRx . xRy . yRb*」等等。"
        interpretation_zh_tw: "再加入 *x, y* 延長關係鏈，省略號表示同一生成規則能持續套用。"
      - id: "4.1252.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "（若 *b* 與 *a* 處於這些關係之一，我就稱 *b* 為 *a* 的後繼者。）"
        interpretation_zh_tw: "「後繼者」由 *b* 在形式序列中相對於 *a* 的生成關係界定，不是外加的普通分類。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.1252 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：形式序列由一項可反覆套用的內在生成關係構成；後繼不是事後外加排序，而由每一項如何從前項形成來界定。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.126"
    parent: "4.12"
    texts:
      de:
        - "In dem Sinne, in welchem wir von formalen Eigenschaften sprechen, können wir nun auch von formalen Begriffen reden."
        - "\\(Ich führe diesen Ausdruck ein, um den Grund der Verwechslung der formalen Begriffe mit den eigentlichen Begriffen, welche die ganze alte Logik durchzieht, klar zu machen.)"
        - "Dass etwas unter einen formalen Begriff als dessen Gegenstand fällt, kann nicht durch einen Satz ausgedrückt werden."
        - "Sondern es zeigt sich an dem Zeichen dieses Gegenstandes selbst."
        - "(Der Name zeigt, dass er einen Gegenstand bezeichnet, das Zahlenzeichen, dass es eine Zahl bezeichnet etc.)"
        - "Die formalen Begriffe können ja nicht, wie die eigentlichen Begriffe, durch eine Funktion dargestellt werden."
        - "Denn ihre Merkmale, die formalen Eigenschaften, werden nicht durch Funktionen ausgedrückt."
        - "Der Ausdruck der formalen Eigenschaft ist ein Zug gewisser Symbole."
        - "Das Zeichen der Merkmale eines formalen Begriffes ist also ein charakteristischer Zug aller Symbole, deren Bedeutungen unter den Begriff fallen."
        - "Der Ausdruck des formalen Begriffes also, eine Satzvariable, in welcher nur dieser charakteristische Zug konstant ist."
      en_ogden_ramsey_1922:
        - "In the sense in which we speak of formal properties we can now speak also of formal concepts."
        - "\\(I introduce this expression in order to make clear the confusion of formal concepts with proper concepts which runs through the whole of the old logic.)"
        - "That anything falls under a formal concept as an object belonging to it, cannot be expressed by a proposition."
        - "But it is shown in the symbol for the object itself."
        - "(The name shows that it signifies an object, the numerical sign that it signifies a number, etc.)"
        - "Formal concepts, cannot, like proper concepts, be presented by a function."
        - "For their characteristics, the formal properties, are not expressed by the functions."
        - "The expression of a formal property is a feature of certain symbols."
        - "The sign that signifies the characteristics of a formal concept is, therefore, a characteristic feature of all symbols, whose meanings fall under the concept."
        - "The expression of the formal concept is therefore a propositional variable in which only this characteristic feature is constant."
    edition_references:
      en_pears_mcguinness: "4.126"
    segments:
      - id: "4.126.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在我們談形式性質的意義下，現在也能談形式概念。"
        interpretation_zh_tw: "「形式概念」承接形式性質而來，起點就不同於「書」或「人」這類可述謂的真正概念。"
      - id: "4.126.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（我引入這個詞，為了澄清貫穿舊邏輯、把形式概念與真正概念混淆的根源。）"
        interpretation_zh_tw: "這個術語用來診斷舊邏輯的層次混淆，不是增設一類特殊物件。"
      - id: "4.126.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "某物作為對象落在一個形式概念之下，不能由命題表達。"
        interpretation_zh_tw: "某符號屬於哪種形式範疇，不能再由同層命題斷言，否則會把使用條件誤作內容。"
      - id: "4.126.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "反之，這會顯示在該對象的符號本身。"
        interpretation_zh_tw: "這是 showing，不是另一句 saying：形式範疇由符號可合法出現的方式顯示，不靠同層命題斷言「它屬於某形式」。"
      - id: "4.126.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "（名稱顯示它指稱對象；數字符號顯示它指稱數字，等等。）"
        interpretation_zh_tw: "名稱與數字符號以不同使用位置具體顯示範疇；這些例子不是替符號再加普通分類謂詞。"
      - id: "4.126.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "形式概念不像真正概念，不能由函數表現。"
        interpretation_zh_tw: "真正概念可由函數判定個體是否落入，形式概念則不能照此建模。"
      - id: "4.126.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "因為其特徵——形式性質——不由函數表達。"
        interpretation_zh_tw: "形式性質是函數運作已預設的符號條件，不能再由同一函數表達。"
      - id: "4.126.h"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "形式性質的表達是某些符號的一項特徵。"
        interpretation_zh_tw: "因此，形式性質應在符號本身的特徵中尋找，而不是在世界中另找對應物。"
      - id: "4.126.i"
        alignment:
          de: [8]
          en_ogden_ramsey_1922: [8]
        translation_zh_tw: "因此，形式概念特徵的符號，是所有其意義落在該概念下之符號的共同特徵。"
        interpretation_zh_tw: "落在同一形式概念下的符號共享一項可辨識特徵；共同之處屬於符號使用。"
      - id: "4.126.j"
        alignment:
          de: [9]
          en_ogden_ramsey_1922: [9]
        translation_zh_tw: "所以，形式概念的表達是一個命題變項，其中只有這項特徵保持不變。"
        interpretation_zh_tw: "命題變項固定共同形式、讓具體值變動；它不是把形式概念命名成一個實體。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 以欄位位置與記錄形狀顯示形式概念，並拒絕把 view 存成 entity。"
        rationale_zh_tw: "view／分類／query 如何選取 entity 可類比形式概念由符號形狀顯示；但此工程判準不等於完整採納早期維根斯坦的形式概念理論。"
        evidence:
          - path: "docs/explainers/entity-vs-view.md"
            kind: heading
            locator: "## 形式概念與真正的概念"
            note_zh_tw: "此節明確區分 view、分類、query 等形式概念與世界中的真正概念。"
    history: []

  - id: "4.127"
    parent: "4.12"
    texts:
      de:
        - "Die Satzvariable bezeichnet den formalen Begriff und ihre Werte die Gegenstände, welche unter diesen Begriff fallen."
      en_ogden_ramsey_1922:
        - "The propositional variable signifies the formal concept, and its values signify the objects which fall under this concept."
    edition_references:
      en_pears_mcguinness: "4.127"
    segments:
      - id: "4.127.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題變項指示形式概念，而它的值則指示落在該概念之下的對象。"
        interpretation_zh_tw: "變項以可取哪些值顯示形式概念；值才是具體對象，兩個層次不能當成同一集合中的成員。"
    project_relations:
