# 數學、等式與替換方法
  - id: "6.2"
    parent: "6"
    texts:
      de:
        - "Die Mathematik ist eine logische Methode."
        - "Die Sätze der Mathematik sind Gleichungen also Scheinsätze."
      en_ogden_ramsey_1922:
        - "Mathematics is a logical method."
        - "The propositions of mathematics are equations, and therefore pseudo-propositions."
    edition_references:
      en_pears_mcguinness: "6.2"
    segments:
      - id: "6.2.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "數學是一種邏輯方法。"
        interpretation_zh_tw: "數學在此被放進形式操作，而非經驗描述。"
      - id: "6.2.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "數學命題是等式，因此是擬命題。"
        interpretation_zh_tw: "「擬命題」表示等式不描繪偶然事態，不是說數學句子為假。"
    project_relations:
