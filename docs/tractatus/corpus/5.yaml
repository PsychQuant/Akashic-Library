  - id: "5.454"
    parent: "5.45"
    texts:
      de:
        - "In der Logik gibt es kein Nebeneinander, kann es keine Klassifikation geben."
        - "In der Logik kann es nicht Allgemeineres und Spezielleres geben."
      en_ogden_ramsey_1922:
        - "In logic there is no side by side, there can be no classification."
        - "In logic there cannot be a more general and a more special."
    edition_references:
      en_pears_mcguinness: "5.454"
    segments:
      - id: "5.454.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯中沒有彼此並列，不能有分類。"
        interpretation_zh_tw: "邏輯形式不是若干外在物種並排後再由我們分箱。"
      - id: "5.454.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "邏輯中也不能有較一般與較特殊之分。"
        interpretation_zh_tw: "真正的一般形式已貫穿所有命題，不能再與特殊形式以同一層次比較。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.454 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：邏輯形式不是一組外在並排、再按層級分類的物種。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
