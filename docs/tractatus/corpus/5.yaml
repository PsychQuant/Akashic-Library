  - id: "5.521"
    parent: "5.52"
    texts:
      de:
        - "Ich trenne den Begriff *Alle* von der Wahrheitsfunktion."
        - "Frege und Russell haben die Allgemeinheit in Verbindung mit dem logischen Produkt oder der logischen Summe eingeführt."
        - "So wurde es schwer, die Sätze „(∃*x*) *. fx*“ und „(*x*) *. fx*“, in welchen beide Ideen beschlossen liegen, zu verstehen."
      en_ogden_ramsey_1922:
        - "I separate the concept *all* from the truth-function."
        - "Frege and Russell have introduced generality in connexion with the logical product or the logical sum."
        - "Then it would be difficult to understand the propositions “(∃*x*) . *fx*” and “(*x*) . *fx*” in which both ideas lie concealed."
    edition_references:
      en_pears_mcguinness: "5.521"
    segments:
      - id: "5.521.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我把「全部」這個概念與真值函數分開。"
        interpretation_zh_tw: "一般性不是合取或選言本身；量化範圍與真值運算必須分辨。"
      - id: "5.521.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "弗雷格與羅素把一般性連同邏輯乘積或邏輯總和一起引入。"
        interpretation_zh_tw: "把量化直接等同於大量合取或選言，會把兩種形式作用綁在同一記號中。"
      - id: "5.521.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "如此便難以理解「(∃x)．fx」與「(x)．fx」，因為兩種觀念都藏在其中。"
        interpretation_zh_tw: "量化與真值運算若未分開，存在式和全稱式各自的形式角色就被遮蔽。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.521 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：一般性不是合取或選言本身，量化範圍與真值運算必須分辨；若量化與合取／選言綁成同一記號，就會遮蔽存在量化與全稱量化各自的形式角色。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
