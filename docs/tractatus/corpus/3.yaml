    texts:
      de:
        - "Sachlagen kann man beschreiben, nicht *benennen*."
        - "\\(Namen gleichen Punkten, Sätze Pfeilen, sie haben Sinn.)"
      en_ogden_ramsey_1922:
        - "States of affairs can be described but not *named*."
        - "\\(Names resemble points; propositions resemble arrows, they have sense.)"
    edition_references:
      en_pears_mcguinness: "3.144"
    segments:
      - id: "3.144.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "狀況可以被描述，不能被命名。"
        interpretation_zh_tw: "描述以有結構的命題指出狀況如何；名稱只能代替對象，不能單獨承擔整個可真假的配置。"
      - id: "3.144.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（名稱像點，命題像箭頭；命題具有意義。）"
        interpretation_zh_tw: "點只標定所指，箭頭則帶有方向與結構；比喻用來凸顯命題超出單一命名的表現能力。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.144 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.144 直接主張「狀況可以被描述，不能被命名。」，本卷並將其限制解讀為「描述以有結構的命題指出狀況如何；名稱只能代替對象，不能單獨承擔整個可真假的配置。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
