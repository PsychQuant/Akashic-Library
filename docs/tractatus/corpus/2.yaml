          - path: "docs/design-principles-and-philosophy.md"
            kind: heading
            locator: "## 14. 早期維根斯坦：圖書館作為世界的圖像"
            note_zh_tw: "該節將 relation／assertion 與 schema／ontology 都列入專案的表現結構。"
    history: []

  - id: "2.062"
    parent: "2.06"
    texts:
      de:
        - "Aus dem Bestehen oder Nichtbestehen eines Sachverhaltes kann nicht auf das Bestehen oder Nichtbestehen eines anderen geschlossen werden."
      en_ogden_ramsey_1922:
        - "From the existence or non-existence of an atomic fact we cannot infer the existence or non-existence of another."
    edition_references:
      en_pears_mcguinness: "2.062"
    segments:
      - id: "2.062.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "不能從一個事態的成立或不成立，推論另一個事態的成立或不成立。"
        interpretation_zh_tw: "這是邏輯獨立性的推論結果：沒有額外命題或經驗法則時，一個基本事態的真值不蘊涵另一個。"
    project_relations:
      - status: intentional_nonconformance
        mode: declared_nonconformance
        claim_zh_tw: "Akashic 允許在明示規則與證據下，從記錄推導或限制其他記錄。"
        rationale_zh_tw: "專案不是簡單事態的真值演算；引用完整性、時間一致性與裁決流程需要跨記錄推論，因此刻意不採用無條件獨立性。"
        evidence:
