  - id: "5.4541"
    parent: "5.454"
    texts:
      de:
        - "Die Lösungen der logischen Probleme müssen einfach sein, denn sie setzen den Standard der Einfachheit."
        - "Die Menschen haben immer geahnt, dass es ein Gebiet von Fragen geben müsse, deren Antworten – a priori – symmetrisch, und zu einem abgeschlossenen, regelmässigen Gebilde vereint liegen."
        - "Ein Gebiet, in dem der Satz gilt: simplex sigillum veri."
      en_ogden_ramsey_1922:
        - "The solution of logical problems must be neat for they set the standard of neatness."
        - "Men have always thought that there must be a sphere of questions whose answers—a priori—are symmetrical and united into a closed regular structure."
        - "A sphere in which the proposition, simplex sigillum veri, is valid."
    edition_references:
      en_pears_mcguinness: "5.4541"
    segments:
      - id: "5.4541.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯問題的解答必須俐落，因為它們設定了俐落的標準。"
        interpretation_zh_tw: "邏輯澄清不能依賴含糊例外；解答本身必須展示完整而一致的形式。"
      - id: "5.4541.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "人們一直認為必有一個問題領域，其答案先於經驗地彼此對稱，並結合成封閉而規整的結構。"
        interpretation_zh_tw: "這個期待來自邏輯答案不受偶然事實左右，應形成可一次掌握的整體。"
      - id: "5.4541.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "在這領域裡，「簡潔是真理的印記」這句話成立。"
        interpretation_zh_tw: "拉丁格言在此把形式簡潔視為邏輯解答無冗餘、無任意補丁的標誌。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.4541 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：邏輯澄清要求完整而無任意例外的形式結構；所謂俐落是邏輯記法的內在要求。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.46"
    parent: "5.4"
    texts:
      de:
        - "Wenn man die logischen Zeichen richtig einführte, so hätte man damit auch schon den Sinn aller ihrer Kombinationen eingeführt; also nicht nur „*p* ∨ *q*“ sondern auch schon „∼(*p* ∨ ∼*q*)“ etc. etc."
        - "Man hätte damit auch schon die Wirkung aller nur möglichen Kombinationen von Klammern eingeführt."
        - "Und damit wäre es klar geworden, dass die eigentlichen allgemeinen Urzeichen nicht die „*p* ∨ *q*“, „(∃*x*) *. fx*“, etc. sind, sondern die allgemeinste Form ihrer Kombinationen."
      en_ogden_ramsey_1922:
        - "When we have rightly introduced the logical signs, the sense of all their combinations has been already introduced with them: therefore not only “*p* ∨ *q*” but also “\\~(*p* ∨ \\~*q*)”, etc. etc."
        - "We should then already have introduced the effect of all possible combinations of brackets; and it would then have become clear that the proper general primitive signs are not “*p* ∨ *q*”, “(∃*x*) . *fx*”, etc., but the most general form of their combinations."
    edition_references:
      en_pears_mcguinness: "5.46"
    segments:
      - id: "5.46.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一旦正確引入邏輯記號，就已連同它們引入所有組合的意義：不只「p∨q」，也包括「~(p∨~q)」等等。"
        interpretation_zh_tw: "正確定義原始記號時，其全部合法組合已由同一套規則確定。"
      - id: "5.46.b"
        alignment:
          de: [1, 2]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "所有可能括號組合的效果也應一併引入；如此就會清楚，真正的一般原始記號不是「p∨q」、「(∃x)．fx」等，而是它們各種組合的最一般形式。"
        interpretation_zh_tw: "德文分兩句、英文以分號合一句；括號範圍與生成通式共同揭示真正基本的是組合形式。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 讓 schema 的合法位置與用法限制記號；這可類比命題 5.46 對記法自行擋錯的要求。"
        rationale_zh_tw: "Akashic schema 能一次列出資料形狀的合法組合與位置，可有限類比記號引入時一併確定其組合；它並沒有證成命題一般形式的完備性。"
        evidence:
          - path: "docs/explainers/entity-vs-view.md"
            kind: heading
            locator: "### 維根斯坦真正用蘇格拉底舉的例子"
            note_zh_tw: "此節以 5.4733 說明同一字形在錯誤位置未獲賦義，錯在記法而非形上學。"
    history: []

  - id: "5.461"
    parent: "5.46"
    texts:
      de:
        - "Bedeutungsvoll ist die scheinbar unwichtige Tatsache, dass die logischen Scheinbeziehungen, wie ∨ und ⊃, der Klammern bedürfen – im Gegensatz zu den wirklichen Beziehungen."
        - "Die Benützung der Klammern mit jenen scheinbaren Urzeichen deutet ja schon darauf hin, dass diese nicht die wirklichen Urzeichen sind."
        - "Und es wird doch wohl niemand glauben, dass die Klammern eine selbständige Bedeutung haben."
      en_ogden_ramsey_1922:
        - "The apparently unimportant fact that the apparent relations like ∨ and ⊃ need brackets—unlike real relations—is of great importance."
        - "The use of brackets with these apparent primitive signs shows that these are not the real primitive signs; and nobody of course would believe that the brackets have meaning by themselves."
    edition_references:
      en_pears_mcguinness: "5.461"
    segments:
      - id: "5.461.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "∨、⊃ 這類表面關係不像真實關係而需要括號，這個看似無關緊要的事實其實極為重要。"
        interpretation_zh_tw: "真實二項關係直接連接名稱，聯結詞卻需以括號標示運算範圍。"
