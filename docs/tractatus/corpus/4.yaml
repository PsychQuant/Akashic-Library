  - id: "4.122"
    parent: "4.12"
    texts:
      de:
        - "Wir können in gewissem Sinne von formalen Eigenschaften der Gegenstände und Sachverhalte bezw. von Eigenschaften der Struktur der Tatsachen reden und in demselben Sinne von formalen Relationen und Relationen von Strukturen."
        - "\\(Statt Eigenschaft der Struktur sage ich auch „interne Eigenschaft“; statt Relation der Strukturen „interne Relation“."
        - "Ich führe diese Ausdrücke ein, um den Grund der, bei den Philosophen sehr verbreiteten Verwechslung zwischen den internen Relationen und den eigentlichen (externen) Relationen zu zeigen.)"
        - "Das Bestehen solcher interner Eigenschaften und Relationen kann aber nicht durch Sätze behauptet werden, sondern es zeigt sich in den Sätzen, welche jene Sachverhalte darstellen und von jenen Gegenständen handeln."
      en_ogden_ramsey_1922:
        - "We can speak in a certain sense of formal properties of objects and atomic facts, or of properties of the structure of facts, and in the same sense of formal relations and relations of structures."
        - "\\(Instead of property of the structure I also say “internal property”; instead of relation of structures “internal relation”."
        - "I introduce these expressions in order to show the reason for the confusion, very widespread among philosophers, between internal relations and proper (external) relations.)"
        - "The holding of such internal properties and relations cannot, however, be asserted by propositions, but it shows itself in the propositions, which present the facts and treat of the objects in question."
    edition_references:
      en_pears_mcguinness: "4.122"
    segments:
      - id: "4.122.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在某種意義下，我們可以談對象與事態的形式性質，或事實結構的性質；同樣也能談形式關係與結構關係。"
        interpretation_zh_tw: "形式性質與形式關係談的是對象、事態或事實必須具有的結構，不是偶然附加的經驗性質。"
      - id: "4.122.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（我也把結構性質稱為「內在性質」，把結構關係稱為「內在關係」。"
        interpretation_zh_tw: "「內在」一詞標示結構所必然帶有的性質或關係，與可有可無的外在關係相對。"
      - id: "4.122.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "我引入這些詞，是為了顯示哲學家常把內在關係與真正的外在關係混淆的根源。）"
        interpretation_zh_tw: "引入術語是為防止把結構必然性誤讀成世界中另一項可觀察關係。"
      - id: "4.122.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "這些內在性質與關係的成立不能由命題斷言，而是在表現相關事實、談論相關對象的命題中顯示自身。"
        interpretation_zh_tw: "內在性質不能由額外命題斷言；它在能合法表現相關事實的命題形式中自行顯示。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.122 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：形式／內在性質不是再添加到對象上的偶然屬性；它在能表現該對象或事態的命題結構中顯現。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.1221"
