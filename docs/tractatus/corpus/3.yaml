  - id: "3.143"
    parent: "3.14"
    texts:
      de:
        - "Dass das Satzzeichen eine Tatsache ist, wird durch die gewöhnliche Ausdrucksform der Schrift oder des Druckes verschleiert."
        - "Denn im gedruckten Satz z. B. sieht das Satzzeichen nicht wesentlich verschieden aus vom Wort."
        - "\\(So war es möglich, dass Frege den Satz einen zusammengesetzten Namen nannte.)"
      en_ogden_ramsey_1922:
        - "That the propositional sign is a fact is concealed by the ordinary form of expression, written or printed."
        - "\\(For in the printed proposition, for example, the sign of a proposition does not appear essentially different from a word."
        - "Thus it was possible for Frege to call the proposition a compounded name.)"
    edition_references:
      en_pears_mcguinness: "3.143"
    segments:
      - id: "3.143.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題記號是一項事實，這一點被書寫或印刷的通常表達形式遮蔽了。"
        interpretation_zh_tw: "線性文字讓整個命題看似與單一詞同類，因而容易忽略字詞的實際排列也是一項結構事實。"
      - id: "3.143.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（例如，在印刷命題中，命題記號看來與詞並無本質差異。"
        interpretation_zh_tw: "印刷外觀把命題的結構排列偽裝成單一詞的形狀；視覺相似不等於邏輯角色相同。"
      - id: "3.143.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "因此，Frege 才可能把命題稱為複合名稱。）"
        interpretation_zh_tw: "Frege 的稱法在此是前述遮蔽所造成的哲學誤讀：可真假的結構不能降成一個較長名稱。"
