        rationale_zh_tw: "此命題的具體內容是：沒有描述性 sense 不表示可從邏輯中刪除；極端式標示運算邊界並在符號演算中有角色。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.462"
    parent: "4.46"
    texts:
      de:
        - "Tautologie und Kontradiktion sind nicht Bilder der Wirklichkeit."
        - "Sie stellen keine mögliche Sachlage dar."
        - "Denn jene lässt *jede* mögliche Sachlage zu, diese *keine*."
        - "In der Tautologie heben die Bedingungen der Übereinstimmung mit der Welt – die darstellenden Beziehungen – einander auf, so dass sie in keiner darstellenden Beziehung zur Wirklichkeit steht."
      en_ogden_ramsey_1922:
        - "Tautology and contradiction are not pictures of the reality."
        - "They present no possible state of affairs."
        - "For the one allows *every* possible state of affairs, the other *none*."
        - "In the tautology the conditions of agreement with the world—the presenting relations—cancel one another, so that it stands in no presenting relation to reality."
    edition_references:
      en_pears_mcguinness: "4.462"
    segments:
      - id: "4.462.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "重言式與矛盾式不是現實的圖像。"
        interpretation_zh_tw: "現實圖像必須挑出一種可能情形；重言式與矛盾式都沒有這種選擇性。"
      - id: "4.462.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "它們不表現任何可能情形。"
        interpretation_zh_tw: "兩者不描繪可拿來與現實比較的特定事態，因此不能當作普通 proposition picture。"
      - id: "4.462.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "前者容許每一種可能情形，後者一種也不容許。"
        interpretation_zh_tw: "全容許與全排除位於表現的兩個極端，都沒有留下某些可能而排除另一些。"
      - id: "4.462.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "在重言式中，與世界相符的條件——表現關係——彼此抵銷，使它與現實沒有任何表現關係。"
        interpretation_zh_tw: "重言式中各表現條件互相抵銷，最終未與現實建立特定表現關係。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.462 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：picture 必須選出某種可能情形；全選與全不選都沒有特定描繪內容，因此不是現實圖像。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
