    texts:
      de:
        - "Obwohl der Satz nur einen Ort des logischen Raumes bestimmen darf, so muss doch durch ihn schon der ganze logische Raum gegeben sein."
        - "\\(Sonst würden durch die Verneinung, die logische Summe, das logische Produkt, etc. immer neue Elemente – in Koordination – eingeführt.)"
        - "\\(Das logische Gerüst um das Bild herum bestimmt den logischen Raum."
        - "Der Satz durchgreift den ganzen logischen Raum.)"
      en_ogden_ramsey_1922:
        - "Although a proposition may only determine one place in logical space, the whole logical space must already be given by it."
        - "\\(Otherwise denial, the logical sum, the logical product, etc., would always introduce new elements—in co-ordination.)"
        - "\\(The logical scaffolding round the picture determines the logical space."
        - "The proposition reaches through the whole logical space.)"
