      en_pears_mcguinness: "2.04"
    segments:
      - id: "2.04.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "所有成立事態的總體就是世界。"
        interpretation_zh_tw: "世界由哪些事態成立來界定，而不是由對象清單界定；Ogden 的 existent atomic facts 在此對應 bestehende Sachverhalte。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "Akashic 的設計原則以事實／事態的總體，而非事物清單，說明其記錄觀。"
        rationale_zh_tw: "這是文件中的結構直覺；有限的研究圖書館不等於世界，也不宣稱已收錄所有成立事態。"
        evidence:
          - path: "docs/design-principles-and-philosophy.md"
            kind: heading
            locator: "## 14. 早期維根斯坦：圖書館作為世界的圖像"
            note_zh_tw: "此節明載世界不是事物清單，而是事實／事態總體。"
    history: []

  - id: "2.05"
    parent: "2"
    texts:
      de:
        - "Die Gesamtheit der bestehenden Sachverhalte bestimmt auch, welche Sachverhalte nicht bestehen."
      en_ogden_ramsey_1922:
        - "The totality of existent atomic facts also determines which atomic facts do not exist."
    edition_references:
      en_pears_mcguinness: "2.05"
    segments:
      - id: "2.05.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "所有成立事態的總體也決定哪些事態不成立。"
        interpretation_zh_tw: "在完整邏輯空間中，實際成立者的總體同時劃定未成立者；這裡預設的是完整世界描述，不是有限觀察。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 現有記錄不會藉由已收錄事態推定所有未收錄事態皆不成立。"
        rationale_zh_tw: "圖書館的知識是開放且可能缺漏的；closed-world 推論會把「尚未記錄」誤寫成「不成立」，違反專案的知識界線。"
    history: []

  - id: "2.06"
    parent: "2"
    texts:
      de:
        - "Das Bestehen und Nichtbestehen von Sachverhalten ist die Wirklichkeit."
        - '\(Das Bestehen von Sachverhalten nennen wir auch eine positive, das Nichtbestehen eine negative Tatsache.)'
      en_ogden_ramsey_1922:
        - "The existence and non-existence of atomic facts is the reality."
        - '\(The existence of atomic facts we also call a positive fact, their non-existence a negative fact.)'
    edition_references:
      en_pears_mcguinness: "2.06"
    segments:
      - id: "2.06.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "事態的成立與不成立就是實在。"
        interpretation_zh_tw: "Wirklichkeit（實在）包含正面的成立與負面的不成立，不只是目前被肯定的事實集合。"
      - id: "2.06.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（我們也把事態的成立稱為正面事實，把事態的不成立稱為負面事實。）"
        interpretation_zh_tw: "括號句界定正面／負面事實；它再次要求把 Sachverhalt 的成立狀態與 Tatsache 的層次分開。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "Akashic 的說明文件以 assertion、truth status、evidence 與 adjudication 分層，避免把可描述內容直接當作已成立事實。"
        rationale_zh_tw: "專案只有知識表述與裁決機制的類比，並不宣稱資料庫窮盡實在中的成立與不成立。"
