  - id: "5.4731"
    parent: "5.473"
    texts:
      de:
        - "Das Einleuchten, von dem Russell so viel sprach, kann nur dadurch in der Logik entbehrlich werden, dass die Sprache selbst jeden logischen Fehler verhindert."
        - "– Dass die Logik a priori ist, besteht darin, dass nicht unlogisch gedacht werden *kann*."
      en_ogden_ramsey_1922:
        - "Self-evidence, of which Russell has said so much, can only be discarded in logic by language itself preventing every logical mistake."
        - "That logic is a priori consists in the fact that we *cannot* think illogically."
    edition_references:
      en_pears_mcguinness: "5.4731"
    segments:
      - id: "5.4731.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "只有讓語言本身阻止每一種邏輯錯誤，才能在邏輯中擺脫羅素反覆訴諸的自明性。"
        interpretation_zh_tw: "健全記法應從結構上排除不合法表達，而不是依賴使用者事後覺得規則自明。"
      - id: "5.4731.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "——邏輯之所以先於經驗，就在於我們不能作非邏輯的思考。"
        interpretation_zh_tw: "邏輯不是由經驗歸納而來；任何可成為思想的內容都已受其形式約束。"
    project_relations:
      - status: analogy_only
        mode: shown_constraint
        claim_zh_tw: "Akashic 讓 schema 的合法位置與用法限制記號；這可類比命題 5.4731 對記法自行擋錯的要求。"
        rationale_zh_tw: "validator 以結構規則擋下錯置，不以使用者覺得「自明」作為通過條件；這是工程檢查的類比，不證成我們不能作非邏輯思考。"
        evidence:
