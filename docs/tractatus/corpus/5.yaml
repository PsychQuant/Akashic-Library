  - id: "5.123"
    parent: "5.12"
    texts:
      de:
        - "Wenn ein Gott eine Welt erschafft, worin gewisse Sätze wahr sind, so schafft er damit auch schon eine Welt, in welcher alle ihre Folgesätze stimmen."
        - "Und ähnlich könnte er keine Welt schaffen, worin der Satz „*p*“ wahr ist, ohne seine sämtlichen Gegenstände zu schaffen."
      en_ogden_ramsey_1922:
        - "If a god creates a world in which certain propositions are true, he creates thereby also a world in which all propositions consequent on them are true."
        - "And similarly he could not create a world in which the proposition “*p*” is true without creating all its objects."
    edition_references:
      en_pears_mcguinness: "5.123"
    segments:
