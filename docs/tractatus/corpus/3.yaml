  - id: "3.1432"
    parent: "3.143"
    texts:
      de:
        - "Nicht: „Das komplexe Zeichen ‚*aRb*‘ sagt, dass *a* in der Beziehung *R* zu *b* steht“, sondern: *Dass* „*a*“ in einer gewissen Beziehung zu „*b*“ steht, sagt, *dass* *aRb*."
      en_ogden_ramsey_1922:
        - "We must not say, “The complex sign ‘*aRb*’ says ‘*a* stands in relation *R* to *b*’”; but we must say, “*That* ‘*a*’ stands in a certain relation to ‘*b*’ says *that aRb*”."
    edition_references:
      en_pears_mcguinness: "3.1432"
    segments:
      - id: "3.1432.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "不應說：「複合記號『*aRb*』說 *a* 與 *b* 處於關係 *R*」；而應說：「『*a*』與『*b*』處於某種關係這件事，說出了 *aRb*。」"
        interpretation_zh_tw: "要點不是整串記號額外命名一項關係，而是記號 a 與 b 在命題記號中的實際配置，描繪了對象 a 與 b 的配置。"
    project_relations:
      - status: partial
        mode: semantic_operation
