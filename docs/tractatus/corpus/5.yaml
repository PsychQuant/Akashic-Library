  - id: "5.52"
    parent: "5.5"
    texts:
      de:
        - "Sind die Werte von *ξ* sämtliche Werte einer Funktion *fx* für alle Werte von *x*, so wird ![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\  = ∼(∃*x*) *. fx*."
      en_ogden_ramsey_1922:
        - "If the values of *ξ* are the total values of a function *fx* for all values of *x*, then ![{ N ( \\bar{\\xi} ) }](images/b3394a04eba3cf3b36ede15e974e646aa098169220c2c60478507502e024c872.svg)\\  = \\~(∃*x*) . *fx*."
    edition_references:
      en_pears_mcguinness: "5.52"
    segments:
      - id: "5.52.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若 ξ 的值是函數 fx 對 x 的一切值所取的全部值，則 N(ξ̄)=~(∃x)．fx。"
        interpretation_zh_tw: "共同否定涵蓋函數的整個值域時，便以量化形式表達「不存在滿足 f 的 x」。"
