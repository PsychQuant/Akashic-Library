  - id: "4.023"
    parent: "4.02"
    texts:
      de:
        - "Die Wirklichkeit muss durch den Satz auf ja oder nein fixiert sein."
        - "Dazu muss sie durch ihn vollständig beschrieben werden."
        - "Der Satz ist die Beschreibung eines Sachverhaltes."
        - "Wie die Beschreibung einen Gegenstand nach seinen externen Eigenschaften, so beschreibt der Satz die Wirklichkeit nach ihren internen Eigenschaften."
        - "Der Satz konstruiert eine Welt mit Hilfe eines logischen Gerüstes und darum kann man am Satz auch sehen, wie sich alles Logische verhält, *wenn* er wahr ist."
        - "Man kann aus einem falschen Satz *Schlüsse ziehen*."
      en_ogden_ramsey_1922:
        - "The proposition determines reality to this extent, that one only needs to say “Yes” or “No” to it to make it agree with reality."
        - "Reality must therefore be completely described by the proposition."
        - "A proposition is the description of a fact."
        - "As the description of an object describes it by its external properties so propositions describe reality by its internal properties."
        - "The proposition constructs a world with the help of a logical scaffolding, and therefore one can actually see in the proposition all the logical features possessed by reality *if* it is true."
        - "One can *draw conclusions* from a false proposition."
    edition_references:
      en_pears_mcguinness: "4.023"
    segments:
      - id: "4.023.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "現實必須由命題固定為可答「是」或「否」。"
        interpretation_zh_tw: "命題必須把邏輯空間切成成立與不成立兩側；這是可判真假的 bipolarity，不是二元搜尋狀態。"
      - id: "4.023.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "為此，命題必須完整描述現實。"
        interpretation_zh_tw: "「完整」要求 truth condition 足以決定何時答是、何時答否，不是列盡現實的一切細節。"
      - id: "4.023.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "命題是對一個事態的描述。"
        interpretation_zh_tw: "命題的描寫對象是一個可能事態，也就是對象可能如何配置。"
      - id: "4.023.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "正如描述依外在性質描述一個對象，命題依內在性質描述現實。"
        interpretation_zh_tw: "命題不是替現實添加外在標籤，而是以自身結構呈現現實可具有的內在配置。"
      - id: "4.023.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "命題藉邏輯鷹架構造一個世界，所以也能從命題看出：若它為真，一切邏輯關係將如何。"
        interpretation_zh_tw: "邏輯鷹架同時給出命題成立時的世界與其推論關係，因此 sense 包含可推導的結構。"
      - id: "4.023.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "人可以從一個假命題推出結論。"
        interpretation_zh_tw: "假命題仍有確定 truth condition，所以仍可參與推論；「為假」不能被誤作「無意義」。"
    project_relations:
      - status: partial
        mode: semantic_operation
        claim_zh_tw: "Akashic 以 YesNoQuestion 對 bounded atom／not expression 明列 yes、no、undetermined；holds 建立 subject 本身，fails 則建立 not(subject) 的 holds valuation，而不把問答壓成檢索 Bool。"
        rationale_zh_tw: "4.023 要求命題劃出可答是或否的 truth condition。現行 slice 已有顯式否定、遞迴 trace 與可達 no：authored 只有在 canonical author-list witness 證成 exact ordered authors 且排除目標 person 時才為 fails；普通資料缺席仍是 undetermined。這只覆蓋一個 predicate 的窄幅 bipolarity，沒有多原子 binary operators、truth table 或等價判定，因此維持 partial。"
        evidence:
          - path: "Sources/AkashicProposition/Question.swift"
            kind: symbol
            locator: "answerSpace"
            note_zh_tw: "`answerSpace` 明列 yes、no 與 undetermined 三種答案。"
          - path: "Sources/AkashicProposition/Question.swift"
            kind: symbol
            locator: "EstablishedAnswer"
            note_zh_tw: "`EstablishedAnswer` 只保存 truth 為 holds 的完整 expression valuation；no 以 `not(subject)` 建立自己的可主張內容。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testAnswerSpaceIncludesUndetermined"
            note_zh_tw: "測試確認 yes-no 問句的答案空間保留 undetermined。"
          - path: "Tests/AkashicPropositionTests/AuthorshipCompletenessPropositionTests.swift"
            kind: test
            locator: "testCanonicalWitnessProducesNoAndExactNegativeFact"
            note_zh_tw: "測試從 canonical witness-backed fails 走到 no、`not(subject)` 的 holds valuation 及 exact negative AcceptedFact。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testUndeterminedAnswerHasNoEstablishedExpression"
            note_zh_tw: "測試確認沒有足夠證據時仍為 undetermined，且不捏造可主張的正負 expression。"
    history:
      - kind: commit
        reference: "e16c6f6e6d77f7cfe7e9d66323aecb174917872c"
        disposition: revised
        note_zh_tw: "e16c6f6 當時新增三值 yes-no answer space但尚未交付可證成的 no；後續 bounded negation 與 canonical witness 已補上該窄幅路徑，整體仍因公式能力邊界而維持 partial。"
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/203"
        disposition: revised
        note_zh_tw: "此 issue 所追蹤的顯式否定、witness-backed fails／no 與負向 fact 窄幅路徑已有直接實作證據；它不等於完整 bipolar truth-condition calculus。"
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "binary operators、truth table 與 formula equivalence 不在本次 unary slice；保留既有 issue identity 作能力邊界。"

  - id: "4.024"
    parent: "4.02"
    texts:
      de:
        - "Einen Satz verstehen, heisst, wissen was der Fall ist, wenn er wahr ist."
        - "\\(Man kann ihn also verstehen, ohne zu wissen, ob er wahr ist.)"
        - "Man versteht ihn, wenn man seine Bestandteile versteht."
      en_ogden_ramsey_1922:
        - "To understand a proposition means to know what is the case, if it is true."
        - "\\(One can therefore understand it without knowing whether it is true or not.)"
        - "One understands it if one understands it constituent parts."
    edition_references:
      en_pears_mcguinness: "4.024"
    segments:
      - id: "4.024.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "理解一個命題，就是知道它為真時何者為實情。"
        interpretation_zh_tw: "理解命題就是知道世界必須如何才使它為真，也就是掌握其 truth condition。"
      - id: "4.024.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（因此即使不知道它是否為真，仍能理解它。）"
        interpretation_zh_tw: "是否知道實際真值，與是否理解命題是兩件事；驗證不能取代 sense。"
      - id: "4.024.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "只要理解它的構成部分，就能理解它。"
        interpretation_zh_tw: "命題的理解具有組合性：掌握成分及其合法結合方式，便能理解整體。"
    project_relations:
      - status: intentional_nonconformance
        mode: declared_nonconformance
        claim_zh_tw: "Akashic 刻意區分可理解、可檢索與已判真三種狀態。"
        rationale_zh_tw: "理解一項記錄只表示能掌握它所主張的情形；索引命中與館藏接受都不等於 world-relative truth。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "## 3. 最簡單的反例：搜尋到一個句子，不等於句子是真的"
            note_zh_tw: "此節直接示範可理解且可命中的句子仍可能為假。"
          - path: "Sources/AkashicProposition/Proposition.swift"
            kind: symbol
            locator: "Proposition"
            note_zh_tw: "`Proposition` 宣告 typed authored 命題的封閉結構。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "evaluate"
            note_zh_tw: "`evaluate(in:)` 對投射結果執行 authored 的開放世界求值。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testAbsenceIsUndeterminedNotFalse"
            note_zh_tw: "測試確認缺少支持資料時維持 undetermined，而非推論為假。"
    history:
      - kind: commit
        reference: "e16c6f6e6d77f7cfe7e9d66323aecb174917872c"
        disposition: retained
        note_zh_tw: "e16c6f6 讓 proposition syntax 與 model valuation 分離，保留本筆不把可表達內容直接當真值的立場。"

  - id: "4.025"
    parent: "4.02"
    texts:
      de:
        - "Die Übersetzung einer Sprache in eine andere geht nicht so vor sich, dass man jeden *Satz* der einen in einen *Satz* der anderen übersetzt, sondern nur die Satzbestandteile werden übersetzt."
        - "\\(Und das Wörterbuch übersetzt nicht nur Substantiva, sondern auch Zeit-, Eigenschafts- und Bindewörter etc.; und es behandelt sie alle gleich.)"
      en_ogden_ramsey_1922:
        - "The translation of one language into another is not a process of translating each proposition of the one into a proposition of the other, but only the constituent parts of propositions are translated."
        - "\\(And the dictionary does not only translate substantives but also adverbs and conjunctions, etc., and it treats them all alike.)"
    edition_references:
      en_pears_mcguinness: "4.025"
    segments:
      - id: "4.025.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "把一種語言翻成另一種語言，不是把前者每個完整命題逐一換成後者命題，而是翻譯命題的構成部分。"
        interpretation_zh_tw: "翻譯必須保存可重新組成命題的成分與角色，不能只建立整句對整句的無結構查表。"
      - id: "4.025.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（字典不只翻名詞，也翻動詞、形容詞與連接詞等，並一視同仁地處理。）"
        interpretation_zh_tw: "字典涵蓋多種詞類，說明翻譯單位不只指物名稱，也包括構成命題關係的其他符號。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.025 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：跨語言對應須處理能重新組成命題的成分；這反對把翻譯理解成兩串完整句子的無結構替換。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.026"
    parent: "4.02"
    texts:
      de:
        - "Die Bedeutungen der einfachen Zeichen (der Wörter) müssen uns erklärt werden, dass wir sie verstehen."
        - "Mit den Sätzen aber verständigen wir uns."
      en_ogden_ramsey_1922:
        - "The meanings of the simple signs (the words) must be explained to us, if we are to understand them."
        - "By means of propositions we explain ourselves."
    edition_references:
      en_pears_mcguinness: "4.026"
    segments:
      - id: "4.026.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "簡單符號（詞）的意義必須有人向我們解釋，我們才能理解。"
        interpretation_zh_tw: "簡單符號本身不描繪事態，其指稱必須透過說明或使用先行建立。"
      - id: "4.026.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "但我們藉命題彼此溝通。"
        interpretation_zh_tw: "命題把已理解的符號組成新配置，因而能傳達一項可能情形，而不必逐詞重新說明。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.026 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：簡單符號需要建立指稱，而完整命題可用這些已理解成分傳達情形；詞義說明與命題溝通扮演不同角色。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.027"
