  - id: "6.113"
    parent: "6.11"
    texts:
      de:
        - "Es ist das besondere Merkmal der logischen Sätze, dass man am Symbol allein erkennen kann, dass sie wahr sind, und diese Tatsache schliesst die ganze Philosophie der Logik in sich."
        - "Und so ist es auch eine der wichtigsten Tatsachen, dass sich die Wahrheit oder Falschheit der nicht-logischen Sätze *nicht* am Satz allein erkennen lässt."
      en_ogden_ramsey_1922:
        - "It is the characteristic mark of logical propositions that one can perceive in the symbol alone that they are true; and this fact contains in itself the whole philosophy of logic."
        - "And so also it is one of the most important facts that the truth or falsehood of non-logical propositions can *not* be recognized from the propositions alone."
    edition_references:
      en_pears_mcguinness: "6.113"
    segments:
      - id: "6.113.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯命題的特徵，是只看符號本身就能認出它為真；這一事實包含整個邏輯哲學。"
        interpretation_zh_tw: "邏輯命題由符號形式顯示其重言性。"
      - id: "6.113.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "同樣重要的是，非邏輯命題的真假不能只由命題本身認出。"
        interpretation_zh_tw: "非邏輯命題仍須與現實比較，不能從句形直接讀出真假。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.113 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.113 的直接論旨是「邏輯命題的特徵，是只看符號本身就能認出它為真；這一事實包含整個邏輯哲學。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.12"
    parent: "6.1"
    texts:
      de:
        - "Dass die Sätze der Logik Tautologien sind, das *zeigt* die formalen – logischen – Eigenschaften der Sprache, der Welt."
        - "Dass ihre Bestandteile *so* verknüpft eine Tautologie ergeben, das charakterisiert die Logik ihrer Bestandteile."
        - "Damit Sätze, auf bestimmte Art und Weise verknüpft, eine Tautologie ergeben, dazu müssen sie bestimmte Eigenschaften der Struktur haben."
        - "Dass sie *so* verbunden eine Tautologie ergeben, zeigt also, dass sie diese Eigenschaften der Struktur besitzen."
      en_ogden_ramsey_1922:
        - "The fact that the propositions of logic are tautologies *shows* the formal—logical—properties of language, of the world."
        - "That its constituent parts connected together *in this way* give a tautology characterizes the logic of its constituent parts."
        - "In order that propositions connected together in a definite way may give a tautology they must have definite properties of structure."
        - "That they give a tautology when *so* connected shows therefore that they possess these properties of structure."
    edition_references:
      en_pears_mcguinness: "6.12"
    segments:
      - id: "6.12.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯命題是重言式這件事，顯示了語言與世界的形式——邏輯——性質。"
        interpretation_zh_tw: "重言式不敘述形式性質，而由自身結構顯示它們。"
      - id: "6.12.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "其組成部分如此連結而形成重言式，刻畫了這些部分的邏輯。"
        interpretation_zh_tw: "連結方式揭露組成命題間的邏輯關係。"
      - id: "6.12.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "命題以特定方式連結要形成重言式，就必須具有特定結構性質。"
        interpretation_zh_tw: "形成重言式的可能性依賴論元結構。"
      - id: "6.12.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "它們如此連結而成為重言式，正顯示它們具有這些結構性質。"
        interpretation_zh_tw: "最後一句以「顯示」取代另一層後設命題。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.12 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.12 的直接論旨是「邏輯命題是重言式這件事，顯示了語言與世界的形式——邏輯——性質。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1201"
    parent: "6.12"
    texts:
      de:
        - "Dass z. B. die Sätze „*p*“ und „∼*p*“ in der Verbindung „∼(*p.*∼*p*)“ eine Tautologie ergeben, zeigt, dass sie einander widersprechen."
        - "Dass die Sätze „*p* ⊃ *q*“, „*p*“ und „*q*“ in der Form „(*p* ⊃ *q*)*.*(*p*) : ⊃ : (*q*)“ miteinander verbunden eine Tautologie ergeben, zeigt, dass *q* aus *p* und *p* ⊃ *q* folgt."
        - "Dass „(*x*) *. fx* : ⊃ : *fa*“ eine Tautologie ist, dass *fa* aus (*x*) *. fx* folgt. etc. etc."
      en_ogden_ramsey_1922:
        - "That *e.g.* the propositions “*p*” and “\\~*p*” in the connexion “\\~(*p* . \\~*p*)” give a tautology shows that they contradict one another."
        - "That the propositions “*p* ⊃ *q*”, “*p*” and “*q*” connected together in the form “(*p* ⊃ *q*) . (*p*) : ⊃ : (*q*)” give a tautology shows that “*q*” follows from “*p*” and “*p* ⊃ *q*”."
        - "That “(*x*) . *fx* : ⊃ : *fa*” is a tautology shows that *fa* follows from (*x*) . *fx*, etc. etc."
    edition_references:
      en_pears_mcguinness: "6.1201"
    segments:
      - id: "6.1201.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "例如，p 與 ∼p 在來源所列連結中形成重言式，顯示兩者互相矛盾。"
        interpretation_zh_tw: "第一個真值形式呈現矛盾關係，不靠經驗反例。"
      - id: "6.1201.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "p ⊃ q、p 與 q 依來源所列形式結合為重言式，顯示 q 可由前兩者推出。"
        interpretation_zh_tw: "第二式把肯定前件推論顯示成重言式。"
      - id: "6.1201.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "全稱式與 fa 所成的重言式，則顯示 fa 可由全稱命題推出，等等。"
        interpretation_zh_tw: "第三式展示全稱實例化；末尾省略的是同類形式例。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1201 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1201 的直接論旨是「例如，p 與 ∼p 在來源所列連結中形成重言式，顯示兩者互相矛盾。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1202"
    parent: "6.12"
    texts:
      de:
        - "Es ist klar, dass man zu demselben Zweck statt der Tautologien auch die Kontradiktionen verwenden könnte."
      en_ogden_ramsey_1922:
        - "It is clear that we could have used for this purpose contradictions instead of tautologies."
    edition_references:
      en_pears_mcguinness: "6.1202"
    segments:
      - id: "6.1202.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "顯然，為了同一目的，也可以用矛盾式取代重言式。"
        interpretation_zh_tw: "重言式與矛盾式都由極端真值結構顯露邏輯關係。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1202 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1202 的直接論旨是「顯然，為了同一目的，也可以用矛盾式取代重言式。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1203"
    parent: "6.12"
    texts:
      de:
        - "Um eine Tautologie als solche zu erkennen, kann man sich, in den Fällen, in welchen in der Tautologie keine Allgemeinheitsbezeichnung vorkommt, folgender anschaulichen Methode bedienen:"
        - "Ich schreibe statt „*p*“, „*q*“, „*r*“ etc. „W*p*F“, „W*q*F“, „W*r*F“ etc."
        - "Die Wahrheitskombinationen drücke ich durch Klammern aus."
        - "z. B.:\n![](images/250px-TLP_6.1203a.png)\\"
        - "und die Zuordnung der Wahr- oder Falschheit des ganzen Satzes und der Wahrheitskombinationen der Wahrheitsargumente durch Striche auf folgende Weise:\n![](images/250px-TLP_6.1203b.png)\\"
        - "Dies Zeichen würde also z. B. den Satz *p* ⊃ *q* darstellen."
        - "Nun will ich z. B. den Satz ∼(*p .* ∼*p*) (Gesetz des Widerspruchs) daraufhin untersuchen, ob er eine Tautologie ist."
        - "Die Form „∼*ξ*“ wird in unserer Notation\n![](images/120px-TLP_6.1203c.png)\\\ngeschrieben;"
        - "die Form „*ξ . η*“ so:\n![](images/250px-TLP_6.1203d.png)\\"
        - "Daher lautet der Satz ∼(*p .* ∼*q*) so:\n![](images/200px-TLP_6.1203e.png)\\"
        - "Setzen wir hier statt „*q*“ „*p*“ ein und untersuchen die Verbindung der äussersten W und F mit den innersten, so ergibt sich, dass die Wahrheit des ganzen Satzes *allen* Wahrheitskombinationen seines Argumentes, seine Falschheit keiner der Wahrheitskombinationen zugeordnet ist."
      en_ogden_ramsey_1922:
        - "In order to recognize a tautology as such, we can, in cases in which no sign of generality occurs in the tautology, make use of the following intuitive method:"
        - "I write instead of “*p*”, “*q*”, “*r*”, etc., “*T p F*”, “*T q F*”, “*T r F*”, etc."
        - "The truth-combinations I express by brackets,"
        - "*e.g.*:\n![](images/300px-TLP_6.1203a-en.png)\\"
        - "and the co-ordination of the truth or falsity of the whole proposition with the truth-combinations of the truth-arguments by lines in the following way:\n![](images/300px-TLP_6.1203b-en.png)\\"
        - "This sign, for example, would therefore present the proposition “*p* ⊃ *q*”."
        - "Now I will proceed to inquire whether such a proposition as \\~(*p* . \\~*p*) (The Law of Contradiction) is a tautology."
        - "The form “\\~*ξ*” is written in our notation\n![](images/250px-TLP_6.1203c-en.png)\\"
        - "the form “*ξ* . *η*” thus:—\n![](images/300px-TLP_6.1203d-en.png)\\"
        - "Hence the proposition \\~(*p* . \\~*q*) runs thus:—\n![](images/250px-TLP_6.1203e-en.png)\\"
        - "If here we put “*p*” instead of “*q*” and examine the combination of the outermost T and F with the innermost, it is seen that the truth of the whole proposition is co-ordinated with *all* the truth-combinations of its argument, its falsity with none of the truth-combinations."
    edition_references:
      en_pears_mcguinness: "6.1203"
    segments:
      - id: "6.1203.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "要辨認不含普遍性記號的式子是否為重言式，可用以下直觀方法。"
        interpretation_zh_tw: "這項圖表法只處理沒有普遍性記號的情形；它不是對所有邏輯式都不加限制的判定程序。"
      - id: "6.1203.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我以 WpF、WqF、WrF 等取代 p、q、r 等命題字母。"
        interpretation_zh_tw: "這一步把每個命題字母改寫成可見的真假兩端，只更換記法，沒有改變命題內容。"
      - id: "6.1203.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "我用括號表示真值組合。"
        interpretation_zh_tw: "括號負責分組論元的可能真值配置，尚未指定整個命題在各配置下的真值。"
      - id: "6.1203.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "例如第一圖所示。"
        interpretation_zh_tw: "第一圖是括號分組的具體例示；圖像本身承接前句所說的配置方式，不是裝飾。"
      - id: "6.1203.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "整個命題的真假與真值論元組合，再用線條依第二圖配對。"
        interpretation_zh_tw: "線條把整體真值規則與論元配置連起來。"
      - id: "6.1203.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "這個記號例如表示 p ⊃ q。"
        interpretation_zh_tw: "蘊涵式是前兩幅圖表如何合讀的示例，不是由圖形外觀自行產生意義。"
      - id: "6.1203.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "現在檢查矛盾律形式是否為重言式。"
        interpretation_zh_tw: "檢查目標是該形式是否在所有真值配置下皆真，而不是用經驗觀察確認它。"
      - id: "6.1203.h"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "否定形式依第三圖寫下。"
        interpretation_zh_tw: "第三圖提供否定運算的局部真值規則。"
      - id: "6.1203.i"
        alignment:
          de: [8]
          en_ogden_ramsey_1922: [8]
        translation_zh_tw: "合取形式依第四圖寫下。"
        interpretation_zh_tw: "第四圖提供合取運算的局部真值規則。"
      - id: "6.1203.j"
        alignment:
          de: [9]
          en_ogden_ramsey_1922: [9]
        translation_zh_tw: "所以待檢查的命題成為第五圖。"
        interpretation_zh_tw: "第五圖把前述否定與合取規則組合起來，仍只是形式表示。"
      - id: "6.1203.k"
        alignment:
          de: [10]
          en_ogden_ramsey_1922: [10]
        translation_zh_tw: "以 p 取代 q，再比較最外與最內的真假，可見整體的真對應所有論元組合，而假不對應任何組合。"
        interpretation_zh_tw: "所有配置皆配到真，才是重言式；圖表是辨認輔具，不增添經驗證據。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1203 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1203 提出一套限於無普遍性記號情形的圖表法，依序改寫命題字母、列出配置並檢查所有真值組合；這是重言式辨認程序。Akashic 的 schema 與程式驗證只規範專案資料，不能據此冒充相同的形式證明。"
    history: []
  - id: "6.121"
    parent: "6.12"
    texts:
      de:
        - "Die Sätze der Logik demonstrieren die logischen Eigenschaften der Sätze, indem sie sie zu nichtssagenden Sätzen verbinden."
        - "Diese Methode könnte man auch eine Nullmethode nennen."
        - "Im logischen Satz werden Sätze miteinander ins Gleichgewicht gebracht und der Zustand des Gleichgewichts zeigt dann an, wie diese Sätze logisch beschaffen sein müssen."
      en_ogden_ramsey_1922:
        - "The propositions of logic demonstrate the logical properties of propositions, by combining them into propositions which say nothing."
        - "This method could be called a zero-method."
        - "In a logical proposition propositions are brought into equilibrium with one another, and the state of equilibrium then shows how these propositions must be logically constructed."
    edition_references:
      en_pears_mcguinness: "6.121"
    segments:
      - id: "6.121.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯命題藉由把命題結合成不說任何事的命題，展示命題的邏輯性質。"
        interpretation_zh_tw: "無經驗內容的組合反而展示形式關係。"
      - id: "6.121.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這種方法也可稱為零方法。"
        interpretation_zh_tw: "「零」比喻真值結果不隨論元配置而改變。"
      - id: "6.121.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "在邏輯命題中，各命題被置於平衡；平衡狀態顯示它們在邏輯上必須如何構成。"
        interpretation_zh_tw: "平衡不是物理狀態，而是重言式的形式恆定。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.121 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.121 的直接論旨是「邏輯命題藉由把命題結合成不說任何事的命題，展示命題的邏輯性質。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.122"
    parent: "6.12"
    texts:
      de:
        - "Daraus ergibt sich, dass wir auch ohne die logischen Sätze auskommen können, da wir ja in einer entsprechenden Notation die formalen Eigenschaften der Sätze durch das blosse Ansehen dieser Sätze erkennen können."
      en_ogden_ramsey_1922:
        - "Whence it follows that we can get on without logical propositions, for we can recognize in an adequate notation the formal properties of the propositions by mere inspection."
    edition_references:
      en_pears_mcguinness: "6.122"
    segments:
      - id: "6.122.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "由此可知，我們也能不靠邏輯命題：在適當記法中，只需查看命題便能認出其形式性質。"
        interpretation_zh_tw: "理想記法應讓邏輯關係可見；這不表示工程系統可省略驗證。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.122 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.122 的直接論旨是「由此可知，我們也能不靠邏輯命題：在適當記法中，只需查看命題便能認出其形式性質。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1221"
    parent: "6.122"
    texts:
      de:
        - "Ergeben z. B. zwei Sätze „*p*“ und „*q*“ in der Verbindung „*p* ⊃ *q*“ eine Tautologie, so ist klar, dass *q* aus *p* folgt."
        - "Dass z. B. „*q*“ aus „*p* ⊃ *q . p*“ folgt, ersehen wir aus diesen beiden Sätzen selbst, aber wir können es auch *so* zeigen, indem wir sie zu „*p* ⊃ *q . p* : ⊃ : *q*“ verbinden und nun zeigen, dass dies eine Tautologie ist."
      en_ogden_ramsey_1922:
        - "If for example two propositions “*p*” and “*q*” give a tautology in the connexion “*p* ⊃ *q*”, then it is clear that “*q*” follows from “*p*”."
        - "E.g. that “*q*” follows from “*p* ⊃ *q* . *p*” we see from these two propositions themselves, but we can also show it by combining them to “*p* ⊃ *q* . *p* : ⊃ : *q*” and then showing that this is a tautology."
    edition_references:
      en_pears_mcguinness: "6.1221"
    segments:
      - id: "6.1221.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "例如，p 與 q 在 p ⊃ q 的連結中形成重言式，就可知 q 由 p 推出。"
        interpretation_zh_tw: "重言式提供推論關係的形式判準。"
      - id: "6.1221.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "q 由 p ⊃ q 與 p 推出，既可由兩式本身看出，也可合成來源所列式並顯示它是重言式。"
        interpretation_zh_tw: "第二種展示把可直接看出的推論改寫成單一重言式。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1221 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1221 的直接論旨是「例如，p 與 q 在 p ⊃ q 的連結中形成重言式，就可知 q 由 p 推出。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1222"
    parent: "6.122"
    texts:
      de:
        - "Dies wirft ein Licht auf die Frage, warum die logischen Sätze nicht durch die Erfahrung bestätigt werden können, ebenso wenig, wie sie durch die Erfahrung widerlegt werden können."
        - "Nicht nur muss ein Satz der Logik durch keine mögliche Erfahrung widerlegt werden können, sondern er darf auch nicht durch eine solche bestätigt werden können."
      en_ogden_ramsey_1922:
        - "This throws light on the question why logical propositions can no more be empirically confirmed than they can be empirically refuted."
        - "Not only must a proposition of logic be incapable of being contradicted by any possible experience, but it must also be incapable of being confirmed by any such."
    edition_references:
      en_pears_mcguinness: "6.1222"
    segments:
      - id: "6.1222.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "這說明為何邏輯命題既不能由經驗確認，也不能由經驗反駁。"
        interpretation_zh_tw: "經驗材料不決定重言式的真。"
      - id: "6.1222.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "邏輯命題不只不能被任何可能經驗反駁，也不能被任何可能經驗確認。"
        interpretation_zh_tw: "若可能經驗能提高其可信度，它就不是此處所說的邏輯命題。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1222 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1222 的直接論旨是「這說明為何邏輯命題既不能由經驗確認，也不能由經驗反駁。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1223"
    parent: "6.122"
    texts:
      de:
        - "Nun wird klar, warum man oft fühlte, als wären die „logischen Wahrheiten“ von uns zu „*fordern*“:"
        - "Wir können sie nämlich insofern fordern, als wir eine genügende Notation fordern können."
      en_ogden_ramsey_1922:
        - "It now becomes clear why we often feel as though “logical truths” must be “*postulated*” by us."
        - "We can in fact postulate them in so far as we can postulate an adequate notation."
    edition_references:
      en_pears_mcguinness: "6.1223"
    segments:
      - id: "6.1223.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "現在可明白，為何人們常覺得必須由我們「要求」邏輯真理。"
        interpretation_zh_tw: "這句提出需要說明的感受：邏輯真理看似必須由人加以要求或設定。"
      - id: "6.1223.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我們能要求它們，只因我們能要求一套充分的記法。"
        interpretation_zh_tw: "後句把要求邏輯真理重解為要求記法充分；可選的是記法，不是任意立法真理。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1223 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1223 先指出邏輯真理似乎須由人要求的感受，再把可要求者限縮為充分記法；它沒有把邏輯真理變成人為政策。Akashic 可選 schema 記法，卻不能因此聲稱其規則就是同一套邏輯形式。"
    history: []
  - id: "6.1224"
    parent: "6.122"
    texts:
      de:
        - "Es wird jetzt auch klar, warum die Logik die Lehre von den Formen und vom Schliessen genannt wurde."
      en_ogden_ramsey_1922:
        - "It also becomes clear why logic has been called the theory of forms and of inference."
    edition_references:
      en_pears_mcguinness: "6.1224"
    segments:
      - id: "6.1224.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "現在也可明白，為何邏輯被稱為形式與推論的學說。"
        interpretation_zh_tw: "形式與推論在符號結構中顯示，不是自然科學的額外對象。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1224 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1224 的直接論旨是「現在也可明白，為何邏輯被稱為形式與推論的學說。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.123"
    parent: "6.12"
    texts:
      de:
        - "Es ist klar: Die logischen Gesetze dürfen nicht selbst wieder logischen Gesetzen unterstehen."
        - "\\(Es gibt nicht, wie Russell meinte, für jede „Type“ ein eigenes Gesetz des Widerspruches, sondern Eines genügt, da es auf sich selbst nicht angewendet wird.)"
      en_ogden_ramsey_1922:
        - "It is clear that the laws of logic cannot themselves obey further logical laws."
        - "\\(There is not, as Russell supposed, for every “type” a special law of contradiction; but one is sufficient, since it is not applied to itself.)"
    edition_references:
      en_pears_mcguinness: "6.123"
    segments:
      - id: "6.123.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "顯然，邏輯法則本身不能再服從更多邏輯法則。"
        interpretation_zh_tw: "否則規範邏輯法則的層級會無止境後退。"
      - id: "6.123.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（並非如羅素所想，每個型別各有一條矛盾律；一條就夠了，因為它不施用於自身。）"
        interpretation_zh_tw: "括號批評羅素的方案，不能改讀成程式型別可任意自我套用。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.123 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.123 的直接論旨是「顯然，邏輯法則本身不能再服從更多邏輯法則。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1231"
    parent: "6.123"
    texts:
      de:
        - "Das Anzeichen des logischen Satzes ist *nicht* die Allgemeingültigkeit."
        - "Allgemein sein, heisst ja nur: Zufälligerweise für alle Dinge gelten."
        - "Ein unverallgemeinerter Satz kann ja ebensowohl tautologisch sein, als ein verallgemeinerter."
      en_ogden_ramsey_1922:
        - "The mark of logical propositions is not their general validity."
        - "To be general is only to be accidentally valid for all things."
        - "An ungeneralized proposition can be tautologous just as well as a generalized one."
    edition_references:
      en_pears_mcguinness: "6.1231"
    segments:
      - id: "6.1231.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯命題的標誌不是普遍有效性。"
        interpretation_zh_tw: "全稱量化不是邏輯性的充分條件。"
      - id: "6.1231.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "普遍只表示碰巧適用於所有事物。"
        interpretation_zh_tw: "「所有」也可能只是經驗上無例外。"
      - id: "6.1231.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "未普遍化的命題同樣可能是重言式。"
        interpretation_zh_tw: "有無量詞與是否重言須分開判定。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1231 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1231 的直接論旨是「邏輯命題的標誌不是普遍有效性。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1232"
    parent: "6.123"
    texts:
      de:
        - "Die logische Allgemeingültigkeit könnte man wesentlich nennen, im Gegensatz zu jener zufälligen, etwa des Satzes „alle Menschen sind sterblich“."
        - "Sätze, wie Russells „Axiom of reducibility“ sind nicht logische Sätze, und dies erklärt unser Gefühl: Dass sie, wenn wahr, so doch nur durch einen günstigen Zufall wahr sein könnten."
      en_ogden_ramsey_1922:
        - "Logical general validity, we could call essential as opposed to accidental general validity, *e.g.* of the proposition “all men are mortal”."
        - "Propositions like Russell’s “axiom of reducibility” are not logical propositions, and this explains our feeling that, if true, they can only be true by a happy chance."
    edition_references:
      en_pears_mcguinness: "6.1232"
    segments:
      - id: "6.1232.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯普遍有效性可稱為本質的，與「所有人都會死」這類偶然普遍性相對。"
        interpretation_zh_tw: "本質有效不能由資料集中零反例建立。"
      - id: "6.1232.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "羅素的可化約公理不是邏輯命題；即使為真，也只能是幸運巧合。"
        interpretation_zh_tw: "可設想公理不成立，顯示其地位不同於重言式。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1232 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1232 的直接論旨是「邏輯普遍有效性可稱為本質的，與「所有人都會死」這類偶然普遍性相對。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1233"
    parent: "6.123"
    texts:
      de:
        - "Es lässt sich eine Welt denken, in der das Axiom of reducibility nicht gilt."
        - "Es ist aber klar, dass die Logik nichts mit der Frage zu schaffen hat, ob unsere Welt wirklich so ist oder nicht."
      en_ogden_ramsey_1922:
        - "We can imagine a world in which the axiom of reducibility is not valid."
        - "But it is clear that logic has nothing to do with the question whether our world is really of this kind or not."
    edition_references:
      en_pears_mcguinness: "6.1233"
    segments:
      - id: "6.1233.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "可以設想一個可化約公理不成立的世界。"
        interpretation_zh_tw: "可設想其失敗，便表示它不是邏輯必然。"
      - id: "6.1233.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "但邏輯不處理我們的世界實際是否如此。"
        interpretation_zh_tw: "世界實際採何種結構是經驗問題。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1233 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1233 的直接論旨是「可以設想一個可化約公理不成立的世界。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.124"
    parent: "6.12"
    texts:
      de:
        - "Die logischen Sätze beschreiben das Gerüst der Welt, oder vielmehr, sie stellen es dar."
        - "Sie „handeln“ von nichts."
        - "Sie setzen voraus, dass Namen Bedeutung, und Elementarsätze Sinn haben:"
        - "Und dies ist ihre Verbindung mit der Welt."
        - "Es ist klar, dass es etwas über die Welt anzeigen muss, dass gewisse Verbindungen von Symbolen – welche wesentlich einen bestimmten Charakter haben – Tautologien sind."
        - "Hierin liegt das Entscheidende."
        - "Wir sagten, manches an den Symbolen, die wir gebrauchen, wäre willkürlich, manches nicht."
        - "In der Logik drückt nur dieses aus: Dass heisst aber, in der Logik drücken nicht *wir* mit Hilfe der Zeichen aus, was wir wollen, sondern in der Logik sagt die Natur der naturnotwendigen Zeichen selbst aus:"
        - "Wenn wir die logische Syntax irgend einer Zeichensprache kennen, dann sind bereits alle Sätze der Logik gegeben."
      en_ogden_ramsey_1922:
        - "The logical propositions describe the scaffolding of the world, or rather they present it."
        - "They “treat” of nothing."
        - "They presuppose that names have meaning, and that elementary propositions have sense."
        - "And this is their connexion with the world."
        - "It is clear that it must show something about the world that certain combinations of symbols—which essentially have a definite character—are tautologies."
        - "Herein lies the decisive point."
        - "We said that in the symbols which we use something is arbitrary, something not."
        - "In logic only this expresses: but this means that in logic it is not *we* who express, by means of signs, what we want, but in logic the nature of the essentially necessary signs itself asserts."
        - "That is to say, if we know the logical syntax of any sign language, then all the propositions of logic are already given."
    edition_references:
      en_pears_mcguinness: "6.124"
    segments:
      - id: "6.124.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯命題描述世界的骨架，更確切地說，是呈現它。"
        interpretation_zh_tw: "「骨架」是形式條件，不是另一組世界事實。"
      - id: "6.124.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "它們不談論任何事。"
        interpretation_zh_tw: "邏輯命題不以某個對象為題材。"
      - id: "6.124.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "它們預設名稱有指涉，而且基本命題有意義。"
        interpretation_zh_tw: "邏輯命題不描述對象，卻以名稱能指涉、基本命題能有意義為運作前提。"
      - id: "6.124.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "這便是它們與世界的聯繫。"
        interpretation_zh_tw: "聯繫不在邏輯命題另述一項事實，而在其符號預設已具有指涉與意義。"
      - id: "6.124.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "具有本質特徵的符號組合會成為重言式，必然顯示世界的某些東西。"
        interpretation_zh_tw: "重言式的可能組合顯示不可任意的結構。"
      - id: "6.124.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "這就是關鍵。"
        interpretation_zh_tw: "短句強調前述區分是論證核心。"
      - id: "6.124.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "所用符號有些成分可任意選擇，有些不可任意。"
        interpretation_zh_tw: "記號外形可約定，邏輯關係不能任意指定。"
      - id: "6.124.h"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "邏輯中不是我們藉記號表達任意所欲，而是本質上必然的記號之本性自行表達。"
        interpretation_zh_tw: "此處把邏輯形式的不可任意性歸於記號的必然結構，不是使用者偏好或格式約定。"
      - id: "6.124.i"
        alignment:
          de: [8]
          en_ogden_ramsey_1922: [8]
        translation_zh_tw: "只要知道任何一種記號語言的邏輯句法，所有邏輯命題便已給定。"
        interpretation_zh_tw: "結論主張完整邏輯句法已決定邏輯命題；它不授權把任何軟體 schema 稱作這種完整句法。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.124 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.124 的直接論旨是「邏輯命題描述世界的骨架，更確切地說，是呈現它。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.125"
    parent: "6.12"
    texts:
      de:
        - "Es ist möglich, und zwar auch nach der alten Auffassung der Logik, von vornherein eine Beschreibung aller „wahren“ logischen Sätze zu geben."
      en_ogden_ramsey_1922:
        - "It is possible, also with the old conception of logic, to give at the outset a description of all “true” logical propositions."
    edition_references:
      en_pears_mcguinness: "6.125"
    segments:
      - id: "6.125.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "即使依舊有的邏輯觀，也能一開始就描述所有「真的」邏輯命題。"
        interpretation_zh_tw: "邏輯命題可由形式辨認；引號提醒此處的真不同於經驗真。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.125 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.125 的直接論旨是「即使依舊有的邏輯觀，也能一開始就描述所有「真的」邏輯命題。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1251"
    parent: "6.125"
    texts:
      de:
        - "Darum kann es in der Logik auch *nie* Überraschungen geben."
      en_ogden_ramsey_1922:
        - "Hence there can *never* be surprises in logic."
    edition_references:
      en_pears_mcguinness: "6.1251"
    segments:
      - id: "6.1251.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "所以邏輯中永遠不會有驚奇。"
        interpretation_zh_tw: "推演只展開形式中已有的關係；不等於人不會在計算時意外。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1251 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1251 的直接論旨是「所以邏輯中永遠不會有驚奇。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.126"
    parent: "6.12"
    texts:
      de:
        - "Ob ein Satz der Logik angehört, kann man berechnen, indem man die logischen Eigenschaften des *Symbols* berechnet."
        - "Und dies tun wir, wenn wir einen logischen Satz „beweisen“."
        - "Denn, ohne uns um einen Sinn und eine Bedeutung zu kümmern, bilden wir den logischen Satz aus anderen nach blossen *Zeichenregeln*."
        - "Der Beweis der logischen Sätze besteht darin, dass wir sie aus anderen logischen Sätzen durch successive Anwendung gewisser Operationen entstehen lassen, die aus den ersten immer wieder Tautologien erzeugen."
        - "(Und zwar *folgen* aus einer Tautologie nur Tautologien.)"
        - "Natürlich ist diese Art zu zeigen, dass ihre Sätze Tautologien sind, der Logik durchaus unwesentlich."
        - "Schon darum, weil die Sätze, von welchen der Beweis ausgeht, ja ohne Beweis zeigen müssen, dass sie Tautologien sind."
      en_ogden_ramsey_1922:
        - "Whether a proposition belongs to logic can be calculated by calculating the logical properties of the *symbol*."
        - "And this we do when we prove a logical proposition."
        - "For without troubling ourselves about a sense and a meaning, we form the logical propositions out of others by mere *symbolic rules*."
        - "We prove a logical proposition by creating it out of other logical propositions by applying in succession certain operations, which again generate tautologies out of the first."
        - "(And from a tautology only tautologies *follow*.)"
        - "Naturally this way of showing that its propositions are tautologies is quite unessential to logic."
        - "Because the propositions, from which the proof starts, must show without proof that they are tautologies."
    edition_references:
      en_pears_mcguinness: "6.126"
    segments:
      - id: "6.126.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一個命題是否屬於邏輯，可藉計算符號的邏輯性質來判定。"
        interpretation_zh_tw: "判定對象是符號形式，不是命題的經驗內容。"
      - id: "6.126.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我們「證明」邏輯命題時正是如此。"
        interpretation_zh_tw: "引號表示此處證明主要是辨認過程。"
      - id: "6.126.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "我們不問意義與指涉，而依純粹記號規則由其他命題形成它。"
        interpretation_zh_tw: "記號規則保持形式，不新增世界事實。"
      - id: "6.126.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "邏輯證明以連續施行運算，從其他邏輯命題再產生重言式。"
        interpretation_zh_tw: "運算鏈只能在重言式範圍內展開。"
      - id: "6.126.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "（重言式只推出重言式。）"
        interpretation_zh_tw: "括號明說推演不會產生有內容命題。"
      - id: "6.126.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "這種顯示命題為重言式的方法，對邏輯並非本質。"
        interpretation_zh_tw: "機械證明協助辨認，卻不使重言式因而成真。"
      - id: "6.126.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "因為證明起點本身必須無需證明就顯示其為重言式。"
        interpretation_zh_tw: "起點仍須由自身形式顯示，避免把證明權威無限上推。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.126 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.126 的直接論旨是「一個命題是否屬於邏輯，可藉計算符號的邏輯性質來判定。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1261"
    parent: "6.126"
    texts:
      de:
        - "In der Logik sind Prozess und Resultat äquivalent."
        - "(Darum keine Überraschung.)"
      en_ogden_ramsey_1922:
        - "In logic process and result are equivalent."
        - "(Therefore no surprises.)"
    edition_references:
      en_pears_mcguinness: "6.1261"
    segments:
      - id: "6.1261.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在邏輯中，過程與結果等價。"
        interpretation_zh_tw: "過程沒有加入經驗內容，結果只展開原有形式。"
      - id: "6.1261.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（因此沒有驚奇。）"
        interpretation_zh_tw: "括號不表示一般程式執行不會失敗或產生副作用。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1261 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1261 的直接論旨是「在邏輯中，過程與結果等價。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1262"
    parent: "6.126"
    texts:
      de:
        - "Der Beweis in der Logik ist nur ein mechanisches Hilfsmittel zum leichteren Erkennen der Tautologie, wo sie kompliziert ist."
      en_ogden_ramsey_1922:
        - "Proof in logic is only a mechanical expedient to facilitate the recognition of tautology, where it is complicated."
    edition_references:
      en_pears_mcguinness: "6.1262"
    segments:
      - id: "6.1262.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯中的證明，只是在重言式複雜時便於辨認它的機械輔具。"
        interpretation_zh_tw: "證明協助人辨認，卻不使重言式因被證明才成真。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.1262 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.1262 的直接論旨是「邏輯中的證明，只是在重言式複雜時便於辨認它的機械輔具。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.1263"
    parent: "6.126"
    texts:
      de:
        - "Es wäre ja auch zu merkwürdig, wenn man einen sinnvollen Satz *logisch* aus anderen beweisen könnte, und einen logischen Satz *auch*."
        - "Es ist von vornherein klar, dass der logische Beweis eines sinnvollen Satzes und der Beweis *in* der Logik zwei ganz verschiedene Dinge sein müssen."
      en_ogden_ramsey_1922:
        - "It would be too remarkable, if one could prove a significant proposition *logically* from another, and a logical proposition *also*."
        - "It is clear from the beginning that the logical proof of a significant proposition and the proof *in* logic must be two quite different things."
    edition_references:
      en_pears_mcguinness: "6.1263"
    segments:
      - id: "6.1263.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若有意義命題與邏輯命題都以同一方式從其他命題證明，那就太奇怪了。"
        interpretation_zh_tw: "前者關乎結論如何由前提成立，後者關乎辨認重言式。"
      - id: "6.1263.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "從一開始就清楚：有意義命題的邏輯證明，與邏輯內部的證明，是兩件完全不同的事。"
        interpretation_zh_tw: "相同的「證明」字樣不能抹平兩種邏輯角色。"
    project_relations:
