    texts:
      de:
        - "Dass z. B. zwei Farben zugleich an einem Ort des Gesichtsfeldes sind, ist unmöglich und zwar logisch unmöglich, denn es ist durch die logische Struktur der Farbe ausgeschlossen."
        - "Denken wir daran, wie sich dieser Widerspruch in der Physik darstellt:"
        - "Ungefähr so, dass ein Teilchen nicht zu gleicher Zeit zwei Geschwindigkeiten haben kann; das heisst, dass es nicht zu gleicher Zeit an zwei Orten sein kann; das heisst, dass Teilchen an verschiedenen Orten zu Einer Zeit nicht identisch sein können."
        - "\\(Es ist klar, dass das logische Produkt zweier Elementarsätze weder eine Tautologie noch eine Kontradiktion sein kann."
        - "Die Aussage, dass ein Punkt des Gesichtsfeldes zu gleicher Zeit zwei verschiedene Farben hat, ist eine Kontradiktion.)"
      en_ogden_ramsey_1922:
        - "For two colours, *e.g.* to be at one place in the visual field, is impossible, logically impossible, for it is excluded by the logical structure of colour."
        - "Let us consider how this contradiction presents itself in physics."
        - "Somewhat as follows: That a particle cannot at the same time have two velocities, *i.e.* that at the same time it cannot be in two places, *i.e.* that particles in different places at the same time cannot be identical."
        - "\\(It is clear that the logical product of two elementary propositions can neither be a tautology nor a contradiction."
        - "The assertion that a point in the visual field has two different colours at the same time, is a contradiction.)"
    edition_references:
      en_pears_mcguinness: "6.3751"
    segments:
      - id: "6.3751.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
