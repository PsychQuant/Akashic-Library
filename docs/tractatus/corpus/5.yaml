  - id: "5.453"
    parent: "5.45"
    texts:
      de:
        - "Alle Zahlen der Logik müssen sich rechtfertigen lassen."
        - "Oder vielmehr: Es muss sich herausstellen, dass es in der Logik keine Zahlen gibt."
        - "Es gibt keine ausgezeichneten Zahlen."
      en_ogden_ramsey_1922:
        - "All numbers in logic must be capable of justification."
        - "Or rather it must become plain that there are no numbers in logic."
        - "There are no pre-eminent numbers."
    edition_references:
      en_pears_mcguinness: "5.453"
    segments:
      - id: "5.453.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "邏輯中的一切數都必須能獲得證成。"
        interpretation_zh_tw: "任何固定項數若出現在邏輯基底中，都不能只是任意選擇。"
      - id: "5.453.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "更確切地說，必須顯明邏輯中沒有數。"
        interpretation_zh_tw: "一般邏輯形式不應依賴某個預先指定的有限數量。"
      - id: "5.453.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "沒有任何特別優先的數。"
        interpretation_zh_tw: "二元、三元或其他項數都不能無理由享有基本地位。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.453 的哲學主張。"
