        rationale_zh_tw: "命題 6.112 的直接論旨是「對邏輯命題的正確說明，必須使它們在所有命題中占有獨特地位。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
