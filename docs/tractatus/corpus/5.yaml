        translation_zh_tw: "若有邏輯的原始記號，正確的邏輯必須說清它們彼此的位置並證成其存在。"
        interpretation_zh_tw: "原始記號不能只是未加說明的清單；每一項都須有不可取代的系統角色。"
      - id: "5.45.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "由原始記號建構邏輯的方式必須清楚。"
        interpretation_zh_tw: "完整的生成規則須顯示整套邏輯如何由這些原始記號形成。"
