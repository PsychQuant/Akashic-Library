  - id: "6.231"
    parent: "6.23"
    texts:
      de:
        - "Es ist eine Eigenschaft der Bejahung, dass man sie als doppelte Verneinung auffassen kann."
        - "Es ist eine Eigenschaft von „1 + 1 + 1 + 1“, dass man es als „(1 + 1) + (1 + 1)“ auffassen kann."
      en_ogden_ramsey_1922:
        - "It is a property of affirmation that it can be conceived as double denial."
        - "It is a property of “1 + 1 + 1 + 1” that it can be conceived as “(1 + 1) + (1 + 1)”."
    edition_references:
      en_pears_mcguinness: "6.231"
    segments:
      - id: "6.231.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "肯定的一項性質，是可以把它理解成雙重否定。"
        interpretation_zh_tw: "第一例顯示不同運算表達可有同一結果。"
      - id: "6.231.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "一加一加一加一的一項性質，是可把它理解成兩組一加一之和。"
        interpretation_zh_tw: "重新分組說明等式所呈現的可替換形式。"
    project_relations:
