        reference: "e16c6f6e6d77f7cfe7e9d66323aecb174917872c"
        disposition: retained
        note_zh_tw: "e16c6f6 以 typed proposition 與端點方向投射補強本筆既有配置類比；原 status 不變。"

  - id: "4.031"
    parent: "4.03"
    texts:
      de:
        - "Im Satz wird gleichsam eine Sachlage probeweise zusammengestellt."
        - "Man kann geradezu sagen: statt, dieser Satz hat diesen und diesen Sinn; dieser Satz stellt diese und diese Sachlage dar."
      en_ogden_ramsey_1922:
        - "In the proposition a state of affairs is, as it were, put together for the sake of experiment."
        - "One can say, instead of, This proposition has such and such a sense, This proposition represents such and such a state of affairs."
    edition_references:
      en_pears_mcguinness: "4.031"
    segments:
      - id: "4.031.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在命題中，彷彿試驗性地組裝出一個事態。"
        interpretation_zh_tw: "命題像模型般先組裝一種可能配置供現實比較；「試驗性」表示尚未預定它為真。"
      - id: "4.031.b"
