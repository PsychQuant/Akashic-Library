        claim_zh_tw: "Akashic 目前沒有把命題 6.231 所論的「肯定的一項性質，是可以把它理解成雙重否定。」設為直接軟體行為。"
        rationale_zh_tw: "命題 6.231 的直接論旨是「肯定的一項性質，是可以把它理解成雙重否定。」；這句處理等式、可替換性或數學演算的形式地位；Akashic 的數值運算不會因表面相似就成為該數學方法的哲學實例。"
