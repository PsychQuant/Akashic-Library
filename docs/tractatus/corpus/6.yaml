  - id: "6.53"
    parent: "6.5"
    texts:
      de:
        - "Die richtige Methode der Philosophie wäre eigentlich die: Nichts zu sagen, als was sich sagen lässt, also Sätze der Naturwissenschaft – also etwas, was mit Philosophie nichts zu tun hat –, und dann immer, wenn ein anderer etwas Metaphysisches sagen wollte, ihm nachzuweisen, dass er gewissen Zeichen in seinen Sätzen keine Bedeutung gegeben hat."
        - "Diese Methode wäre für den anderen unbefriedigend – er hätte nicht das Gefühl, dass wir ihn Philosophie lehrten – aber *sie* wäre die einzig streng richtige."
      en_ogden_ramsey_1922:
        - "The right method of philosophy would be this."
        - "To say nothing except what can be said, *i.e.* the propositions of natural science, *i.e.* something that has nothing to do with philosophy: and then always, when someone else wished to say something metaphysical, to demonstrate to him that he had given no meaning to certain signs in his propositions."
        - "This method would be unsatisfying to the other—he would not have the feeling that we were teaching him philosophy—but it would be the only strictly correct method."
    edition_references:
      en_pears_mcguinness: "6.53"
    segments:
      - id: "6.53.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0, 1]
        translation_zh_tw: "哲學的正確方法是只說可說之物，也就是自然科學命題；有人想說形上學之物時，就指出其命題某些記號沒有指涉。"
        interpretation_zh_tw: "德文第一句對應英譯兩句，將哲學定位為意義澄清而非競爭性理論。"
      - id: "6.53.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "這方法會令對方不滿，但它是唯一嚴格正確的方法。"
        interpretation_zh_tw: "方法的嚴格性來自守住記號意義界線，不來自讓對方滿意。"
    project_relations:
      - status: intentional_nonconformance
