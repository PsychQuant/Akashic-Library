        rationale_zh_tw: "命題 3.13 直接主張「一切屬於投射的，都屬於命題；但被投射者不屬於命題。」，本卷並將其限制解讀為「命題包含使投射成立的形式條件，卻不把它所描繪的世界項目當作自身零件。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
