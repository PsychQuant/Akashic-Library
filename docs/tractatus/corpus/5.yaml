  - id: "5.531"
    parent: "5.53"
    texts:
      de:
        - "Ich schreibe also nicht „*f* (*a, b*) *. a* = *b*“, sondern „*f* (*a, a*)“ (oder „*f* (*b, b*)“)."
        - "Und nicht „*f* (*a, b*) *.* ∼*a* = *b*“, sondern „*f* (*a, b*)“."
      en_ogden_ramsey_1922:
        - "I write therefore not “*f*(*a*, *b*) . *a* = *b*” but “*f*(*a*, *a*)” (or “*f*(*b*, *b*)”)."
        - "And not “*f*(*a*, *b*) . \\~*a* = *b*” but “*f*(*a*, *b*)”."
    edition_references:
      en_pears_mcguinness: "5.531"
    segments:
      - id: "5.531.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "因此我不寫「f(a,b)．a=b」，而寫「f(a,a)」（或「f(b,b)」）。"
        interpretation_zh_tw: "在兩個引數位置重用同一名稱，就足以顯示所涉對象相同。"
      - id: "5.531.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我也不寫「f(a,b)．~a=b」，而直接寫「f(a,b)」。"
        interpretation_zh_tw: "在兩個位置使用不同名稱便顯示對象有別，不必額外加上同一性的否定。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.531 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：同一與差異由引數位置重用同一記號或使用不同記號顯示，等號可從這些式子移除。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
