  - id: "4.124"
    parent: "4.12"
    texts:
      de:
        - "Das Bestehen einer internen Eigenschaft einer möglichen Sachlage wird nicht durch einen Satz ausgedrückt, sondern es drückt sich in dem sie darstellenden Satz, durch eine interne Eigenschaft dieses Satzes aus."
        - "Es wäre ebenso unsinnig, dem Satze eine formale Eigenschaft zuzusprechen, als sie ihm abzusprechen."
      en_ogden_ramsey_1922:
        - "The existence of an internal property of a possible state of affairs is not expressed by a proposition, but it expresses itself in the proposition which presents that state of affairs, by an internal property of this proposition."
        - "It would be as senseless to ascribe a formal property to a proposition as to deny it the formal property."
    edition_references:
      en_pears_mcguinness: "4.124"
    segments:
      - id: "4.124.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "可能情形的一項內在性質之成立，不由命題表達；它透過表現該情形之命題的內在性質自行表達。"
        interpretation_zh_tw: "可能情形的內在性質由表現它的命題結構顯示；另加一句斷言會把形式條件誤作內容。"
      - id: "4.124.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "把一項形式性質歸給命題，與否認命題有該形式性質，同樣無意義。"
        interpretation_zh_tw: "肯定或否定命題具有某形式性質都同樣越界，因為兩者都預設能把形式當普通述詞。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.124 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：形式不是命題可有可無的普通謂詞；能形成該命題的符號結構已顯示形式，正說或反說都錯置層次。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
