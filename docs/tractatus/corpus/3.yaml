      de:
        - "Die Gegenstände kann ich nur *nennen*."
        - "Zeichen vertreten sie."
        - "Ich kann nur *von* ihnen sprechen, *sie aussprechen* kann ich nicht."
        - "Ein Satz kann nur sagen, *wie* ein Ding ist, nicht *was* es ist."
      en_ogden_ramsey_1922:
        - "Objects I can only *name*."
        - "Signs represent them."
        - "I can only speak *of* them."
        - "I cannot *assert them*."
        - "A proposition can only say *how* a thing is, not *what* it is."
    edition_references:
      en_pears_mcguinness: "3.221"
    segments:
      - id: "3.221.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
