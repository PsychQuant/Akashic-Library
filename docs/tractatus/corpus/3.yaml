        rationale_zh_tw: "命題 3.203 直接主張「名稱意指對象。」，本卷並將其限制解讀為「名稱的角色是指向對象；它不把對象的全部性質或內部結構包含在字樣裡。」。這裡處理名稱、簡單記號、分析與對象的表現關係；Akashic entity 不是《論考》的簡單對象，schema 分解也不是唯一的完整分析。"
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "在來源存檔層，被儲存的位元組扮演類比中對象的角色：digest（實作採 sha256）是規範所要求的內容定址，在本條類比裡站在「名」的位置——類比之名住在記號層（記錄層的 provenance 引用），位元組本身不承載 entity 層的名字。"
        rationale_zh_tw: "#223 的 digest-not-path 判準把本命題讀作儲存層的結構類比：內容定址的存檔沒有 entity 名、沒有歷史、沒有生命週期——它只能被 digest 指稱，與「名稱指向對象、不把對象內部結構包含在字樣裡」角色相似。「名」在此取記號層的指稱記號義；evidence note 說存檔「沒有名字」取 entity namespace 的鍵名義，兩義不同、不相斥。本條只取「身分被位元組窮盡——改一 byte 即另一串」這一結構相似，界線有三：並不主張位元組是《論考》意義下的簡單對象（位元組串可分解；見 2.02／2.021 的 rejected）；亦不主張 digest 具備記號的任意性——digest 由內容計算而得、不可依約定更換，與 3.322「記號是任意的」所述相異，此為本類比已知的不相似處；也不由本命題推導任何工程規範——digest 定址的規範理由在 #223 的裁決與 spec 條款自身，《論考》僅提供事後的結構類比。同命題上一條 not_applicable 的否定理由在 entity 層（Akashic entity 不是《論考》的簡單對象），本條肯定的是儲存定址層的有限類比，兩者對象不同、相容並存。"
        evidence:
          - path: "Sources/AkashicStoreIO/SourceStore.swift"
            kind: symbol
            locator: "storeSource"
            note_zh_tw: "本函式自身的 doc comment 明言 digest 算在原始位元組上、判準客觀；其所在 extension 的檔首 doc comment 另明言存檔不是 entity——沒有名字、沒有歷史、沒有生命週期。（原錨 storeSourceContent 於 #224 改名為 storeSource——兩個 PR 各自綠、合上 main 才撞的 cross-PR 漂移，#232 merge 時修正。）"
          - path: "openspec/specs/provenance-reference/spec.md"
            kind: requirement
            locator: "Retrieved content SHALL be addressed by the digest of its bytes"
            note_zh_tw: "digest 定址是 normative 條款：內容以位元組的 digest 指稱。"
          - path: "openspec/specs/entry-source-reference/spec.md"
            kind: requirement
            locator: "Content the store is able to ingest SHALL be referenced by digest rather than by file-system path"
            note_zh_tw: "digest-not-path 判準的另一份 normative 來源，且它明寫理由：路徑在檔案被移動或改名時失效、且不攜帶任何偵測位元組已變的手段，而 digest 是 store 對已存內容既有的身分。本條類比之「名」取的正是此定址義——名指向內容而不把內容的內部結構包進字樣。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/223"
        disposition: revised
        note_zh_tw: "#223 裁決 digest-not-path 判準（2026-08-10），#235 據以掛上 analogy_only 對照；裁決本身有效。本筆標 revised：evidence 曾為已知過渡態——判準的另一份 normative 來源 entry-source-reference 當時活在未合併的 PR #249，而 validator 要求 evidence path 存在於專案內。"
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/252"
        disposition: revised
        note_zh_tw: "PR #249 已於 2026-08-15 合併、entry-source-reference spec 進入專案內，#252 據此補引其 digest-not-path requirement 並重讀 rationale 全文。evidence 的過渡態至此關閉。"
