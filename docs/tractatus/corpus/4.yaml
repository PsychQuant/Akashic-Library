  - id: "4.062"
    parent: "4.06"
    texts:
      de:
        - "Kann man sich nicht mit falschen Sätzen, wie bisher mit wahren, verständigen?"
        - "Solange man nur weiss, dass sie falsch gemeint sind."
        - "Nein!"
        - "Denn, wahr ist ein Satz, wenn es sich so verhält, wie wir es durch ihn sagen; und wenn wir mit „*p*“ ∼*p* meinen, und es sich so verhält wie wir es meinen, so ist „*p*“ in der neuen Auffassung wahr und nicht falsch."
      en_ogden_ramsey_1922:
        - "Can we not make ourselves understood by means of false propositions as hitherto with true ones, so long as we know that they are meant to be false?"
        - "No!"
        - "For a proposition is true, if what we assert by means of it is the case; and if by “*p*” we mean \\~*p*, and what we mean is the case, then “*p*” in the new conception is true and not false."
    edition_references:
      en_pears_mcguinness: "4.062"
    segments:
      - id: "4.062.a"
        alignment:
          de: [0, 1]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "難道不能像用真命題那樣，用假命題讓彼此理解，只要知道它們被當成假的嗎？"
        interpretation_zh_tw: "這個問法試圖把「大家知道它是假的」當成一項溝通慣例，卻仍稱原命題為假。"
      - id: "4.062.b"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "不行！"
        interpretation_zh_tw: "直接否定表示上述方案混淆了符號慣例與命題在該慣例下的真值。"
      - id: "4.062.c"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "因為當我們藉命題所斷言者確實如此，命題就是真的；若我們用「*p*」意指 ∼*p*，而事實又如我們所意指，那麼在這套新理解中「*p*」是真的，不是假的。"
        interpretation_zh_tw: "若重新約定 *p* 表達 ∼*p*，且現實符合所表達者，*p* 在新約定下就是真；改義不會保留同一個假命題。"
    project_relations:
