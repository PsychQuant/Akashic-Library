  - id: "5.156"
    parent: "5.15"
    texts:
      de:
        - "So ist die Wahrscheinlichkeit eine Verallgemeinerung."
        - "Sie involviert eine allgemeine Beschreibung einer Satzform."
        - "Nur in Ermanglung der Gewissheit gebrauchen wir die Wahrscheinlichkeit."
        - "– Wenn wir zwar eine Tatsache nicht vollkommen kennen, wohl aber *etwas* über ihre Form wissen."
        - "\\(Ein Satz kann zwar ein unvollständiges Bild einer gewissen Sachlage sein, aber er ist immer *ein* vollständiges Bild.)"
        - "Der Wahrscheinlichkeitssatz ist gleichsam ein Auszug aus anderen Sätzen."
      en_ogden_ramsey_1922:
        - "Probability is a generalization."
        - "It involves a general description of a propositional form."
        - "Only in default of certainty do we need probability."
        - "If we are not completely acquainted with a fact, but know *something* about its form."
        - "\\(A proposition can, indeed, be an incomplete picture of a certain state of affairs, but it is always *a* complete picture.)"
        - "The probability proposition is, as it were, an extract from other propositions."
    edition_references:
      en_pears_mcguinness: "5.156"
    segments:
      - id: "5.156.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "因此，機率是一種概括。"
        interpretation_zh_tw: "機率把許多具體真值可能性收束成一項一般比例陳述。"
      - id: "5.156.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "它包含對某種命題形式的一般描述。"
        interpretation_zh_tw: "機率陳述保留事件的形式範圍，而不逐一指定哪個具體事實成立。"
      - id: "5.156.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "只有缺乏確定性時，我們才需要機率。"
        interpretation_zh_tw: "完整確定時已知唯一事實，便不需要以可能性比例概括。"
      - id: "5.156.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "——也就是我們未完全掌握一項事實，卻知道其形式的一些內容。"
        interpretation_zh_tw: "未知的是哪個具體事實成立，已知的是它落在哪個形式範圍。"
      - id: "5.156.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "（命題固然可能是某一事態的不完整圖像，但它始終是一幅完整的圖像。）"
        interpretation_zh_tw: "「不完整」指資訊較粗略，不是符號只形成半個命題；命題仍完整決定自己的真假條件。"
      - id: "5.156.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "機率命題彷彿是從其他命題抽取出的摘要。"
        interpretation_zh_tw: "它濃縮背景命題的共同支持，不另外引入一種機率事實。"
