name: Plugin guards

# **為什麼是獨立 workflow 而不是 ci.yml 的一個 step**
#
# `ci.yml` 的 `paths-ignore` 明列 `plugin/**`——一個純 plugin 的 push 不只是
# 「CI 沒跑守衛」，是**整個 CI job 被跳過**。那個排除有真實理由（macOS runner
# 是 10× 計費，2026-08 兩度把免費額度燒光），而它的註解當時寫著排除 plugin 的
# 理由是「plugin shell 沒有任何測試讀取」。
#
# 那句話當時為真、現在為假：`plugin/` 底下已經有五支守衛。#407 R6 的跨模型審查
# 量到這個缺口——「進版控不等於會被執行」。
#
# 解法不是把 `plugin/**` 從那份 paths-ignore 拿掉（那會讓每次改 skill 散文都點
# 一台 10× 計費的 macOS runner，重演被燒光的那件事），而是**按需求分流**：
#
#   * 純 python／bash 的守衛（散文、覆蓋）→ 這裡，ubuntu，1× 計費。
#   * 需要 build 好的 CLI 當 oracle 的 parity 守衛 → `census-parity.yml`，macOS，
#     但觸發路徑**只有三條**（census 本身、parity 測試、它的 oracle
#     `StoreVersion.swift`）。那三條就是「parity 可能因此破掉」的完整條件。
#
# （`ci.yml` 的 macOS job 也有一個 parity step，但它的觸發是 push-to-main ＋
# `paths-ignore: plugin/**`——所以改 census 時它反而被跳過。`census-parity.yml`
# 補的正是那一格；兩者重疊無害。）

# **`Sources/AkashicCore/Venue.swift` 也在觸發路徑裡**：散文守衛的第 5 項讀它，
# 存在的理由正是「規則檔的值域宣稱會與那個 enum 漂移」。只監看 plugin/** 的話，
# 改 enum 不觸發任何跑那個守衛的 workflow——而那正是它防的那個漂移
# （#407 R7 verify）。
on:
  push:
    branches: [main]
    paths: &guard_paths
      - "plugin/**"
      - "Sources/AkashicCore/Venue.swift"
  pull_request:
    paths: *guard_paths

# **最小權限 ＋ 不留憑證**（#407 R8 HIGH）。這兩個 workflow 以 `pull_request`
# 觸發並**執行 PR 端可控的程式碼**（守衛本身就是 PR 可以改的檔案）。
# `actions/checkout` 預設 `persist-credentials: true` 會把 token 留在 git config，
# 於是被改過的守衛腳本可以直接拿它 push。同 repo 的 contributor PR 拿到的 token
# 不像 fork PR 那樣被降權，所以這道防線不能靠外部設定。
permissions:
  contents: read

concurrency:
  group: plugin-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 規則有沒有被每個 skill 掛到，且相對路徑真的解析得到。
      - name: rule-coverage
        run: bash plugin/tests/rule-coverage.sh

      # 散文守衛。`--venue` 顯式指向 checkout 內的原始碼——**不給的話第 5 項會
      # 走「未涵蓋」出口並以 exit 2 表明它沒被執行**（未涵蓋不得冒充通過）。
      # 逐條重建審查者宣稱的失敗情境。純 bash，不需要 build 產物。
      - name: review-claim-audit
        run: bash plugin/tests/review-claim-audit.sh

      - name: rule-prose-guards
        run: python3 plugin/tests/rule-prose-guards.py --venue Sources/AkashicCore/Venue.swift

      # 上一步的每一項都證明會紅。一個從沒紅過的檢查，和一個不存在的檢查，
      # 在報告上長得一模一樣。
      - name: rule-prose-guards negative control
        run: python3 plugin/tests/rule-prose-guards-mutations.py
