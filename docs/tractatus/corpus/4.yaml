  - id: "4.022"
    parent: "4.02"
    texts:
      de:
        - "Der Satz *zeigt* seinen Sinn."
        - "Der Satz *zeigt*, wie es sich verhält, *wenn* er wahr ist."
        - "Und er *sagt*, *dass* es sich so verhält."
      en_ogden_ramsey_1922:
        - "The proposition *shows* its sense."
        - "The proposition *shows* how things stand, *if* it is true."
        - "And it *says*, that they do so stand."
    edition_references:
      en_pears_mcguinness: "4.022"
    segments:
      - id: "4.022.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題顯示它的意義。"
        interpretation_zh_tw: "命題的 Sinn 從其可表現的結構顯現，不是靠額外貼上一個「意義」欄位才獲得。"
      - id: "4.022.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "命題顯示：如果它為真，情形會如何。"
        interpretation_zh_tw: "顯示的是 truth condition：世界必須如何才使命題為真，而不是命題目前是否已被接受。"
      - id: "4.022.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "而它說出：情形確實如此。"
        interpretation_zh_tw: "說出是對現實作斷言；這比符號僅能顯示其可能真實情形多了一項肯定，因此不能由搜尋命中取代。"
    project_relations:
