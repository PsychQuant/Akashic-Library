        rationale_zh_tw: "4.031 把命題理解為試驗性組裝出的事態，尚未預定為真。Proposition、Assertion 與 AcceptedFact 的型別分離直接保存這項先後關係；但現行模型只涵蓋 authored，並非完整事態或 sense 理論。"
