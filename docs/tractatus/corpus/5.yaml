    texts:
      de:
        - "Dieselbe Operation, die „*q*“ aus „*p*“ macht, macht aus „*q*“ „*r*“ u. s. f."
        - "Dies kann nur darin ausgedrückt sein, dass „*p*“, „*q*“, „*r*“, etc. Variable sind, die gewisse formale Relationen allgemein zum Ausdruck bringen."
      en_ogden_ramsey_1922:
        - "The same operation which makes “*q*” from “*p*”, makes “*r*” from “*q*”, and so on."
        - "This can only be expressed by the fact that “*p*”, “*q*”, “*r*”, etc., are variables which give general expression to certain formal relations."
