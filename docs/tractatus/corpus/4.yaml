        claim_zh_tw: "Akashic 已把 authored 的窄幅 truth conditions 寫成 bounded atom／not expression：resolved identity 為 holds、canonical witnessed exclusion 為 fails、其餘保留 undetermined，且 recursive trace 顯示每層否定如何由 operand truth 導出。"
        rationale_zh_tw: "4.431 把命題視為其完整 truth conditions 的表達。現行 evaluator 已直接表達一個 atomic predicate 的正負條件與 unary negation，並避免把資料缺席混同於 truth-table 排除；然而它沒有多原子 binary operators、完整 truth-possibility table、normalization 或 truth-condition equivalence，因此不能宣稱完整實作。"
