  - id: "6.111"
    parent: "6.11"
    texts:
      de:
        - "Theorien, die einen Satz der Logik gehaltvoll erscheinen lassen, sind immer falsch."
        - "Man könnte z. B. glauben, dass die Worte „wahr“ und „falsch“ zwei Eigenschaften unter anderen Eigenschaften bezeichnen, und da erschiene es als eine merkwürdige Tatsache, dass jeder Satz eine dieser Eigenschaften besitzt."
        - "Das scheint nun nichts weniger als selbstverständlich zu sein, ebensowenig selbstverständlich, wie etwa der Satz, „alle Rosen sind entweder gelb oder rot“ klänge, auch wenn er wahr wäre."
        - "Ja, jener Satz bekommt nun ganz den Charakter eines naturwissenschaftlichen Satzes und dies ist das sichere Anzeichen dafür, dass er falsch aufgefasst wurde."
      en_ogden_ramsey_1922:
        - "Theories which make a proposition of logic appear substantial are always false."
        - "One could *e.g.* believe that the words “true” and “false” signify two properties among other properties, and then it would appear as a remarkable fact that every proposition possesses one of these properties."
        - "This now by no means appears self-evident, no more so than the proposition “All roses are either yellow or red” would sound even if it were true."
        - "Indeed our proposition now gets quite the character of a proposition of natural science and this is a certain symptom of its being falsely understood."
    edition_references:
      en_pears_mcguinness: "6.111"
    segments:
      - id: "6.111.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "任何使邏輯命題看似有實質內容的理論總是錯的。"
        interpretation_zh_tw: "邏輯真不是另一項可觀察性質。"
      - id: "6.111.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "人們可能以為「真」與「假」像其他性質一樣，於是每個命題具有其中一種性質就顯得奇特。"
        interpretation_zh_tw: "把真假當普通謂詞，會把形式條件誤作經驗分類。"
      - id: "6.111.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "這絲毫不比「所有玫瑰不是黃的就是紅的」更不證自明，即使後者為真。"
        interpretation_zh_tw: "玫瑰例是偶然概括，不能說明重言式的必然性。"
      - id: "6.111.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "當邏輯命題因此呈現自然科學命題的性格時，正顯示它已被誤解。"
        interpretation_zh_tw: "自然科學式讀法需要經驗內容，恰與邏輯命題的角色衝突。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.111 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.111 的直接論旨是「任何使邏輯命題看似有實質內容的理論總是錯的。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.112"
    parent: "6.11"
    texts:
      de:
        - "Die richtige Erklärung der logischen Sätze muss ihnen eine einzigartige Stellung unter allen Sätzen geben."
      en_ogden_ramsey_1922:
        - "The correct explanation of logical propositions must give them a peculiar position among all propositions."
    edition_references:
      en_pears_mcguinness: "6.112"
    segments:
      - id: "6.112.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "對邏輯命題的正確說明，必須使它們在所有命題中占有獨特地位。"
        interpretation_zh_tw: "獨特性來自形式與真值條件，不是較高權威或特殊資料標籤。"
    project_relations:
