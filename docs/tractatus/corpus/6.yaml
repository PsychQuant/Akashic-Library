  - id: "6.211"
    parent: "6.21"
    texts:
      de:
        - "Im Leben ist es ja nie der mathematische Satz, den wir brauchen, sondern wir benützen den mathematischen Satz *nur*, um aus Sätzen, welche nicht der Mathematik angehören, auf andere zu schliessen, welche gleichfalls nicht der Mathematik angehören."
        - "\\(In der Philosophie führt die Frage „wozu gebrauchen wir eigentlich jenes Wort, jenen Satz“ immer wieder zu wertvollen Einsichten.)"
      en_ogden_ramsey_1922:
        - "In life it is never a mathematical proposition which we need, but we use mathematical propositions *only* in order to infer from propositions which do not belong to mathematics to others which equally do not belong to mathematics."
        - "\\(In philosophy the question “Why do we really use that word, that proposition?” constantly leads to valuable results.)"
    edition_references:
      en_pears_mcguinness: "6.211"
    segments:
      - id: "6.211.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "生活中需要的從來不是數學命題本身；我們只用它從非數學命題推到其他非數學命題。"
        interpretation_zh_tw: "數學命題在生活推論中充當形式中介，而不是待比對的生活事實。"
      - id: "6.211.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（在哲學中，反覆追問我們究竟拿某個詞或命題做什麼，總會帶來有價值的洞見。）"
        interpretation_zh_tw: "括號把注意力轉向語句使用，是方法提醒而非使用頻率統計。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前沒有把命題 6.211 所論的「生活中需要的從來不是數學命題本身；我們只用它從非數學命題推到其他非數學命題。」設為直接軟體行為。"
