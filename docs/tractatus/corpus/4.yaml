        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.123 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：內在性質由不可設想其缺失來界定；例子的必然關係取決於如何界定對象，因而也暴露術語層次可能游移。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
