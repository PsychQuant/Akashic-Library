          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "命題只能說一個事物是如何，不能說它是什麼。"
        interpretation_zh_tw: "命題描繪對象的可能配置，而不把對象的形式本質當成另一項同類性質加以陳述。"
