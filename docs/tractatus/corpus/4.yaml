schema_version: 1
volume: "4"
propositions:
  - id: "4"
    texts:
      de:
        - "Der Gedanke ist der sinnvolle Satz."
      en_ogden_ramsey_1922:
        - "The thought is the significant proposition."
    edition_references:
      en_pears_mcguinness: "4"
    segments:
      - id: "4.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "思想就是有意義的命題。"
        interpretation_zh_tw: "此處的「思想」不是一閃即逝的心理事件，而是具有 Sinn（意義／意旨）、能表現某種情形的 Satz（命題）。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：此處的「思想」不是一閃即逝的心理事件，而是具有 Sinn（意義／意旨）、能表現某種情形的 Satz（命題）。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.001"
    parent: "4"
    texts:
      de:
        - "Die Gesamtheit der Sätze ist die Sprache."
      en_ogden_ramsey_1922:
        - "The totality of propositions is the language."
    edition_references:
      en_pears_mcguinness: "4.001"
    segments:
      - id: "4.001.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題的總體就是語言。"
        interpretation_zh_tw: "語言在此由全部可形成意義的命題界定，不只是字彙、聲音或符號的清單。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.001 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：語言在此由全部可形成意義的命題界定，不只是字彙、聲音或符號的清單。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.002"
    parent: "4"
    texts:
      de:
        - "Der Mensch besitzt die Fähigkeit Sprachen zu bauen, womit sich jeder Sinn ausdrücken lässt, ohne eine Ahnung davon zu haben, wie und was jedes Wort bedeutet."
        - "– Wie man auch spricht, ohne zu wissen, wie die einzelnen Laute hervorgebracht werden."
        - "Die Umgangssprache ist ein Teil des menschlichen Organismus und nicht weniger kompliziert als dieser."
        - "Es ist menschenunmöglich, die Sprachlogik aus ihr unmittelbar zu entnehmen."
        - "Die Sprache verkleidet den Gedanken."
        - "Und zwar so, dass man nach der äusseren Form des Kleides, nicht auf die Form des bekleideten Gedankens schliessen kann; weil die äussere Form des Kleides nach ganz anderen Zwecken gebildet ist, als danach, die Form des Körpers erkennen zu lassen."
        - "Die stillschweigenden Abmachungen zum Verständnis der Umgangssprache sind enorm kompliziert."
      en_ogden_ramsey_1922:
        - "Man possesses the capacity of constructing languages, in which every sense can be expressed, without having an idea how and what each word means—just as one speaks without knowing how the single sounds are produced."
        - "Colloquial language is a part of the human organism and is not less complicated than it."
        - "From it it is humanly impossible to gather immediately the logic of language."
        - "Language disguises the thought; so that from the external form of the clothes one cannot infer the form of the thought they clothe, because the external form of the clothes is constructed with quite another object than to let the form of the body be recognized."
        - "The silent adjustments to understand colloquial language are enormously complicated."
    edition_references:
      en_pears_mcguinness: "4.002"
    segments:
      - id: "4.002.a"
        alignment:
          de: [0, 1]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "人具有建構語言的能力，任何意義都能藉此表達，而無須知道每個詞如何、意指什麼——正如人會說話卻不知道個別聲音如何產生。"
        interpretation_zh_tw: "語言使用能力先於一套明說的詞義理論；會說話不表示已能逐條說明聲音與詞如何運作。"
      - id: "4.002.b"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "日常語言是人體有機體的一部分，其複雜程度不下於人體。"
        interpretation_zh_tw: "日常語言嵌入人的生活與實作，其複雜性不能縮成一張簡單詞彙表。"
      - id: "4.002.c"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "人不可能直接從中抽取語言邏輯。"
        interpretation_zh_tw: "不能由表面用法直接讀出語言邏輯；分析需要另外辨明符號角色與組合條件。"
      - id: "4.002.d"
        alignment:
          de: [4, 5]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "語言把思想包裹起來；人不能由衣服外形推知被包裹思想的形式，因為衣服外形依別的目的製成，不是為了顯示身體形狀。"
        interpretation_zh_tw: "「衣服」比喻警告：表面文法受溝通等多重目的塑造，不等於被表達思想的邏輯形式。"
      - id: "4.002.e"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "理解日常語言所依賴的默契極為複雜。"
        interpretation_zh_tw: "默契使日常理解成為可能，卻高度複雜；共同使用不保證背後有一條可直接抄出的簡單規則。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.002 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：語言能力可以先於明說的語法理論；日常語言的表面形式受多重用途塑造，因而可能遮蔽思想的邏輯結構，不能把表面文法直接當成邏輯形式。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.003"
    parent: "4"
    texts:
      de:
        - "Die meisten Sätze und Fragen, welche über philosophische Dinge geschrieben worden sind, sind nicht falsch, sondern unsinnig."
        - "Wir können daher Fragen dieser Art überhaupt nicht beantworten, sondern nur ihre Unsinnigkeit feststellen."
        - "Die meisten Fragen und Sätze der Philosophen beruhen darauf, dass wir unsere Sprachlogik nicht verstehen."
        - "\\(Sie sind von der Art der Frage, ob das Gute mehr oder weniger identisch sei als das Schöne.)"
        - "Und es ist nicht verwunderlich, dass die tiefsten Probleme eigentlich *keine* Probleme sind."
      en_ogden_ramsey_1922:
        - "Most propositions and questions, that have been written about philosophical matters, are not false, but senseless."
        - "We cannot, therefore, answer questions of this kind at all, but only state their senselessness."
        - "Most questions and propositions of the philosophers result from the fact that we do not understand the logic of our language."
        - "\\(They are of the same kind as the question whether the Good is more or less identical than the Beautiful.)"
        - "And so it is not to be wondered at that the deepest problems are really *no* problems."
    edition_references:
      en_pears_mcguinness: "4.003"
    segments:
      - id: "4.003.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "多數關於哲學事項而寫的命題與問題，不是錯誤，而是無意義。"
        interpretation_zh_tw: "這裡的「無意義」不是「答案為假」：有些哲學問句根本沒有形成可判真的命題。"
      - id: "4.003.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因此，我們完全不能回答這類問題，只能指出它們的無意義。"
        interpretation_zh_tw: "對未形成意義的問題，增加搜尋結果也不會產生答案；工作是指出它為何沒有合法的可能答案。"
      - id: "4.003.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "哲學家的多數問題與命題，都源自我們不理解自己語言的邏輯。"
        interpretation_zh_tw: "病灶在於誤解語言的邏輯，而非單純缺少資料；因此哲學澄清不同於資訊檢索。"
      - id: "4.003.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（它們就像問：善比美更同一，還是較不同一？）"
        interpretation_zh_tw: "「善比美更同一嗎」把不適用的比較結構硬套到概念上，示範語法像問句、卻沒有清楚 truth condition。"
      - id: "4.003.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "所以，最深的問題其實根本不是問題，也就不足為奇。"
        interpretation_zh_tw: "所謂最深問題的消解，是看出它未成為問題；不能把「查無結果」誤作這項哲學結論。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "Akashic 明確區分 query 與作出事實斷言的 proposition。"
        rationale_zh_tw: "問句組織可判定的可能答案，並不因有問號就成為一幅真或假的圖像；這項區分可類比本命題對可回答與未形成意義之問題的檢查，但專案不把哲學問句一概判為無意義。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "### 回應：問題是對 logical space 的切分操作"
            note_zh_tw: "此節說明問題以可能答案切分邏輯空間，而問題本身不是 fact。"
          - path: "Sources/AkashicProposition/Question.swift"
            kind: symbol
            locator: "YesNoQuestion"
            note_zh_tw: "`YesNoQuestion` 保存待回答的 typed proposition。"
          - path: "Sources/AkashicProposition/Question.swift"
            kind: symbol
            locator: "Stance"
            note_zh_tw: "`Stance` 區分 established 與 questioned 的來源立場。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testQuestionedStanceCannotBecomeFact"
            note_zh_tw: "測試確認 questioned stance 不得升格為 AcceptedFact。"
    history:
      - kind: commit
        reference: "e16c6f6e6d77f7cfe7e9d66323aecb174917872c"
        disposition: retained
        note_zh_tw: "e16c6f6 使 questioned stance 與 fact acceptance 的區別可由型別與測試驗證，保留本筆問句澄清類比。"

  - id: "4.0031"
    parent: "4.003"
    texts:
      de:
        - "Alle Philosophie ist „Sprachkritik“."
        - "(Allerdings nicht im Sinne Mauthners.)"
        - "Russell’s Verdienst ist es, gezeigt zu haben, dass die scheinbare logische Form des Satzes nicht seine wirkliche sein muss."
      en_ogden_ramsey_1922:
        - "All philosophy is “Critique of language” (but not at all in Mauthner’s sense)."
        - "Russell’s merit is to have shown that the apparent logical form of the proposition need not be its real form."
    edition_references:
      en_pears_mcguinness: "4.0031"
    segments:
      - id: "4.0031.a"
        alignment:
          de: [0, 1]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一切哲學都是「語言批判」（當然不是毛特納所說的意義）。"
        interpretation_zh_tw: "「語言批判」指澄清表達的邏輯界線；括註排除把它等同毛特納式的一般語言懷疑論。"
      - id: "4.0031.b"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "羅素的功績在於顯示：命題表面的邏輯形式不必就是它真正的邏輯形式。"
        interpretation_zh_tw: "日常文法外觀可能遮蔽實際邏輯結構，因此不能把表面句法或 schema 直接當成 logical form。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.0031 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：哲學工作被理解為揭露語句表面文法與實際邏輯結構的落差；這不等於只做文字校對。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.01"
    parent: "4"
    texts:
      de:
        - "Der Satz ist ein Bild der Wirklichkeit."
        - "Der Satz ist ein Modell der Wirklichkeit, so wie wir sie uns denken."
      en_ogden_ramsey_1922:
        - "The proposition is a picture of reality."
        - "The proposition is a model of the reality as we think it is."
    edition_references:
      en_pears_mcguinness: "4.01"
    segments:
      - id: "4.01.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題是現實的圖像。"
        interpretation_zh_tw: "Bild 應譯為「圖像」：命題藉其元素配置表現現實中的可能配置，不是把句子當照片。"
      - id: "4.01.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "命題是我們所思考之現實的模型。"
        interpretation_zh_tw: "模型提供一種可與現實比較的結構；「如我們所思考」提醒這是表現出的可能情形，尚不等於已成立的事實。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "Akashic 文件以元素、配置與投射規則說明 record 的 picture-like 功能。"
        rationale_zh_tw: "這項映射只解釋結構性表現，不宣稱每份 record 都是單一命題，也不把 Akashic 完整等同《邏輯哲學論》的圖像論。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 2. logical picture 的最小結構"
            note_zh_tw: "此節明列 picture 的 elements、configuration、projection rule 與 sense。"
    history: []

  - id: "4.011"
    parent: "4.01"
    texts:
      de:
        - "Auf den ersten Blick scheint der Satz – wie er etwa auf dem Papier gedruckt steht – kein Bild der Wirklichkeit zu sein, von der er handelt."
        - "Aber auch die Notenschrift scheint auf den ersten Blick kein Bild der Musik zu sein, und unsere Lautzeichen- (Buchstaben-)Schrift kein Bild unserer Lautsprache."
        - "Und doch erweisen sich diese Zeichensprachen auch im gewöhnlichen Sinne als Bilder dessen, was sie darstellen."
      en_ogden_ramsey_1922:
        - "At the first glance the proposition—say as it stands printed on paper—does not seem to be picture of the reality of which it treats."
        - "But nor does the musical score appear at first sight to be a picture of a musical piece; nor does our phonetic spelling (letters) seem to be a picture of our spoken language."
        - "And yet these symbolisms prove to be pictures—even in the ordinary sense of the word—of what they represent."
    edition_references:
      en_pears_mcguinness: "4.011"
    segments:
      - id: "4.011.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "乍看之下，命題——例如印在紙上的樣子——似乎不是它所談現實的圖像。"
        interpretation_zh_tw: "紙面字形不像現實，並不能否定命題的圖像功能；Bild 的判準不是視覺相似。"
      - id: "4.011.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "但樂譜乍看也不像音樂，我們的聲音符號（字母）書寫也不像口語。"
        interpretation_zh_tw: "樂譜與拼音文字提供反例：載體外觀可與所表現者不同，仍能依規則重建音樂或語音。"
      - id: "4.011.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "然而，這些符號語言即使按「圖像」一詞的日常意義來說，仍顯示為它們所表現之物的圖像。"
        interpretation_zh_tw: "符號語言之所以是圖像，在於符號配置可系統性對應所表現的配置，而非字形模仿對象。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.011 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：是否為 picture 不由外觀相似判定，而由符號配置與被表現配置之間是否有可遵循的對應規則判定。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.012"
    parent: "4.01"
    texts:
      de:
        - "Offenbar ist, dass wir einen Satz von der Form „*aRb*“ als Bild empfinden."
        - "Hier ist das Zeichen offenbar ein Gleichnis des Bezeichneten."
      en_ogden_ramsey_1922:
        - "It is obvious that we perceive a proposition of the form *aRb* as a picture."
        - "Here the sign is obviously a likeness of the signified."
    edition_references:
      en_pears_mcguinness: "4.012"
    segments:
      - id: "4.012.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "顯然，我們會把「*aRb*」形式的命題感受為圖像。"
        interpretation_zh_tw: "在 *aRb* 中，名稱的位置與關係符號的結合直接展示一個可能的關係事態。"
      - id: "4.012.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這裡，符號顯然是被指稱者的譬喻。"
        interpretation_zh_tw: "符號作為譬喻，指的是其結構角色可對應被指稱者，不是字母外形與對象相像。"
    project_relations:
      - status: analogy_only
        mode: structural_invariant
        claim_zh_tw: "Akashic 的解說以關係端點的實際配置，而非字串並排，類比 *aRb* 的圖像結構。"
        rationale_zh_tw: "有型別與方向的 relation 可保存配置差異；但這仍是工程詮釋，不證明 Akashic schema 就是現實的 logical form。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "### 3.2 `aRb`：不是符號列，而是符號之間真的有配置"
            note_zh_tw: "此節以端點、relation、方向與投射規則分析 *aRb*。"
          - path: "Sources/AkashicProposition/Proposition.swift"
            kind: symbol
            locator: "Proposition"
            note_zh_tw: "`Proposition` 宣告 typed authored 命題的封閉結構。"
          - path: "Sources/AkashicProposition/Projection.swift"
            kind: symbol
            locator: "project"
            note_zh_tw: "`project(in:)` 依端點身分與角色方向建立投射。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testReversedArgumentsReportWrongEntityKind"
            note_zh_tw: "測試確認反轉端點時會因實體種類錯誤而拒絕投射。"
    history:
      - kind: commit
        reference: "e16c6f6e6d77f7cfe7e9d66323aecb174917872c"
        disposition: retained
        note_zh_tw: "e16c6f6 以 person／work 具名角色與方向檢查提供 aRb 配置類比的現行證據。"

  - id: "4.013"
    parent: "4.01"
    texts:
      de:
        - "Und wenn wir in das Wesentliche dieser Bildhaftigkeit eindringen, so sehen wir, dass dieselbe durch *scheinbare Unregelmässigkeiten* (wie die Verwendung der ♯ und ♭ in der Notenschrift) *nicht* gestört wird."
        - "Denn auch diese Unregelmässigkeiten bilden das ab, was sie ausdrücken sollen; nur auf eine andere Art und Weise."
      en_ogden_ramsey_1922:
        - "And if we penetrate to the essence of this pictorial nature we see that this is not disturbed by *apparent irregularities* (like the use of ♯ and ♭ in the score)."
        - "For these irregularities also picture what they are to express; only in another way."
    edition_references:
      en_pears_mcguinness: "4.013"
    segments:
      - id: "4.013.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
