        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在事態中，對象彼此扣連，如同鏈條的環節。"
        interpretation_zh_tw: "鏈條比喻強調對象不是靠額外黏著物集合，而是彼此的特定聯結本身構成事態。"
    project_relations:
      - status: analogy_only
        mode: structural_invariant
        claim_zh_tw: "Akashic 的關係記錄以端點角色表現項目如何聯結，而非只把項目放進無結構清單。"
        rationale_zh_tw: "這只類比「關係配置承載意義」；端點 entity 仍不是 Tractatus 的簡單對象。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 3. 維根斯坦自己的例子，以及它們對 Akashic 的意義"
            note_zh_tw: "此節以端點、relation 與方向說明配置的工程意義。"
    history: []

