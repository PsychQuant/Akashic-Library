          - path: "Sources/AkashicProposition/Question.swift"
            kind: symbol
            locator: "YesNoQuestion"
            note_zh_tw: "`YesNoQuestion` 保存待回答的 expression，並預留一層可表示 no-answer 的 negation budget。"
          - path: "Sources/AkashicProposition/Question.swift"
            kind: symbol
            locator: "EstablishedAnswer"
            note_zh_tw: "`EstablishedAnswer` 將 determinate 答案綁在其確切 holds expression valuation，而非只留 yes／no label。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testAnswerSpaceIncludesUndetermined"
            note_zh_tw: "測試確認 yes-no 問句的答案空間保留 undetermined。"
          - path: "Tests/AkashicPropositionTests/PropositionTests.swift"
            kind: test
            locator: "testQuestionedStanceCannotBecomeFact"
            note_zh_tw: "測試確認 questioned stance 不得升格為 AcceptedFact。"
          - path: "Tests/AkashicPropositionTests/AuthorshipCompletenessPropositionTests.swift"
            kind: test
            locator: "testCanonicalWitnessProducesNoAndExactNegativeFact"
            note_zh_tw: "測試確認 canonical witnessed exclusion 可達 no，並建立 `not(subject)` 的 holds valuation 與 exact negative fact。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testNegativeSubjectNoAnswerEstablishesStructuralDoubleNegation"
            note_zh_tw: "測試確認負向 subject 的 no 仍以結構式 `not(subject)` 表達，不把雙重否定偷化簡。"
          - path: "Tests/AkashicPropositionTests/NegationTests.swift"
            kind: test
            locator: "testUndeterminedAnswerHasNoEstablishedExpression"
            note_zh_tw: "測試確認 undetermined 不會獲得可被後續斷言的虛構答案 expression。"
