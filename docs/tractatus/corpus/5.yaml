          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "但所有邏輯命題都說同一件事。"
        interpretation_zh_tw: "邏輯命題共有必然形式，而不各自增加一項經驗資訊。"
      - id: "5.43.c"
