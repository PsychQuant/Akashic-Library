    parent: "3.341"
    texts:
      de:
        - "Man könnte also sagen: Der eigentliche Name ist das, was alle Symbole, die den Gegenstand bezeichnen, gemeinsam haben."
        - "Es würde sich so successive ergeben, dass keinerlei Zusammensetzung für den Namen wesentlich ist."
      en_ogden_ramsey_1922:
        - "One could therefore say the real name is that which all symbols, which signify an object, have in common."
        - "It would then follow, step by step, that no sort of composition was essential for a name."
