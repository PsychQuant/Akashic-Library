  - id: "3.1431"
    parent: "3.143"
    texts:
      de:
        - "Sehr klar wird das Wesen des Satzzeichens, wenn wir es uns, statt aus Schriftzeichen, aus räumlichen Gegenständen (etwa Tischen, Stühlen, Büchern) zusammengesetzt denken."
        - "Die gegenseitige räumliche Lage dieser Dinge drückt dann den Sinn des Satzes aus."
      en_ogden_ramsey_1922:
        - "The essential nature of the propositional sign becomes very clear when we imagine it made up of spatial objects (such as tables, chairs, books) instead of written signs."
        - "The mutual spatial position of these things then expresses the sense of the proposition."
    edition_references:
      en_pears_mcguinness: "3.1431"
    segments:
      - id: "3.1431.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若不把命題記號想成由書寫記號，而想成由空間物件（例如桌子、椅子、書）組成，命題記號的本質就會變得非常清楚。"
        interpretation_zh_tw: "換掉文字載體後，仍保留的是物件彼此的配置；這使「命題記號是一項事實」不再被字串外觀遮蔽。"
      - id: "3.1431.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這些東西彼此的空間位置，於是表達命題的意義。"
        interpretation_zh_tw: "表意者不是各物件孤立存在，而是它們被安排成的關係；該關係再依投射方法對應到事態。"
    project_relations:
      - status: analogy_only
        mode: structural_invariant
        claim_zh_tw: "專案解說以桌子、椅子與書的配置說明：承載意義的是元素關係，而非單一載體外觀。"
        rationale_zh_tw: "解說直接採用 3.1431 作哲學例子，再以 relation instance 作受限工程類比；它沒有把 Akashic entity 冒充簡單對象。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "### 3.1 桌子、椅子與書：配置本身表達意義"
            note_zh_tw: "此節逐條說明空間配置與 Akashic 關係實例的類比界線。"
