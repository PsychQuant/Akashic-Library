        claim_zh_tw: "Akashic 刻意不把搜尋命中或記錄存在當成 proposition 說出的內容為真。"
        rationale_zh_tw: "搜尋只顯示字串或索引條件成立；truth condition 與對現實的斷言需要另行表示及裁決，不能由命中狀態取代。"
