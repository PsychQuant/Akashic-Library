        claim_zh_tw: "Akashic 文件區分 picture 所表現的可能事態與其後的真假判定。"
        rationale_zh_tw: "record 可讓人理解一項主張可能如何成立，卻不因可解析或可理解就自動為真；這只是對 sense／truth 區分的工程說明。"
