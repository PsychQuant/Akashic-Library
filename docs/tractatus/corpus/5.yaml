  - id: "5.3"
    parent: "5"
    texts:
      de:
        - "Alle Sätze sind Resultate von Wahrheitsoperationen mit den Elementarsätzen."
        - "Die Wahrheitsoperation ist die Art und Weise, wie aus den Elementarsätzen die Wahrheitsfunktion entsteht."
        - "Nach dem Wesen der Wahrheitsoperation wird auf die gleiche Weise, wie aus den Elementarsätzen ihre Wahrheitsfunktion, aus Wahrheitsfunktionen eine Neue."
        - "Jede Wahrheitsoperation erzeugt aus Wahrheitsfunktionen von Elementarsätzen wieder eine Wahrheitsfunktion von Elementarsätzen, einen Satz."
        - "Das Resultat jeder Wahrheitsoperation mit den Resultaten von Wahrheitsoperationen mit Elementarsätzen ist wieder das Resultat *Einer* Wahrheitsoperation mit Elementarsätzen."
        - "Jeder Satz ist das Resultat von Wahrheitsoperationen mit Elementarsätzen."
      en_ogden_ramsey_1922:
        - "All propositions are results of truth-operations on the elementary propositions."
        - "The truth-operation is the way in which a truth-function arises from elementary propositions."
        - "According to the nature of truth-operations, in the same way as out of elementary propositions arise their truth-functions, from truth-functions arises a new one."
        - "Every truth-operation creates from truth-functions of elementary propositions another truth-function of elementary propositions, *i.e.*, a proposition."
        - "The result of every truth-operation on the results of truth-operations on elementary propositions is also the result of *one* truth-operation on elementary propositions."
        - "Every proposition is the result of truth-operations on elementary propositions."
    edition_references:
      en_pears_mcguinness: "5.3"
    segments:
      - id: "5.3.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "所有命題都是對基本命題施行真值運算的結果。"
        interpretation_zh_tw: "此句提出完備性主張：複合命題最終都可追溯到基本命題的真值組合。"
      - id: "5.3.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "真值運算就是由基本命題產生真值函數的方式。"
        interpretation_zh_tw: "真值運算不是世界事件，而是從輸入真值規定輸出真值的形式規則。"
      - id: "5.3.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "依真值運算的本性，正如基本命題產生其真值函數，真值函數又可產生新的真值函數。"
        interpretation_zh_tw: "真值函數可再作為真值運算的輸入，使複合層次得以遞迴形成。"
      - id: "5.3.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "每項真值運算都從基本命題的真值函數造出另一個基本命題的真值函數，也就是一個命題。"
        interpretation_zh_tw: "真值運算對命題封閉；運算結果仍由同一批基本命題的配置決定。"
      - id: "5.3.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "對以基本命題為基底的真值運算結果再施行真值運算，其結果仍是對基本命題施行一項真值運算的結果。"
        interpretation_zh_tw: "巢狀真值運算可以攤平成一個直接作用於底層真值配置的函數。"
      - id: "5.3.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "每個命題都是對基本命題施行真值運算的結果。"
        interpretation_zh_tw: "末句重申：不需在真值運算之外另設一種複合命題來源。"
    project_relations:
      - status: aspirational
        mode: semantic_operation
        claim_zh_tw: "Akashic 把真值函數式組合作為非平凡語意層的最低目標之一；現行主線尚未實作命題 5.3 的完整形式系統。"
        rationale_zh_tw: "專案文件要求未來能由原子判定組成複合真值，但目前只能據此標示方向，不能把現有資料讀取冒充為真值運算。此命題的重點是：真值運算對組合封閉：多層複合可以攤平成直接作用於基本命題的一個真值函數。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "### 9.4 Truth-functional composition"
            note_zh_tw: "此節把真值函數式組合列為最低語意能力，並明示這是目標而非既成實作。"
    history:
      - kind: issue
        reference: "https://github.com/PsychQuant/Akashic-Library/issues/204"
        disposition: retained
        note_zh_tw: "命題 5.3 所需的遞迴閉包、巢狀運算攤平與完備性驗證由此 issue 追蹤；單一 authored predicate 不足以證成。"

