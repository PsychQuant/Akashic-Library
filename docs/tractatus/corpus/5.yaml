  - id: "5.551"
    parent: "5.55"
    texts:
      de:
        - "Unser Grundsatz ist, dass jede Frage, die sich überhaupt durch die Logik entscheiden lässt, sich ohne weiteres entscheiden lassen muss."
        - "\\(Und wenn wir in die Lage kommen, ein solches Problem durch Ansehen der Welt beantworten zu müssen, so zeigt dies, dass wir auf grundfalscher Fährte sind.)"
      en_ogden_ramsey_1922:
        - "Our fundamental principle is that every question which can be decided at all by logic can be decided off-hand."
        - "\\(And if we get into a situation where we need to answer such a problem by looking at the world, this shows that we are on a fundamentally wrong track.)"
    edition_references:
      en_pears_mcguinness: "5.551"
    segments:
      - id: "5.551.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們的基本原則是：凡能由邏輯決定的問題，都能當下決定。"
        interpretation_zh_tw: "邏輯判定不應等待新的世界資料，否則它便不是純形式問題。"
      - id: "5.551.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（若我們必須觀察世界才能回答這類問題，就表示我們走在根本錯誤的路上。）"
        interpretation_zh_tw: "經驗查詢的必要性是把經驗問題誤當邏輯問題的警訊。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.551 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：邏輯判定不應等待新的世界資料，否則它便不是純形式問題；經驗查詢的必要性是把經驗問題誤當邏輯問題的警訊。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.552"
    parent: "5.55"
    texts:
      de:
        - "Die „Erfahrung“, die wir zum Verstehen der Logik brauchen, ist nicht die, dass sich etwas so und so verhält, sondern, dass etwas *ist*: aber das ist eben *keine* Erfahrung."
        - "Die Logik ist *vor* jeder Erfahrung – dass etwas *so* ist."
        - "Sie ist vor dem Wie, nicht vor dem Was."
      en_ogden_ramsey_1922:
        - "The “experience” which we need to understand logic is not that such and such is the case, but that something *is*; but that is *no* experience."
        - "Logic *precedes* every experience—that something is *so*."
        - "It is before the How, not before the What."
    edition_references:
      en_pears_mcguinness: "5.552"
    segments:
      - id: "5.552.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "為理解邏輯而需要的「經驗」，不是某事如此，而是有某物存在；但那恰恰不是經驗。"
        interpretation_zh_tw: "邏輯不依賴某項特定事實，只預設符號能有所指；後者不是可比較的經驗命題。"
      - id: "5.552.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "邏輯先於一切關於某物如何的經驗。"
        interpretation_zh_tw: "邏輯形式不由世界偶然採取的某一配置決定。"
      - id: "5.552.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "它先於「如何」，而不先於「什麼」。"
        interpretation_zh_tw: "邏輯先於事實的排列方式，卻不憑空先於任何可表達內容之存在。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.552 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：邏輯不依賴某項特定事實，僅預設符號能有所指的世界，後者不是一則可比較的經驗命題；德文把後兩句合成一個來源單元；重點是邏輯先於事實配置，卻不憑空先於任何可表達內容的存在。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.5521"
    parent: "5.552"
    texts:
      de:
        - "Und wenn dies nicht so wäre, wie könnten wir die Logik anwenden?"
        - "Man könnte sagen: Wenn es eine Logik gäbe, auch wenn es keine Welt gäbe, wie könnte es dann eine Logik geben, da es eine Welt gibt."
      en_ogden_ramsey_1922:
        - "And if this were not the case, how could we apply logic?"
        - "We could say: if there were a logic, even if there were no world, how then could there be a logic, since there is a world?"
    edition_references:
      en_pears_mcguinness: "5.5521"
    segments:
      - id: "5.5521.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若非如此，我們怎能應用邏輯？"
        interpretation_zh_tw: "邏輯若與任何可能世界無關，就無從說明它為何能規範實際命題。"
      - id: "5.5521.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "可以問：若即使沒有世界也會有邏輯，那麼既然有世界，怎麼可能沒有邏輯？"
        interpretation_zh_tw: "邏輯可應用性與世界存在相扣連，卻不取決於世界採取哪種具體配置。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.5521 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：邏輯的可應用性與世界存在互相扣連，卻不取決於世界採取哪一種具體配置。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.553"
    parent: "5.55"
    texts:
      de:
        - "Russell sagte, es gäbe einfache Relationen zwischen verschiedenen Anzahlen von Dingen (Individuals)."
        - "Aber zwischen welchen Anzahlen?"
        - "Und wie soll sich das entscheiden? – Durch die Erfahrung?"
        - "\\(Eine ausgezeichnete Zahl gibt es nicht.)"
      en_ogden_ramsey_1922:
        - "Russell said that there were simple relations between different numbers of things (individuals)."
        - "But between what numbers?"
        - "And how should this be decided—by experience?"
        - "\\(There is no pre-eminent number.)"
    edition_references:
      en_pears_mcguinness: "5.553"
    segments:
      - id: "5.553.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "羅素說，不同數目的事物（個體）之間有簡單關係。"
        interpretation_zh_tw: "這項主張把某些固定項數的關係預設為基本邏輯形式。"
      - id: "5.553.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "但究竟是哪些數目？"
        interpretation_zh_tw: "若沒有先驗準則，就無法選出哪些項數應列入基本形式。"
      - id: "5.553.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "又要如何決定——靠經驗嗎？"
        interpretation_zh_tw: "若答案靠觀察，所列關係項數就不能宣稱是先驗邏輯結構。"
      - id: "5.553.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（沒有任何特別優先的數。）"
        interpretation_zh_tw: "邏輯不能無理由把某個項數視為本質上比其他數更基本。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.553 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：若關係項數由觀察列舉，就不能宣稱那套清單是先驗邏輯形式；邏輯不能無理由把某個項數視為基本。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

