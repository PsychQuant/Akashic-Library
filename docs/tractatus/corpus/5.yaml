        mode: semantic_operation
        claim_zh_tw: "Akashic 把真值函數式組合作為非平凡語意層的最低目標之一；現行主線尚未實作命題 5.502 的完整形式系統。"
        rationale_zh_tw: "專案文件只支撐真值組合的方向，尚不支撐這裡的共同否定完備性或完整形式推導。此命題的重點是：N 運算把指定集合中的每一命題一併否定，作為生成其他真值函數的單一運算。"
