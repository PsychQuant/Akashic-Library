    texts:
      de:
        - "Der Satz kann die gesamte Wirklichkeit darstellen, aber er kann nicht das darstellen, was er mit der Wirklichkeit gemein haben muss, um sie darstellen zu können – die logische Form."
        - "Um die logische Form darstellen zu können, müssten wir uns mit dem Satze ausserhalb der Logik aufstellen können, das heisst ausserhalb der Welt."
      en_ogden_ramsey_1922:
        - "Propositions can represent the whole reality, but they cannot represent what they must have in common with reality in order to be able to represent it—the logical form."
        - "To be able to represent the logical form, we should have to be able to put ourselves with the propositions outside logic, that is outside the world."
    edition_references:
      en_pears_mcguinness: "4.12"
    segments:
      - id: "4.12.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題能表現全部現實，卻不能表現它為了能表現現實而必須與現實共有之物——邏輯形式。"
        interpretation_zh_tw: "命題能描繪現實，卻不能把自身與現實共享的邏輯形式再當成描繪內容；共同形式是表現的先決條件。"
      - id: "4.12.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "若要表現邏輯形式，我們就必須能帶著命題站到邏輯之外，也就是世界之外。"
        interpretation_zh_tw: "若要把邏輯形式當普通對象表現，就得站到邏輯與世界之外；這個要求本身不可能滿足。"
