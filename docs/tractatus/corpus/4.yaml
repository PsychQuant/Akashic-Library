  - id: "4.441"
    parent: "4.44"
    texts:
      de:
        - "Es ist klar, dass dem Komplex der Zeichen „F“ und „W“ kein Gegenstand (oder Komplex von Gegenständen) entspricht; so wenig, wie den horizontalen und vertikalen Strichen oder den Klammern."
        - "– „Logische Gegenstände“ gibt es nicht."
        - "Analoges gilt natürlich für alle Zeichen, die dasselbe ausdrücken wie die Schemata der „W“ und „F“."
      en_ogden_ramsey_1922:
        - "It is clear that to the complex of the signs “F” and “T” no object (or complex of objects) corresponds; any more than to horizontal and vertical lines or to brackets."
        - "There are no “logical objects”."
        - "Something analogous holds of course for all signs, which express the same as the schemata of “T” and “F”."
    edition_references:
      en_pears_mcguinness: "4.441"
    segments:
      - id: "4.441.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "很清楚，符號「F」與「W」的複合不對應任何物件（或物件複合），正如水平線、垂直線與括號也不對應物件。"
        interpretation_zh_tw: "F、W、線條與括號的功能來自表式規則，無須在世界中替每個記號尋找對應物。"
      - id: "4.441.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "不存在「邏輯物件」。"
        interpretation_zh_tw: "否認「邏輯物件」是要阻止把運算記號的角色誤作另一類實體。"
      - id: "4.441.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "所有與 W／F 表式表達相同內容的符號，情形當然也一樣。"
        interpretation_zh_tw: "凡與真值表達式等價的記法都一樣靠形式運作，不因換符號就產生新的邏輯物件。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.441 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：邏輯記號的角色由運算與排列方式決定，不必假設世界中有 W、F、括號等對應物來充當其意義。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.442"
    parent: "4.44"
    texts:
      de:
        - |-
          Es ist z. B.:

          „

          |p |q | |
          |---|---|---|
          |W|W |W |
          |F|W |W |
          |W|F | |
          |F|F |W |

          “

          ein Satzzeichen.
        - "Frege’s „Urteilsstrich“ „![{ \\vdash }](images/8972055d3850ecff6e47e1516fc07474dfcc4bf7f0095ed9bcf5389c004a6d07.svg)\\ “ ist logisch ganz bedeutungslos; er zeigt bei Frege (und Russell) nur an, dass diese Autoren die so bezeichneten Sätze für wahr halten."
        - "„![{ \\vdash }](images/8972055d3850ecff6e47e1516fc07474dfcc4bf7f0095ed9bcf5389c004a6d07.svg)\\ “ gehört daher ebenso wenig zum Satzgefüge, wie etwa die Nummer des Satzes."
        - "Ein Satz kann unmöglich von sich selbst aussagen, dass er wahr ist.)"
        - "Ist die Reihenfolge der Wahrheitsmöglichkeiten im Schema durch eine Kombinationsregel ein für allemal festgesetzt, dann ist die letzte Kolonne allein schon ein Ausdruck der Wahrheitsbedingungen."
        - "Schreiben wir diese Kolonne als Reihe hin, so wird das Satzzeichen zu:"
        - "„(WW–W)(*p*, *q*)“ oder deutlicher „(WWFW)(*p*, *q*)“."
        - "\\(Die Anzahl der Stellen in der linken Klammer ist durch die Anzahl der Glieder in der rechten bestimmt.)"
      en_ogden_ramsey_1922:
        - |-
          Thus e.g.

          “

          |p |q | |
          |---|---|---|
          |T|T |T |
          |F|T |T |
          |T|F | |
          |F|F |T |

          ”

          is a propositional sign.
        - "\\(Frege’s assertion sign “![{ \\vdash }](images/8972055d3850ecff6e47e1516fc07474dfcc4bf7f0095ed9bcf5389c004a6d07.svg)\\ ” is logically altogether meaningless; in Frege (and Russell) it only shows that these authors hold as true the propositions marked in this way."
        - "“![{ \\vdash }](images/8972055d3850ecff6e47e1516fc07474dfcc4bf7f0095ed9bcf5389c004a6d07.svg)\\ ” belongs therefore to the propositions no more than does the number of the proposition."
        - "A proposition cannot possibly assert of itself that it is true.)"
        - "If the sequence of the truth-possibilities in the schema is once for all determined by a rule of combination, then the last column is by itself an expression of the truth-conditions."
        - "If we write this column as a row the propositional sign becomes: “(TT–T) (*p*, *q*)” or more plainly: “(TTFT) (*p*, *q*)”."
        - "\\(The number of places in the left-hand bracket is determined by the number of terms in the right-hand bracket.)"
    edition_references:
      en_pears_mcguinness: "4.442"
    segments:
      - id: "4.442.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "例如，所列 W／F（英文 T／F）表格就是一個命題符號。"
        interpretation_zh_tw: "真值表的整體配置可充當命題符號；表格不是查詢結果清單，而是給出哪些 valuation 被接受。"
      - id: "4.442.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "弗雷格的「判斷線」⊢ 在邏輯上完全沒有意義；對弗雷格與羅素而言，它只顯示作者把所標命題視為真。"
        interpretation_zh_tw: "判斷線記錄作者的認可態度，屬於後設標註，不參與命題的 truth condition。"
      - id: "4.442.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "⊢ 不屬於命題結構，正如命題編號也不屬於。"
        interpretation_zh_tw: "認可記號與編號都可在不改變 sense 下移除，因此不能算命題結構的一部分。"
      - id: "4.442.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "命題不可能斷言自己為真。"
        interpretation_zh_tw: "自我認可會混淆命題內容與對內容的後設評價；真不能由命題替自己貼標籤取得。"
      - id: "4.442.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "若表式中真值可能的次序已由組合規則固定，最後一欄本身就表達真值條件。"
        interpretation_zh_tw: "固定 valuation 列次序後，末欄直接指定哪些情形被接受，因而已足以給出完整 truth condition。"
      - id: "4.442.f"
        alignment:
          de: [5, 6]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "把該欄寫成一列，命題符號就成為德文的「(WW–W)(*p*, *q*)」／「(WWFW)(*p*, *q*)」，英文相應為「(TT–T)(*p*, *q*)」／「(TTFT)(*p*, *q*)」。"
        interpretation_zh_tw: "把真值欄壓成序列只是等價記法；W／F 與 T／F 的字母差異不改變所選 valuation。"
      - id: "4.442.g"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "（左括號位置數由右括號項目數決定。）"
        interpretation_zh_tw: "括號兩側的元數互相制約，表示縮寫仍須遵守可檢查的組合規則。"
    project_relations:
      - status: intentional_nonconformance
        mode: declared_nonconformance
        claim_zh_tw: "Akashic 刻意不把搜尋命中或作者認可標記當成 proposition 的 truth condition。"
        rationale_zh_tw: "真值欄可壓縮成命題符號；作者的認可標記與命題編號只是後設標註，不會使命題為真，也不是命題 sense 的構成部分。 現況文件因此把 retrieval、館藏裁決與 world-relative valuation 分開。"
        evidence:
          - path: "docs/explainers/why-akashic-is-not-just-google.md"
            kind: heading
            locator: "## 3. 最簡單的反例：搜尋到一個句子，不等於句子是真的"
            note_zh_tw: "此節明確證明可搜尋與被收錄不等於句子為真。"
    history: []

  - id: "4.45"
    parent: "4.4"
    texts:
      de:
        - "Für *n* Elementarsätze gibt es *L~n~* mögliche Gruppen von Wahrheitsbedingungen."
        - "Die Gruppen von Wahrheitsbedingungen, welche zu den Wahrheitsmöglichkeiten einer Anzahl von Elementarsätzen gehören, lassen sich in eine Reihe ordnen."
      en_ogden_ramsey_1922:
        - "For *n* elementary propositions there are *L~n~* possible groups of truth-conditions."
        - "The groups of truth-conditions which belong to the truth-possibilities of a number of elementary propositions can be ordered in a series."
    edition_references:
      en_pears_mcguinness: "4.45"
    segments:
      - id: "4.45.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "對 *n* 個基本命題，共有 *L~n~* 組可能的真值條件。"
        interpretation_zh_tw: "*L~n~* 計數的是對 *n* 個基本命題可指定的所有 truth-condition 集合，不是實際資料筆數。"
      - id: "4.45.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "屬於一組基本命題真值可能的各組真值條件，可以排列成序列。"
        interpretation_zh_tw: "把各組 truth condition 排成序列，使不同命題形式能依其接受的 valuation 系統比較。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.45 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：真值條件本身形成可枚舉的形式空間；排列順序是表現規約，不改變每組接受哪些 valuation。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.46"
    parent: "4.4"
    texts:
      de:
        - "Unter den möglichen Gruppen von Wahrheitsbedingungen gibt es zwei extreme Fälle."
        - "In dem einen Fall ist der Satz für sämtliche Wahrheitsmöglichkeiten der Elementarsätze wahr."
        - "Wir sagen, die Wahrheitsbedingungen sind *tautologisch*."
        - "Im zweiten Fall ist der Satz für sämtliche Wahrheitsmöglichkeiten falsch: Die Wahrheitsbedingungen sind *kontradiktorisch*."
        - "Im ersten Fall nennen wir den Satz eine Tautologie, im zweiten Fall eine Kontradiktion."
      en_ogden_ramsey_1922:
        - "Among the possible groups of truth-conditions there are two extreme cases."
        - "In the one case the proposition is true for all the truth-possibilities of the elementary propositions."
        - "We say that the truth-conditions are *tautological*."
        - "In the second case the proposition is false for all the truth-possibilities."
        - "The truth-conditions are *self-contradictory*."
        - "In the first case we call the proposition a tautology, in the second case a contradiction."
    edition_references:
      en_pears_mcguinness: "4.46"
    segments:
      - id: "4.46.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "可能的真值條件組中有兩個極端情形。"
        interpretation_zh_tw: "兩個極端位於所有可能 truth-condition 集合的兩端：全接受與全拒絕。"
      - id: "4.46.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "一種情形下，命題對基本命題的全部真值可能都為真。"
        interpretation_zh_tw: "若每一個基本 valuation 都滿足命題，世界如何變動都不會使它為假。"
      - id: "4.46.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "我們稱這種真值條件為恆真。"
        interpretation_zh_tw: "「恆真」描述全接受的 truth-condition 形狀，不是對某項內容給予特別高的可信度。"
      - id: "4.46.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3, 4]
        translation_zh_tw: "另一種情形下，命題對全部真值可能都為假；這種真值條件是矛盾的。"
        interpretation_zh_tw: "若沒有任何 valuation 滿足命題，其 truth condition 自我矛盾；這也不是單次查詢回傳 false。"
      - id: "4.46.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "第一種命題稱為重言式，第二種稱為矛盾式。"
        interpretation_zh_tw: "重言式與矛盾式分別命名全接受與全拒絕兩端，兩者都沒有挑出特定世界情形。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.46 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：tautology 接受所有 valuation，contradiction 不接受任何 valuation；兩者由真值條件的極端形狀界定。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.461"
    parent: "4.46"
    texts:
      de:
        - "Der Satz zeigt was er sagt, die Tautologie und die Kontradiktion, dass sie nichts sagen."
        - "Die Tautologie hat keine Wahrheitsbedingungen, denn sie ist bedingungslos wahr; und die Kontradiktion ist unter keiner Bedingung wahr."
        - "Tautologie und Kontradiktion sind sinnlos."
        - "\\(Wie der Punkt von dem zwei Pfeile in entgegengesetzter Richtung auseinandergehen.)"
        - "\\(Ich weiss z. B. nichts über das Wetter, wenn ich weiss, dass es regnet oder nicht regnet.)"
      en_ogden_ramsey_1922:
        - "The proposition shows what it says, the tautology and the contradiction that they say nothing."
        - "The tautology has no truth-conditions, for it is unconditionally true; and the contradiction is on no condition true."
        - "Tautology and contradiction are without sense."
        - "\\(Like the point from which two arrows go out in opposite directions.)"
        - "\\(I know, *e.g.* nothing about the weather, when I know that it rains or does not rain.)"
    edition_references:
      en_pears_mcguinness: "4.461"
    segments:
      - id: "4.461.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題顯示它所說的內容；重言式與矛盾式則顯示它們什麼也沒說。"
        interpretation_zh_tw: "普通命題藉排除可能情形而說出內容；重言式與矛盾式只顯示自己的極端邏輯地位。"
      - id: "4.461.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "重言式沒有真值條件，因為它無條件為真；矛盾式在任何條件下都不真。"
        interpretation_zh_tw: "重言式不附加成立限制，矛盾式則沒有可成立條件；兩者都沒有一般命題那種選擇性的 truth condition。"
      - id: "4.461.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "重言式與矛盾式沒有意義。"
        interpretation_zh_tw: "此處「沒有意義」是 sinnlos：它們沒有描述性 sense，卻仍是合法符號；不能與語法無法成義的 unsinnig 混同。"
      - id: "4.461.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（如同一點向相反方向伸出兩支箭。）"
        interpretation_zh_tw: "相反方向的兩支箭彼此抵銷，形象化說明極端式沒有留下單一描述方向。"
      - id: "4.461.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "（知道「下雨或不下雨」時，我對天氣仍一無所知。）"
        interpretation_zh_tw: "「下雨或不下雨」必真，卻沒有告知天氣如何，證明真不等於具有經驗資訊。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.461 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：兩個極端式不選取任何特定可能情形，因而沒有描述性 sense；這裡的 sinnlos 不等於語法胡亂或 unsinnig。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.4611"
    parent: "4.461"
    texts:
      de:
        - "Tautologie und Kontradiktion sind aber nicht unsinnig; sie gehören zum Symbolismus, und zwar ähnlich wie die „0“ zum Symbolismus der Arithmetik."
      en_ogden_ramsey_1922:
        - "Tautology and contradiction are, however, not nonsensical; they are part of the symbolism, in the same way that “0” is part of the symbolism of Arithmetic."
    edition_references:
      en_pears_mcguinness: "4.4611"
    segments:
      - id: "4.4611.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "然而，重言式與矛盾式並非無稽；它們屬於符號系統，正如「0」屬於算術的符號系統。"
        interpretation_zh_tw: "沒有描述性 sense 不表示可從邏輯中刪除；極端式標示運算邊界並在符號演算中有角色。"
    project_relations:
