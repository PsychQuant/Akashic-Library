  - id: "5.633"
    parent: "5.63"
    texts:
      de:
        - "Wo in der Welt ist ein metaphysisches Subjekt zu merken?"
        - "Du sagst, es verhält sich hier ganz, wie mit Auge und Gesichtsfeld."
        - "Aber das Auge siehst du wirklich *nicht*."
        - "Und nichts *am Gesichtsfeld* lässt darauf schliessen, dass es von einem Auge gesehen wird."
      en_ogden_ramsey_1922:
        - "*Where in* the world is a metaphysical subject to be noted?"
        - "You say that this case is altogether like that of the eye and the field of sight."
        - "But you do *not* really see the eye."
        - "And from nothing *in the field of sight* can it be concluded that it is seen from an eye."
    edition_references:
      en_pears_mcguinness: "5.633"
    segments:
      - id: "5.633.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "形上主體究竟能在世界的哪裡被注意到？"
        interpretation_zh_tw: "若主體是世界內對象，理應能指出位置；反問迫使我們看見這種定位失敗。"
      - id: "5.633.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "你會說，這完全像眼睛與視野的情形。"
        interpretation_zh_tw: "眼睛與視野的類比，把觀看條件和視野中可見的項目區分開來。"
      - id: "5.633.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "但你其實看不見眼睛。"
        interpretation_zh_tw: "觀看者的眼睛不作為同一視野中的一個可見項目出現。"
      - id: "5.633.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "而且視野中的任何東西，都不能讓人推出它是由一隻眼睛看見的。"
        interpretation_zh_tw: "視野不以任何內部特徵證明有一個形上觀看者；主體只在視野的界線上顯示。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.633 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：若主體是世界內對象，理應能指出位置；反問迫使我們看見這種定位失敗；眼睛的比喻把觀看條件與視野中可見項目區分開來；視野不包含自己的觀看器官，也不以內部特徵證明某個形上觀看者；主體只在界線上顯示。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

