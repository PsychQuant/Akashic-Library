  - id: "4.431"
    parent: "4.43"
    texts:
      de:
        - "Der Ausdruck der Übereinstimmung und Nichtübereinstimmung mit den Wahrheitsmöglichkeiten der Elementarsätze drückt die Wahrheitsbedingungen des Satzes aus."
        - "Der Satz ist der Ausdruck seiner Wahrheitsbedingungen."
        - "\\(Frege hat sie daher ganz richtig als Erklärung der Zeichen seiner Begriffsschrift vorausgeschickt."
        - "Nur ist die Erklärung des Wahrheitsbegriffes bei Frege falsch: Wären „das Wahre“ und „das Falsche“ wirklich Gegenstände und die Argumente in ∼*p* etc. dann wäre nach Frege’s Bestimmung der Sinn von „∼*p*“ keineswegs bestimmt.)"
      en_ogden_ramsey_1922:
        - "The expression of the agreement and disagreement with the truth-possibilities of the elementary-propositions expresses the truth-conditions of the proposition."
        - "The proposition is the expression of its truth-conditions."
        - "\\(Frege has therefore quite rightly put them at the beginning, as explaining the signs of his logical symbolism."
        - "Only Frege’s explanation of the truth-concept is false: if “the true” and “the false” were real objects and the arguments in \\~*p* etc., then the sense of \\~*p* would by no means be determined by Frege’s determination.)"
    edition_references:
      en_pears_mcguinness: "4.431"
    segments:
      - id: "4.431.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "表達與基本命題真值可能的相符與不相符，就是表達命題的真值條件。"
        interpretation_zh_tw: "一個命題接受與拒絕哪些基本 valuation，合起來就是其完整 truth condition。"
      - id: "4.431.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "命題是其真值條件的表達。"
        interpretation_zh_tw: "命題的 sense 由 truth condition 表達；它不是查詢結果、信心分數或單一當前真值。"
      - id: "4.431.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（因此弗雷格把真值條件置於概念文字符號之前作說明，這點相當正確。"
        interpretation_zh_tw: "先交代 truth condition，才能使後續符號有確定 sense；這項方法論次序是弗雷格的正確處。"
      - id: "4.431.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "但他的真理概念說明錯誤：若「真者」「假者」真是物件，又是 ∼*p* 等式的論元，那麼依他的規定，∼*p* 的意義仍未獲得決定。）"
        interpretation_zh_tw: "把真、假當物件無法解釋否定如何改變 truth condition；指到某個真值物件不足以決定 ∼*p* 的 sense。"
    project_relations:
