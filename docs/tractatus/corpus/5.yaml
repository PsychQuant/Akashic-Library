  - id: "5.5301"
    parent: "5.53"
    texts:
      de:
        - "Dass die Identität keine Relation zwischen Gegenständen ist, leuchtet ein."
        - "Dies wird sehr klar, wenn man z. B. den Satz „(*x*) : *fx.* ⊃*.x* = *a*“ betrachtet."
        - "Was dieser Satz sagt, ist einfach, dass *nur* *a* der Funktion *f* genügt, und nicht, dass nur solche Dinge der Funktion *f* genügen, welche eine gewisse Beziehung zu *a* haben."
        - "Man könnte nun freilich sagen, dass eben *nur* *a* diese Beziehung zu *a* habe, aber um dies auszudrücken, brauchten wir das Gleichheitszeichen selber."
      en_ogden_ramsey_1922:
        - "That identity is not a relation between objects is obvious."
        - "This becomes very clear if, for example, one considers the proposition “(*x*) : *fx* . ⊃ . *x* = *a*”."
        - "What this proposition says is simply that *only* *a* satisfies the function *f*, and not that only such things satisfy the function *f* which have a certain relation to *a*."
        - "One could of course say that in fact *only* *a* has this relation to *a* but in order to express this we should need the sign of identity itself."
    edition_references:
      en_pears_mcguinness: "5.5301"
    segments:
      - id: "5.5301.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "同一性不是對象之間的關係，這很明顯。"
        interpretation_zh_tw: "同一不連接兩個先已分立的對象，而是同一名稱的重複使用。"
      - id: "5.5301.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "考察命題「(x)：fx．⊃．x=a」，這點就會非常清楚。"
        interpretation_zh_tw: "例式讓唯一滿足條件的表達與關係述詞的表達方式可被直接比較。"
      - id: "5.5301.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "這個命題只說唯有 a 滿足函數 f，而不是說只有那些與 a 處於某種關係的東西才滿足 f。"
        interpretation_zh_tw: "唯一性由變項位置與同一名稱表達，沒有在 a 之外增設「與 a 同一」的關係。"
      - id: "5.5301.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "當然可以說，事實上只有 a 與 a 具有這項關係；但若要表達這點，我們又需要同一性記號本身。"
        interpretation_zh_tw: "把同一性定義成特殊關係會循環：指定唯一自關聯者時仍得先辨認同一對象。"
    project_relations:
