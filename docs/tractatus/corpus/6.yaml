  - id: "6.4311"
    parent: "6.431"
    texts:
      de:
        - "Der Tod ist kein Ereignis des Lebens."
        - "Den Tod erlebt man nicht."
        - "Wenn man unter Ewigkeit nicht unendliche Zeitdauer, sondern Unzeitlichkeit versteht, dann lebt der ewig, der in der Gegenwart lebt."
        - "Unser Leben ist ebenso endlos, wie unser Gesichtsfeld grenzenlos ist."
      en_ogden_ramsey_1922:
        - "Death is not an event of life."
        - "Death is not lived through."
        - "If by eternity is understood not endless temporal duration but timelessness, then he lives eternally who lives in the present."
        - "Our life is endless in the way that our visual field is without limit."
    edition_references:
      en_pears_mcguinness: "6.4311"
    segments:
      - id: "6.4311.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "死亡不是生命中的事件。"
        interpretation_zh_tw: "死亡不是主體可回顧的一段經驗。"
      - id: "6.4311.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "人不會經歷死亡。"
        interpretation_zh_tw: "第二句排除把死亡當成被經歷狀態。"
      - id: "6.4311.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "若永恆不是無限時間延續，而是無時間性，活在當下者便永恆地活著。"
        interpretation_zh_tw: "永恆被重解為無時間性，不是無限長紀錄。"
      - id: "6.4311.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "我們的生命無盡，正如視野沒有可見邊界。"
        interpretation_zh_tw: "視野比喻說明界線不等於視野內的一個物件。"
