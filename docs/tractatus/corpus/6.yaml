  - id: "6.51"
    parent: "6.5"
    texts:
      de:
        - "Skeptizismus ist *nicht* unwiderleglich, sondern offenbar unsinnig, wenn er bezweifeln will, wo nicht gefragt werden kann."
        - "Denn Zweifel kann nur bestehen, wo eine Frage besteht; eine Frage nur, wo eine Antwort besteht, und diese nur, wo etwas *gesagt* werden *kann*."
      en_ogden_ramsey_1922:
        - "Scepticism is *not* irrefutable, but palpably senseless, if it would doubt where a question cannot be asked."
        - "For doubt can only exist where there is a question; a question only where there is an answer, and this only where something *can be said*."
    edition_references:
      en_pears_mcguinness: "6.51"
    segments:
      - id: "6.51.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "懷疑論若想在無法提問之處懷疑，便不是不可反駁，而是顯然無意義。"
        interpretation_zh_tw: "有意義的懷疑需要可區分的答案條件。"
      - id: "6.51.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "只有有問題之處才有懷疑；有答案之處才有問題；而只有某物能被說出之處才有答案。"
        interpretation_zh_tw: "本句建立可說、答案、問題與懷疑的依存鏈，不要求系統隱藏未決狀態。"
    project_relations:
