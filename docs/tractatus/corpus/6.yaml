  - id: "6.342"
    parent: "6.34"
    texts:
      de:
        - "Und nun sehen wir die gegenseitige Stellung von Logik und Mechanik."
        - "(Man könnte das Netz auch aus verschiedenartigen Figuren etwa aus Dreiecken und Sechsecken bestehen lassen.)"
        - "Dass sich ein Bild, wie das vorhin erwähnte, durch ein Netz von gegebener Form beschreiben lässt, sagt über das Bild *nichts* aus."
        - "(Denn dies gilt für jedes Bild dieser Art.)"
        - "*Das* aber charakterisiert das Bild, dass es sich durch ein bestimmtes Netz von *bestimmter* Feinheit *vollständig* beschreiben lässt."
        - "So auch sagt es nichts über die Welt aus, dass sie sich durch die Newtonsche Mechanik beschreiben lässt; wohl aber, dass sie sich *so* durch jene beschreiben lässt, wie dies eben der Fall ist."
        - "Auch das sagt etwas über die Welt, dass sie sich durch die eine Mechanik einfacher beschreiben lässt, als durch die andere."
      en_ogden_ramsey_1922:
        - "And now we see the relative position of logic and mechanics."
        - "(We could construct the network out of figures of different kinds, as out of triangles and hexagons together.)"
        - "That a picture like that instanced above can be described by a network of a given form asserts *nothing* about the picture."
        - "(For this holds of every picture of this kind.)"
        - "But *this* does characterize the picture, the fact, namely, that it can be *completely* described by a definite net of *definite* fineness."
        - "So too the fact that it can be described by Newtonian mechanics asserts nothing about the world; but *this* asserts something, namely, that it can be described in that particular way in which as a matter of fact it is described."
        - "The fact, too, that it can be described more simply by one system of mechanics than by another says something about the world."
    edition_references:
      en_pears_mcguinness: "6.342"
    segments:
      - id: "6.342.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "由此可看見邏輯與力學的相對位置。"
        interpretation_zh_tw: "第一句開始區分普遍形式與經驗內容。"
      - id: "6.342.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（網格也可混用三角形與六角形。）"
        interpretation_zh_tw: "混合網格再次顯示形式選擇可約定。"
      - id: "6.342.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "一幅圖能被某種形狀的網格描述，本身對圖像什麼也沒說。"
        interpretation_zh_tw: "僅能套用框架不構成關於資料的資訊。"
      - id: "6.342.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "（因為同類圖像都可如此。）"
        interpretation_zh_tw: "括號說明該能力對所有同類圖像都成立。"
      - id: "6.342.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "真正刻畫圖像的是它能被某種特定形狀、特定細度的網格完整描述。"
        interpretation_zh_tw: "具體網格與細度才反映圖像結構。"
      - id: "6.342.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "世界可由牛頓力學描述本身沒說什麼；它實際以何種方式被描述才說出東西。"
        interpretation_zh_tw: "理論可用性不同於世界實際呈現的參數。"
      - id: "6.342.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "某一力學比另一力學能更簡潔描述世界，也說出了世界的某些東西。"
        interpretation_zh_tw: "相對簡潔性可能成為關於世界的線索，但不是邏輯真理。"
