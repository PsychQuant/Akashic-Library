      en_pears_mcguinness: "4.0312"
    segments:
      - id: "4.0312.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題的可能性奠基於符號代表對象的原則。"
        interpretation_zh_tw: "命題之所以可能，是因名稱能在符號配置中代理對象，讓配置可投射到事態。"
      - id: "4.0312.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我的根本思想是：「邏輯常項」不代表任何東西。"
        interpretation_zh_tw: "邏輯常項不替世界中的另一類物件站位；否定、合取等角色來自符號運作。"
      - id: "4.0312.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "事實的邏輯無法被代表。"
        interpretation_zh_tw: "事實的邏輯只能在可形成的結構中顯示，不能再由一個名稱或額外事實代表。"
    project_relations:
      - status: intentional_nonconformance
        mode: declared_nonconformance
        claim_zh_tw: "Akashic 刻意不把 schema 直接等同於事實的 logical form。"
        rationale_zh_tw: "schema 是版本化、可修訂的工程文法；它可限制可表達配置，卻不能因此成為世界與語言必然共有的邏輯形式。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "## 2. logical picture 的最小結構"
            note_zh_tw: "此節要求 picture 同時具備元素、配置、投射規則與 sense；只有 schema 並不足以滿足這些條件。"
    history: []

  - id: "4.032"
    parent: "4.03"
    texts:
      de:
        - "Nur insoweit ist der Satz ein Bild einer Sachlage, als er logisch gegliedert ist."
        - "\\(Auch der Satz „ambulo“ ist zusammengesetzt, denn sein Stamm ergibt mit einer anderen Endung und seine Endung mit einem anderen Stamm, einen anderen Sinn.)"
      en_ogden_ramsey_1922:
        - "The proposition is a picture of its state of affairs, only in so far as it is logically articulated."
        - "(Even the proposition “ambulo” is composite, for its stem gives a different sense with another termination, or its termination with another stem.)"
    edition_references:
      en_pears_mcguinness: "4.032"
    segments:
      - id: "4.032.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題只有在邏輯上有分節時，才是事態的圖像。"
        interpretation_zh_tw: "圖像功能要求可區分的符號成分與結合方式；不可分節的整塊記號無法逐項投射事態。"
      - id: "4.032.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "（即使「ambulo」這個命題也是複合的，因為其詞幹配上另一詞尾、或其詞尾配上另一詞幹，都會產生另一意義。）"
        interpretation_zh_tw: "單一書寫詞仍可藉詞幹與詞尾的替換顯出內部結構；邏輯分節不等於字面上有空格。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.032 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：邏輯分節不必等同字面上有多個空格分開的詞；能以不同成分重組而改變 sense，便顯示其內部結構。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.04"
    parent: "4"
    texts:
      de:
        - "Am Satz muss gerade soviel zu unterscheiden sein, als an der Sachlage die er darstellt."
        - "Die beiden müssen die gleiche logische (mathematische) Mannigfaltigkeit besitzen."
        - "(Vergleiche Hertz’s Mechanik, über Dynamische Modelle.)"
      en_ogden_ramsey_1922:
        - "In the proposition there must be exactly as many thing distinguishable as there are in the state of affairs, which it represents."
        - "They must both possess the same logical (mathematical) multiplicity (cf. Hertz’s Mechanics, on Dynamic Models)."
    edition_references:
      en_pears_mcguinness: "4.04"
    segments:
      - id: "4.04.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題中可區分的項目，必須恰好與它所表現的事態中可區分者一樣多。"
        interpretation_zh_tw: "命題必須保留事態中可區分的每個結構位置，少一項便無法作逐項投射。"
      - id: "4.04.b"
        alignment:
          de: [1, 2]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "兩者必須具有相同的邏輯（數學）多樣性。（參見赫茲《力學》論動力模型。）"
        interpretation_zh_tw: "相同多樣性要求模型保留所有結構自由度；赫茲的動力模型只是類比，不表示任一資料 schema 就是 logical form。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.04 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：picture 與事態要共享足以逐項對應的結構複雜度；僅有模糊相似或少掉關係位置，無法完成表現。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.041"
    parent: "4.04"
    texts:
      de:
        - "Diese mathematische Mannigfaltigkeit kann man natürlich nicht selbst wieder abbilden."
        - "Aus ihr kann man beim Abbilden nicht heraus."
      en_ogden_ramsey_1922:
        - "This mathematical multiplicity naturally cannot in its turn be represented."
        - "One cannot get outside it in the representation."
    edition_references:
      en_pears_mcguinness: "4.041"
    segments:
      - id: "4.041.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "這種數學多樣性自然不能再由另一幅圖像來描繪。"
        interpretation_zh_tw: "邏輯多樣性是任何圖像已經使用的共同形式，不能在同一層次再被另一幅圖像描繪。"
      - id: "4.041.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "進行描繪時，人無法跳到它之外。"
        interpretation_zh_tw: "描繪活動一開始便受共同形式約束；企圖跳到形式之外再表現它，只會造成無限後退。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.041 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：表現所預設的共同形式不是同一表現內可再列為一項內容的對象，否則會要求無限後設描繪。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.0411"
    parent: "4.041"
    texts:
      de:
        - "Wollten wir z. B. das, was wir durch „(*x*).*fx*“ ausdrücken, durch Vorsetzen eines Indexes vor „*fx*“ ausdrücken – etwa so: „Alg. *fx*“, es würde nicht genügen – wir wüssten nicht, was verallgemeinert wurde."
        - "Wollten wir es durch einen Index „*a*“ anzeigen – etwa so: „*f* (*x~a~*)“ – es würde auch nicht genügen – wir wüssten nicht den Bereich der Allgemeinheitsbezeichnung."
        - "Wollten wir es durch Einführung einer Marke in die Argumentstellen versuchen – etwa so: „(*A, A*) *. F* (*A, A*)“ – es würde nicht genügen – wir könnten die Identität der Variablen nicht feststellen."
        - "U. s. w."
        - "Alle diese Bezeichnungsweisen genügen nicht, weil sie nicht die notwendige mathematische Mannigfaltigkeit haben."
      en_ogden_ramsey_1922:
        - "If we tried, for example, to express what is expressed by “(*x*) . *fx*” by putting an index before *fx*, like: “Gen. *fx*”, it would not do, we should not know what was generalized."
        - "If we tried to show it by an index *g*, like: “*f*(*x~g~*)” it would not do—we should not know the scope of the generalization."
        - "If we were to try it by introducing a mark in the argument places, like “(*G, G*) . *F*(*G, G*)”, it would not do—we could not determine the identity of the variables, etc."
        - "All these ways of symbolizing are inadequate because they have not the necessary mathematical multiplicity."
    edition_references:
      en_pears_mcguinness: "4.0411"
    segments:
      - id: "4.0411.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "例如，若想在「(*x*).*fx*」的「*fx*」前加索引來表達原式——如「Alg. *fx*」——仍不夠，因為我們不知道何者被概括。"
        interpretation_zh_tw: "只在 *fx* 前加索引，沒有標出量詞究竟約束什麼，因此遺失被概括項目的結構。"
      - id: "4.0411.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "若用索引「*a*」標示——如「*f* (*x~a~*)」——也不夠，因為我們不知道概括記號的範圍。"
        interpretation_zh_tw: "另一個索引即使標示概括，也未決定量詞作用域，仍不能重建原式的邏輯關係。"
      - id: "4.0411.c"
        alignment:
          de: [2, 3]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "若在論元位置引入標記——如「(*A, A*) *. F* (*A, A*)」——同樣不夠，因為無法確定變項同一性，等等。"
        interpretation_zh_tw: "在論元位置加記號仍不足以保存變項同一性；同一字母的共指約束是不可省略的結構。"
      - id: "4.0411.d"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "這些記法都不足，因為它們沒有必要的數學多樣性。"
        interpretation_zh_tw: "三個失敗例共同指出：記法必須具備足夠的數學多樣性，完整保存對象、作用域與變項連結。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.0411 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：量化記法必須同時保存概括對象、作用域與變項同一性；添加一個標籤若少掉其中任一結構，就不能表達原式。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

