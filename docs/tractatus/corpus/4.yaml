  - id: "4.1273"
    parent: "4.127"
    texts:
      de:
        - "Wollen wir den allgemeinen Satz: „*b* ist ein Nachfolger von *a*“ in der Begriffsschrift ausdrücken, so brauchen wir hierzu einen Ausdruck für das allgemeine Glied der Formenreihe: *aRb*, (∃*x*) : *aRx.xRb*, (∃*x, y*) : *aRx.xRy.yRb*, . . ."
        - "Das allgemeine Glied einer Formenreihe kann man nur durch eine Variable ausdrücken, denn der Begriff: Glied dieser Formenreihe, ist ein *formaler* Begriff."
        - "(Dies haben Frege und Russell übersehen; die Art und Weise wie sie allgemeine Sätze, wie den obigen ausdrücken wollen ist daher falsch; sie enthält einen circulus vitiosus.)"
        - "Wir können das allgemeine Glied der Formenreihe bestimmen, indem wir ihr erstes Glied angeben und die allgemeine Form der Operation, welche das folgende Glied aus dem vorhergehenden Satz erzeugt."
      en_ogden_ramsey_1922:
        - "If we want to express in logical symbolism the general proposition “*b* is a successor of *a*” we need for this an expression for the general term of the formal series: *aRb*, (∃*x*) : *aRx* . *xRb*, (∃*x*, *y*) : *aRx* . *xRy* . *yRb*, …"
        - "The general term of a formal series can only be expressed by a variable, for the concept symbolized by “term of this formal series” is a *formal* concept."
        - "(This Frege and Russell overlooked; the way in which they express general propositions like the above is, therefore, false; it contains a vicious circle.)"
        - "We can determine the general term of the formal series by giving its first term and the general form of the operation, which generates the following term out of the preceding proposition."
    edition_references:
      en_pears_mcguinness: "4.1273"
    segments:
      - id: "4.1273.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "若要以概念文字表達一般命題「*b* 是 *a* 的後繼者」，就需要形式序列一般項的表達：*aRb*、(∃*x*) : *aRx.xRb*、(∃*x, y*) : *aRx.xRy.yRb*……。"
        interpretation_zh_tw: "例式不是任意列舉，而讓同一關係鏈如何逐步增長變得可見，為一般項準備生成形式。"
      - id: "4.1273.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "形式序列的一般項只能由變項表達，因為「此形式序列的一項」是形式概念。"
        interpretation_zh_tw: "變項保留生成形式並容納各項；把「是序列成員」當普通謂詞，會錯置形式概念。"
      - id: "4.1273.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（弗雷格與羅素忽略了這點；他們表達這類一般命題的方式因而錯誤，並含有惡性循環。）"
        interpretation_zh_tw: "若以已完成的成員類別定義一般項，便先預設要定義的序列，因而形成惡性循環。"
      - id: "4.1273.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "我們可以給出第一項，以及從前一命題產生下一命題之操作的一般形式，來決定形式序列的一般項。"
        interpretation_zh_tw: "首項加生成操作可遞迴決定全序列，不必預先把所有成員物件化或逐一列完。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 4.1273 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：一般項不是列舉完所有成員，而由起點與可反覆的生成操作給出；把『成為本序列一項』當普通謂詞會循環預設序列。 專案現有檔案、schema 與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "4.1274"
    parent: "4.127"
    texts:
      de:
        - "Die Frage nach der Existenz eines formalen Begriffes ist unsinnig."
        - "Denn kein Satz kann eine solche Frage beantworten."
        - "\\(Man kann also z. B. nicht fragen: „Gibt es unanalysierbare Subjekt-Prädikatsätze?“)"
      en_ogden_ramsey_1922:
        - "The question about the existence of a formal concept is senseless."
        - "For no proposition can answer such a question."
        - "\\(For example, one cannot ask: “Are there unanalysable subject-predicate propositions?”)"
    edition_references:
      en_pears_mcguinness: "4.1274"
    segments:
      - id: "4.1274.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "詢問一個形式概念是否存在，是無意義的。"
        interpretation_zh_tw: "形式概念由符號可採取的形狀顯示，不能再成為普通存在量化的查詢對象。"
      - id: "4.1274.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "因為沒有命題能回答這類問題。"
        interpretation_zh_tw: "沒有具 truth condition 的命題可對這種存在問句回答真或假，因此問題不是「尚無答案」。"
      - id: "4.1274.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "（例如不能問：「是否存在不可分析的主詞—述詞命題？」）"
        interpretation_zh_tw: "「有不可分析的主詞—述詞命題嗎」把命題形式物件化，語法像問題，卻沒有合法的可能答案空間。"
    project_relations:
      - status: analogy_only
        mode: meta_elucidation
        claim_zh_tw: "Akashic 文件把 query 視為對可能答案的組織操作，而不是一項已成立事實。"
        rationale_zh_tw: "這有助檢查問句是否具有可判定答案空間；但專案不宣稱能形式判決所有形式概念存在問句是否無意義。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "### 回應：問題是對 logical space 的切分操作"
            note_zh_tw: "此節明載問題本身不是 fact，而以可能答案切分空間。"
    history: []

