    texts:
      de:
        - "Die Grammophonplatte, der musikalische Gedanke, die Notenschrift, die Schallwellen, stehen alle in jener abbildenden internen Beziehung zu einander, die zwischen Sprache und Welt besteht."
        - "Ihnen allen ist der logische Bau gemeinsam."
        - "\\(Wie im Märchen die zwei Jünglinge, ihre zwei Pferde und ihre Lilien."
        - "Sie sind alle in gewissem Sinne Eins.)"
      en_ogden_ramsey_1922:
        - "The gramophone record, the musical thought, the score, the waves of sound, all stand to one another in that pictorial internal relation, which holds between language and the world."
        - "To all of them the logical structure is common."
        - "\\(Like the two youths, their two horses and their lilies in the story."
        - "They are all in a certain sense one.)"
