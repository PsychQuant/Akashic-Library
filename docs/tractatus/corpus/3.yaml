schema_version: 1
volume: "3"
propositions:
  - id: "3"
    texts:
      de:
        - "Das logische Bild der Tatsachen ist der Gedanke."
      en_ogden_ramsey_1922:
        - "The logical picture of the facts is the thought."
    edition_references:
      en_pears_mcguinness: "3"
    segments:
      - id: "3.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "事實的邏輯圖像就是思想。"
        interpretation_zh_tw: "思想在此不是單純的心理事件，而是能以與事實共有的邏輯形式來描繪事實的圖像。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3 直接主張「事實的邏輯圖像就是思想。」，本卷並將其限制解讀為「思想在此不是單純的心理事件，而是能以與事實共有的邏輯形式來描繪事實的圖像。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
    history: []
  - id: "3.001"
    parent: "3"
    texts:
      de:
        - "„Ein Sachverhalt ist denkbar“ heisst: Wir können uns ein Bild von ihm machen."
      en_ogden_ramsey_1922:
        - "“An atomic fact is thinkable”—means: we can imagine it."
    edition_references:
      en_pears_mcguinness: "3.001"
    segments:
      - id: "3.001.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "「一個事態是可思的」意即：我們能為它形成一幅圖像。"
        interpretation_zh_tw: "可思性在此由可圖像化界定；重點是可能配置能被表現，不是它已經實際成立。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.001 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.001 直接主張「「一個事態是可思的」意即：我們能為它形成一幅圖像。」，本卷並將其限制解讀為「可思性在此由可圖像化界定；重點是可能配置能被表現，不是它已經實際成立。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
    history: []
  - id: "3.01"
    parent: "3"
    texts:
      de:
        - "Die Gesamtheit der wahren Gedanken sind ein Bild der Welt."
      en_ogden_ramsey_1922:
        - "The totality of true thoughts is a picture of the world."
    edition_references:
      en_pears_mcguinness: "3.01"
    segments:
      - id: "3.01.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "真思想的總體是世界的一幅圖像。"
        interpretation_zh_tw: "每個真思想描繪一項成立的事態；其總體合成世界圖像，但仍不是世界本身。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.01 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.01 直接主張「真思想的總體是世界的一幅圖像。」，本卷並將其限制解讀為「每個真思想描繪一項成立的事態；其總體合成世界圖像，但仍不是世界本身。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
    history: []
  - id: "3.02"
    parent: "3"
    texts:
      de:
        - "Der Gedanke enthält die Möglichkeit der Sachlage die er denkt."
        - "Was denkbar ist, ist auch möglich."
      en_ogden_ramsey_1922:
        - "The thought contains the possibility of the state of affairs which it thinks."
        - "What is thinkable is also possible."
    edition_references:
      en_pears_mcguinness: "3.02"
    segments:
      - id: "3.02.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "思想包含它所思之狀況的可能性。"
        interpretation_zh_tw: "思想的結構預先劃出它所描繪狀況的可能方式；這裡尚未判定該狀況實際成立。"
      - id: "3.02.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "凡可思者亦可能。"
        interpretation_zh_tw: "「可能」是邏輯上的可表現性，不是機率、可實作性或已獲證據支持。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.02 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.02 直接主張「思想包含它所思之狀況的可能性。」，本卷並將其限制解讀為「思想的結構預先劃出它所描繪狀況的可能方式；這裡尚未判定該狀況實際成立。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
    history: []
  - id: "3.03"
    parent: "3"
    texts:
      de:
        - "Wir können nichts Unlogisches denken, weil wir sonst unlogisch denken müssten."
      en_ogden_ramsey_1922:
        - "We cannot think anything unlogical, for otherwise we should have to think unlogically."
    edition_references:
      en_pears_mcguinness: "3.03"
    segments:
      - id: "3.03.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們不能思考任何不合邏輯之物，否則我們就必須不合邏輯地思考。"
        interpretation_zh_tw: "邏輯不是思想可以任意違反的外加規則；能成為思想的表現本身已受邏輯形式約束。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.03 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.03 直接主張「我們不能思考任何不合邏輯之物，否則我們就必須不合邏輯地思考。」，本卷並將其限制解讀為「邏輯不是思想可以任意違反的外加規則；能成為思想的表現本身已受邏輯形式約束。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
    history: []
  - id: "3.031"
    parent: "3.03"
    texts:
      de:
        - "Man sagte einmal, dass Gott alles schaffen könne, nur nichts, was den logischen Gesetzen zuwider wäre."
        - "– Wir könnten nämlich von einer „unlogischen“ Welt nicht *sagen*, wie sie aussähe."
      en_ogden_ramsey_1922:
        - "It used to be said that God could create everything, except what was contrary to the laws of logic."
        - "The truth is, we could not *say* of an “unlogical” world how it would look."
    edition_references:
      en_pears_mcguinness: "3.031"
    segments:
      - id: "3.031.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "曾有人說，上帝能創造一切，只不能創造違反邏輯法則之物。"
        interpretation_zh_tw: "這個傳統說法把邏輯限制表述成創造能力的例外，下一句則把焦點轉回可說性的界線。"
      - id: "3.031.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "——因為我們無法說出一個「不合邏輯」世界會是什麼樣子。"
        interpretation_zh_tw: "問題不是缺少一幅罕見世界的描述，而是「不合邏輯」使描述本身無法形成可理解的樣貌。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.031 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.031 直接主張「曾有人說，上帝能創造一切，只不能創造違反邏輯法則之物。」，本卷並將其限制解讀為「這個傳統說法把邏輯限制表述成創造能力的例外，下一句則把焦點轉回可說性的界線。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
    history: []
  - id: "3.032"
    parent: "3.03"
    texts:
      de:
        - "Etwas „der Logik widersprechendes“ in der Sprache darstellen, kann man ebensowenig, wie in der Geometrie eine den Gesetzen des Raumes widersprechende Figur durch ihre Koordinaten darstellen; oder die Koordinaten eines Punktes angeben, welcher nicht existiert."
      en_ogden_ramsey_1922:
        - "To present in language anything which “contradicts logic” is as impossible as in geometry to present by its co-ordinates a figure which contradicts the laws of space; or to give the co-ordinates of a point which does not exist."
    edition_references:
      en_pears_mcguinness: "3.032"
    segments:
      - id: "3.032.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "在語言中表現「違反邏輯」之物，就如同在幾何學中以座標表現違反空間法則的圖形，或給出一個不存在之點的座標一樣不可能。"
        interpretation_zh_tw: "座標例子說明表現系統的構成規則同時界定其可表現範圍；違反規則的項目不是另一個合法內容。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.032 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.032 直接主張「在語言中表現「違反邏輯」之物，就如同在幾何學中以座標表現違反空間法則的圖形，或給出一個不存在之點的座標一樣不可能。」，本卷並將其限制解讀為「座標例子說明表現系統的構成規則同時界定其可表現範圍；違反規則的項目不是另一個合法內容。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
    history: []
  - id: "3.0321"
    parent: "3.032"
    texts:
      de:
        - "Wohl können wir einen Sachverhalt räumlich darstellen, welcher den Gesetzen der Physik, aber keinen, der den Gesetzen der Geometrie zuwiderliefe."
      en_ogden_ramsey_1922:
        - "We could present spatially an atomic fact which contradicted the laws of physics, but not one which contradicted the laws of geometry."
    edition_references:
      en_pears_mcguinness: "3.0321"
    segments:
      - id: "3.0321.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們固然能在空間中表現一個違反物理定律的事態，卻不能表現一個違反幾何法則的事態。"
        interpretation_zh_tw: "物理定律限制何者實際可能，幾何形式則限制何者能在該空間表現中成為一個有結構的可能性。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.0321 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.0321 直接主張「我們固然能在空間中表現一個違反物理定律的事態，卻不能表現一個違反幾何法則的事態。」，本卷並將其限制解讀為「物理定律限制何者實際可能，幾何形式則限制何者能在該空間表現中成為一個有結構的可能性。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
    history: []
  - id: "3.04"
    parent: "3"
    texts:
      de:
        - "Ein a priori richtiger Gedanke wäre ein solcher, dessen Möglichkeit seine Wahrheit bedingte."
      en_ogden_ramsey_1922:
        - "An a priori true thought would be one whose possibility guaranteed its truth."
    edition_references:
      en_pears_mcguinness: "3.04"
    segments:
      - id: "3.04.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一個先天地正確的思想，會是其可能性本身就保證其為真的思想。"
        interpretation_zh_tw: "此條提出極強的條件：若僅由思想可被形成便推出真，可能性與真理就必須重合。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.04 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.04 直接主張「一個先天地正確的思想，會是其可能性本身就保證其為真的思想。」，本卷並將其限制解讀為「此條提出極強的條件：若僅由思想可被形成便推出真，可能性與真理就必須重合。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
    history: []
  - id: "3.05"
    parent: "3"
    texts:
      de:
        - "Nur so könnten wir a priori wissen, dass ein Gedanke wahr ist, wenn aus dem Gedanken selbst (ohne Vergleichsobjekt) seine Wahrheit zu erkennen wäre."
      en_ogden_ramsey_1922:
        - "Only if we could know a priori that a thought is true if its truth was to be recognized from the thought itself (without an object of comparison)."
    edition_references:
      en_pears_mcguinness: "3.05"
    segments:
      - id: "3.05.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "唯有當一個思想的真能從思想本身辨認出來（毋須比較對象），我們才能先天地知道它為真。"
        interpretation_zh_tw: "通常思想必須與現實比較才判定真假；省略比較對象只可能發生在思想形式本身已排除為假的情況。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 3.05 關於思想、命題記號、投射或配置何以具有意義的論旨具有直接的軟體實作對應。"
        rationale_zh_tw: "命題 3.05 直接主張「唯有當一個思想的真能從思想本身辨認出來（毋須比較對象），我們才能先天地知道它為真。」，本卷並將其限制解讀為「通常思想必須與現實比較才判定真假；省略比較對象只可能發生在思想形式本身已排除為假的情況。」。這裡處理思想、命題記號、投射或配置何以具有意義；Akashic 的檔案與欄位沒有因此取得相同的邏輯圖像地位。"
