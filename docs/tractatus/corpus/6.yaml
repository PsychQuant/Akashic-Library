        claim_zh_tw: "Akashic 刻意保留規範性設計與哲學解說，不把可寫文件限縮為自然科學命題。"
        rationale_zh_tw: "專案以哲學作概念澄清並與經驗事實分層；這不把形上學句子寫入 canonical store 當事實。"
