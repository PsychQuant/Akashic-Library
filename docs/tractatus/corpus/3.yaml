    parent: "3.26"
    texts:
      de:
        - "Jedes definierte Zeichen bezeichnet *über* jene Zeichen, durch welche es definiert wurde; und die Definitionen weisen den Weg."
        - "Zwei Zeichen, ein Urzeichen, und ein durch Urzeichen definiertes, können nicht auf dieselbe Art und Weise bezeichnen."
        - "Namen *kann* man nicht durch Definitionen auseinanderlegen."
        - "(Kein Zeichen, welches allein, selbständig eine Bedeutung hat.)"
      en_ogden_ramsey_1922:
        - "Every defined sign signifies *via* those signs by which it is defined, and the definitions show the way."
        - "Two signs, one a primitive sign, and one defined by primitive signs, cannot signify in the same way."
        - "Names *cannot* be taken to pieces by definition (nor any sign which alone and independently has a meaning)."
    edition_references:
      en_pears_mcguinness: "3.261"
    segments:
      - id: "3.261.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "每個被定義的記號，都是經由用來定義它的那些記號而指示；定義則指出這條路徑。"
        interpretation_zh_tw: "衍生記號的指示方式可沿定義展開到較原初的記號，定義本身充當可追蹤的轉換規則。"
      - id: "3.261.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "兩個記號——一個原初記號與一個由原初記號定義的記號——不能以同一方式指示。"
        interpretation_zh_tw: "即使最終關聯到相同對象，原初指稱與經定義展開的符號角色仍不相同。"
      - id: "3.261.c"
        alignment:
          de: [2, 3]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "名稱不能由定義拆解。（任何單獨且獨立具有指稱的記號也不能。）"
        interpretation_zh_tw: "英譯把德文括號納入同句，故採二對一；共同重點是直接指稱者不是定義縮寫。"
