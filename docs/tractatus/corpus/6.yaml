schema_version: 1
volume: "6"
propositions:
  - id: "6"
    texts:
      de:
        - "Die allgemeine Form der Wahrheitsfunktion ist: ![{ [ \\bar{p}, \\bar{\\xi}, N (\\bar{\\xi}) ] }](images/336cae8a41089348ef601ba5dbe893d3758f7baa1841701bd587566e0f16d282.svg)\\ ."
        - "Dies ist die allgemeine Form des Satzes."
      en_ogden_ramsey_1922:
        - "The general form of truth-function is: ![{ [ \\bar{p}, \\bar{\\xi}, N (\\bar{\\xi}) ] }](images/336cae8a41089348ef601ba5dbe893d3758f7baa1841701bd587566e0f16d282.svg)\\ ."
        - "This is the general form of proposition."
    edition_references:
      en_pears_mcguinness: "6"
    segments:
      - id: "6.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "真值函數的一般形式是來源所列的三項式。"
        interpretation_zh_tw: "公式以基本命題、命題值的選取與否定運算概括真值函數；它不是程式函式簽章。"
      - id: "6.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這就是命題的一般形式。"
        interpretation_zh_tw: "第二句把前式提升為一切命題的形式主張，不是某類經驗句的範本。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6 的直接論旨是「真值函數的一般形式是來源所列的三項式。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.001"
    parent: "6"
    texts:
      de:
        - "Dies sagt nichts anderes, als dass jeder Satz ein Resultat der successiven Anwendung der Operation ![{ N' (\\bar{\\xi}) }](images/6f5736dff9d73c6c95c36f30466ceb36b6191d4b51adec9af05bd29016ef01ea.svg)\\  auf die Elementarsätze ist."
      en_ogden_ramsey_1922:
        - "This says nothing else than that every proposition is the result of successive applications of the operation ![{ N (\\bar{\\xi}) }](images/eb37987510f581cb73f8db614bd71715f510cf605279d48188050d8b509b47ed.svg)\\  to the elementary propositions."
    edition_references:
      en_pears_mcguinness: "6.001"
    segments:
      - id: "6.001.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "這無非是說，每一命題都是把運算 N 逐次施用於基本命題所得的結果。"
        interpretation_zh_tw: "「逐次施用」描述真值函數的生成；不能只因軟體也有反覆運算，就宣稱兩者相同。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.001 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.001 的直接論旨是「這無非是說，每一命題都是把運算 N 逐次施用於基本命題所得的結果。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.002"
    parent: "6"
    texts:
      de:
        - "Ist die allgemeine Form gegeben, wie ein Satz gebaut ist, so ist damit auch schon die allgemeine Form davon gegeben, wie aus einem Satz durch eine Operation ein anderer erzeugt werden kann."
      en_ogden_ramsey_1922:
        - "If we are given the general form of the way in which a proposition is constructed, then thereby we are also given the general form of the way in which by an operation out of one proposition another can be created."
    edition_references:
      en_pears_mcguinness: "6.002"
    segments:
      - id: "6.002.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一旦給出命題如何構成的一般形式，也就同時給出了如何藉運算從一個命題產生另一個命題的一般形式。"
        interpretation_zh_tw: "命題構成與運算生成在此共同受邏輯形式規定，不是一般資料轉換流程。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.002 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.002 的直接論旨是「一旦給出命題如何構成的一般形式，也就同時給出了如何藉運算從一個命題產生另一個命題的一般形式。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.01"
    parent: "6"
    texts:
      de:
        - "Die allgemeine Form der Operation ![{ \\Omega ' (\\bar{\\eta}) }](images/ea9e48f6e881e8a034e4cbc779a077ac01d2da54238fa332cfbe2255015dca69.svg)\\  ist also: ![{ [\\bar{\\xi}, N(\\bar{\\xi})]' (\\bar{\\eta}) (= [ \\bar{\\eta}, \\bar{\\xi}, N (\\bar{\\xi}) ]) }](images/d1cf195aa1fb631bffe7b018f1114530b8c1bcc712299ba306fdef8ed6c55335.svg)\\ ."
        - "Das ist die allgemeinste Form des Überganges von einem Satz zum anderen."
      en_ogden_ramsey_1922:
        - "The general form of the operation ![{ \\Omega ' (\\bar{\\eta}) }](images/ea9e48f6e881e8a034e4cbc779a077ac01d2da54238fa332cfbe2255015dca69.svg)\\  is therefore: ![{ [\\bar{\\xi}, N(\\bar{\\xi})]' (\\bar{\\eta}) (= [ \\bar{\\eta}, \\bar{\\xi}, N (\\bar{\\xi}) ]) }](images/d1cf195aa1fb631bffe7b018f1114530b8c1bcc712299ba306fdef8ed6c55335.svg)\\ ."
        - "This is the most general form of transition from one proposition to another."
    edition_references:
      en_pears_mcguinness: "6.01"
    segments:
      - id: "6.01.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "因此，運算 Ω′ 的一般形式如來源公式所示。"
        interpretation_zh_tw: "公式描述運算如何作用於命題值，其抽象層次高於具體程式操作。"
      - id: "6.01.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這是從一個命題過渡到另一個命題的最一般形式。"
        interpretation_zh_tw: "「最一般」限於《論考》的命題生成架構，不能直接移植成 Akashic API。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.01 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.01 的直接論旨是「因此，運算 Ω′ 的一般形式如來源公式所示。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.02"
    parent: "6"
    texts:
      de:
        - "Und so kommen wir zu den Zahlen:"
        - "Ich definiere\n![{ x = \\Omega^{0 \\prime} x \\text{ Def.} }](images/2c3e0efa8931e01e650511958fc1f6d5b5cba8c4120db825866394563d645203.svg)\\  und\n![{ \\Omega^{\\prime} \\Omega^{\\nu \\prime} x = \\Omega^{\\nu + 1 \\prime} x \\text{ Def.} }](images/1bd88ac2bf5db57ea9040cc5e72c42410c17abe58b77c117e3bfb0772eaf1d77.svg)\\"
        - "Nach diesen Zeichenregeln schreiben wir also die Reihe ![{ x, \\Omega ' x, \\Omega ' \\Omega ' x, \\Omega ' \\Omega ' \\Omega ' x, ..... }](images/2bdad2e773a893d516dedb66aae27db7901736d7838298078d42775abc368450.svg)\\"
        - "so: ![{ \\Omega^{0 \\prime} x, \\Omega^{0+1 \\prime} x, \\Omega^{0 + 1 + 1 \\prime} x, \\Omega^{0 + 1 + 1 + 1 \\prime} x, ..... }](images/2363c84eb861521de9141a1ef7e7f9b8e30ee559dbe0fdd98ebe96665b1cacc5.svg)\\"
        - "Also schreibe ich statt „![{ [ x, \\xi, \\Omega ' \\xi ] }](images/356a71ba81334c39be3a91a1d42c9d51eb9ad1ea7b726f750fd3a307d7947385.svg)\\ “:"
        - "„![{ [ \\Omega^{0 \\prime} x, \\Omega^{\\nu \\prime} x, \\Omega^{\\nu + 1 \\prime} x ] }](images/6dfd74305dc6480d900085f169502024845a873e4e905856bf37dbc80f3bb653.svg)\\ “."
        - "Und definiere:"
        - "![{ 0 + 1 = 1 \\text{ Def.} }](images/9bfe93c20fc75f7848141a5dc2cdd0308e48f56967903cda5e95d9574182253c.svg)\\"
        - "![{ 0 + 1 + 1 = 2 \\text{ Def.} }](images/fe681449dc8d64199e5d1bdbf8208df658a75a9e18932d30c9dfe7f01673531e.svg)\\"
        - "![{ 0 + 1 + 1 + 1 = 3 \\text{ Def.} }](images/79fe9d279c0691bdeef7a6bf88e5f6a6364bd5b2dabfd79444199d7e0fb31ca7.svg)\\"
        - "\\(u. s. f.)"
      en_ogden_ramsey_1922:
        - "And thus we come to numbers:"
        - "I define\n![{ x = \\Omega^{0 \\prime} x \\text{ Def.} }](images/2c3e0efa8931e01e650511958fc1f6d5b5cba8c4120db825866394563d645203.svg)\\  and\n![{ \\Omega^{\\prime} \\Omega^{ \\nu \\prime} x = \\Omega^{ \\nu + 1 \\prime} x \\text{ Def.} }](images/2f81698ca04ab3ce262aa94e5d57f69a5eaa2cadf033aba83d9dc9724869a8b0.svg)\\"
        - "According, then, to these symbolic rules we write the series ![{ x, \\Omega ' x, \\Omega ' \\Omega ' x, \\Omega ' \\Omega ' \\Omega ' x, ..... }](images/2bdad2e773a893d516dedb66aae27db7901736d7838298078d42775abc368450.svg)\\"
        - "as: ![{ \\Omega^{0 \\prime} x, \\Omega^{0+1 \\prime} x, \\Omega^{0 + 1 + 1 \\prime} x, \\Omega^{0 + 1 + 1 + 1 \\prime} x, ..... }](images/2363c84eb861521de9141a1ef7e7f9b8e30ee559dbe0fdd98ebe96665b1cacc5.svg)\\"
        - "Therefore I write in place of “![{ [ x, \\xi, \\Omega ' \\xi ] }](images/356a71ba81334c39be3a91a1d42c9d51eb9ad1ea7b726f750fd3a307d7947385.svg)\\ ”,"
        - "“![{ [ \\Omega^{0 \\prime} x, \\Omega^{ \\nu \\prime} x, \\Omega^{ \\nu + 1 \\prime} x ] }](images/cbe2c1a200eb49c3a9b16c7105afbb9fbed122da767f2d37389ac28a9e93e102.svg)\\ ”."
        - "And I define:"
        - "![{ 0 + 1 = 1 \\text{ Def.} }](images/9bfe93c20fc75f7848141a5dc2cdd0308e48f56967903cda5e95d9574182253c.svg)\\"
        - "![{ 0 + 1 + 1 = 2 \\text{ Def.} }](images/fe681449dc8d64199e5d1bdbf8208df658a75a9e18932d30c9dfe7f01673531e.svg)\\"
        - "![{ 0 + 1 + 1 + 1 = 3 \\text{ Def.} }](images/79fe9d279c0691bdeef7a6bf88e5f6a6364bd5b2dabfd79444199d7e0fb31ca7.svg)\\"
        - "\\(and so on.)"
    edition_references:
      en_pears_mcguinness: "6.02"
    segments:
      - id: "6.02.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "於是我們來到數。"
        interpretation_zh_tw: "這個過渡把前述運算序列轉入數的討論；它尚未把數當成另添的一類對象。"
      - id: "6.02.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "我作如下定義：第一式把 x 定為 Ω 的零次施用，第二式把再施用一次 Ω 定為指數的後繼。"
        interpretation_zh_tw: "兩條遞迴式分別給出基底與後繼，必須合讀為同一個定義步驟，並非兩項經驗等式。"
      - id: "6.02.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "依這些記號規則，我們把 x、Ω′x、Ω′Ω′x 等寫成一個序列。"
        interpretation_zh_tw: "原序列把反覆操作直接展開。"
      - id: "6.02.d"
        alignment:
          de: [3]
          en_ogden_ramsey_1922: [3]
        translation_zh_tw: "也就是把它們改寫成以零與連續加一標示的指數序列。"
        interpretation_zh_tw: "新記法以指數記錄反覆次數，讓數的位置可見。"
      - id: "6.02.e"
        alignment:
          de: [4]
          en_ogden_ramsey_1922: [4]
        translation_zh_tw: "所以我以含 x、ξ 與 Ω′ξ 的序列記法為起點，改用下一式。"
        interpretation_zh_tw: "這句說明被替換的舊序列形式。"
      - id: "6.02.f"
        alignment:
          de: [5]
          en_ogden_ramsey_1922: [5]
        translation_zh_tw: "改寫後的序列以 Ω 的零次、ν 次與 ν 加一次施用表示。"
        interpretation_zh_tw: "此式是新記法的通式，不是經驗等式。"
      - id: "6.02.g"
        alignment:
          de: [6]
          en_ogden_ramsey_1922: [6]
        translation_zh_tw: "並作如下定義。"
        interpretation_zh_tw: "接下來只是為常用數字命名。"
      - id: "6.02.h"
        alignment:
          de: [7]
          en_ogden_ramsey_1922: [7]
        translation_zh_tw: "零加一被定義為一。"
        interpretation_zh_tw: "「一」記錄一次後繼。"
      - id: "6.02.i"
        alignment:
          de: [8]
          en_ogden_ramsey_1922: [8]
        translation_zh_tw: "零連加兩次一被定義為二。"
        interpretation_zh_tw: "「二」記錄兩次後繼。"
      - id: "6.02.j"
        alignment:
          de: [9]
          en_ogden_ramsey_1922: [9]
        translation_zh_tw: "零連加三次一被定義為三。"
        interpretation_zh_tw: "「三」記錄三次後繼。"
      - id: "6.02.k"
        alignment:
          de: [10]
          en_ogden_ramsey_1922: [10]
        translation_zh_tw: "如此類推。"
        interpretation_zh_tw: "省略號延伸同一規則，未引入新的數學對象。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.02 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.02 從運算序列過渡到數，並以零次施用與後繼式定義其記法；這是《論考》的數與運算形式，不是程式整數型別或一般遞迴 API。Akashic 的 schema 與程式運算只規範專案資料，不能冒充相同的邏輯形式。"
    history: []
  - id: "6.021"
    parent: "6.02"
    texts:
      de:
        - "Die Zahl ist der Exponent einer Operation."
      en_ogden_ramsey_1922:
        - "A number is the exponent of an operation."
    edition_references:
      en_pears_mcguinness: "6.021"
    segments:
      - id: "6.021.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "數是運算的指數。"
        interpretation_zh_tw: "數被理解為運算施行多少次的標誌；這是《論考》的數概念，不等於程式整數型別。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.021 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.021 的直接論旨是「數是運算的指數。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.022"
    parent: "6.02"
    texts:
      de:
        - "Der Zahlbegriff ist nichts anderes, als das Gemeinsame aller Zahlen, die allgemeine Form der Zahl."
        - "Der Zahlbegriff ist die variable Zahl."
        - "Und der Begriff der Zahlengleichheit ist die allgemeine Form aller speziellen Zahlengleichheiten."
      en_ogden_ramsey_1922:
        - "The concept number is nothing else than that which is common to all numbers, the general form of number."
        - "The concept number is the variable number."
        - "And the concept of equality of numbers is the general form of all special equalities of numbers."
    edition_references:
      en_pears_mcguinness: "6.022"
    segments:
      - id: "6.022.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "數概念無非是所有數的共同點，也就是數的一般形式。"
        interpretation_zh_tw: "共同形式而非個別數值構成「數」的概念。"
      - id: "6.022.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "數概念就是可變的數。"
        interpretation_zh_tw: "可變數表示能由不同數值占據的形式位置。"
      - id: "6.022.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "數相等的概念則是所有特殊數等式的一般形式。"
        interpretation_zh_tw: "數相等也由各具體等式共有的形式界定。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.022 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.022 的直接論旨是「數概念無非是所有數的共同點，也就是數的一般形式。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.03"
    parent: "6"
    texts:
      de:
        - "Die allgemeine Form der ganzen Zahl ist: ![{ [ 0, \\xi, \\xi + 1] }](images/b62025c4a407e7eb826ef60301c7aba855768d91af1e7b6d3248a9d8c43658f1.svg)\\ ."
      en_ogden_ramsey_1922:
        - "The general form of the cardinal number is: [0, *ξ*, *ξ* + 1]."
    edition_references:
      en_pears_mcguinness: "6.03"
    segments:
      - id: "6.03.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "基數的一般形式是來源所列的零、任意數與後繼三項式。"
        interpretation_zh_tw: "這個三項式表示自然數序列的形式，不是宣稱所有數學只需一個資料結構。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不主張命題 6.03 關於邏輯命題、真值運算或形式證明的論旨具有直接軟體實作對應。"
        rationale_zh_tw: "命題 6.03 的直接論旨是「基數的一般形式是來源所列的零、任意數與後繼三項式。」；這句處理真值函數、重言式、符號形式或邏輯證明；Akashic 的 schema 與程式運算只規範專案資料，不能據此冒充相同的邏輯形式。"
    history: []
  - id: "6.031"
    parent: "6.03"
    texts:
      de:
        - "Die Theorie der Klassen ist in der Mathematik ganz überflüssig."
        - "Dies hängt damit zusammen, dass die Allgemeinheit, welche wir in der Mathematik brauchen, nicht die *zufällige* ist."
      en_ogden_ramsey_1922:
        - "The theory of classes is altogether superfluous in mathematics."
        - "This is connected with the fact that the generality which we need in mathematics is not the *accidental* one."
    edition_references:
      en_pears_mcguinness: "6.031"
    segments:
      - id: "6.031.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "類別理論在數學中完全是多餘的。"
        interpretation_zh_tw: "這是維根斯坦對當時基礎論的強主張，不是現代數學的中立共識。"
      - id: "6.031.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這與數學所需的普遍性不是偶然普遍性有關。"
        interpretation_zh_tw: "他把數學普遍性理解為形式必要，而非碰巧涵蓋所有個案。"
