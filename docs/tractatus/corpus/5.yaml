  - id: "5.55"
    parent: "5.5"
    texts:
      de:
        - "Wir müssen nun die Frage nach allen möglichen Formen der Elementarsätze a priori beantworten."
        - "Der Elementarsatz besteht aus Namen."
        - "Da wir aber die Anzahl der Namen von verschiedener Bedeutung nicht angeben können, so können wir auch nicht die Zusammensetzung des Elementarsatzes angeben."
      en_ogden_ramsey_1922:
        - "We must now answer a priori the question as to all possible forms of the elementary propositions."
        - "The elementary proposition consists of names."
        - "Since we cannot give the number of names with different meanings, we cannot give the composition of the elementary proposition."
    edition_references:
      en_pears_mcguinness: "5.55"
    segments:
      - id: "5.55.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "我們現在必須先於經驗地回答：基本命題有哪些可能形式。"
        interpretation_zh_tw: "問題要求的是基本命題形式的完整先驗清單，而不是從已見句子歸納。"
      - id: "5.55.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "基本命題由名稱組成。"
        interpretation_zh_tw: "基本命題的最小結構以名稱的直接組合呈現可能事態。"
      - id: "5.55.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "既然我們無法給出意義不同的名稱有多少，也就無法給出基本命題的組成。"
        interpretation_zh_tw: "未知名稱的可能數量，使逐項列舉基本命題形式的企圖失去根據。"
    project_relations:
