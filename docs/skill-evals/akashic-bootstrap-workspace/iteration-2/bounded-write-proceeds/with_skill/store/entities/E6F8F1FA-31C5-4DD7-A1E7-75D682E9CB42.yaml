title: Composite marginal quantile regression analysis for longitudinal adolescent
  body mass index data
authors:
- literal: Chi‐Chuan Yang
- literal: Yi‐Hau Chen
- literal: Hsing‐Yi Chang
date: 2017-06-02
fields:
  abstract: <jats:p>Childhood and adolescenthood overweight or obesity, which may
    be quantified through the body mass index (BMI), is strongly associated with adult
    obesity and other health problems. Motivated by the child and adolescent behaviors
    in long‐term evolution (CABLE) study, we are interested in individual, family,
    and school factors associated with marginal quantiles of longitudinal adolescent
    BMI values. We propose a new method for composite marginal quantile regression
    analysis for longitudinal outcome data, which performs marginal quantile regressions
    at multiple quantile levels simultaneously. The proposed method extends the quantile
    regression coefficient modeling method introduced by Frumento and Bottai (<jats:italic>Biometrics</jats:italic>
    2016; <jats:bold>72</jats:bold>:74–84) to longitudinal data accounting suitably
    for the correlation structure in longitudinal observations. A goodness‐of‐fit
    test for the proposed modeling is also developed. Simulation results show that
    the proposed method can be much more efficient than the analysis without taking
    correlation into account and the analysis performing separate quantile regressions
    at different quantile levels. The application to the longitudinal adolescent BMI
    data from the CABLE study demonstrates the practical utility of our proposal.
    Copyright © 2017 John Wiley &amp; Sons, Ltd.</jats:p>
