  - id: "4.021"
    parent: "4.02"
    texts:
      de:
        - "Der Satz ist ein Bild der Wirklichkeit: Denn ich kenne die von ihm dargestellte Sachlage, wenn ich den Satz verstehe."
        - "Und den Satz verstehe ich, ohne dass mir sein Sinn erklärt wurde."
      en_ogden_ramsey_1922:
        - "The proposition is a picture of reality, for I know the state of affairs presented by it, if I understand the proposition."
        - "And I understand the proposition, without its sense having been explained to me."
    edition_references:
      en_pears_mcguinness: "4.021"
    segments:
      - id: "4.021.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "命題是現實的圖像：因為當我理解命題時，我便知道它所表現的事態。"
        interpretation_zh_tw: "理解命題便掌握它描繪哪一個可能事態；這項掌握尚未回答該事態是否實際成立。"
      - id: "4.021.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "而我理解命題，並不需要別人向我解釋它的意義。"
        interpretation_zh_tw: "命題的組合規則與已知成分可使 sense 顯現，無須再替整句附加一個外部意義標籤。"
    project_relations:
      - status: analogy_only
