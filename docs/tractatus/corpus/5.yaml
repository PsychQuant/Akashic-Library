  - id: "5.2521"
    parent: "5.252"
    texts:
      de:
        - "Die fortgesetzte Anwendung einer Operation auf ihr eigenes Resultat nenne ich ihre successive Anwendung („*O'O'O'a*“ ist das Resultat der dreimaligen successiven Anwendung von „*O'ξ*“ auf „*a*“)."
        - "In einem ähnlichen Sinne rede ich von der successiven Anwendung *mehrerer* Operationen auf eine Anzahl von Sätzen."
      en_ogden_ramsey_1922:
        - "The repeated application of an operation to its own result I call its successive application (“*O'O'O'a*” is the result of the threefold successive application of “*O'ξ*” to “*a*”)."
        - "In a similar sense I speak of the successive application of *several* operations to a number of propositions."
    edition_references:
      en_pears_mcguinness: "5.2521"
    segments:
      - id: "5.2521.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "一項運算反覆作用於自身結果，我稱為它的連續套用（「O'O'O'a」是「O'ξ」對「a」連續套用三次的結果）。"
        interpretation_zh_tw: "每一步都把前一步結果再當基底，因而形成可數的迭代序列。"
      - id: "5.2521.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "同樣地，我也談若干運算對若干命題的連續套用。"
        interpretation_zh_tw: "連續套用不只限於單一運算或單一命題，可用同一概念描述複合生成過程。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.2521 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：連續套用把有限多次的重複運算表示成一個可辨認的生成過程。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

  - id: "5.2522"
    parent: "5.252"
    texts:
      de:
        - "Das allgemeine Glied einer Formenreihe *a*, *O'a*, *O'O'a*, *. . . .* schreibe ich daher so: „[*a, x, O'x*]“."
        - "Dieser Klammerausdruck ist eine Variable."
        - "Das erste Glied des Klammerausdruckes ist der Anfang der Formenreihe, das zweite die Form eines beliebigen Gliedes *x* der Reihe und das dritte die Form desjenigen Gliedes der Reihe, welches auf *x* unmittelbar folgt."
      en_ogden_ramsey_1922:
        - "The general term of the formal series *a*, *O'a*, *O'O'a*, ... I write thus: “[*a*, *x*, *O'x*]”."
        - "This expression in brackets is a variable."
        - "The first term of the expression is the beginning of the formal series, the second the form of an arbitrary term *x* of the series, and the third the form of that term of the series which immediately follows *x*."
    edition_references:
      en_pears_mcguinness: "5.2522"
    segments:
      - id: "5.2522.a"
        alignment:
          de: [0]
          en_ogden_ramsey_1922: [0]
        translation_zh_tw: "形式序列 a、O'a、O'O'a……的一般項，我因此寫成「[a, x, O'x]」。"
        interpretation_zh_tw: "方括號記法把形式序列的生成資料濃縮成一個一般表達式。"
      - id: "5.2522.b"
        alignment:
          de: [1]
          en_ogden_ramsey_1922: [1]
        translation_zh_tw: "這個方括號表達式是一個變項。"
        interpretation_zh_tw: "它不是序列中的固定一項，而是可套用於整個同形式序列的模式。"
      - id: "5.2522.c"
        alignment:
          de: [2]
          en_ogden_ramsey_1922: [2]
        translation_zh_tw: "表達式的第一項是形式序列的起點，第二項是序列任一項 x 的形式，第三項則是緊接在 x 之後那一項的形式。"
        interpretation_zh_tw: "三個位置分別指定初始值、一般項與後繼規則，因而完整刻畫序列。"
    project_relations:
      - status: not_applicable
        claim_zh_tw: "Akashic 目前不宣稱直接實作命題 5.2522 的哲學主張。"
        rationale_zh_tw: "此命題的具體內容是：三個位置分別指定初始值、一般項與後繼規則，因而完整刻畫形式序列。專案現有 schema、資料與查詢行為不足以證成同一主張，硬套對應會誤導。"
        evidence: []
    history: []

