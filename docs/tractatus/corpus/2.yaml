        rationale_zh_tw: "這是概念與翻譯上的採納，不代表專案已形式化全體事實如何由事態結構組成。"
        evidence:
          - path: "docs/explainers/logical-picture-future-and-questions.md"
            kind: heading
            locator: "### 1.2 Tatsache 與 Sachverhalt 不宜混譯"
